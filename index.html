ourquoi lis-tu le code INS comme du texte ?\n> Pour garder les zéros initiaux (01000 pour la Belgique) et fusionner sur des chaînes strictement identiques. Lu comme un nombre, le code perd ses zéros et la fusion échoue sans prévenir.\n? Explique en trente secondes pourquoi tu as 551 communes.\n> Le fichier des ventes compte 565 communes, sur le découpage de 2025. Le fichier fiscal en compte 581, sur l'ancien découpage. Je reconstitue les 14 communes fusionnées dans le fichier fiscal en additionnant revenus et habitants, ce qui donne 565 communes des deux côtés. J'en retire 14 qui n'ont pas de prix médian, faute de ventes suffisantes : il en reste 551.\n? Que fait `anti_join(x, y)` ?\n> Il renvoie les lignes de x qui n'ont aucun correspondant dans y. Je l'utilise dans les deux sens pour repérer les communes présentes dans un seul fichier.\n? Pourquoi ne peut-on pas répartir les ventes d'une nouvelle commune entre les anciennes ?\n> Parce qu'une médiane dépend de tous les prix individuels, que le fichier ne donne pas. On peut additionner des totaux, pas découper une médiane.\n:retenir\n- 565 communes dans les ventes (découpage 2025), 581 dans le fiscal (ancien découpage), 13 et 29 orphelins.\n- On agrège le fichier fiscal vers le nouveau découpage : somme des totaux, puis rapport.\n- Anvers garde son code : le piège silencieux.\n- 14 communes sans médiane (moins de 16 prix exploitables) : il reste 551 communes.\n\n#Q 1.2 | Ce que mesurent vraiment prix et rev_hab\n:intro\nAvant d'estimer une relation entre deux variables, il faut se demander ce qu'elles mesurent **vraiment**. Aucune des deux ne mesure exactement ce qu'on voudrait. Ces limites reviendront à la question 1.18, quand il faudra dire pourquoi l'élasticité n'est pas un effet causal.\n:concepts donnees\n##a | Le prix médian mesure-t-il la valeur des maisons ?\n:enonce\n`prix` est le prix médian des maisons vendues en 2023 dans la commune. Est-ce une mesure de la valeur des maisons de la commune ? Donnez une raison pour laquelle les deux peuvent différer.\n:court\n**Non, pas exactement.** C'est la médiane des maisons **vendues en 2023**, pas celle de **toutes** les maisons de la commune. Les deux diffèrent dès que les maisons vendues une année donnée ne ressemblent pas au parc existant.\n:zero\nImagine une commune de 5 000 maisons dont 80 se vendent en 2023. `prix` ne décrit que ces 80. Si ce sont surtout de petites maisons mitoyennes, ou des maisons à rénover vendues après une succession, leur prix médian sera plus bas que la valeur médiane des 5 000. C'est un **effet de composition** : l'échantillon des ventes n'est pas tiré au hasard dans le parc.\n\nDeux autres raisons, si tu veux aller plus loin :\n\n- **Qualité et taille.** Le prix médian mélange le prix « d'une maison donnée » et le type de maisons de la commune. Une commune de grandes villas a un prix médian élevé même si le mètre carré y est bon marché.\n- **Hasard.** Avec peu de ventes, la médiane dépend des quelques biens vendus cette année-là (question 1.3).\n\nL'énoncé ne demande qu'**une** raison. Donne la première, c'est la plus directe.\n:gpt\nUne raison : si les biens rénovés changent plus souvent de propriétaire, les ventes surreprésentent ces maisons par rapport au parc.\n:claude\nTrois raisons : composition des ventes (petites maisons, maisons à rénover), qualité et taille des biens, hasard quand il y a peu de ventes.\n:verdict\nMême idée de fond : les ventes ne sont pas un échantillon représentatif du parc. Les exemples vont en sens opposé (ChatGPT : des maisons rénovées, donc un prix médian trop haut ; Claude : des maisons à rénover, donc trop bas), et c'est justement ce qu'il faut comprendre : on ne sait pas dans quel sens va l'écart. Une seule raison suffit ; choisis celle que tu sais expliquer.\n:opt claude | Composition des ventes\nNon : `prix` est la médiane des maisons vendues en 2023, pas de toutes les maisons de la commune. Si les biens vendus cette année-là ne ressemblent pas au parc (davantage de petites maisons ou de maisons à rénover, par exemple), le prix médian des ventes s'écarte de la valeur médiane des maisons.\n:opt gpt | Rotation plus forte de certains biens\nNon : le prix médian partage en deux les ventes de l'année. Si certains biens, par exemple les maisons rénovées, changent plus souvent de propriétaire, ils sont surreprésentés parmi les ventes par rapport au parc.\n##b | Pourquoi rev_hab mesure mal le revenu des ménages\n:enonce\nDonnez deux raisons pour lesquelles `rev_hab` peut mal mesurer le revenu des ménages d'une commune. L'une de ces raisons concerne particulièrement certaines communes bruxelloises : laquelle ?\n:court\n1. On divise par les **habitants**, enfants compris, pas par les ménages : à revenu de ménage égal, une commune de familles nombreuses a un `rev_hab` plus bas.\n2. Le revenu **imposable** n'est pas tout le revenu. À Bruxelles, les **fonctionnaires européens et internationaux** ne paient pas l'impôt belge sur leur salaire : leurs revenus élevés manquent, alors qu'ils habitent et achètent dans ces communes.\n:zero\n`rev_hab` = revenu total net imposable de la commune ÷ nombre d'habitants. Regarde séparément le haut et le bas de la fraction.\n\n**Le dénominateur.** On divise par tous les résidents, bébés compris. Deux communes où chaque ménage gagne 60 000 € : dans l'une les ménages comptent deux personnes (`rev_hab` = 30 000 €), dans l'autre quatre (`rev_hab` = 15 000 €). Le pouvoir d'achat immobilier des ménages est pourtant le même.\n\n**Le numérateur.** Le revenu net imposable est ce qui figure dans la déclaration d'impôt. Il manque :\n\n- les revenus non imposables (les allocations familiales, par exemple) ;\n- la plupart des revenus du capital (intérêts, dividendes), taxés à la source et souvent non déclarés ;\n- les loyers perçus, taxés sur le revenu cadastral, bien inférieur aux loyers réels ;\n- et, pour Bruxelles, les salaires des fonctionnaires européens et internationaux, **exonérés de l'impôt belge**.\n\nCe dernier point se voit dans les données. Ixelles a le prix médian le plus élevé du pays (840 000 €) pour un revenu par habitant de 21 877 €, **sous la moyenne belge**. Les ménages qui y achètent des maisons sont en partie invisibles dans la statistique fiscale.\n\n:::cle Pourquoi c'est important pour la suite\nÀ Bruxelles, `rev_hab` sous-estime le revenu réel des acheteurs. Les communes bruxelloises se retrouvent donc à gauche du nuage (revenu apparent faible) et très haut (prix élevés) : c'est ce qui tire vers le bas l'élasticité du modèle sans régions (question 1.12).\n:::\n:accord Mêmes deux raisons (dénominateur en habitants, revenus absents de la statistique fiscale) et même réponse pour Bruxelles (les fonctionnaires internationaux). Claude ajoute l'exemple chiffré d'Ixelles et la liste des revenus manquants ; ChatGPT cite le glossaire de l'IBSA comme source pour le cas bruxellois.\n:quiz\n? Deux communes ont exactement les mêmes ménages, avec les mêmes revenus, mais dans l'une les ménages ont plus d'enfants. Son rev_hab sera :\n- le même\n+ plus faible\n- plus élevé\n> On divise par tous les habitants, enfants compris. Plus d'enfants, même revenu : un revenu par habitant plus bas.\n:oral\n? Pourquoi les communes bruxelloises ont-elles un revenu par habitant si bas pour des prix si élevés ?\n> En partie parce que rev_hab y sous-estime le revenu des acheteurs : les fonctionnaires européens et internationaux ne paient pas l'impôt belge sur leur salaire, donc leurs revenus n'apparaissent pas dans la statistique fiscale, alors qu'ils achètent des maisons dans ces communes.\n\n#Q 1.3 | Rouvroy et Charleroi : la précision d'une médiane\n:intro\nDeux communes au prix médian presque identique, mais l'une repose sur 17 ventes et l'autre sur 1 854. Cette question te fait mesurer ce que cela change, et prépare la question 1.14 sur l'hétéroscédasticité.\n:concepts donnees, incertitude\n##a | Comparer les deux communes\n:enonce\nComparez les communes de Rouvroy et de Charleroi : nombre de ventes, prix médian, écart interquartile (p75 − p25) et écart interquartile rapporté au prix médian.\n:court\nPrix médians proches (158 500 € et 137 750 €), mais Rouvroy repose sur **109 fois moins de ventes** (17 contre 1 854), et ses prix sont bien plus dispersés : l'écart interquartile y **dépasse le prix médian** (rapport de 1,09, contre 0,65 à Charleroi).\n:zero\nL'[[écart interquartile]] p75 − p25 est la largeur de la « moitié centrale » des prix : un quart des maisons se vend moins cher que p25, un quart plus cher que p75. Le diviser par le prix médian permet de comparer la dispersion de deux communes qui n'ont pas le même niveau de prix.\n\nÀ Rouvroy, la moitié centrale des ventes s'étale de 97 500 € à 269 500 € : presque du simple au triple. Dans une petite commune rurale, quelques biens très différents (une fermette, une maison à rénover, une villa récente) suffisent à écarter les quartiles.\n:res\n| Commune | Ventes | Prix médian | p25 | p75 | Écart interquartile | Écart / prix médian |\n|---|--:|--:|--:|--:|--:|--:|\n| Charleroi | 1 854 | 137 750 € | 95 000 € | 185 000 € | 90 000 € | 0,65 |\n| Rouvroy | 17 | 158 500 € | 97 500 € | 269 500 € | 172 000 € | 1,09 |\n:code\n```r\ntab_1_3 <- base %>%\n  filter(commune %in% c(\"ROUVROY\", \"CHARLEROI\")) %>%\n  transmute(commune, n_ventes, prix, p25, p75,\n            eiq         = p75 - p25,\n            eiq_relatif = (p75 - p25) / prix,\n            se_mediane  = 0.93 * (p75 - p25) / sqrt(n_ventes))\n```\n\n`%in%` teste l'appartenance à une liste : « la commune est-elle Rouvroy ou Charleroi ? ». Les noms sont en majuscules dans le fichier des ventes.\n:accord Mêmes chiffres dans les deux versions.\n##b | L'erreur-type de la médiane\n:enonce\nPour une distribution normale, l'erreur-type de la médiane d'un échantillon de n observations vaut environ 0,93 × (p75 − p25)/√n. Calculez cette erreur-type approximative pour les deux communes et comparez-les.\n:court\n**Rouvroy : 38 796 €** (24,5 % du prix médian). **Charleroi : 1 944 €** (1,4 %). L'erreur-type est **20 fois plus grande** à Rouvroy.\n:zero\nL'[[erreur-type]] répond à la question : « si l'on avait observé d'autres ventes, tirées dans la même distribution de prix, de combien la médiane aurait-elle bougé ? ». L'outil ci-dessous le montre.\n\n{{w:mediane}}\n\nLa formule dit deux choses simples :\n\n$$ \\text{erreur-type} ≈ 0,93 × \\frac{p75 − p25}{\\sqrt{n}} $$\n\n- **plus les prix sont dispersés** (numérateur), moins la médiane est précise ;\n- **plus il y a de ventes** (dénominateur), plus elle est précise, mais seulement comme $\\sqrt{n}$ : il faut quatre fois plus de ventes pour doubler la précision.\n\nLe calcul : Rouvroy, 0,93 × 172 000 / √17 = 38 796 €. Charleroi, 0,93 × 90 000 / √1 854 = 1 944 €.\n\nD'où vient le facteur 20 ? Il se décompose : le nombre de ventes explique un facteur √(1 854 / 17) = 10,4 ; la dispersion plus forte explique le reste (172 000 / 90 000 = 1,9). Et 10,4 × 1,9 ≈ 20.\n\n+++ D'où sort le 0,93 ?\nPour une loi normale d'écart-type σ, l'erreur-type de la médiane vaut environ 1,2533 × σ / √n. Or l'écart interquartile d'une loi normale vaut 1,349 × σ. En remplaçant σ par (écart interquartile) / 1,349, on obtient le facteur 1,2533 / 1,349 = 0,93. Tu n'as pas à le démontrer : l'énoncé donne la formule.\n+++\n:res\n| Commune | Erreur-type | En % du prix médian | Intervalle à 95 % du prix médian |\n|---|--:|--:|--:|\n| Charleroi | 1 944 € | 1,4 % | 133 900 € – 141 600 € |\n| Rouvroy | 38 796 € | 24,5 % | 82 500 € – 234 500 € |\n:accord Mêmes valeurs. Claude ajoute l'intervalle de confiance et la décomposition du facteur 20 (10,4 × 1,9), qui rendent la comparaison parlante. ChatGPT se limite aux deux calculs.\n##c | Conséquence pour la régression\n:enonce\nLe prix médian de Rouvroy est-il une mesure aussi fiable du prix d'une maison typique de la commune que celui de Charleroi ? Si `prix` est la variable dépendante d'une régression, quelle hypothèse du modèle linéaire cette différence de précision entre communes peut-elle remettre en cause ? Vous le vérifierez à la question 1.14.\n:court\n**Non** : la médiane de Rouvroy est bien moins fiable. Comme `prix` est la variable dépendante, cette imprécision entre dans le terme d'erreur, dont la variance dépend alors du nombre de ventes. C'est l'hypothèse d'**homoscédasticité** (variance constante des erreurs) qui est remise en cause.\n:zero\nLe raisonnement tient en trois étapes.\n\n1. Le prix qu'on observe est le « vrai » prix typique de la commune, plus une erreur d'échantillonnage : $prix_{observé} = prix_{typique} + e$.\n2. Dans la régression, cette erreur $e$ se retrouve dans le [[terme d'erreur]] $u$, avec tout le reste.\n3. La variance de $e$ vaut environ (0,93 × écart interquartile)² / n : elle est **énorme à Rouvroy, minuscule à Charleroi**. La variance de $u$ n'est donc pas la même pour toutes les communes.\n\nUne variance des erreurs qui change d'une observation à l'autre, c'est par définition de l'[[hétéroscédasticité]].\n\n| | Ce que ça change |\n|---|---|\n| Les coefficients | **Rien** : une erreur de mesure sur y, sans lien avec x, ajoute du bruit mais pas de biais. |\n| Les erreurs-types classiques | Elles deviennent **fausses**. D'où les erreurs-types robustes HC1 imposées par l'énoncé. |\n| L'efficacité | Les MCO ne sont plus les plus précis. Des moindres carrés pondérés par le nombre de ventes le seraient davantage. |\n:gpt\nConstate que l'erreur-type est près de 20 fois plus élevée à Rouvroy et conclut que « ce bruit dans la variable expliquée peut rendre la variance de l'erreur différente selon la commune », sans nommer l'hypothèse.\n:claude\nNomme l'hypothèse (homoscédasticité, théorème de Gauss-Markov), déroule le raisonnement (erreur d'échantillonnage dans y → dans u → variance dépendant de n) et précise ce que cela change et ne change pas.\n:verdict\nLa question demande explicitement « quelle hypothèse du modèle linéaire ». Il faut écrire le mot **homoscédasticité**. La version de Claude y répond directement ; celle de ChatGPT décrit le phénomène sans le nommer.\n:opt claude | Nommer l'hypothèse et dérouler le raisonnement\nNon : l'erreur-type de la médiane vaut 24,5 % du prix à Rouvroy, contre 1,4 % à Charleroi. Le prix observé est le prix typique plus une erreur d'échantillonnage, qui entre dans le terme d'erreur de la régression. Comme la variance de cette erreur dépend du nombre de ventes, la variance du terme d'erreur n'est pas constante d'une commune à l'autre : l'hypothèse d'homoscédasticité est remise en cause. Les coefficients restent sans biais, mais les erreurs-types classiques ne sont plus valables.\n:quiz\n? Une commune a quatre fois plus de ventes qu'une autre, avec la même dispersion des prix. L'erreur-type de sa médiane est :\n- quatre fois plus petite\n+ deux fois plus petite\n- la même\n> L'erreur-type diminue comme 1/√n : √4 = 2.\n? L'imprécision du prix médian dans les petites communes :\n- biaise le coefficient du revenu\n+ rend les erreurs-types classiques incorrectes, sans biaiser le coefficient\n- n'a aucune conséquence\n> Une erreur de mesure sur la variable dépendante, sans lien avec le régresseur, n'introduit pas de biais. Elle rend la variance des erreurs non constante.\n:oral\n? Quelle est la différence entre l'erreur-type de la médiane de Rouvroy et l'erreur-type de l'élasticité ?\n> La première mesure l'imprécision d'un prix communal : de combien la médiane de Rouvroy aurait pu varier avec d'autres ventes. La seconde mesure l'incertitude sur la relation estimée entre revenu et prix sur l'ensemble des 551 communes.\n\n#Q 1.4 | Décrire les données : tableaux, histogrammes, logarithmes\n:intro\nOn regarde les données avant de les modéliser. Deux enseignements à repérer : Bruxelles est à la fois la région la plus chère et la plus pauvre, et le logarithme ne fait pas la même chose au prix et au revenu.\n:concepts donnees, log\n##a | Statistiques descriptives\n:enonce\nPrésentez un tableau des statistiques descriptives (moyenne, médiane, écart-type, minimum, maximum) de `prix`, `rev_hab` et `n_ventes`, pour l'ensemble des communes et par région. Indiquez les communes qui ont les valeurs minimale et maximale de `prix` et de `rev_hab`.\n:court\nPrix médian moyen : **296 148 €** (Flandre 336 156 €, Wallonie 235 028 €, Bruxelles 511 876 €). Revenu par habitant moyen : **24 288 €** (Flandre 25 680 €, Wallonie 23 116 €, Bruxelles 19 199 €). Extrêmes : prix de 95 000 € à **Hastière** à 840 000 € à **Ixelles** ; revenu de 12 987 € à **Saint-Josse-ten-Noode** à 36 091 € à **Sint-Martens-Latem**.\n:zero\nTrois choses à commenter dans ce tableau.\n\n- **L'ordre des régions.** La Flandre est plus riche et plus chère que la Wallonie. Bruxelles est à part : **la plus chère et la plus pauvre à la fois**. Une seule droite pour tout le pays aura du mal à décrire cela.\n- **Les asymétries.** Pour le prix, la moyenne (296 148 €) dépasse la médiane (285 000 €) ; pour le nombre de ventes, l'écart est énorme (156 contre 108). Quelques très grandes valeurs tirent la moyenne vers le haut : Anvers compte 2 729 ventes.\n- **Le revenu.** Moyenne et médiane presque égales (24 288 € et 24 269 €) : la distribution est déjà symétrique.\n\n:::piege Une moyenne entre communes, pas entre maisons\nCes statistiques donnent le même poids à chaque commune : Rouvroy compte autant que Charleroi. 296 148 € est la moyenne des prix médians communaux, pas le prix moyen d'une maison en Belgique.\n:::\n:res\n| Variable | Groupe | Communes | Moyenne | Médiane | Écart-type | Minimum | Maximum |\n|---|---|--:|--:|--:|--:|--:|--:|\n| Prix médian (€) | Belgique | 551 | 296 148 | 285 000 | 101 888 | 95 000 | 840 000 |\n| | Flandre | 281 | 336 156 | 319 000 | 76 891 | 180 000 | 750 000 |\n| | Wallonie | 251 | 235 028 | 225 000 | 73 493 | 95 000 | 632 000 |\n| | Bruxelles | 19 | 511 876 | 479 000 | 154 953 | 337 500 | 840 000 |\n| Revenu par habitant (€) | Belgique | 551 | 24 288 | 24 269 | 3 264 | 12 987 | 36 091 |\n| | Flandre | 281 | 25 680 | 25 521 | 2 689 | 19 660 | 36 091 |\n| | Wallonie | 251 | 23 116 | 22 628 | 2 934 | 15 317 | 34 116 |\n| | Bruxelles | 19 | 19 199 | 18 429 | 4 089 | 12 987 | 26 354 |\n| Nombre de ventes | Belgique | 551 | 156,5 | 108 | 216,1 | 17 | 2 729 |\n| | Flandre | 281 | 195,1 | 137 | 250,9 | 18 | 2 729 |\n| | Wallonie | 251 | 116,7 | 72 | 168,5 | 17 | 1 854 |\n| | Bruxelles | 19 | 110,3 | 90 | 73,4 | 19 | 276 |\n\n| Extrême | Commune | Région | Valeur |\n|---|---|---|--:|\n| Prix le plus bas | Hastière | Wallonie | 95 000 € |\n| Prix le plus élevé | Ixelles | Bruxelles | 840 000 € |\n| Revenu le plus bas | Saint-Josse-ten-Noode | Bruxelles | 12 987 € |\n| Revenu le plus élevé | Sint-Martens-Latem | Flandre | 36 091 € |\n:code\n```r\nstats_desc <- function(d, groupe) {\n  bind_rows(lapply(c(\"prix\", \"rev_hab\", \"n_ventes\"), function(v) {\n    x <- d[[v]]\n    data.frame(groupe = groupe, variable = v, n = length(x),\n               moyenne = mean(x), mediane = median(x), ecart_type = sd(x),\n               minimum = min(x), maximum = max(x))\n  }))\n}\ntab_1_4 <- bind_rows(stats_desc(base, \"Belgique\"),\n                     stats_desc(filter(base, region == \"Flandre\"), \"Flandre\"),\n                     stats_desc(filter(base, region == \"Wallonie\"), \"Wallonie\"),\n                     stats_desc(filter(base, region == \"Bruxelles\"), \"Bruxelles\"))\n\nbase %>% slice_min(prix, n = 1)    # la commune au prix le plus bas\nbase %>% slice_max(prix, n = 1)    # … et au prix le plus élevé\n```\n\nOn écrit une petite fonction `stats_desc()` pour ne pas recopier quatre fois le même calcul. `lapply()` applique la fonction à chacune des trois variables, `bind_rows()` empile les résultats. `slice_min()` et `slice_max()` renvoient la ligne où une variable est minimale ou maximale.\n:accord Tableaux identiques. ChatGPT donne en plus les communes extrêmes **dans chaque région** (par exemple Menin et Knokke-Heist pour le prix en Flandre, Farciennes et Lasne pour le revenu en Wallonie) et rappelle que chaque commune pèse autant. L'énoncé ne demande les extrêmes que pour l'ensemble.\n##b | Histogrammes et coefficient d'asymétrie\n:enonce\nReprésentez les histogrammes de `prix` et de `rev_hab`, puis ceux de leur logarithme, et calculez le coefficient d'asymétrie de ces quatre variables.\n:court\nAsymétrie : **1,34** pour `prix`, **−0,01** pour ln(prix), **0,01** pour `rev_hab`, **−0,59** pour ln(rev_hab).\n:zero\nUn histogramme découpe l'axe en tranches et compte les communes dans chaque tranche. Le [[coefficient d'asymétrie]] résume sa forme en un nombre :\n\n$$ \\text{asymétrie} = \\frac{\\frac{1}{n} \\sum (x_{i} − \\bar{x})^{3}}{\\left[\\frac{1}{n} \\sum (x_{i} − \\bar{x})^{2}\\right]^{3/2}} $$\n\nPas besoin de retenir la formule, seulement sa lecture : les écarts à la moyenne sont mis **au cube**, ce qui garde leur signe et donne beaucoup de poids aux valeurs éloignées.\n\n- **0** : distribution symétrique ;\n- **positif** : la queue de droite est plus longue (quelques très grandes valeurs) ;\n- **négatif** : la queue de gauche est plus longue.\n\n{{w:histos}}\n:code\n```r\nasymetrie <- function(x) {\n  m <- mean(x)\n  mean((x - m)^3) / mean((x - m)^2)^1.5\n}\nasymetrie(base$prix)            #  1,338\nasymetrie(log(base$prix))       # -0,007\nasymetrie(base$rev_hab)         #  0,012\nasymetrie(log(base$rev_hab))    # -0,594\n\nggplot(base, aes(x = prix / 1000)) +\n  geom_histogram(bins = 40, fill = \"grey60\", colour = \"white\") +\n  labs(x = \"Prix médian (milliers d'euros)\", y = \"Nombre de communes\")\n```\n\nR n'a pas de fonction d'asymétrie de base : on l'écrit en deux lignes. `log()` est le logarithme naturel.\n:accord Mêmes quatre valeurs (1,338 ; −0,007 ; 0,012 ; −0,594), calculées avec la même formule. Seule la présentation diffère : Claude trace quatre graphiques séparés avec `ggplot2`, ChatGPT une seule figure à quatre panneaux avec les graphiques de base de R.\n##c | Ce que fait le logarithme à chaque variable\n:enonce\nPour laquelle des deux variables la transformation logarithmique rend-elle la distribution plus symétrique ? Que fait-elle à la distribution de l'autre ?\n:court\nLe logarithme rend le **prix** symétrique (asymétrie de 1,34 à −0,01). Il rend au contraire le **revenu**, déjà symétrique, **asymétrique vers la gauche** (de 0,01 à −0,59).\n:zero\nLe logarithme **comprime les grandes valeurs et étire les petites**. Ce qu'il produit dépend donc de la forme de départ.\n\n- **Prix** : une longue queue à droite (Ixelles, Knokke, la périphérie riche). Le logarithme la ramène vers le centre : la distribution devient symétrique.\n- **Revenu** : déjà symétrique. Le logarithme étire le bas de la distribution et écarte vers la gauche les quelques communes très pauvres (Saint-Josse, Molenbeek) : il **crée** une queue à gauche.\n\nChange de variable et d'échelle dans l'outil de la question (b) pour le voir.\n\n:::cle La leçon\nLe logarithme n'est pas un remède universel qui « normalise » les données. Il corrige une asymétrie à droite ; sur une variable symétrique, il en crée une à gauche.\n:::\n:accord Même réponse dans les deux versions.\n##d | Une autre raison de passer en logarithme\n:enonce\nLa forme de la distribution est-elle la seule raison de transformer une variable en logarithme dans une régression ? Donnez une autre raison.\n:court\n**Non.** La raison principale est l'**interprétation** : en logarithme, un coefficient mesure un effet **en pourcentage** (une élasticité), ce qui est plus plausible pour des prix et des revenus qu'un effet constant en euros.\n:zero\nUn modèle en niveaux suppose que 1 000 € de revenu en plus ajoutent **le même nombre d'euros** au prix à Hastière (95 000 €) et à Ixelles (840 000 €). Un modèle en logarithmes suppose qu'ils ajoutent **le même pourcentage**. La seconde hypothèse est bien plus crédible.\n\nAutres raisons valables, si on t'en demande davantage :\n\n- un modèle multiplicatif $prix = A × rev^{β}$ devient linéaire en logarithmes : $\\ln(prix) = \\ln(A) + β \\ln(rev)$ ;\n- la dispersion augmente souvent avec le niveau : en logarithmes, l'hétéroscédasticité et le poids des valeurs extrêmes diminuent ;\n- le coefficient ne dépend plus des unités (euros ou milliers d'euros).\n\n:::astuce Une précision qui fait bonne impression\nLa régression linéaire **n'exige pas** que les variables soient normalement distribuées. La symétrie d'un histogramme n'est donc jamais, à elle seule, une raison suffisante de transformer une variable.\n:::\n:gpt\nLa forme fonctionnelle traduit une **hypothèse économique** : en log-log, une même hausse relative du revenu est associée à une même variation relative du prix. Ajoute que la régression ne requiert pas que le revenu soit normalement distribué.\n:claude\nL'**interprétation en pourcentage** (élasticité, semi-élasticité), avec l'exemple Hastière-Ixelles, puis trois autres raisons : modèle multiplicatif, hétéroscédasticité, indépendance des unités.\n:verdict\nC'est la même raison, dite de deux façons : passer en logarithme, c'est supposer des effets proportionnels. Claude donne plus de raisons (une seule est demandée) ; ChatGPT ajoute la remarque sur la normalité, juste et utile à l'oral.\n:opt mix | L'interprétation en pourcentage\nNon. La raison principale est l'interprétation : en logarithmes, le coefficient mesure un effet relatif (une élasticité), plus plausible pour des prix et des revenus qu'un effet constant en euros. Une hausse de revenu ne peut pas ajouter le même montant au prix à Hastière et à Ixelles, mais elle peut ajouter le même pourcentage. La régression n'exige d'ailleurs pas que les variables soient normalement distribuées.\n:quiz\n? Le coefficient d'asymétrie du nombre de ventes est fortement positif. Cela signifie que :\n- la plupart des communes ont beaucoup de ventes\n+ quelques communes ont beaucoup plus de ventes que les autres\n- la moyenne est inférieure à la médiane\n> Une asymétrie positive indique une longue queue à droite : quelques très grandes valeurs (Anvers, Charleroi…), qui tirent la moyenne au-dessus de la médiane.\n:oral\n? Pourquoi mettre le prix en logarithme ?\n> Surtout pour l'interprétation : le coefficient mesure alors un effet en pourcentage, plus crédible qu'un effet constant en euros entre Hastière et Ixelles. Accessoirement, le logarithme rend la distribution du prix symétrique et réduit le poids des communes très chères.\n\n#Q 1.5 | Le nuage de points\n:enonce\nReprésentez `prix` en fonction de `rev_hab`, avec une couleur par région et la droite des MCO estimée sur l'ensemble des communes, d'abord en niveaux, puis avec des échelles logarithmiques.\n:intro\nUn graphique vaut ici tous les tableaux : on y voit d'un coup la relation positive, les trois régions, et le problème que posera Bruxelles. Utilise l'outil pour reproduire les deux graphiques demandés (échelles « Niveaux » puis « Logarithmiques », modèle « Une seule droite »).\n\n{{w:nuage modele=unique echelle=niveaux}}\n:concepts mco, log\n##a | Que représente un point ?\n:enonce\nQue représente un point ?\n:court\n**Une commune en 2023.** En abscisse, son revenu net imposable par habitant ; en ordonnée, le prix médian des maisons qui y ont été vendues. La couleur indique sa région.\n:zero\nC'est la question de l'[[unité statistique]], posée autrement. Réponds toujours par : une observation = quoi, quand, et que lit-on sur chaque axe.\n:accord Même réponse.\n##b | Niveaux ou logarithmes ?\n:enonce\nLa relation vous paraît-elle plus proche d'une droite en niveaux ou en logarithmes ?\n:court\n**Un peu plus proche d'une droite en logarithmes** : en niveaux, le nuage s'incurve vers le haut et s'élargit quand le revenu augmente ; en logarithmes, la dispersion est plus régulière. Mais la différence est modeste : le grand écart à la droite vient des régions, pas de la forme de la courbe.\n:zero\nDeux indices à chercher à l'œil.\n\n- **La courbure.** En niveaux, les points flamands et wallons dessinent une courbe qui monte de plus en plus vite. Une droite ne suit pas bien une courbe.\n- **L'éventail.** En niveaux, le nuage est étroit à gauche et large à droite : la dispersion des prix augmente avec le revenu. En logarithmes, la bande a une épaisseur plus régulière.\n\nSois honnête dans ta réponse : la différence n'est pas spectaculaire. Ce qui frappe surtout, dans les deux graphiques, ce sont les trois paquets de couleurs.\n:gpt\nPrudent : à l'intérieur des régions, les bandes de points sont assez rectilignes en logarithmes et les prix extrêmes pèsent moins ; mais la superposition des trois groupes « empêche de trancher nettement » à l'œil.\n:claude\nTranche un peu plus : « un peu plus proche d'une droite en logarithmes », en donnant les deux indices (courbure, élargissement), tout en précisant que la différence reste modeste.\n:verdict\nLes deux disent la même chose avec un degré d'assurance différent. La question demande ton impression (« vous paraît-elle ») : il faut **prendre position** et la justifier par ce qu'on voit, puis nuancer. La formulation de Claude fait les deux.\n:opt claude | Prendre position, puis nuancer\nUn peu plus proche d'une droite en logarithmes. En niveaux, le nuage s'incurve vers le haut et s'élargit quand le revenu augmente ; en logarithmes, la dispersion est plus régulière. La différence reste modeste : l'essentiel de l'écart à la droite vient des régions, pas de la forme fonctionnelle.\n:opt gpt | Insister sur la difficulté de trancher\nEn logarithmes, les bandes de points sont assez rectilignes à l'intérieur de chaque région et les prix extrêmes pèsent moins. La superposition des trois régions empêche toutefois de trancher nettement à l'œil pour une droite nationale.\n##c | Les régions par rapport à la droite\n:enonce\nComment les communes de chaque région se situent-elles par rapport à la droite ?\n:court\n**Bruxelles** : les 19 communes sont toutes très au-dessus, à gauche du graphique (revenus faibles, prix élevés). **Wallonie** : la plupart sont en dessous. **Flandre** : la majorité est au-dessus.\n:zero\nÊtre au-dessus de la droite, c'est avoir un prix **plus élevé que ce que le revenu laisse prévoir**. La droite commune est donc un compromis entre trois nuages différents : elle passe trop bas pour Bruxelles et la Flandre, trop haut pour la Wallonie.\n\nC'est le point de départ de toute la suite : les questions 1.9 à 1.13 corrigent ce défaut en donnant à chaque région sa propre droite.\n:res\n| Région | Communes | Au-dessus de la droite en niveaux | Au-dessus de la droite en log-log |\n|---|--:|--:|--:|\n| Flandre | 281 | 55,9 % | 66,9 % |\n| Wallonie | 251 | 13,9 % | 17,9 % |\n| Bruxelles | 19 | 100 % | 100 % |\n:accord Même constat. ChatGPT le **chiffre** avec le tableau ci-dessus (part des communes dont le résidu est positif), ce qui est plus solide qu'une impression visuelle. Le calcul tient en une ligne : `mean(resid(modele) > 0)` par région.\n##d | Ce que le graphique ne montre pas\n:enonce\nCitez deux informations utiles que ce graphique ne permet pas de voir.\n:court\n1. **La précision de chaque point** : Rouvroy (17 ventes) pèse autant à l'œil que Charleroi (1 854 ventes).\n2. **Les autres déterminants du prix** : taille et qualité des maisons, distance aux emplois, part d'appartements. Le graphique montre une corrélation, pas l'effet du revenu « toutes choses égales par ailleurs ».\n:zero\nCoche « Taille des points = nombre de ventes » dans l'outil : tu vois alors ce que le graphique de base cache. Les gros points sont fiables, les petits beaucoup moins.\n\nOn pourrait citer aussi la population des communes (Anvers et une commune de 2 000 habitants valent un point chacune) et l'évolution dans le temps (une seule année).\n:gpt\nDeux informations : le **nombre de ventes** derrière chaque médiane et la **dispersion des prix** à l'intérieur de la commune.\n:claude\nDeux informations : la **précision** de chaque point (nombre de ventes et dispersion), et les **autres déterminants** du prix. Mentionne aussi la taille des communes et la dimension temporelle.\n:verdict\nLes deux informations de ChatGPT sont en réalité deux faces de la même idée (la précision de la médiane, question 1.3). Celles de Claude sont de nature différente : l'une concerne la **qualité de la mesure**, l'autre l'**interprétation** de la relation. Elles couvrent mieux la question et préparent les questions 1.14 et 1.18.\n:opt claude | Précision des points et variables absentes\nLe graphique ne montre pas la précision de chaque point : une commune de 17 ventes pèse autant qu'une commune de 1 854 ventes. Il ne montre pas non plus les autres déterminants du prix (taille des maisons, localisation, part d'appartements) : on voit une corrélation, pas l'effet du revenu à caractéristiques égales.\n:opt gpt | Nombre de ventes et dispersion des prix\nLe graphique ne montre ni le nombre de ventes derrière chaque médiane, ni la dispersion des prix de vente à l'intérieur de chaque commune. Un point à Rouvroy et un point à Charleroi ont la même taille malgré des précisions très différentes.\n:code\n```r\ncouleurs <- c(Flandre = \"#E69F00\", Wallonie = \"#0072B2\", Bruxelles = \"#CC79A7\")\n\nfig_1_5_niveaux <- ggplot(base, aes(x = rev_k, y = prix_k)) +\n  geom_point(aes(colour = region), alpha = 0.7) +                  # couleur par région\n  geom_smooth(method = \"lm\", formula = y ~ x, se = FALSE, colour = \"black\") +\n  scale_colour_manual(values = couleurs) +\n  labs(x = \"Revenu net imposable par habitant (milliers d'euros)\",\n       y = \"Prix médian (milliers d'euros)\", colour = \"Région\")\n\nfig_1_5_logs <- fig_1_5_niveaux + scale_x_log10() + scale_y_log10()\n```\n\n:::piege Où placer `colour = region`\nIl est dans `geom_point()`, pas dans `ggplot()`. Placé dans `ggplot()`, il s'appliquerait aussi à `geom_smooth()`, qui tracerait alors **une droite par région**. L'énoncé demande une seule droite, estimée sur l'ensemble des communes.\n:::\n\nAvec `scale_x_log10()` et `scale_y_log10()`, `geom_smooth()` estime la droite sur les logarithmes : c'est exactement le modèle log-log de la question 1.6. ChatGPT obtient le même résultat avec les graphiques de base de R (`plot()` puis `abline()`), en traçant directement ln(prix) contre ln(revenu).\n:quiz\n? Une commune située au-dessus de la droite des MCO :\n- a un revenu supérieur à la moyenne\n+ a un prix plus élevé que ce que son revenu laisse prévoir\n- a un prix supérieur à la moyenne\n> La droite donne le prix prédit à partir du revenu. Être au-dessus, c'est avoir un résidu positif.\n:oral\n? Pourquoi une seule droite ne convient-elle pas à ce nuage ?\n> Parce qu'elle fait un compromis entre trois nuages : toutes les communes bruxelloises sont au-dessus, la plupart des wallonnes en dessous. Les erreurs de prédiction ne sont pas dues au hasard, elles dépendent de la région.\n\n#SEC B | Formes fonctionnelles\n\n#Q 1.6 | Quatre modèles, quatre façons de lire une pente\n:enonce\nEstimez par les MCO les quatre modèles suivants, en exprimant `prix` et `rev_hab` en milliers d'euros lorsqu'ils sont en niveau : niveau-niveau, log-log, log-niveau, niveau-log. Présentez-les dans un tableau unique (coefficients, erreurs-types, R², nombre d'observations). Interprétez le coefficient de pente de chaque modèle.\n:intro\nLes quatre modèles relient les deux mêmes variables. La seule chose qui change est **l'endroit où l'on met le logarithme**, et cela change complètement la lecture du coefficient. Si la leçon sur les logarithmes n'est pas fraîche, commence par elle.\n:concepts log, mco, lire-r\n## | Estimer et interpréter\n:court\n| Modèle | Pente (erreur-type HC1) | Lecture |\n|---|--:|---|\n| Niveau-niveau | 18,229 (1,666) | +1 000 € de revenu ↔ **+18 229 €** de prix |\n| Log-log | 1,444 (0,149) | +1 % de revenu ↔ **+1,44 %** de prix (élasticité) |\n| Log-niveau | 0,0642 (0,0051) | +1 000 € de revenu ↔ **+6,4 %** de prix |\n| Niveau-log | 401,17 (45,97) | +1 % de revenu ↔ **+4 012 €** de prix |\n:zero\n**La règle, en deux lignes.**\n\n- La variable **dépendante** est en log ? L'effet se lit **en pourcentage**. Sinon, dans l'unité de y (ici des milliers d'euros).\n- Le **régresseur** est en log ? L'effet se lit « **pour une hausse de 1 %** de x ». Sinon, pour une hausse d'une unité (ici 1 000 €).\n\nApplique-la mécaniquement aux quatre cas.\n\n**Niveau-niveau (18,229).** Rien en log : unités contre unités. Une commune dont le revenu par habitant est supérieur de 1 000 € a, en moyenne, un prix médian supérieur de 18,229 milliers d'euros, soit 18 229 €.\n\n**Log-log (1,444).** Tout en log : pourcentage contre pourcentage. Un revenu supérieur de 1 % va de pair avec un prix supérieur de 1,44 %. C'est une [[élasticité]]. Elle dépasse 1 : le prix augmente **plus que proportionnellement** au revenu.\n\n**Log-niveau (0,0642).** Seul y est en log : pourcentage contre unité. On multiplie par 100 : 1 000 € de revenu en plus vont de pair avec un prix supérieur d'environ 6,4 %. C'est une [[semi-élasticité]]. Valeur exacte : 100 × (exp(0,0642) − 1) = 6,6 %.\n\n**Niveau-log (401,17).** Seul x est en log : unité contre pourcentage. On **divise** par 100 : un revenu supérieur de 1 % va de pair avec un prix supérieur de 401,17 / 100 = 4,01 milliers d'euros, soit environ 4 000 €.\n\n:::piege Le vocabulaire qui coûte des points\nOn compare des communes entre elles, la même année. Écris « va de pair avec », « est associé à », « une commune dont le revenu est plus élevé a… ». N'écris pas « une hausse du revenu fait monter le prix » : ce serait une affirmation causale, que la question 1.18 te demandera justement de refuser.\n:::\n\n**Pourquoi « en milliers d'euros » ?** Uniquement pour obtenir des coefficients lisibles. Diviser une variable par 1 000 multiplie ou divise son coefficient par 1 000, sans rien changer d'autre. Dans un logarithme, changer d'unité ne déplace que la constante : c'est pourquoi les logs peuvent être pris sur les montants en euros.\n:res\n| | Niveau-niveau | Log-log | Log-niveau | Niveau-log |\n|---|--:|--:|--:|--:|\n| Variable dépendante | prix (k€) | ln(prix) | ln(prix) | prix (k€) |\n| Régresseur | rev_hab (k€) | ln(rev_hab) | rev_hab (k€) | ln(rev_hab) |\n| **Pente** | **18,229** (1,666) | **1,444** (0,149) | **0,0642** (0,0051) | **401,17** (45,97) |\n| Constante | −146,61 (41,70) | −2,026 (1,513) | 10,984 (0,131) | −3 751,0 (464,9) |\n| R² | 0,341 | 0,367 | 0,403 | 0,297 |\n| Observations | 551 | 551 | 551 | 551 |\n\nErreurs-types robustes HC1 entre parenthèses. Les quatre pentes sont très significatives (t entre 8,7 et 12,5). Source : Statbel, 2023.\n\n{{w:formes}}\n:code\n```r\nbase <- base %>%\n  mutate(prix_k = prix / 1000, rev_k = rev_hab / 1000,   # en milliers d'euros\n         lprix = log(prix), lrev = log(rev_hab))          # logarithmes\n\nreg_1_6_nn <- lm(prix_k ~ rev_k, data = base)   # niveau-niveau\nreg_1_6_ll <- lm(lprix  ~ lrev,  data = base)   # log-log\nreg_1_6_ln <- lm(lprix  ~ rev_k, data = base)   # log-niveau\nreg_1_6_nl <- lm(prix_k ~ lrev,  data = base)   # niveau-log\n\nrob <- function(m) coeftest(m, vcov = vcovHC(m, type = \"HC1\"))\nrob(reg_1_6_ll)                    # coefficients et erreurs-types robustes\nsummary(reg_1_6_ll)$r.squared      # R²\nnobs(reg_1_6_ll)                   # nombre d'observations\n```\n\n- `lm(y ~ x, data = base)` estime y sur x par les MCO, constante comprise.\n- `rob()` est un raccourci défini une fois au début du script, pour ne pas réécrire soixante fois la même ligne. `coeftest()` vient du package `lmtest`, `vcovHC()` du package `sandwich`.\n- On aurait pu écrire directement `lm(log(prix) ~ log(rev_hab))` : le résultat est le même.\n:accord Les quatre régressions donnent exactement les mêmes coefficients, erreurs-types et R² dans les deux scripts. ChatGPT donne en plus, pour chaque pente, la valeur **exacte** à côté de l'approximation : 1,4475 % pour une hausse de 1 % en log-log, et 3 992 € (au lieu de 4 012 €) en niveau-log. C'est un raffinement : pour une variation de 1 %, l'approximation suffit.\n:quiz\n? Dans le modèle log-niveau, la pente vaut 0,0642 quand le revenu est en milliers d'euros. Cela signifie que :\n- un revenu supérieur de 1 % est associé à un prix supérieur de 0,064 %\n+ un revenu supérieur de 1 000 € est associé à un prix supérieur d'environ 6,4 %\n- un revenu supérieur de 1 000 € est associé à un prix supérieur de 64 €\n> y est en log (effet en pourcentage : on multiplie par 100), x est en niveau (pour une unité, soit 1 000 €).\n? L'élasticité de 1,444 est supérieure à 1. Cela veut dire que :\n- les prix sont plus élevés que les revenus\n+ entre communes, le prix augmente plus que proportionnellement au revenu\n- une hausse de revenu de 1 € fait monter le prix de 1,44 €\n> Une élasticité relie deux pourcentages : +1 % de revenu, +1,44 % de prix.\n:oral\n? Pourquoi 1,44 % et pas 1,44 € ?\n> Parce que le logarithme est des deux côtés : la pente relie une variation en pourcentage du revenu à une variation en pourcentage du prix. C'est une élasticité.\n? Que se passe-t-il si tu exprimes le revenu en euros plutôt qu'en milliers d'euros ?\n> Dans les modèles où le revenu est en niveau, la pente est divisée par 1 000. Dans ceux où il est en logarithme, seule la constante change. Rien d'autre ne bouge : ni les t, ni le R², ni les prédictions.\n\n#Q 1.7 | Variations prédites : approximation ou valeur exacte ?\n:enonce\nPour une commune dont le revenu par habitant est de 24 000 euros, calculez la variation du prix prédite par chacun des quatre modèles pour (a) une hausse du revenu de 1 000 euros. Faites de même pour (b) un passage de 20 000 à 30 000 euros. Pour les modèles dont la variable dépendante est en logarithme, donnez l'approximation usuelle et la variation exacte. Pourquoi l'écart entre approximation et variation exacte grandit-il de (a) à (b) ? Quel type de relation chacun des quatre modèles impose-t-il aux données ?\n:intro\nCette question fait calculer la même chose de deux façons, pour montrer **quand la lecture rapide d'un coefficient en logarithme cesse d'être fiable**. L'outil de la question 1.6 refait tous ces calculs : règle le revenu de départ et d'arrivée.\n:concepts log\n## | Les deux cas et leur comparaison\n:court\n(a) De 24 000 à 25 000 € : les quatre modèles prédisent **+16 400 à +18 300 €**, soit +5,5 à +6,6 %, et l'approximation est presque exacte. (b) De 20 000 à 30 000 € : **+163 000 à +192 000 €**, et l'approximation se trompe lourdement (64 % au lieu de 90 % pour le log-niveau). L'approximation est une formule valable pour de **petites** variations ; son erreur croît comme le carré de la variation.\n:zero\n**Les formules.** Le revenu passe de $r₀$ à $r₁$ (en milliers d'euros).\n\n| Modèle | Approximation usuelle | Variation exacte |\n|---|---|---|\n| Niveau-niveau | — | $Δprix = β₁ (r₁ − r₀)$ |\n| Log-log | $%Δprix ≈ β₁ × %Δrev$ | $%Δprix = 100 × [(r₁ / r₀)^{β₁} − 1]$ |\n| Log-niveau | $%Δprix ≈ 100 × β₁ (r₁ − r₀)$ | $%Δprix = 100 × [\\exp(β₁ (r₁ − r₀)) − 1]$ |\n| Niveau-log | — | $Δprix = β₁ × [\\ln(r₁) − \\ln(r₀)]$ |\n\nLes modèles en niveau n'ont pas d'« approximation » : leur variable dépendante est en euros, le calcul est direct.\n\n**Un exemple entièrement détaillé : le log-log, cas (b).** Le revenu augmente de 50 %.\n\n- Approximation usuelle : 1,444 × 50 % = **72,2 %**.\n- Calcul exact : le modèle dit $\\ln(prix) = β₀ + 1,444 × \\ln(rev)$. La variation de ln(prix) vaut donc 1,444 × ln(30 000 / 20 000) = 1,444 × 0,4055 = 0,5856. Pour revenir à un pourcentage : 100 × (exp(0,5856) − 1) = **79,6 %**.\n\n**Pourquoi l'écart grandit-il ?** L'approximation repose sur deux raccourcis : $\\exp(z) − 1 ≈ z$ et $\\ln(1 + g) ≈ g$. Ils remplacent une courbe par sa tangente. Près du point de départ, la tangente colle à la courbe ; plus on s'éloigne, plus elle s'en écarte. L'erreur est de l'ordre de $z² / 2$ : elle croît comme le **carré** de la variation.\n\n| | (a) | (b) |\n|---|--:|--:|\n| Variation du log-prix dans le log-niveau (z) | 0,064 | 0,642 |\n| Erreur de l'approximation | 0,2 point | 25,8 points |\n\nUne variation dix fois plus grande donne une erreur environ cent fois plus grande.\n\n**Quel type de relation chaque modèle impose-t-il ?**\n\n| Modèle | Ce qui est constant | Forme de la courbe prix-revenu |\n|---|---|---|\n| Niveau-niveau | l'effet **en euros** de 1 000 € de revenu (18 229 €) | une droite |\n| Log-log | l'**élasticité** (1,44) | convexe : en euros, l'effet de 1 000 € grandit avec le revenu |\n| Log-niveau | la **semi-élasticité** (+6,4 % par 1 000 €) | exponentielle, convexe elle aussi |\n| Niveau-log | l'effet en euros de **1 %** de revenu (4 012 €) | concave : l'effet de 1 000 € diminue quand le revenu monte |\n\nLe nuage de la question 1.5 s'incurve vers le haut : les modèles convexes (log-log, log-niveau) lui conviennent mieux que le modèle concave (niveau-log), qui a d'ailleurs le plus petit R².\n:res\n**(a) De 24 000 à 25 000 € (+1 000 €, soit +4,17 %)**\n\n| Modèle | Prix prédit à 24 000 € | Variation en € | Approximation | Variation exacte |\n|---|--:|--:|--:|--:|\n| Niveau-niveau | 290 889 € | +18 229 € | — | +6,27 % |\n| Log-log | 279 371 € | +16 967 € | +6,02 % | +6,07 % |\n| Log-niveau | 275 281 € | +18 256 € | +6,42 % | +6,63 % |\n| Niveau-log | 295 099 € | +16 377 € | — | +5,55 % |\n\n**(b) De 20 000 à 30 000 € (+10 000 €, soit +50 %)**\n\n| Modèle | Prix prédit à 20 000 € | Variation en € | Approximation | Variation exacte |\n|---|--:|--:|--:|--:|\n| Niveau-niveau | 217 973 € | +182 291 € | — | +83,6 % |\n| Log-log | 214 695 € | +170 914 € | +72,2 % | +79,6 % |\n| Log-niveau | 212 927 € | +191 739 € | +64,2 % | +90,0 % |\n| Niveau-log | 221 957 € | +162 660 € | — | +73,3 % |\n\nPour exprimer en euros les modèles dont la variable dépendante est en log, on part du prix prédit $\\exp(β₀ + β₁ x)$. Pour les modèles en niveau, le pourcentage rapporte la variation au prix prédit de départ.\n:code\n```r\nb_ll <- coef(reg_1_6_ll)[2]              # la pente du log-log\nr0 <- 20; r1 <- 30                       # en milliers d'euros\n\nb_ll * (r1 - r0) / r0 * 100              # approximation : 72,2 %\n100 * ((r1 / r0)^b_ll - 1)               # exacte : 79,6 %\n\nb_ln <- coef(reg_1_6_ln)[2]              # la pente du log-niveau\n100 * b_ln * (r1 - r0)                   # approximation : 64,2 %\n100 * (exp(b_ln * (r1 - r0)) - 1)        # exacte : 90,0 %\n```\n\n`coef(m)` renvoie le vecteur des coefficients ; `[2]` prend le deuxième, la pente (le premier est la constante). `exp()` est l'exponentielle, l'opération inverse du logarithme.\n:gpt\nMêmes variations en euros et mêmes variations exactes. Présente **deux** approximations pour les modèles en log : l'« approximation locale » (β × %Δrev, soit 6,02 % et 72,2 % en log-log) et « 100 Δln(P) », la variation du log-prix lue directement comme un pourcentage (5,90 % et 58,6 %). Explique l'écart par la courbure du logarithme et de l'exponentielle.\n:claude\nUne seule approximation par modèle, celle du cours : β₁ × %Δrev pour le log-log, 100 × β₁ × Δrev pour le log-niveau. Explique l'écart par un développement limité : l'erreur est d'ordre z²/2, donc cent fois plus grande pour une variation dix fois plus grande.\n:verdict\nTous les chiffres communs sont identiques. La différence porte sur ce qu'on appelle « l'approximation usuelle ». Pour le log-log, celle des manuels est **β₁ × %Δrev** : c'est la lecture même de l'élasticité. La colonne supplémentaire de ChatGPT (58,6 %) est un autre raccourci, qui n'approche que le côté « prix » ; la donner en plus risque de brouiller la réponse, et tu devrais expliquer à l'oral d'où elle vient. L'explication de Claude (erreur en z²) est plus précise et répond directement au « pourquoi ». Conseil : une seule approximation par modèle, et l'argument du carré.\n:opt claude | Une approximation par modèle, erreur en z²\nJe donne pour le log-log l'approximation β₁ × %Δrev et pour le log-niveau 100 × β₁ × Δrev, puis la variation exacte. L'écart passe de 0,2 point en (a) à 26 points en (b) pour le log-niveau, parce que l'approximation remplace exp(z) − 1 par z : l'erreur est de l'ordre de z²/2 et croît comme le carré de la variation.\n:opt gpt | Deux approximations pour les modèles en log\nJe donne l'approximation locale (β × %Δrev) et la lecture directe de 100 × Δln(prix) comme un pourcentage, puis la variation exacte. Les trois s'écartent davantage sur un grand intervalle car le logarithme et l'exponentielle sont courbes.\n:piege\nDans le cas (b), ne lis pas le coefficient du log-niveau « à la volée » : 0,0642 × 10 = 0,642 ne veut **pas** dire +64 %. La variation exacte est de +90 %. Dès que le produit dépasse 0,1 environ, passe à la formule avec l'exponentielle.\n:quiz\n? L'approximation « 100 × β » pour un coefficient en logarithme est fiable :\n- toujours\n+ pour les petites variations seulement\n- pour les grandes variations seulement\n> Elle remplace une courbe par sa tangente. L'erreur croît comme le carré de la variation.\n? Quel modèle impose que 1 000 € de revenu en plus aient un effet en euros de plus en plus faible quand le revenu monte ?\n- le log-log\n- le niveau-niveau\n+ le niveau-log\n> Dans le niveau-log, l'effet est constant pour 1 % de revenu. Or 1 000 € représentent un pourcentage de plus en plus petit quand le revenu augmente : la relation est concave.\n:oral\n? Pourquoi l'approximation est-elle bonne en (a) et mauvaise en (b) ?\n> Parce qu'elle remplace exp(z) − 1 par z, ce qui n'est juste que pour un petit z. En (a), z vaut 0,06 et l'erreur est de 0,2 point ; en (b), z vaut 0,64 et l'erreur atteint 26 points. L'erreur croît comme le carré de la variation.\n\n#Q 1.8 | Peut-on choisir un modèle à son R² ?\n:enonce\nUn·e collègue retient le modèle log-log parce que son R² est plus élevé que celui du modèle niveau-niveau. Discutez cet argument. Quels critères utiliseriez-vous pour choisir, à la lumière des questions 1.4 à 1.7 ? Dans la suite, on retient le modèle log-log.\n:concepts mco, log\n## | L'argument et les bons critères\n:court\n**L'argument ne tient pas.** Le R² du log-log (0,367) est la part expliquée de la variance de **ln(prix)** ; celui du niveau-niveau (0,341), la part expliquée de la variance de **prix**. Ce sont deux variables différentes : les deux R² ne sont pas comparables. On choisit le log-log pour son **interprétation** (une élasticité), la **symétrie** de ln(prix) et la **forme du nuage**, pas pour son R².\n:zero\nLe [[R²]] est une proportion : « quelle part de la dispersion de y le modèle explique-t-il ? ». Changer y, c'est changer la dispersion à expliquer. Comparer 0,367 et 0,341 revient à comparer une note sur 20 et une note sur 100 sans regarder le barème.\n\n**Les comparaisons qui, elles, sont valables.**\n\n- **Même variable dépendante.** Sur ln(prix), le log-niveau (0,403) fait mieux que le log-log (0,367). Sur prix, le niveau-niveau (0,341) fait mieux que le niveau-log (0,297).\n- **Même échelle.** On ramène les prédictions du log-log en euros, puis on calcule le carré de leur corrélation avec le prix observé : 0,357, contre 0,341 pour le niveau-niveau. Le log-log reste un peu meilleur, mais l'écart est faible.\n\n**Les critères à utiliser**, avec ce que les questions précédentes ont montré.\n\n1. **L'interprétation économique.** Un effet proportionnel (une élasticité) est plus plausible pour des prix et des revenus, et il ne dépend pas des unités. Le niveau-niveau prédirait d'ailleurs un prix **négatif** pour un revenu inférieur à 8 043 € (146,61 / 18,229).\n2. **La distribution (question 1.4).** ln(prix) est symétrique, ce qui limite le poids des communes très chères.\n3. **La forme du nuage (question 1.5).** En niveaux, relation convexe et dispersion croissante ; en logarithmes, bande plus régulière.\n4. **La qualité d'ajustement**, mais seulement entre modèles comparables.\n\n:::astuce Ce qu'il faut savoir répondre si on insiste\n« Votre log-niveau a un R² plus élevé que votre log-log, pourquoi ne pas le prendre ? » Entre ces deux-là, la comparaison est légitime, et le log-niveau s'ajuste un peu mieux. On garde le log-log pour son interprétation en élasticité et parce que l'énoncé l'impose pour la suite ; l'écart de R² (0,403 contre 0,367) est modeste.\n:::\n:gpt\nLes deux R² portent sur deux dispersions différentes ; avec ln(prix) à gauche, le log-niveau atteint d'ailleurs 0,403. Retient le log-log « pour son élasticité, le nuage de points et l'usage demandé dans la suite ». Propose, pour départager des modèles prédictifs, de comparer leurs **erreurs hors échantillon** sur une même échelle.\n:claude\nMême diagnostic, avec l'image de la note sur 20 et sur 100. **Recalcule** un R² du log-log sur l'échelle des prix (0,357 contre 0,341), signale le prix négatif prédit par le niveau-niveau sous 8 043 €, et liste quatre critères reliés aux questions 1.4 à 1.7.\n:verdict\nMême conclusion. Claude répond plus complètement à la seconde moitié de la question (« quels critères, à la lumière des questions 1.4 à 1.7 ») et chiffre la comparaison sur une même échelle, ce qui montre que tu sais **faire** une comparaison valable, pas seulement dire que l'autre ne l'est pas. L'idée de ChatGPT (erreur de prévision hors échantillon) est juste mais sort du cadre du cours.\n:opt claude | Deux R² non comparables, puis quatre critères\nL'argument ne tient pas : les deux R² mesurent la part expliquée de deux variables différentes, ln(prix) et prix. Ramené sur l'échelle des prix, le log-log explique 35,7 % de la variance contre 34,1 % pour le niveau-niveau : il reste un peu meilleur, mais ce n'est pas un argument décisif. Je choisis le log-log pour son interprétation (une élasticité, plus plausible qu'un effet constant en euros), pour la symétrie de ln(prix) et pour la forme du nuage, plus régulière en logarithmes.\n:opt gpt | Deux R² non comparables, critère de prévision\nLes deux R² portent sur des dispersions différentes et ne se comparent pas. Je retiens le log-log pour son élasticité et la forme du nuage. Pour départager des modèles sur leur qualité de prédiction, il faudrait comparer leurs erreurs sur une même échelle.\n:code\n```r\n# R² du log-log recalculé sur l'échelle des prix\ncor(base$prix_k, exp(fitted(reg_1_6_ll)) / 1000)^2    # 0,357\nsummary(reg_1_6_nn)$r.squared                         # 0,341\n```\n\n`fitted(m)` renvoie les valeurs ajustées, ici des ln(prix) prédits. `exp()` les ramène en euros. Le carré de la corrélation entre le prix observé et ce prix prédit est un R² comparable à celui du modèle en niveaux.\n:quiz\n? Lesquels de ces R² peut-on comparer directement ?\n- log-log (0,367) et niveau-niveau (0,341)\n+ log-log (0,367) et log-niveau (0,403)\n- log-niveau (0,403) et niveau-log (0,297)\n> Seuls les modèles qui ont la même variable dépendante, ici ln(prix), ont des R² comparables.\n:oral\n? Pourquoi avoir retenu le log-log si ce n'est pas pour son R² ?\n> Pour son interprétation : la pente est une élasticité, un effet proportionnel plus crédible qu'un effet constant en euros entre une commune à 95 000 € et une à 840 000 €. S'y ajoutent la symétrie de ln(prix) et un nuage plus régulier en logarithmes.\n\n#SEC C | Régions\n\n#Q 1.9 | Ajouter la région : des droites parallèles\n:enonce\nAjoutez au modèle log-log des indicatrices de région, avec la Flandre comme catégorie de référence.\n:intro\nLe nuage de la question 1.5 montrait trois paquets de couleurs. On donne maintenant à chaque région **sa propre hauteur**, tout en gardant une pente commune.\n\n$$ \\ln(prix_{i}) = β₀ + β₁ \\ln(rev\\_hab_{i}) + δ_{W} Wallonie_{i} + δ_{B} Bruxelles_{i} + u_{i} $$\n\n{{w:nuage modele=paralleles titre=\"Le modèle 1.9 : trois droites parallèles\"}}\n:concepts indicatrices, log\n##a | Interpréter les deux indicatrices\n:enonce\nInterprétez les coefficients des deux indicatrices.\n:court\n**Wallonie : −0,205.** À revenu par habitant égal, le prix médian d'une commune wallonne est inférieur de **18,5 %** à celui d'une commune flamande. **Bruxelles : +0,895.** À revenu égal, il est supérieur de **145 %**, soit 2,45 fois plus élevé.\n:zero\nUne commune flamande a `Wallonie = 0` et `Bruxelles = 0` : c'est la [[catégorie de référence]]. Écris l'équation pour chaque région.\n\n| Région | Équation de sa droite | Hauteur |\n|---|---|--:|\n| Flandre | $\\ln(prix) = β₀ + β₁ \\ln(rev)$ | −3,614 |\n| Wallonie | $\\ln(prix) = (β₀ + δ_{W}) + β₁ \\ln(rev)$ | −3,819 |\n| Bruxelles | $\\ln(prix) = (β₀ + δ_{B}) + β₁ \\ln(rev)$ | −2,719 |\n\nMême pente (1,608), hauteurs différentes : **trois droites parallèles**. Le coefficient d'une indicatrice est l'écart vertical entre la droite de cette région et celle de la Flandre.\n\n**Passer du coefficient au pourcentage.** L'écart est mesuré en logarithmes. Pour une indicatrice, la variation n'est pas « petite » : on passe d'un coup de 0 à 1. Il faut donc la formule exacte :\n\n$$ \\text{écart en %} = 100 × (\\exp(δ) − 1) $$\n\n- Wallonie : 100 × (exp(−0,205) − 1) = **−18,5 %**. Ici l'approximation (−20,5 %) n'était pas loin.\n- Bruxelles : 100 × (exp(0,895) − 1) = **+144,7 %**. L'approximation aurait donné +89,5 % : complètement faux.\n\nRemarque au passage le R² : il passe de 0,367 à **0,757**. Les régions expliquent une grande partie des écarts de prix entre communes.\n:res\n| | Coefficient | Erreur-type HC1 | t |\n|---|--:|--:|--:|\n| Constante | −3,614 | 0,752 | −4,8 |\n| ln(rev_hab) | 1,608 | 0,074 | 21,7 |\n| Wallonie | −0,205 | 0,017 | −12,3 |\n| Bruxelles | 0,895 | 0,055 | 16,4 |\n\nR² = 0,757 ; 551 communes.\n:code\n```r\nbase$region <- factor(base$region, levels = c(\"Flandre\", \"Wallonie\", \"Bruxelles\"))\nreg_1_9 <- lm(lprix ~ lrev + region, data = base)\nrob(reg_1_9)\n\n100 * (exp(coef(reg_1_9)[c(\"regionWallonie\", \"regionBruxelles\")]) - 1)   # -18,5 et +144,7\n```\n\nQuand un régresseur est un **facteur**, R crée tout seul une indicatrice par catégorie, sauf la première, qui sert de référence. L'ordre donné dans `levels = c(...)` décide donc de la référence : ici la Flandre. Les coefficients s'appellent `regionWallonie` et `regionBruxelles` (nom de la variable collé à celui de la catégorie).\n:accord Mêmes coefficients, et la même formule exacte 100 × (exp(δ) − 1) : −18,53 % et +144,72 %. Les deux versions soulignent qu'on ne peut pas lire +0,895 comme « +89,5 % ».\n##b | Pourquoi pas trois indicatrices et la constante ?\n:enonce\nPourquoi ne peut-on pas inclure dans le modèle les trois indicatrices de région et la constante ?\n:court\nParce que, pour chaque commune, Flandre + Wallonie + Bruxelles = 1, exactement comme la colonne de la constante. Les régresseurs seraient **parfaitement colinéaires** : les MCO n'auraient pas de solution unique. C'est le **piège des variables indicatrices**.\n:zero\nTrois régions, trois hauteurs à estimer. Avec la constante et trois indicatrices, on aurait **quatre** nombres pour décrire **trois** hauteurs : il y a un nombre de trop.\n\nConcrètement, on pourrait ajouter n'importe quelle valeur $c$ à la constante et retrancher $c$ aux trois indicatrices sans changer une seule prédiction :\n\n| | Constante | Flandre | Wallonie | Bruxelles | Hauteur Flandre | Hauteur Wallonie |\n|---|--:|--:|--:|--:|--:|--:|\n| Solution 1 | −3,614 | 0 | −0,205 | 0,895 | −3,614 | −3,819 |\n| Solution 2 | 0 | −3,614 | −3,819 | −2,719 | −3,614 | −3,819 |\n| Solution 3 | 10 | −13,614 | −13,819 | −12,719 | −3,614 | −3,819 |\n\nUne infinité de jeux de coefficients donnent exactement le même modèle : les données ne peuvent pas choisir entre eux. Mathématiquement, la matrice $X'X$ n'est pas inversible ; l'hypothèse d'**absence de [[colinéarité parfaite]]** est violée.\n\nR ne plante pas : il détecte le problème, retire une variable et affiche `NA` pour son coefficient.\n:accord Même explication (la somme des trois indicatrices reproduit la constante, d'où une colinéarité parfaite). Claude ajoute l'illustration « ajouter c à la constante et le retrancher aux indicatrices », qui est la façon la plus simple de le faire comprendre à l'oral.\n:quiz\n? Le coefficient de l'indicatrice Bruxelles vaut 0,895. À revenu égal, par rapport à une commune flamande, le prix médian à Bruxelles est :\n- supérieur de 89,5 %\n- supérieur de 0,895 %\n+ supérieur d'environ 145 %\n> Pour une indicatrice dans un modèle en log, l'écart exact est 100 × (exp(0,895) − 1) = 144,7 %.\n:oral\n? Comment lis-tu un coefficient d'indicatrice dans un modèle dont la variable dépendante est en logarithme ?\n> C'est un écart en logarithmes par rapport à la catégorie de référence, toutes choses égales par ailleurs. Je le convertis en pourcentage avec 100 × (exp(δ) − 1), parce que l'approximation 100 × δ n'est valable que pour un petit δ.\n\n#Q 1.10 | Changer de référence à la main\n:enonce\nSans réestimer le modèle, calculez à partir des coefficients de la question 1.9 la valeur de tous les coefficients (constante, élasticité, indicatrices) que vous obtiendriez avec la Wallonie comme catégorie de référence. Détaillez chaque calcul. Interprétez le coefficient de l'indicatrice Bruxelles.\n:intro\nChanger de catégorie de référence ne change pas le modèle : ce sont les mêmes trois droites, décrites depuis un autre point de vue. L'outil ci-dessous fait le calcul pour les trois références possibles.\n\n{{w:reference}}\n:concepts indicatrices\n## | Les quatre calculs\n:court\n| Nouveau coefficient | Calcul | Valeur |\n|---|---|--:|\n| Constante | −3,614 + (−0,205) | **−3,819** |\n| Élasticité | inchangée | **1,608** |\n| Indicatrice Flandre | −(−0,205) | **+0,205** |\n| Indicatrice Bruxelles | 0,895 − (−0,205) | **+1,100** |\n\nÀ revenu égal, le prix médian d'une commune bruxelloise est **trois fois** celui d'une commune wallonne (+200 %).\n:zero\nPars de la seule chose qui ne dépend pas de la référence : **la hauteur de chaque droite**.\n\n| Région | Hauteur de sa droite |\n|---|--:|\n| Flandre | $β₀$ = −3,614 |\n| Wallonie | $β₀ + δ_{W}$ = −3,614 − 0,205 = −3,819 |\n| Bruxelles | $β₀ + δ_{B}$ = −3,614 + 0,895 = −2,719 |\n\nAvec la Wallonie en référence, deux règles suffisent :\n\n- la **nouvelle constante** est la hauteur de la droite de la **nouvelle référence** : −3,819 ;\n- chaque **indicatrice** est la hauteur de sa région **moins** celle de la référence.\n\nDonc : Flandre = −3,614 − (−3,819) = **+0,205** (le même écart qu'avant, signe inversé). Bruxelles = −2,719 − (−3,819) = **+1,100**.\n\nL'**élasticité** ne bouge pas : les trois droites ont la même pente, quel que soit le point de vue.\n\n**Interprétation de Bruxelles.** À revenu par habitant égal, le prix médian d'une commune bruxelloise dépasse celui d'une commune wallonne de 100 × (exp(1,100) − 1) = **+200 %** : il est trois fois plus élevé.\n\n:::piege Deux erreurs fréquentes\n- Écrire « +110 % » en lisant 1,100 directement. La valeur exacte est +200 %.\n- Additionner les pourcentages (18,5 % + 144,7 %). Les écarts s'additionnent **en logarithmes** (0,205 + 0,895 = 1,100), pas en pourcentages.\n:::\n:accord Mêmes quatre valeurs (−3,8187 ; 1,6078 ; +0,2049 ; +1,0999) et même interprétation (+200,4 %, soit un rapport de 3,004). ChatGPT met lui aussi en garde contre la lecture « 110 % de plus ».\n:quiz\n? Avec Bruxelles comme catégorie de référence, que vaudrait le coefficient de l'indicatrice Wallonie ?\n- +1,100\n+ −1,100\n- −0,205\n> C'est la hauteur de la Wallonie moins celle de Bruxelles : −3,819 − (−2,719) = −1,100. Le même écart que Bruxelles par rapport à la Wallonie, signe inversé.\n:oral\n? Comment retrouves-tu les coefficients sans réestimer ?\n> Chaque région a une hauteur de droite, qui ne dépend pas de la référence. La nouvelle constante est la hauteur de la nouvelle référence, et chaque indicatrice est la différence entre la hauteur de sa région et celle de la référence. La pente est commune, donc inchangée.\n\n#Q 1.11 | Vérifier avec relevel()\n:enonce\nRéestimez le modèle avec la Wallonie comme catégorie de référence (fonction `relevel()`) et comparez aux valeurs calculées à la question 1.10. Qu'est-ce qui change, et qu'est-ce qui ne change pas ?\n:concepts indicatrices\n## | Ce qui change, ce qui ne change pas\n:court\nR redonne **exactement** les valeurs calculées à la main (−3,819 ; 1,608 ; +0,205 ; +1,100). **Changent** : la constante et les indicatrices (valeur, sens et erreur-type), donc les hypothèses testées. **Ne changent pas** : l'élasticité et son erreur-type, les valeurs ajustées, les résidus, le R² (0,757).\n:zero\nC'est le même modèle, écrit autrement. Tout ce qui décrit **l'ajustement** est identique ; tout ce qui décrit **un écart à la référence** est redéfini.\n\n| | Ne change pas | Change |\n|---|---|---|\n| Coefficients | l'élasticité (1,608) | la constante, les indicatrices |\n| Erreurs-types | celle de l'élasticité (0,074) | celles de la constante et des indicatrices |\n| Ajustement | valeurs ajustées, résidus, R², nombre d'observations | — |\n| Ce qu'on teste | — | Bruxelles **contre la Wallonie**, et non plus contre la Flandre |\n\nUn détail qui montre que tu as compris : l'erreur-type de Bruxelles passe de 0,055 à 0,052. Ce n'est plus la même quantité. Avant, on mesurait l'écart Bruxelles-Flandre ($δ_{B}$) ; maintenant l'écart Bruxelles-Wallonie ($δ_{B} − δ_{W}$), dont la précision dépend de la covariance entre les deux estimateurs. L'écart Flandre-Wallonie, lui, garde la même erreur-type (0,017) : seul son signe s'inverse.\n:res\n| | Référence Flandre (1.9) | Référence Wallonie (1.11) |\n|---|--:|--:|\n| Constante | −3,614 (0,752) | −3,819 (0,743) |\n| ln(rev_hab) | 1,608 (0,074) | 1,608 (0,074) |\n| Wallonie | −0,205 (0,017) | — |\n| Flandre | — | +0,205 (0,017) |\n| Bruxelles | +0,895 (0,055) | +1,100 (0,052) |\n| R² | 0,757 | 0,757 |\n:code\n```r\nbase$region_w <- relevel(base$region, ref = \"Wallonie\")\nreg_1_11 <- lm(lprix ~ lrev + region_w, data = base)\nrob(reg_1_11)\n\nall.equal(fitted(reg_1_9), fitted(reg_1_11))    # TRUE : mêmes valeurs ajustées\n```\n\n`relevel()` déplace une catégorie en première position du facteur, donc en référence. `all.equal()` vérifie que deux objets sont égaux, à une erreur d'arrondi près : c'est la preuve que les deux écritures décrivent le même modèle.\n:accord Mêmes coefficients et même liste de ce qui change et ne change pas. Les deux scripts vérifient par le code que les valeurs ajustées sont identiques ; ChatGPT vérifie en plus que les quatre valeurs calculées à la main coïncident avec les coefficients réestimés (`stopifnot(max(abs(calcules - coef(m11))) < 1e-9)`).\n:oral\n? Changer de catégorie de référence change-t-il les conclusions ?\n> Non. Les prédictions, les résidus, le R² et l'élasticité sont identiques. Seule change la question que posent les indicatrices : un écart par rapport à la Wallonie au lieu d'un écart par rapport à la Flandre.\n\n#Q 1.12 | Pourquoi l'élasticité change : le biais de variable omise\n:intro\nL'élasticité valait 1,444 sans les régions (question 1.6) et vaut 1,608 avec (question 1.9). Cette question explique pourquoi, puis te fait retrouver l'un des deux chiffres à partir de l'autre, **à la quatrième décimale**. C'est la démonstration la plus élégante du travail.\n\n{{w:bvo}}\n:concepts hypotheses, indicatrices\n##a | Pourquoi deux élasticités différentes ?\n:enonce\nL'élasticité estimée à la question 1.9 diffère de celle du modèle log-log de la question 1.6. Pourquoi ces deux coefficients sont-ils différents ?\n:court\nParce que le modèle 1.6 **omet la région**, qui influence le prix **et** est corrélée au revenu. Son élasticité (1,444) mélange deux choses : la relation entre prix et revenu **à l'intérieur** des régions, et les différences de prix et de revenu **entre** régions. C'est un [[biais de variable omise]].\n:zero\nDans le modèle 1.6, tout ce qui n'est pas le revenu se retrouve dans le terme d'erreur, région comprise. Or la région remplit les deux conditions qui créent un biais :\n\n1. elle **influence le prix** : à revenu égal, on paie moins cher en Wallonie et beaucoup plus cher à Bruxelles ;\n2. elle est **liée au revenu** : les communes wallonnes et bruxelloises ont en moyenne des revenus plus faibles.\n\nLe coefficient du revenu « ramasse » alors une partie de l'effet de la région. Le modèle 1.9 retire cet effet : son élasticité (1,608) compare des communes **d'une même région**.\n:accord Même explication : la pente simple mélange les différences au sein des régions et les différences entre régions.\n##b | Retrouver exactement 1,444\n:enonce\nEstimez la régression de l'indicatrice Wallonie sur log(rev_hab), puis celle de l'indicatrice Bruxelles sur log(rev_hab). À l'aide des coefficients de ces deux régressions et de ceux de la question 1.9, retrouvez exactement l'élasticité de la question 1.6. Détaillez le calcul.\n:court\n$$ 1,6078 + (−0,2049) × (−1,1457) + 0,8949 × (−0,4451) = 1,6078 + 0,2348 − 0,3983 = 1,4443 $$\n\nC'est exactement l'élasticité de la question 1.6.\n:zero\nLa formule du biais de variable omise, avec deux variables omises :\n\n$$ \\text{élasticité courte} = \\text{élasticité longue} + δ_{W} × π_{W} + δ_{B} × π_{B} $$\n\nChaque variable omise ajoute un terme, qui est le produit de deux nombres :\n\n- $δ$ : **son effet sur le prix** dans le modèle long (question 1.9) ;\n- $π$ : **son lien avec le revenu**, c'est-à-dire la pente de la régression de l'indicatrice sur ln(rev_hab).\n\nLes deux régressions « auxiliaires » donnent les $π$ :\n\n| Régression | Pente sur ln(rev_hab) | Lecture |\n|---|--:|---|\n| Wallonie ~ ln(rev_hab) | $π_{W}$ = −1,1457 (0,169) | plus le revenu est élevé, moins la commune a de chances d'être wallonne |\n| Bruxelles ~ ln(rev_hab) | $π_{B}$ = −0,4451 (0,107) | idem pour Bruxelles |\n\nLe calcul, terme à terme :\n\n| Terme | Calcul | Valeur |\n|---|---|--:|\n| Élasticité du modèle long (1.9) | $β₁$ | 1,6078 |\n| Contribution de la Wallonie | (−0,2049) × (−1,1457) | +0,2348 |\n| Contribution de Bruxelles | 0,8949 × (−0,4451) | −0,3983 |\n| **Somme** | | **1,4443** |\n| Élasticité du modèle court (1.6) | | 1,4443 |\n\n:::cle « Exactement », pas « à peu près »\nL'égalité est une propriété algébrique des MCO, vraie sur n'importe quel échantillon, pas une approximation statistique. C'est pour cela que l'énoncé écrit « retrouvez exactement ». Garde quatre décimales dans ton rapport pour le montrer.\n:::\n:code\n```r\nbase <- base %>% mutate(wallonie  = as.numeric(region == \"Wallonie\"),\n                        bruxelles = as.numeric(region == \"Bruxelles\"))\nreg_1_12_w <- lm(wallonie  ~ lrev, data = base)     # pente π_W\nreg_1_12_b <- lm(bruxelles ~ lrev, data = base)     # pente π_B\n\nb <- coef(reg_1_9)\nb[\"lrev\"] + b[\"regionWallonie\"]  * coef(reg_1_12_w)[2] +\n            b[\"regionBruxelles\"] * coef(reg_1_12_b)[2]      # 1,4443\ncoef(reg_1_6_ll)[\"lrev\"]                                    # 1,4443\n```\n\n`as.numeric(region == \"Wallonie\")` fabrique l'indicatrice à la main : la comparaison renvoie `TRUE` ou `FALSE`, que `as.numeric()` transforme en 1 ou 0. On accède à un coefficient par son nom : `b[\"lrev\"]`.\n:accord Mêmes pentes auxiliaires (−1,1457 et −0,4451), mêmes contributions (+0,2348 et −0,3983) et même somme (1,4443). Les deux scripts vérifient l'égalité par le code ; ChatGPT l'impose même avec un `stopifnot()` qui arrêterait le script si elle était fausse.\n##c | Le signe de chaque contribution\n:enonce\nExpliquez le signe de la contribution de chaque région, en vous aidant du graphique de la question 1.5.\n:court\n**Wallonie : (−) × (−) = +0,235.** Les communes wallonnes sont plus pauvres *et* moins chères à revenu égal : elles tirent le bas de la droite vers le bas, ce qui la rend plus pentue. **Bruxelles : (+) × (−) = −0,398.** Les communes bruxelloises sont plus pauvres *mais* beaucoup plus chères : elles relèvent le bas de la droite, ce qui l'aplatit. L'effet bruxellois l'emporte.\n:zero\nLe signe d'une contribution est le produit de deux signes : **effet de la région sur le prix** × **lien de la région avec le revenu**.\n\nRegarde le nuage (modèle « Une seule droite ») en te demandant où se trouve chaque région.\n\n- **Wallonie** : à gauche (revenus faibles) et sous la droite (prix bas). Une droite qui veut passer près de ces points doit descendre à gauche : elle devient **plus raide**. Omettre la Wallonie *gonfle* l'élasticité.\n- **Bruxelles** : à gauche aussi, mais très au-dessus (prix élevés). Une droite attirée par ces points doit remonter à gauche : elle devient **plus plate**. Omettre Bruxelles *écrase* l'élasticité.\n\nLes deux effets vont en sens contraire. Le bruxellois (−0,398) est plus fort que le wallon (+0,235) : au total, l'élasticité sans régions **sous-estime** de 0,163 celle qui vaut à l'intérieur des régions.\n\nVérifie-le avec l'outil en haut de la page : choisis « Sans Bruxelles », l'écart change de signe.\n:accord Même lecture des deux signes et même conclusion (la contribution négative de Bruxelles domine).\n##d | « 1.9 est la bonne, 1.6 est biaisée » ?\n:enonce\nUn·e collègue affirme que l'élasticité de la question 1.9 est « la bonne » et que celle de la question 1.6 est « biaisée ». Êtes-vous d'accord ?\n:court\n**Pas entièrement : tout dépend de la question posée.** Pour comparer des communes d'une même région, 1.9 est la bonne mesure, et 1.6 est biaisée de −0,16 *pour ce paramètre-là*. Pour décrire l'association sur l'ensemble de la Belgique, 1.6 répond correctement à cette autre question. Et **aucune des deux n'est un effet causal**.\n:zero\n« Biaisé » n'a de sens que par rapport à ce qu'on cherche à mesurer.\n\n| Ce qu'on veut savoir | La bonne élasticité |\n|---|---|\n| « Si je prends deux communes **de la même région**, de combien leurs prix diffèrent-ils quand leurs revenus diffèrent de 1 % ? » | 1.9 (1,608) |\n| « Si je ne connais **que le revenu** d'une commune belge, quel prix prédire ? » | 1.6 (1,444) |\n| « Si le revenu des habitants **augmentait**, de combien le prix monterait-il ? » | Aucune des deux |\n\nLe collègue a raison sur un point : 1.6 est une mauvaise estimation de la relation *à région donnée*. Il a tort de croire que 1.9 est « la » bonne : elle peut elle-même être biaisée par d'autres variables omises, à l'intérieur des régions cette fois (localisation, qualité des logements). Ajouter un contrôle retire **un** biais, pas tous les biais.\n:accord Même position nuancée dans les deux versions : l'élasticité « juste » dépend du paramètre visé, et parler d'effet causal exigerait en plus l'exogénéité du revenu à l'intérieur des régions (question 1.18).\n:quiz\n? Une variable omise est liée négativement au revenu et a un effet positif sur le prix. L'omettre :\n- gonfle le coefficient du revenu\n+ réduit le coefficient du revenu\n- ne change pas le coefficient du revenu\n> Biais = (effet sur y) × (lien avec x) = (+) × (−) = négatif. C'est le cas de Bruxelles.\n? Sans les communes bruxelloises, omettre la région :\n- ne créerait aucun biais\n- sous-estimerait toujours l'élasticité\n+ surestimerait l'élasticité\n> Il ne resterait que la contribution wallonne, positive : (−) × (−). L'outil le montre avec « Sans Bruxelles ».\n:oral\n? Pourquoi l'élasticité passe-t-elle de 1,44 à 1,61 quand tu ajoutes les régions ?\n> Par biais de variable omise : la région influence le prix et est corrélée au revenu. La Wallonie, pauvre et bon marché, gonfle la pente de 0,23 ; Bruxelles, pauvre mais chère, l'écrase de 0,40. L'effet bruxellois domine, et la formule 1,608 + 0,235 − 0,398 redonne exactement 1,444.\n? Alors 1,61 est-elle la vraie élasticité ?\n> C'est la bonne mesure de l'association entre communes d'une même région. Mais ce n'est pas un effet causal : d'autres variables omises, comme la localisation, sont liées à la fois au revenu et au prix.\n:retenir\n- Omettre une variable crée un biais égal à (son effet sur y) × (son lien avec x).\n- Wallonie : (−) × (−) = +0,235. Bruxelles : (+) × (−) = −0,398.\n- 1,608 + 0,235 − 0,398 = 1,444, exactement.\n- « Biaisé » se dit toujours par rapport à un paramètre précis.\n\n#SEC D | Interaction\n\n#Q 1.13 | Une élasticité par région\n:enonce\nEstimez un modèle log-log dans lequel l'élasticité peut différer d'une région à l'autre, en ajoutant l'interaction entre log(rev_hab) et les indicatrices de région.\n:intro\nLe modèle 1.9 imposait la même pente aux trois régions. On relâche cette contrainte : chaque région a maintenant sa hauteur **et** sa pente.\n\n$$ \\ln(prix) = β₀ + β₁ \\ln(rev) + δ_{W} W + δ_{B} B + θ_{W} (W × \\ln(rev)) + θ_{B} (B × \\ln(rev)) + u $$\n\n{{w:nuage modele=pentes titre=\"Le modèle 1.13 : une droite par région\"}}\n:concepts indicatrices, incertitude\n##a | L'élasticité de chaque région et son erreur-type\n:enonce\nDonnez l'élasticité estimée dans chaque région et son erreur-type. Pour les régions autres que la référence, l'élasticité est la somme de deux coefficients : calculez son erreur-type à partir de la matrice de variance-covariance, ou réestimez le modèle en changeant de catégorie de référence.\n:court\n| Région | Calcul | Élasticité | Erreur-type HC1 | IC à 95 % |\n|---|---|--:|--:|--:|\n| Flandre | $β₁$ | **1,440** | 0,108 | [1,23 ; 1,65] |\n| Wallonie | $β₁ + θ_{W}$ | **1,838** | 0,109 | [1,62 ; 2,05] |\n| Bruxelles | $β₁ + θ_{B}$ | **1,072** | 0,138 | [0,80 ; 1,34] |\n:zero\n**Lire les élasticités.** Remplace W et B par leurs valeurs pour chaque région et regarde ce qui multiplie ln(rev).\n\n- Flandre (W = 0, B = 0) : il reste $β₁$ = 1,440.\n- Wallonie (W = 1) : $β₁ + θ_{W}$ = 1,440 + 0,398 = 1,838.\n- Bruxelles (B = 1) : $β₁ + θ_{B}$ = 1,440 − 0,368 = 1,072.\n\nLe coefficient d'une [[interaction]] est donc la **différence de pente** avec la région de référence.\n\n**L'erreur-type d'une somme.** C'est le piège de la question. On n'additionne **pas** les deux erreurs-types. La variance d'une somme fait intervenir la covariance :\n\n$$ Var(\\hat{β}₁ + \\hat{θ}_{W}) = Var(\\hat{β}₁) + Var(\\hat{θ}_{W}) + 2 Cov(\\hat{β}₁, \\hat{θ}_{W}) $$\n\nIci la covariance est fortement négative (quand la pente flamande est surestimée, la différence avec la Wallonie est sous-estimée d'autant), ce qui explique que l'erreur-type de la somme (0,109) soit **plus petite** que celle de l'interaction seule (0,153).\n\n**La seconde méthode, plus simple.** Mets la Wallonie en catégorie de référence : le coefficient de ln(rev) devient directement l'élasticité wallonne, avec la bonne erreur-type. Les deux méthodes donnent 1,838 (0,109).\n\n:::astuce Une vérification qui rassure\nDans un modèle où tout est interagi avec la région, les élasticités sont exactement celles qu'on obtiendrait en estimant **une régression séparée dans chaque région**.\n:::\n:res\n| | Coefficient | Erreur-type HC1 |\n|---|--:|--:|\n| Constante | −1,909 | 1,097 |\n| ln(rev_hab) | 1,440 | 0,108 |\n| Wallonie | −4,219 | 1,550 |\n| Bruxelles | 4,465 | 1,744 |\n| ln(rev_hab) × Wallonie | 0,398 | 0,153 |\n| ln(rev_hab) × Bruxelles | −0,368 | 0,175 |\n:code\n```r\nreg_1_13 <- lm(lprix ~ lrev * region, data = base)    # * = effets principaux + interactions\nrob(reg_1_13)\n\nV  <- vcovHC(reg_1_13, type = \"HC1\")                  # matrice de variance-covariance robuste\nbi <- coef(reg_1_13)\n\nbi[\"lrev\"] + bi[\"lrev:regionWallonie\"]                                  # 1,838\nsqrt(V[\"lrev\", \"lrev\"] + V[\"lrev:regionWallonie\", \"lrev:regionWallonie\"] +\n     2 * V[\"lrev\", \"lrev:regionWallonie\"])                              # 0,109\n\n# Vérification : la Wallonie en référence\nrob(lm(lprix ~ lrev * region_w, data = base))[\"lrev\", ]                 # 1,838 (0,109)\n```\n\n- `lrev * region` est un raccourci pour `lrev + region + lrev:region`. Le `:` désigne l'interaction seule.\n- `vcovHC()` renvoie un tableau carré : sur la diagonale, les variances des coefficients ; ailleurs, leurs covariances. `V[\"a\", \"b\"]` lit la case à la ligne `a`, colonne `b`.\n- `sqrt()` est la racine carrée : l'erreur-type est la racine de la variance.\n:gpt\nMêmes élasticités et erreurs-types. Calcule l'intervalle de confiance avec le quantile de **Student** (545 degrés de liberté) : [1,227 ; 1,652] pour la Flandre. Écrit une fonctio
