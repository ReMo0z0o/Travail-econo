<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Atelier ECGEB352</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Mise en page : sommaire fixe à gauche, colonne de lecture étroite (≈ 70 caractères),
   outils interactifs qui débordent légèrement de la colonne. Encre bleu nuit sur gris froid ;
   un seul accent (encre bleue) ; les couleurs vives sont réservées aux données. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f7f8fa; --surface-3: #eceff3;
  --ink: #0f1b2d; --ink-2: #3f4b5e; --muted: #6b7687; --line: #dfe3ea; --line-2: #c6cdd8;
  --accent: #2747c9; --accent-ink: #1c3394; --accent-soft: #e9edfc; --on-accent: #ffffff;
  --gpt: #0d7a5f; --gpt-soft: #e2f3ee; --claude: #b4531a; --claude-soft: #f9ece2;
  --ok: #0a6b0a; --ok-soft: #e3f3e3; --ok-mark: #0ca30c;
  --warn: #7a4f00; --warn-soft: #fdf2d6; --warn-mark: #fab219;
  --bad: #a82424; --bad-soft: #fbe7e7; --bad-mark: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s-mute: #9aa3b0;
  --s1-soft: rgba(42,120,214,.12); --s2-soft: rgba(235,104,52,.12); --s3-soft: rgba(27,175,122,.14);
  --grid: #e7eaef; --axis: #c3cad4;
  --code-bg: #f1f3f7; --tok-com: #6b7687; --tok-str: #0d7a5f; --tok-num: #b4531a; --tok-fn: #2747c9;
  --ombre: 0 1px 2px rgba(15,27,45,.06), 0 6px 20px rgba(15,27,45,.07);
  --f-texte: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-titre: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --r: 8px; --r-s: 5px; --nav-l: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1016; --surface: #151a22; --surface-2: #1a2029; --surface-3: #212835;
    --ink: #e7ebf1; --ink-2: #b5bdca; --muted: #8791a2; --line: #262d39; --line-2: #37414f;
    --accent: #8ea6ff; --accent-ink: #b6c5ff; --accent-soft: #1b2548; --on-accent: #0c1016;
    --gpt: #4fc4a6; --gpt-soft: #12302a; --claude: #ee9960; --claude-soft: #35210f;
    --ok: #6fd96f; --ok-soft: #12301a; --ok-mark: #0ca30c;
    --warn: #f5c451; --warn-soft: #33270a; --warn-mark: #fab219;
    --bad: #f39a9a; --bad-soft: #3a1717; --bad-mark: #d03b3b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-mute: #6c7584;
    --s1-soft: rgba(57,135,229,.18); --s2-soft: rgba(217,89,38,.18); --s3-soft: rgba(25,158,112,.2);
    --grid: #232a35; --axis: #3a4350;
    --code-bg: #10151c; --tok-com: #8791a2; --tok-str: #4fc4a6; --tok-num: #ee9960; --tok-fn: #8ea6ff;
    --ombre: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1016; --surface: #151a22; --surface-2: #1a2029; --surface-3: #212835;
  --ink: #e7ebf1; --ink-2: #b5bdca; --muted: #8791a2; --line: #262d39; --line-2: #37414f;
  --accent: #8ea6ff; --accent-ink: #b6c5ff; --accent-soft: #1b2548; --on-accent: #0c1016;
  --gpt: #4fc4a6; --gpt-soft: #12302a; --claude: #ee9960; --claude-soft: #35210f;
  --ok: #6fd96f; --ok-soft: #12301a; --ok-mark: #0ca30c;
  --warn: #f5c451; --warn-soft: #33270a; --warn-mark: #fab219;
  --bad: #f39a9a; --bad-soft: #3a1717; --bad-mark: #d03b3b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-mute: #6c7584;
  --s1-soft: rgba(57,135,229,.18); --s2-soft: rgba(217,89,38,.18); --s3-soft: rgba(25,158,112,.2);
  --grid: #232a35; --axis: #3a4350;
  --code-bg: #10151c; --tok-com: #8791a2; --tok-str: #4fc4a6; --tok-num: #ee9960; --tok-fn: #8ea6ff;
  --ombre: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-texte); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ------------------------------------------------------------- structure */
.app { display: grid; grid-template-columns: var(--nav-l) minmax(0, 1fr); min-height: 100vh; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px;
  padding: 18px 14px 14px max(14px, env(safe-area-inset-left, 0px)); z-index: 20; }
.colonne { min-width: 0; display: flex; flex-direction: column; }
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 12px; min-height: 52px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.vue { width: 100%; max-width: 900px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.bouton-icone { display: none; width: 38px; height: 38px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-s); align-items: center; justify-content: center; cursor: pointer; flex: none; }
.voile { position: fixed; inset: 0; background: rgba(8,12,20,.45); z-index: 15; }
.fil { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fil a { color: var(--ink-2); text-decoration: none; } .fil a:hover { text-decoration: underline; }
.fil .sep { margin: 0 6px; color: var(--line-2); }
.progression { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); text-decoration: none; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-variant-numeric: tabular-nums; }
.progression .jauge { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.progression .jauge i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); height: auto; transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--ombre); padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .nav.ouvert { transform: none; }
  .bouton-icone { display: inline-flex; }
}

/* --------------------------------------------------------------- sommaire */
.marque { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); padding: 2px 4px; }
.marque-sigle { flex: none; width: 40px; height: 40px; display: grid; place-items: center; background: var(--ink); color: var(--bg); border-radius: var(--r); font: italic 600 22px/1 var(--f-math); padding-top: 4px; }
.marque-texte { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.marque-texte strong { font: 600 16px/1.2 var(--f-titre); letter-spacing: -.01em; }
.marque-texte small { font-size: 12px; color: var(--muted); }
.recherche { position: relative; }
.recherche input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface-2); font-size: 14px; }
.recherche-resultats { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-s); box-shadow: var(--ombre); max-height: 60vh; overflow: auto; z-index: 5; }
.recherche-resultats a { display: block; padding: 8px 10px; text-decoration: none; color: var(--ink); font-size: 13.5px; border-bottom: 1px solid var(--line); }
.recherche-resultats a:last-child { border-bottom: 0; }
.recherche-resultats a:hover, .recherche-resultats a:focus { background: var(--accent-soft); }
.recherche-resultats small { display: block; color: var(--muted); font-size: 12px; }
.recherche-resultats .vide { padding: 10px; color: var(--muted); font-size: 13.5px; }
#nav-liste { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-lien { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 500; }
.nav-lien:hover { background: var(--surface-3); color: var(--ink); }
.nav-lien.actif { background: var(--accent-soft); color: var(--accent-ink); }
.nav-lien .pico { flex: none; width: 22px; text-align: center; font: 600 13px/1 var(--f-code); color: var(--muted); }
.nav-lien.actif .pico { color: var(--accent); }
.nav-titre { margin: 14px 8px 4px; font: 600 11px/1.2 var(--f-texte); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav-partie > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-s); font-size: 14.5px; font-weight: 600; color: var(--ink); }
.nav-partie > summary::-webkit-details-marker { display: none; }
.nav-partie > summary:hover { background: var(--surface-3); }
.nav-partie > summary .num { flex: none; width: 22px; height: 22px; border-radius: 4px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 600 12px/1 var(--f-titre); }
.nav-partie > summary .compte { margin-left: auto; font: 500 12px/1 var(--f-code); color: var(--muted); }
.nav-partie > summary .chevron { flex: none; width: 10px; height: 10px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; margin-right: 3px; }
.nav-partie[open] > summary .chevron { transform: rotate(45deg); }
.nav-questions { display: flex; flex-direction: column; margin: 2px 0 6px 18px; border-left: 1px solid var(--line); }
.nav-sec { margin: 8px 0 2px 12px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.nav-q { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--ink-2); text-decoration: none; font-size: 13.5px; line-height: 1.35; }
.nav-q:hover { color: var(--ink); background: var(--surface-2); }
.nav-q.actif { border-left-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav-q .n { flex: none; font: 500 12px/1.4 var(--f-code); color: var(--muted); min-width: 30px; }
.nav-q .etat { flex: none; margin-left: auto; width: 14px; height: 14px; }
.nav-q.fait .n { color: var(--ok); }
.nav-pied { border-top: 1px solid var(--line); padding-top: 10px; }
.sauvegarde { font-size: 12px; color: var(--muted); line-height: 1.4; }
.sauvegarde b { color: var(--ink-2); font-weight: 600; }

/* ------------------------------------------------------------ typographie */
.vue h1 { font: 700 clamp(26px, 4.2vw, 36px)/1.14 var(--f-titre); letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
.vue h2 { font: 600 23px/1.25 var(--f-titre); letter-spacing: -.012em; margin: 44px 0 12px; text-wrap: balance; }
.vue h3 { font: 600 18.5px/1.3 var(--f-titre); margin: 30px 0 8px; text-wrap: balance; }
.vue h4 { font: 600 15.5px/1.35 var(--f-texte); margin: 22px 0 6px; }
.vue p, .vue li { font-size: 16.5px; line-height: 1.65; }
.vue p { margin: 0 0 14px; max-width: 72ch; }
.vue ul, .vue ol { margin: 0 0 14px; padding-left: 22px; max-width: 72ch; }
.vue li { margin-bottom: 5px; } .vue li > ul, .vue li > ol { margin-top: 5px; }
.vue strong { font-weight: 600; }
.chapo { font-size: 18.5px !important; line-height: 1.55 !important; color: var(--ink-2); max-width: 66ch !important; }
.surtitre { font: 600 12px/1.2 var(--f-texte); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
code { font: 500 .88em var(--f-code); background: var(--code-bg); padding: .1em .36em; border-radius: 4px; overflow-wrap: anywhere; }
.math { font-family: var(--f-math); font-size: 1.08em; white-space: nowrap; }
.math i { font-style: italic; }
.math .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .18em; line-height: 1.25; }
.math .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .3em .05em; }
.math .frac > span:last-child { padding: .05em .3em 0; }
.math .chap { position: relative; display: inline-block; }
.math .chap::before { content: "^"; position: absolute; left: 50%; top: -.52em; transform: translateX(-50%); font-style: normal; font-size: .8em; }
.math .barre-h { text-decoration: overline; }
.math .rac { border-top: 1px solid currentColor; padding: 0 .12em; margin-left: -.02em; }
.math sub, .math sup { font-size: .72em; line-height: 0; }
.equation { display: block; overflow-x: auto; overflow-y: hidden; padding: 14px 4px; margin: 4px 0 16px; text-align: center; font-size: 1.12em; }
.equation .math { font-size: 1.12em; }
blockquote { margin: 0 0 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: 16.5px; }
blockquote p:last-child { margin-bottom: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 34px 0; }
.terme { border-bottom: 1px dotted var(--muted); cursor: help; background: none; padding: 0; border-top: 0; border-left: 0; border-right: 0; color: inherit; font: inherit; }
.terme:hover { border-bottom-color: var(--accent); color: var(--accent-ink); }

/* ----------------------------------------------------------------- tables */
.table-boite { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.4; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 13px; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.d, th.d { text-align: right; white-space: nowrap; } td.c, th.c { text-align: center; }
td code { font-size: .86em; }

/* ------------------------------------------------------------------- code */
pre.code { margin: 0 0 16px; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; font: 400 13.5px/1.6 var(--f-code); tab-size: 2; }
pre.code code { background: none; padding: 0; font: inherit; overflow-wrap: normal; }
pre.code .com { color: var(--tok-com); font-style: italic; } pre.code .str { color: var(--tok-str); }
pre.code .num { color: var(--tok-num); } pre.code .fn { color: var(--tok-fn); }
pre.sortie { background: var(--surface); border-style: dashed; color: var(--ink-2); }

/* --------------------------------------------------------------- encadrés */
.encadre { margin: 0 0 18px; padding: 14px 16px 2px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.encadre > .etiquette { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 var(--f-texte); letter-spacing: .07em; text-transform: uppercase; margin: 0 0 9px; padding: 4px 8px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); }
.encadre > .etiquette svg { width: 13px; height: 13px; flex: none; }
.encadre.cle { background: var(--accent-soft); border-color: transparent; } .encadre.cle > .etiquette { background: var(--accent); color: var(--on-accent); }
.encadre.piege { background: var(--bad-soft); border-color: transparent; } .encadre.piege > .etiquette { background: var(--bad-mark); color: #fff; }
.encadre.astuce { background: var(--warn-soft); border-color: transparent; } .encadre.astuce > .etiquette { background: var(--warn-mark); color: #0b0b0b; }
.encadre.verif { background: var(--ok-soft); border-color: transparent; } .encadre.verif > .etiquette { background: var(--ok-mark); color: #fff; }
.encadre p, .encadre li { font-size: 15.5px; }
details.plus { margin: 0 0 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.plus > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 9px; }
details.plus > summary::-webkit-details-marker { display: none; }
details.plus > summary::before { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.plus[open] > summary::before { transform: rotate(45deg); }
details.plus > .interieur { padding: 4px 16px 4px; border-top: 1px solid var(--line); }
details.plus > .interieur > :first-child { margin-top: 12px; }

/* ---------------------------------------------------------------- boutons */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink); line-height: 1.3; }
.btn:hover { border-color: var(--ink-2); color: var(--ink); }
.btn.plein { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.plein:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--on-accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.petit { padding: 4px 9px; font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface-2); padding: 2px; gap: 2px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; padding: 4px 10px; font-size: 13.5px; border-radius: 3px; color: var(--ink-2); white-space: nowrap; }
.seg input:checked + span { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line-2); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.puce { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; color: var(--ink-2); text-decoration: none; }
a.puce:hover { border-color: var(--accent); color: var(--accent-ink); }

/* ------------------------------------------------------- page d'accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 26px; }
.grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 0 0 22px; }
.carte { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 0; }
a.carte:hover { border-color: var(--accent); color: var(--ink); }
.carte .num { font: 700 13px/1 var(--f-titre); color: var(--muted); letter-spacing: .06em; }
.carte h3 { margin: 0; font: 600 17px/1.25 var(--f-titre); }
.carte p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }

window.__CONTENU = {"accueil":"# Comprendre, refaire et défendre le travail d'économétrie\n\n>> Trois enquêtes, 41 questions, 121 sous-questions. Pour chacune : la réponse, le raisonnement expliqué depuis zéro, les chiffres recalculés sur tes fichiers, ce qu'ont fait ChatGPT et Claude, et un espace pour écrire ta propre version.\n\n{{w:reprise}}\n\n## Les trois enquêtes\n\n{{w:cartes-parties}}\n\n## Le fil rouge : de l'association à la cause\n\nLes trois parties posent la même question de fond : **quand a-t-on le droit de dire qu'une chose en cause une autre ?** Chaque partie utilise un outil plus ambitieux que la précédente.\n\n| Partie | Ce qu'on compare | L'outil | Ce qu'on a le droit de conclure |\n|---|---|---|---|\n| 1. Communes belges | Des communes riches et des communes pauvres, la même année | Régression (MCO), logarithmes, indicatrices | Une **association** : les communes plus riches ont des maisons plus chères. Pas un effet causal. |\n| 2. Mères américaines | Des mères dont les deux premiers enfants sont de même sexe ou non | Variables instrumentales (VI, 2SLS) | Un **effet causal**, mais seulement si l'instrument est valide, et seulement pour certaines mères. |\n| 3. Localités burkinabè | L'évolution de localités électrifiées tôt et de localités électrifiées tard | Double différence, effets fixes | Un **effet causal**, si les deux groupes auraient évolué de la même façon sans le réseau. |\n\nSi tu retiens cela, tu as déjà la colonne vertébrale de l'oral : dans chaque partie, on te demandera *ce que tu mesures*, *à quelle condition c'est un effet causal*, et *ce qui pourrait fausser le résultat*.\n\n## Comment une question est présentée\n\nChaque sous-question suit le même plan, toujours dans le même ordre.\n\n| Bloc | À quoi il sert |\n|---|---|\n| **La réponse en bref** | Ce que tu dois pouvoir dire en deux phrases, chiffre compris. |\n| **Comprendre pas à pas** | Le raisonnement sans prérequis : d'où vient l'idée, pourquoi cette formule, comment lire le résultat. Les mots soulignés en pointillés ouvrent leur définition. |\n| **Les chiffres** | Les tableaux et les valeurs, tels que R les produit sur tes fichiers. |\n| **Le code R** | Les lignes du script qui donnent ces chiffres, commentées une par une. |\n| **ChatGPT et Claude** | Ce que chacun a fait, là où ils diffèrent, et un conseil argumenté. Quand les deux sont d'accord, c'est dit en une ligne. |\n| **Ma version pour le rapport** | Tu coches le raisonnement qui te convainc, tu le réécris avec tes mots, tu coches « je sais l'expliquer ». Tout est enregistré. |\n\nBeaucoup de questions contiennent en plus un **outil interactif** : un graphique construit sur les vraies données, que tu peux manipuler pour voir ce que fait une hypothèse ou un choix de méthode.\n\n## Par où commencer\n\n1. **Tu pars de zéro ?** Lis d'abord [les bases](#bases) : dix leçons courtes, dans l'ordre, avec un outil à manipuler dans presque chacune. Compte une heure et demie.\n2. **Avance partie par partie**, question par question. Ne saute pas la partie 1 : elle installe tout le vocabulaire (coefficient, erreur-type, logarithme, biais de variable omise).\n3. **À chaque sous-question, écris ta version.** C'est le meilleur test : si tu n'arrives pas à la reformuler sans regarder, relis le bloc « Comprendre pas à pas ».\n4. **Refais le code** avec l'[atelier R](#atelier), en comparant tes résultats aux valeurs de contrôle.\n5. **Rassemble** tes choix et tes textes dans [Mon rapport](#choix), puis exporte-les.\n6. **Entraîne-toi pour l'oral** avec les [cartes de questions](#oral).\n\n## Ce qui a été vérifié pour construire cet atelier\n\n:::verif Vérifications faites sur tes fichiers\n- **Les deux scripts R tournent du début à la fin** sans erreur (R 4.3.3) et donnent **les mêmes chiffres** sur tous les résultats principaux : 551 communes, élasticités 1,444 et 1,608, effet 2SLS de −5,46 semaines, double différence de 0,380.\n- **Les outils interactifs recalculent tout en direct** à partir des données réelles. Leurs résultats sont comparés automatiquement à ceux de R (48 contrôles, tous identiques).\n- **Une erreur de date commune aux deux versions** : la fusion de Bastogne et Bertogne a pris effet le **2 décembre 2024**, et non le 1er (voir la question 1.1).\n- **Un chiffre que je n'ai pas pu vérifier** : la valeur du tableau 4 de l'article sur le Burkina Faso (question 3.4 c). ChatGPT donne 0,396 ; Claude dit ne pas avoir pu lire le tableau. Tu dois la lire toi-même dans ta copie de l'article.\n- **Des constats absents des deux versions**, dans la partie 3 : la série des écoles électrifiées change de régime en 2006, l'effet estimé sur les écoles vient d'une baisse du groupe de comparaison, et il n'est plus significatif avec des erreurs-types groupées (questions 3.5 et 3.8).\n- **Un piège technique** : les deux scripts échouent dès la lecture des fichiers si la session R n'est pas en UTF-8. Détails dans l'[atelier R](#atelier).\n\nLe bilan complet des deux versions est sur la page [ChatGPT vs Claude](#comparatif).\n:::\n\n## La consigne du cours\n\n:::note À garder en tête\nL'énoncé précise que l'usage d'outils d'intelligence artificielle n'est pas autorisé pour ce travail, que chaque membre du groupe doit pouvoir expliquer le code et l'ensemble du travail, et qu'un examen oral par groupe suit la remise. Cet atelier est construit pour que tu comprennes la matière et puisses tout refaire et tout expliquer toi-même. Ce que tu remets reste ta décision et ta responsabilité.\n:::\n","bases":"# Les bases, depuis zéro\n\n>> Dix leçons courtes, dans l'ordre, pour comprendre tout le vocabulaire du travail sans aucun prérequis. Chaque leçon s'appuie sur les vraies données du travail.\n\n:::cle Comment lire ces leçons\nNe cherche pas à tout mémoriser. À la fin de chaque leçon, vérifie seulement que tu sais répondre à la question posée dans l'encadré « Tu dois savoir dire ». Tu reviendras ici depuis les questions du travail, par les liens « À revoir avant ».\n:::\n\n#L donnees | Données, variables, moyenne et médiane | 6 min\n>> Avant toute régression, il faut savoir ce qu'est une ligne du tableau. C'est la première chose qu'on te demandera à l'oral, et c'est la source de beaucoup d'erreurs.\n\n### Une ligne, une colonne\n\nUn jeu de données est un tableau. Chaque **ligne** est une [[observation]] : une commune, une mère, une localité observée une année donnée. Ce que représente une ligne s'appelle l'[[unité statistique]]. Chaque **colonne** est une **variable** : une caractéristique mesurée pour chaque observation (le prix médian, le revenu par habitant, le nombre d'enfants).\n\n| Partie | Une ligne = | Nombre de lignes | Exemples de variables |\n|---|---|--:|---|\n| 1 | une commune belge en 2023 | 551 | `prix`, `rev_hab`, `region` |\n| 2 | une mère américaine au recensement de 1980 | 254 654 | `work`, `morekids`, `age` |\n| 3 | une localité burkinabè, une année donnée | 2 970 | `nl_extensive`, `year`, `treated` |\n\nDans la partie 3, la même localité revient sur plusieurs lignes, une par année : on appelle cela un [[panel]]. Compter les lignes et compter les localités ne donne donc pas le même nombre (2 970 lignes, 297 localités).\n\n### Résumer une variable\n\n- La **moyenne** additionne toutes les valeurs et divise par leur nombre. Elle est tirée par les valeurs extrêmes.\n- La **[[médiane]]** est la valeur du milieu quand on range les observations par ordre croissant : la moitié est en dessous, la moitié au-dessus. Elle résiste aux valeurs extrêmes.\n- Les **quartiles** coupent les observations en quatre : le premier quartile (p25) laisse un quart des valeurs sous lui, le troisième (p75) trois quarts. L'[[écart interquartile]] p75 − p25 mesure la dispersion de la moitié centrale.\n- L'**écart-type** mesure la dispersion autour de la moyenne, dans l'unité de la variable.\n\n:::ex Dans le travail\nLe prix médian communal vaut en moyenne 296 148 €, mais sa médiane est de 285 000 €. La moyenne est plus haute parce que quelques communes très chères (Ixelles, 840 000 €) la tirent vers le haut. Pour le nombre de ventes, l'écart est énorme : moyenne 156, médiane 108, à cause d'Anvers (2 729 ventes).\n:::\n\n:::piege Deux médianes à ne pas confondre\nDans la partie 1, la variable `prix` est déjà une médiane : celle des maisons vendues dans la commune. Quand on calcule ensuite « la médiane de `prix` », on prend la médiane, entre communes, de ces médianes communales. Ce n'est pas le prix médian d'une maison en Belgique : une petite commune pèse autant qu'Anvers.\n:::\n\n:::cle Tu dois savoir dire\nPour chaque partie : que représente une ligne ? Combien y en a-t-il ? Quelle est la différence entre une moyenne et une médiane ?\n:::\n\n#L causalite | Corrélation n'est pas causalité | 7 min\n>> C'est l'idée la plus importante du travail. Les trois parties tournent autour d'elle.\n\n### Deux phrases qui ne veulent pas dire la même chose\n\n- « Les communes où les habitants sont plus riches ont des maisons plus chères. » C'est une **association** (ou corrélation) : deux choses varient ensemble.\n- « Si le revenu des habitants d'une commune augmentait, le prix des maisons monterait. » C'est une affirmation **causale** : on prétend savoir ce qui se passerait si on changeait une chose en laissant tout le reste identique.\n\nLes données montrent directement la première. La seconde demande une hypothèse supplémentaire, qu'il faut énoncer et défendre.\n\n### Trois raisons pour lesquelles une association n'est pas un effet\n\n1. **Un facteur caché agit sur les deux.** Une commune proche de Bruxelles, verte et bien desservie attire des ménages aisés *et* a des maisons chères. Le revenu et le prix montent ensemble sans que l'un cause l'autre. C'est un [[facteur de confusion]], et le biais qu'il crée s'appelle le [[biais de variable omise]].\n2. **La causalité va dans l'autre sens.** Des maisons chères empêchent les ménages modestes de s'installer : c'est le prix qui « choisit » le revenu des habitants. On parle de [[causalité inverse]].\n3. **Les groupes comparés se sont formés eux-mêmes.** Les mères de trois enfants ne ressemblent pas aux mères de deux enfants : elles ont choisi d'en avoir un de plus. C'est un [[biais de sélection]].\n\n{{w:dag jeu=generique titre=\"Le schéma du facteur caché\"}}\n\n### Les trois parties du travail, relues avec cette idée\n\n| Partie | Ce qu'on voudrait savoir | Le facteur caché | La parade |\n|---|---|---|---|\n| 1 | L'effet du revenu sur les prix | Localisation, cadre de vie, emplois | Aucune : on conclut à une association (question 1.18). |\n| 2 | L'effet d'un 3ᵉ enfant sur le travail de la mère | Préférences, carrière, revenu du conjoint | Un **instrument** : le sexe des deux premiers enfants, dû au hasard. |\n| 3 | L'effet du réseau électrique sur une localité | Taille, proximité du réseau | La **double différence** : comparer des évolutions, pas des niveaux. |\n\n:::cle Tu dois savoir dire\nPourquoi comparer deux groupes ne suffit pas à mesurer un effet, avec un exemple concret pour chaque partie.\n:::\n\n#L mco | La régression : une droite au milieu d'un nuage | 10 min\n>> La régression linéaire résume la relation entre deux variables par une droite. Presque tout le travail en découle.\n\n### L'idée\n\nOn dispose, pour chaque commune, de son revenu par habitant (x) et de son prix médian (y). On cherche la droite qui passe « au mieux » au milieu du nuage de points :\n\n$$ y_{i} = β₀ + β₁ x_{i} + u_{i} $$\n\n- $y$ est la [[variable dépendante]] (ce qu'on explique), $x$ le [[régresseur]] (ce qui explique).\n- $β₁$ est la **pente** : de combien y change, en moyenne, quand x augmente d'une unité.\n- $β₀$ est la **constante** : la valeur de y prédite quand x vaut zéro. Elle n'a souvent aucun sens concret (une commune au revenu nul n'existe pas).\n- $u$ est le [[terme d'erreur]] : tout ce qui fait varier y en dehors de x.\n\n### « Au mieux », c'est-à-dire ?\n\nPour chaque commune, la droite fait une erreur de prédiction, le [[résidu]] : prix observé moins prix prédit. La méthode des **moindres carrés ordinaires** ([[MCO]]) choisit la droite qui rend la **somme des carrés des résidus** la plus petite possible. On met les résidus au carré pour que les erreurs positives et négatives ne se compensent pas, et pour pénaliser davantage les grosses erreurs.\n\n{{w:mco}}\n\nLes valeurs estimées se notent avec un chapeau : $\\hat{β}₁$ est la pente calculée sur *tes* données, alors que $β₁$ est la vraie pente, inconnue.\n\n### Le R²\n\nLe [[R²]] est la part de la dispersion de y que la droite « explique ». Il va de 0 (la droite n'explique rien) à 1 (tous les points sont sur la droite). Deux mises en garde qui reviennent dans le travail :\n\n- un R² élevé ne prouve aucun effet causal ;\n- on ne compare des R² qu'entre modèles qui expliquent **la même variable dépendante** (question 1.8).\n\n### Plusieurs régresseurs\n\nOn peut ajouter d'autres variables : $y = β₀ + β₁ x₁ + β₂ x₂ + u$. Chaque coefficient se lit alors « **toutes choses égales par ailleurs** » : $β₁$ est l'effet de x₁ quand x₂ ne change pas. Dans R, tout cela s'écrit `lm(y ~ x1 + x2, data = base)`.\n\n:::cle Tu dois savoir dire\nCe qu'est un résidu, ce que minimisent les MCO, et comment se lit une pente avec ses unités.\n:::\n\n#L incertitude | Erreur-type, intervalle de confiance et test | 12 min\n>> Une estimation n'est jamais « le » vrai nombre. Cette leçon explique comment on mesure le doute, et comment on lit toutes les sorties de R.\n\n### Pourquoi une estimation est incertaine\n\nTes 551 communes, tes 254 654 mères sont un échantillon parmi d'autres possibles. Avec d'autres observations, tu aurais obtenu une pente un peu différente. L'[[erreur-type]] mesure de combien l'estimation bougerait d'un échantillon à l'autre.\n\n{{w:echantillon}}\n\nDeux choses à retenir de cet outil :\n\n- l'erreur-type **diminue quand le nombre d'observations augmente**, comme $1/\\sqrt{n}$ : quatre fois plus de données, deux fois plus de précision ;\n- R calcule l'erreur-type à partir d'**un seul** échantillon, grâce à une formule. Cette formule repose sur des hypothèses, et c'est pour cela qu'il existe plusieurs erreurs-types (classiques, robustes, groupées) : voir la leçon 7.\n\n### L'intervalle de confiance\n\nOn entoure l'estimation d'une marge : **estimation ± 1,96 × erreur-type**. C'est l'[[intervalle de confiance]] à 95 %. Lecture correcte : la méthode qui construit ces intervalles attrape la vraie valeur 95 fois sur 100.\n\nExemple : élasticité 1,608, erreur-type 0,074. Intervalle : 1,608 ± 1,96 × 0,074 = [1,46 ; 1,75].\n\n### Le test d'hypothèse, toujours en quatre étapes\n\nL'énoncé demande plusieurs fois de dérouler un test « étape par étape ». Le plan est toujours le même.\n\n1. **Hypothèses.** L'[[hypothèse nulle]] H₀ est l'affirmation qu'on met à l'épreuve (souvent « le coefficient vaut zéro », c'est-à-dire « pas d'effet »). H₁ est son contraire.\n2. **Statistique.** Un nombre calculé sur les données. Pour un coefficient : $t = \\frac{\\hat{β}}{\\text{erreur-type}}$, c'est-à-dire « à combien d'erreurs-types de zéro se trouve l'estimation ».\n3. **Loi sous H₀.** Ce que vaudrait cette statistique par pur hasard si H₀ était vraie : une loi normale pour un t, une loi du khi-deux pour certains tests (Breusch-Pagan, Sargan).\n4. **Décision.** Si la statistique tombe là où le hasard l'envoie rarement (au-delà de 1,96 en valeur absolue pour un t au seuil de 5 %), on **rejette** H₀.\n\nLa [[p-valeur]] résume les étapes 3 et 4 : c'est la probabilité d'obtenir une statistique au moins aussi extrême si H₀ était vraie. **p < 0,05 : on rejette H₀ au seuil de 5 %**, et on dit que le coefficient est « significatif ».\n\n{{w:loi test=interaction}}\n\n:::piege Trois erreurs classiques à l'oral\n- **Ne pas rejeter H₀ ne prouve pas H₀.** Un test peut manquer de puissance : il ne voit pas un écart qui existe.\n- **Significatif ne veut pas dire important.** Avec 254 654 mères, un écart minuscule devient significatif.\n- **La p-valeur n'est pas la probabilité que H₀ soit vraie.**\n:::\n\n:::cle Tu dois savoir dire\nCe que mesure une erreur-type, comment on construit un intervalle à 95 %, et les quatre étapes d'un test.\n:::\n\n#L log | Logarithmes, pourcentages et élasticités | 10 min\n>> Le logarithme transforme des écarts en pourcentages. C'est pour cela que la partie 1 l'utilise partout.\n\n### Ce que fait le logarithme\n\nLe logarithme naturel, noté ln (dans R : `log()`), a une propriété qui suffit à tout comprendre : **il transforme les multiplications en additions**.\n\n$$ \\ln(a × b) = \\ln(a) + \\ln(b) \\quad \\text{donc} \\quad \\ln(1,10 × x) − \\ln(x) = \\ln(1,10) ≈ 0,095 $$\n\nAugmenter une valeur de 10 % ajoute toujours à peu près 0,095 à son logarithme, que l'on parte de 100 000 € ou de 800 000 €. En logarithme, **un même écart représente un même pourcentage**.\n\nD'où l'approximation à connaître par cœur : pour une petite variation, **100 × (différence de logarithmes) ≈ variation en pourcentage**.\n\n{{w:logpct}}\n\n### Les quatre formes d'une régression\n\nSelon qu'on met y, x, les deux ou aucun des deux en logarithme, la pente ne se lit pas de la même façon. C'est toute la question 1.6.\n\n| Modèle | Équation | Lecture de β₁ |\n|---|---|---|\n| Niveau-niveau | $y = β₀ + β₁ x$ | x augmente d'**une unité** → y change de β₁ **unités** |\n| Log-log | $\\ln(y) = β₀ + β₁ \\ln(x)$ | x augmente de **1 %** → y change de β₁ **%** : c'est une [[élasticité]] |\n| Log-niveau | $\\ln(y) = β₀ + β₁ x$ | x augmente d'**une unité** → y change d'environ 100 × β₁ **%** : une [[semi-élasticité]] |\n| Niveau-log | $y = β₀ + β₁ \\ln(x)$ | x augmente de **1 %** → y change de β₁ / 100 **unités** |\n\n:::astuce La règle pour ne jamais se tromper\nRegarde de quel côté se trouve le logarithme. Un **y en log** donne un effet **en pourcentage**. Un **x en log** se lit « pour une hausse de **1 %** de x ».\n:::\n\n### Quand l'approximation ne suffit plus\n\nL'approximation « 100 × Δln ≈ % » ne vaut que pour les petites variations. Pour un grand écart, ou pour le coefficient d'une variable indicatrice, on utilise la formule exacte :\n\n$$ \\text{variation exacte en %} = 100 × (\\exp(δ) − 1) $$\n\nExemple du travail : le coefficient de l'indicatrice Bruxelles vaut 0,895. L'approximation donnerait +89,5 % ; la valeur exacte est 100 × (exp(0,895) − 1) = **+144,7 %**.\n\n:::cle Tu dois savoir dire\nPourquoi une différence de logarithmes est un pourcentage, comment lire une élasticité, et quand il faut passer à la formule exacte.\n:::\n\n#L indicatrices | Variables indicatrices et interactions | 8 min\n>> Comment faire entrer une information qualitative (la région, le sexe d'un enfant, « traité ou non ») dans une régression.\n\n### Une variable qui vaut 0 ou 1\n\nUne [[indicatrice]] (ou variable muette, *dummy*) vaut 1 si l'observation appartient à une catégorie, 0 sinon : `Wallonie` vaut 1 pour une commune wallonne, 0 pour les autres.\n\nAvec une **seule indicatrice** comme régresseur, la régression ne fait que comparer deux moyennes :\n\n$$ y = β₀ + β₁ D + u \\quad → \\quad β₀ = \\text{moyenne du groupe } D = 0, \\quad β₁ = \\text{écart entre les deux moyennes} $$\n\nRetiens-le : c'est exactement la question 2.2, et la base de la double différence.\n\n### La catégorie de référence\n\nPour trois régions, on ne met que **deux** indicatrices. La région laissée de côté (la Flandre, dans le travail) est la [[catégorie de référence]] : chaque coefficient mesure un écart **par rapport à elle**. Mettre les trois indicatrices *et* la constante est impossible : leur somme vaut toujours 1, comme la constante. C'est le piège de la [[colinéarité parfaite]] (question 1.9 b).\n\nGéométriquement, des indicatrices ajoutées à un modèle donnent des **droites parallèles** : même pente, hauteurs différentes.\n\n### L'interaction : des pentes différentes\n\nPour autoriser une pente propre à chaque région, on multiplie le régresseur par l'indicatrice. Ce produit s'appelle une [[interaction]] :\n\n$$ \\ln(prix) = β₀ + β₁ \\ln(rev) + δ W + θ (W × \\ln(rev)) + u $$\n\n- en Flandre (W = 0), la pente est $β₁$ ;\n- en Wallonie (W = 1), la pente est $β₁ + θ$.\n\nLe coefficient $θ$ est donc la **différence de pente** entre les deux régions. Tester « les deux pentes sont égales » revient à tester $θ = 0$.\n\n{{w:nuage modele=pentes titre=\"Essaie : droites parallèles, puis une pente par région\"}}\n\n:::cle Tu dois savoir dire\nCe que mesure le coefficient d'une indicatrice, pourquoi on en omet une, et ce que mesure le coefficient d'une interaction.\n:::\n\n#L hypotheses | Quand peut-on faire confiance aux MCO ? | 10 min\n>> Deux hypothèses à distinguer absolument : l'une concerne la justesse du coefficient, l'autre seulement sa précision annoncée.\n\n### L'exogénéité : le coefficient est-il juste ?\n\nPour que $\\hat{β}₁$ mesure bien l'effet de x sur y, il faut que tout ce qui se trouve dans le terme d'erreur soit sans lien avec x :\n\n$$ E(u \\mid x) = 0 $$\n\nEn mots : parmi les observations qui ont le même x, les autres causes de y ne sont en moyenne ni favorables ni défavorables. On dit que x est [[exogène]]. Si un facteur caché influence y *et* est corrélé à x, l'hypothèse tombe : x est [[endogène]], et le coefficient est **biaisé**.\n\n### Le biais de variable omise, avec son signe\n\nSi on oublie une variable z, le coefficient de x absorbe une partie de son effet :\n\n$$ \\text{biais} = (\\text{effet de z sur y}) × (\\text{lien entre z et x}) $$\n\nIl suffit de connaître les deux signes pour connaître le sens du biais.\n\n| Effet de z sur y | Lien entre z et x | Biais |\n|---|---|---|\n| + | + | vers le haut |\n| − | − | vers le haut |\n| + | − | vers le bas |\n| − | + | vers le bas |\n\nLe travail te fait vérifier cette formule au chiffre près à la question 1.12, et l'utiliser pour raisonner aux questions 2.2 et 1.18.\n\n### L'homoscédasticité : l'erreur-type est-elle juste ?\n\nLa formule « classique » de l'erreur-type suppose que la dispersion des erreurs est **la même pour toutes les observations** : c'est l'[[homoscédasticité]]. Si elle varie (par exemple, des erreurs plus dispersées dans les petites communes), on parle d'[[hétéroscédasticité]].\n\n:::cle La distinction à ne jamais rater\n- **Endogénéité** : le **coefficient** est faux. C'est grave et aucune option de R ne le corrige.\n- **Hétéroscédasticité** : le coefficient reste juste, seules les **erreurs-types classiques** sont fausses. On les remplace par des erreurs-types **robustes**.\n:::\n\n### Les erreurs-types robustes HC1\n\nL'énoncé impose partout les erreurs-types « robustes à l'hétéroscédasticité (HC1) ». Elles restent valables que la dispersion soit constante ou non. Dans R :\n\n```r\ncoeftest(m, vcov = vcovHC(m, type = \"HC1\"))\n```\n\nLes coefficients sont **identiques** à ceux de `summary(m)` ; seules les colonnes erreur-type, t et p-valeur changent.\n\n:::piege À l'oral\nNe dis jamais « l'hétéroscédasticité biaise les coefficients ». Elle fausse les erreurs-types classiques, donc les tests et les intervalles. Rien d'autre.\n:::\n\n:::cle Tu dois savoir dire\nLa différence entre un problème de biais et un problème d'erreur-type, et le signe d'un biais de variable omise.\n:::\n\n#L instruments | Variables instrumentales : l'idée | 9 min\n>> Que faire quand la variable qui nous intéresse est endogène ? Trouver quelque chose qui la fait varier « par hasard ».\n\n### Le problème\n\nOn veut l'effet d'un troisième enfant (X) sur le travail de la mère (Y). Mais avoir un troisième enfant est un **choix**, lié aux préférences, à la carrière, au revenu du conjoint : autant de facteurs cachés qui jouent aussi sur le travail. Les MCO sont biaisés.\n\n### La solution\n\nOn cherche une variable Z, l'[[instrument]], qui remplit deux conditions.\n\n1. **Pertinence.** Z fait réellement varier X. Ici : les parents de deux enfants de même sexe ont plus souvent un troisième enfant (41,4 % contre 34,6 %). Cette condition **se vérifie** dans les données.\n2. **Exogénéité.** Z n'est lié à aucun facteur caché, et n'agit sur Y **que par l'intermédiaire de X**. Ici : le sexe d'un enfant est dû au hasard, et il ne devrait pas changer le travail de la mère autrement que par le nombre d'enfants. Cette condition **ne se vérifie pas** directement : elle se défend par des arguments.\n\n{{w:dag schema=vi}}\n\n### Le calcul, en une division\n\nSi Z ne touche Y qu'à travers X, alors :\n\n$$ \\text{effet de X sur Y} = \\frac{\\text{effet de Z sur Y}}{\\text{effet de Z sur X}} = \\frac{\\text{forme réduite}}{\\text{première étape}} $$\n\nDans le travail : −0,426 semaine / 0,0675 = **−6,3 semaines** par enfant supplémentaire. C'est l'[[estimateur de Wald]]. Les doubles moindres carrés ([[2SLS]]) généralisent cette idée quand il y a des variables de contrôle ou plusieurs instruments.\n\n### Le prix à payer\n\nLa VI n'utilise que la petite part des variations de X provoquée par Z. Elle est donc **beaucoup moins précise** que les MCO : dans le travail, l'erreur-type est quinze fois plus grande. On échange du biais contre de l'imprécision.\n\n{{w:simiv}}\n\n:::cle Tu dois savoir dire\nLes deux conditions d'un bon instrument, laquelle se teste, et pourquoi l'estimation par VI est moins précise.\n:::\n\n#L did | Double différence, effets fixes et erreurs groupées | 9 min\n>> Quand on suit les mêmes unités dans le temps, on peut comparer des évolutions plutôt que des niveaux.\n\n### Deux comparaisons naïves, deux biais\n\nDes localités reçoivent l'électricité en 2008-2009 (les « traitées »), d'autres seulement en 2015-2017 (le « groupe de comparaison »).\n\n- **Comparer les deux groupes après** mélange l'effet du réseau avec tout ce qui les distinguait déjà avant.\n- **Comparer les traitées avant et après** mélange l'effet du réseau avec tout ce qui a changé pour tout le monde entre-temps.\n\n### La double différence\n\nOn fait les deux soustractions à la fois :\n\n$$ DD = (\\bar{y}_{T, après} − \\bar{y}_{T, avant}) − (\\bar{y}_{C, après} − \\bar{y}_{C, avant}) $$\n\nLa première différence retire ce qui distingue durablement les groupes ; la seconde retire ce qui change pour tout le monde. Il reste ce qui change **seulement pour les traitées, seulement après**.\n\n{{w:did}}\n\n### L'hypothèse qui porte tout : les tendances parallèles\n\nLa double différence mesure un effet causal **si**, sans électricité, les traitées auraient évolué comme le groupe de comparaison. C'est l'hypothèse des [[tendances parallèles]]. Elle porte sur une situation qu'on n'observe jamais (le [[contrefactuel]]) : on peut la rendre plausible, jamais la prouver.\n\n### Les effets fixes\n\nUn [[effets fixes::effet fixe]] de localité est une constante propre à chaque localité : il absorbe tout ce qui ne change pas dans le temps pour elle (sa taille, sa situation). Un effet fixe d'année absorbe tout ce qui touche toutes les localités la même année. Avec les deux, il ne reste que la variation de la double différence.\n\n{{w:effetsfixes}}\n\n### Les erreurs-types groupées\n\nDix observations de la même localité ne sont pas dix informations indépendantes : ce qui rend une localité plus lumineuse que prévu une année a de bonnes chances de persister l'année suivante. Les [[erreurs-types groupées]] (*clustered*) en tiennent compte ; sans elles, on surestime la précision.\n\n:::cle Tu dois savoir dire\nCe que retire chacune des deux différences, l'hypothèse des tendances parallèles, et pourquoi on groupe les erreurs-types par localité.\n:::\n\n#L lire-r | Lire une sortie de R | 6 min\n>> Toutes les régressions du travail se lisent de la même façon. Autant apprendre le format une fois.\n\n### Une ligne de `coeftest()`\n\n```txt\n                 Estimate Std. Error  t value  Pr(>|t|)\n(Intercept)     -3.613805   0.752053  -4.8053 1.999e-06 ***\nlrev             1.607820   0.074037  21.7165 < 2.2e-16 ***\nregionWallonie  -0.204929   0.016638 -12.3170 < 2.2e-16 ***\nregionBruxelles  0.894930   0.054719  16.3551 < 2.2e-16 ***\n```\n\n| Colonne | Ce que c'est | Sur la ligne `lrev` |\n|---|---|---|\n| `Estimate` | le coefficient estimé | 1,608 : l'élasticité |\n| `Std. Error` | son erreur-type (ici robuste HC1) | 0,074 |\n| `t value` | Estimate / Std. Error | 21,7 : très loin de zéro |\n| `Pr(>\\|t\\|)` | la p-valeur du test « coefficient = 0 » | < 2,2 × 10⁻¹⁶ : pratiquement nulle |\n\n- `(Intercept)` est la constante.\n- `regionWallonie` est l'indicatrice créée automatiquement par R à partir du facteur `region` : le nom de la variable collé au nom de la catégorie.\n- Les étoiles résument la p-valeur : `***` < 0,001, `**` < 0,01, `*` < 0,05.\n- `1.999e-06` se lit 1,999 × 10⁻⁶, soit 0,000002.\n\n:::astuce Trois réflexes\n- L'intervalle de confiance à 95 % n'est pas affiché : c'est Estimate ± 1,96 × Std. Error.\n- Le R² n'est pas dans `coeftest()` : `summary(m)$r.squared`.\n- Vérifie toujours le nombre d'observations avec `nobs(m)` : R supprime sans prévenir les lignes qui ont une valeur manquante.\n:::\n\n:::piege `summary()` n'est pas `coeftest()`\n`summary(lm(...))` affiche les erreurs-types **classiques**. L'énoncé demande les robustes : les coefficients sont les mêmes, mais pas les erreurs-types, ni les t, ni les p-valeurs. Tous les chiffres du rapport doivent venir de `coeftest(m, vcov = vcovHC(m, type = \"HC1\"))`.\n:::\n\n:::cle Tu dois savoir dire\nLire à voix haute n'importe quelle ligne d'une sortie : le coefficient et son unité, son erreur-type, s'il est significatif, et son intervalle de confiance.\n:::\n","p1":"#PART 1 | Revenus et prix des maisons dans les communes belges | Régression, logarithmes, indicatrices\n:resultat 1,61 | élasticité du prix au revenu, à région donnée\n:intro\n>> Les communes où les habitants gagnent plus ont-elles des maisons plus chères ? De combien ? Et cette relation est-elle la même en Flandre, en Wallonie et à Bruxelles ?\n\n### Ce que tu vas faire\n\nTu construis d'abord toi-même la base de données, à partir de deux fichiers publics de Statbel qui ne se correspondent pas tout à fait. Puis tu estimes la relation entre le revenu par habitant et le prix médian des maisons, de plusieurs façons, en te demandant à chaque étape ce que le chiffre veut dire.\n\n| Étape | Questions | L'idée à retenir |\n|---|---|---|\n| A. Construire et décrire | 1.1 à 1.5 | Avant d'estimer quoi que ce soit, savoir ce qu'est une ligne et ce que mesurent vraiment les variables. |\n| B. Formes fonctionnelles | 1.6 à 1.8 | Un coefficient se lit en euros ou en pourcentage selon l'endroit où se trouve le logarithme. |\n| C. Régions | 1.9 à 1.12 | Ajouter la région change l'élasticité : c'est le biais de variable omise, que tu vérifies au chiffre près. |\n| D. Interaction | 1.13 | L'élasticité peut différer d'une région à l'autre. |\n| E. Hétéroscédasticité | 1.14 | La précision des estimations dépend d'une hypothèse sur la dispersion des erreurs. |\n| F. Contrôles et causalité | 1.15 à 1.18 | Un bon contrôle, un mauvais contrôle, et pourquoi rien de tout cela n'est un effet causal. |\n\n### Les données\n\nDeux fichiers de Statbel, l'office belge de statistique.\n\n| Fichier | Une ligne = | Ce qu'on en tire |\n|---|---|---|\n| `vastgoed_2010_9999.txt` | un territoire × une période × un type de bien | nombre de ventes, prix médian, quartiles |\n| `TF_PSNL_INC_TAX_MUNTY.txt` | une commune × une année de revenus | revenu total net imposable, nombre d'habitants |\n\nLes deux se rejoignent par le [[code INS]] de la commune. La base finale compte **551 communes** : 281 flamandes, 251 wallonnes et 19 bruxelloises.\n\n### Le résultat en une phrase\n\nÀ région donnée, une commune dont le revenu par habitant est supérieur de 1 % a un prix médian supérieur d'environ **1,6 %**. À revenu égal, les maisons sont environ 18 % moins chères en Wallonie et 2,4 fois plus chères à Bruxelles qu'en Flandre. Ce sont des associations entre communes, pas l'effet d'une hausse de revenu.\n\n{{w:nuage modele=unique titre=\"Le nuage qui résume toute la partie 1\"}}\n\n#SEC A | Construction et description de l'échantillon\n\n#Q 1.1 | Construire la base : 565, 581, puis 551 communes\n:intro\nCette question est la plus longue du travail, et celle qui fait le plus peur. Elle ne demande pourtant aucune statistique : seulement de comprendre **pourquoi deux fichiers qui décrivent le même pays ne comptent pas le même nombre de communes**, et de réparer cela proprement.\n\nL'outil ci-dessous montre tout le problème d'un coup. Reviens-y à chaque sous-question.\n\n{{w:fusion}}\n:concepts donnees\n##a | Compter les communes dans chaque fichier\n:enonce\nCombien de communes le fichier des ventes compte-t-il pour 2023 (ensemble des maisons, niveau communal, année entière) ? Combien de communes le fichier fiscal compte-t-il pour 2023 ?\n:court\n**565 communes** dans le fichier des ventes, **581** dans le fichier fiscal. L'écart de 16 est le premier signe que les deux fichiers ne découpent pas le pays de la même façon.\n:zero\nLe fichier des ventes est un grand tableau « empilé » : la même commune y apparaît des dizaines de fois, pour chaque année, chaque trimestre, chaque type de bien. Pour compter les communes, il faut d'abord ne garder que **les lignes qui nous intéressent**. Quatre filtres :\n\n| Variable | Valeurs possibles | Ce qu'on garde | Pourquoi |\n|---|---|---|---|\n| `CD_YEAR` | 2010 à 2026 | `2023` | l'année étudiée |\n| `CD_PERIOD` | `Q1` à `Q4` (trimestres), `S1`, `S2` (semestres), `Y` (année) | `\"Y\"` | l'année entière ; sinon les mêmes ventes seraient comptées plusieurs fois |\n| `CD_niveau_refnis` | 1 Belgique, 2 régions, 3 provinces, 4 arrondissements, 5 communes | `5` | le niveau communal |\n| `CD_TYPE_NL` | 4 types de biens | « toutes les maisons » | l'énoncé exclut les appartements |\n\nComment savoir que `Y` veut dire « année » et que `5` veut dire « commune » ? Par les métadonnées, et en regardant ce que contient chaque variable avec `table()`. Petit contrôle malin : en 2023, pour un type de bien donné, le niveau 1 compte 1 ligne (la Belgique), le niveau 2 en compte 3 (les régions), le niveau 3 en compte 10 (les provinces), le niveau 4 en compte 43 (les arrondissements) et le niveau 5 en compte 565. C'est bien l'emboîtement administratif belge.\n\nLe fichier fiscal est plus simple : une ligne par commune et par année. Il suffit de garder `CD_YEAR == 2023`.\n\n:::piege Le code INS se lit comme du texte\n`colClasses = c(CD_REFNIS = \"character\")` oblige R à lire le code comme une chaîne de caractères. Sinon `01000` deviendrait le nombre `1000`, et la fusion entre les deux fichiers échouerait sans message d'erreur.\n:::\n:res\n| Fichier | Filtre | Communes |\n|---|---|--:|\n| Ventes | 2023, année entière, niveau 5, toutes les maisons | **565** |\n| Fiscal | revenus 2023 | **581** |\n:code\n```r\n# Repérer les valeurs utiles avant de filtrer\ntable(immo_raw$CD_PERIOD)          # Q1..Q4, S1, S2, Y\ntable(immo_raw$CD_niveau_refnis)   # 1 à 5\n\nventes23 <- immo_raw %>%\n  filter(CD_YEAR == 2023, CD_PERIOD == \"Y\", CD_niveau_refnis == 5)\n\nmaisons23 <- ventes23 %>%\n  filter(CD_TYPE_NL == \"Alle huizen met 2, 3, 4 of meer gevels (excl. appartementen)\") %>%\n  transmute(refnis = CD_REFNIS, commune = CD_REFNIS_FR,\n            n_ventes = MS_TOTAL_TRANSACTIONS, prix = MS_P_50_median,\n            p25 = MS_P_25, p75 = MS_P_75)\n\nfisc23 <- fisc_raw %>% filter(CD_YEAR == 2023)\n\nn_distinct(maisons23$refnis)          # 565\nn_distinct(fisc23$CD_MUNTY_REFNIS)    # 581\n```\n\n- `filter()` garde les lignes qui vérifient **toutes** les conditions séparées par des virgules.\n- `%>%` (le « pipe ») passe le résultat de gauche à la fonction de droite : « prends `immo_raw`, puis filtre ».\n- `transmute()` crée de nouvelles colonnes et ne garde qu'elles : c'est ici qu'on donne aux variables les noms demandés par l'énoncé.\n- `n_distinct()` compte les valeurs différentes.\n:gpt\nFiltre le type de bien sur l'intitulé **français** : `CD_TYPE_FR == \"Toutes les maisons avec 2, 3, 4 ou plus de façades (excl. appartements)\"`. Ajoute une phrase utile : additionner les trimestres à l'année, ou les sous-types de maisons à leur total, compterait plusieurs fois les mêmes ventes.\n:claude\nFiltre sur l'intitulé **néerlandais**, qui ne contient aucun accent, et justifie ce choix : une comparaison de chaînes avec « façades » peut échouer si l'encodage du fichier est mal lu. Donne le contrôle 1 / 3 / 10 / 43 / 565 pour vérifier le sens des niveaux.\n:verdict\nMêmes chiffres. La seule différence est le libellé utilisé pour filtrer. Celui de Claude est plus prudent : le « ç » de « façades » est exactement le genre de caractère qu'un problème d'encodage abîme. La phrase de ChatGPT sur le double comptage mérite d'être reprise : elle montre que tu sais *pourquoi* tu filtres.\n:opt mix | Filtrer sur le néerlandais et justifier chaque filtre\nJe garde l'année 2023, la période annuelle `Y` (les trimestres et semestres recompteraient les mêmes ventes), le niveau communal 5 et la ligne « toutes les maisons ». Je filtre sur l'intitulé néerlandais, sans accent, pour ne pas dépendre de l'encodage. J'obtiens 565 communes dans les ventes et 581 dans le fichier fiscal.\n:opt gpt | Filtrer sur l'intitulé français\nMême sélection, avec le libellé français du type de bien. Plus lisible pour un lecteur francophone, mais sensible à l'encodage du fichier.\n##b | Les communes présentes dans un seul fichier\n:enonce\nÉtablissez la liste des communes qui ne figurent que dans un seul des deux fichiers (fonction `anti_join()` du package dplyr). Combien y en a-t-il de chaque côté ? Que remarquez-vous dans leurs noms ?\n:court\n**13 communes** n'existent que dans le fichier des ventes, **29** que dans le fichier fiscal. Les noms des premières sont des assemblages des secondes (Nazareth-De Pinte, Merelbeke-Melle…) : ce sont des **fusions de communes**.\n:zero\n`anti_join(x, y)` renvoie les lignes de `x` qui n'ont **aucun correspondant** dans `y`. C'est l'outil qui repère les « orphelins » d'une fusion. On l'appelle deux fois, en inversant les tables.\n\nRegarde les deux listes dans l'outil en haut de la page. Trois choses sautent aux yeux :\n\n- côté ventes, des **noms composés** : Nazareth-De Pinte, Merelbeke-Melle, Tessenderlo-Ham, Bilzen-Hoeselt, Tongres-Borgloon, Beveren-Kruibeke-Zwijndrecht ;\n- côté fiscal, **les morceaux** de ces noms : Nazareth, De Pinte, Merelbeke, Melle, Tessenderlo, Ham… ;\n- certains noms sont **des deux côtés, avec des codes différents** : Wingene, Tielt, Lochristi, Lokeren, Hasselt, Bastogne. La nouvelle commune a gardé le nom de l'une des anciennes, mais a reçu un nouveau code.\n\nSur les 29 communes « fiscales », 27 sont flamandes et 2 wallonnes (Bastogne et Bertogne). Les deux listes décrivent donc les mêmes territoires, découpés différemment : 29 anciennes communes sont devenues 13 nouvelles.\n\n:::astuce Le compte est-il bon ?\n581 − 29 + 13 = 565. Les 16 communes d'écart de la question (a) sont bien 29 − 13.\n:::\n:code\n```r\nseulement_ventes <- anti_join(maisons23, fisc23, by = c(\"refnis\" = \"CD_MUNTY_REFNIS\"))\nseulement_fisc   <- anti_join(fisc23, maisons23, by = c(\"CD_MUNTY_REFNIS\" = \"refnis\"))\nnrow(seulement_ventes)   # 13\nnrow(seulement_fisc)     # 29\n```\n\n`by = c(\"refnis\" = \"CD_MUNTY_REFNIS\")` dit à R que la colonne `refnis` de la première table correspond à la colonne `CD_MUNTY_REFNIS` de la seconde. On en a besoin parce que la clé ne porte pas le même nom dans les deux fichiers.\n:accord Mêmes listes et mêmes effectifs. Claude détaille davantage ce qu'on remarque dans les noms (noms composés, mêmes noms avec un autre code, 27 communes flamandes et 2 wallonnes) ; ChatGPT le dit en deux phrases. L'énoncé pose explicitement la question des noms : la version détaillée y répond mieux.\n##c | D'où vient la différence ?\n:enonce\nLa documentation de Statbel n'explique pas cette différence. Consultez la page de Statistiek Vlaanderen « Nieuwe NIS-codes voor gefuseerde gemeenten vanaf 1 januari 2025 ». Expliquez l'origine de la différence entre les deux fichiers, et pourquoi ils ne suivent pas le même découpage communal pour l'année 2023.\n:court\n28 communes flamandes ont fusionné en 13 le **1er janvier 2025**, et Bastogne a absorbé Bertogne le **2 décembre 2024**. Le fichier des ventes décrit toutes ses années, 2023 comprise, avec le **nouveau** découpage (565 communes) ; le fichier fiscal garde l'**ancien** (581 communes).\n:zero\nUne commune fusionnée reçoit en principe un nouveau code INS. La page de Statistiek Vlaanderen donne la table de correspondance entre anciens et nouveaux codes pour les fusions flamandes.\n\nReste la vraie question : pourquoi, **pour la même année 2023**, les deux fichiers n'utilisent-ils pas le même découpage ? Parce que chacun applique **un seul découpage à toute sa série**, mais pas le même. Les données elles-mêmes le montrent.\n\n| Fichier | Ce qu'on observe | Ce que ça veut dire |\n|---|---|---|\n| Ventes | 565 communes **chaque année** de 2010 à 2025. Pajottegem a des ventes en 2010, alors qu'elle n'existe que depuis 2025. | Statbel a **recalculé tout l'historique** sur le découpage de 2025. |\n| Fiscal | 581 communes **chaque année** de 2005 à 2023. | Le fichier utilise le découpage en vigueur avant les fusions. |\n\nC'est cohérent : la série des ventes va jusqu'en 2026 et doit donc décrire les nouvelles communes ; les revenus de 2023, eux, ont été déclarés et imposés en 2024, quand les anciennes communes existaient encore.\n\nEn une phrase : **chaque fichier est cohérent avec lui-même, mais l'un décrit 2023 avec les communes de 2025, l'autre avec celles de 2023.**\n\n:::verif Une erreur de date dans les deux versions\nChatGPT et Claude écrivent tous deux que la fusion de Bastogne et Bertogne date du **1er décembre 2024**. La date d'effet est le **2 décembre 2024**, le lundi d'installation du nouveau conseil communal (décret wallon du 19 mai 2023 ; note du Registre national sur les fusions, [ibz.rrn.fgov.be](https://ibz.rrn.fgov.be/fileadmin/user_upload/fr/rn/circulaires/NOT_Fusion_General.pdf)). Corrige-la dans ton rapport.\n:::\n:gpt\nExplication courte : les fusions flamandes prennent effet le 1er janvier 2025, celle de Bastogne en décembre 2024 ; la série de ventes a été exprimée sur le découpage récent, le fiscal garde celui de 2023. Cite une note de Statbel selon laquelle certaines séries historiques sont recalculées sur les nouvelles limites.\n:claude\nMême explication, mais **démontrée par les données** : 565 communes chaque année dans les ventes (Pajottegem a des ventes dès 2010), 581 chaque année dans le fiscal. Ajoute l'argument fiscal : les revenus 2023 sont imposés en 2024, avant les fusions.\n:verdict\nMême conclusion. La version de Claude est plus convaincante parce qu'elle **prouve** l'affirmation avec deux comptages que tu peux refaire en une ligne de R. J'ai vérifié les deux : 565 communes pour chaque année de 2010 à 2025 dans les ventes (et les premiers trimestres de 2026), 581 pour chaque année de 2005 à 2023 dans le fiscal. Les deux versions se trompent d'un jour sur Bastogne.\n:opt claude | Explication démontrée par les données\nLes deux fichiers appliquent chacun un seul découpage à toute leur série. Le fichier des ventes compte 565 communes pour chaque année depuis 2010 : Statbel a recalculé l'historique sur le découpage de 2025 (Pajottegem a des ventes en 2010 alors qu'elle n'existe que depuis 2025). Le fichier fiscal compte 581 communes chaque année : il garde l'ancien découpage, celui dans lequel les revenus de 2023 ont été imposés. Les fusions (28 communes flamandes devenues 13 au 1er janvier 2025, Bastogne et Bertogne au 2 décembre 2024) expliquent l'écart.\n:opt gpt | Explication courte\nLes fusions de communes (1er janvier 2025 en Flandre, décembre 2024 pour Bastogne) ont créé de nouveaux codes. La série des ventes a été recalculée sur le nouveau découpage, alors que la statistique fiscale de 2023 garde l'ancien.\n:code\n```r\n# Le fichier des ventes utilise-t-il le même découpage chaque année ?\nimmo_raw %>%\n  filter(CD_PERIOD == \"Y\", CD_niveau_refnis == 5,\n         CD_TYPE_NL == \"Alle huizen met 2, 3, 4 of meer gevels (excl. appartementen)\") %>%\n  group_by(CD_YEAR) %>% summarise(communes = n_distinct(CD_REFNIS))    # 565 partout\n\nfisc_raw %>% group_by(CD_YEAR) %>%\n  summarise(communes = n_distinct(CD_MUNTY_REFNIS))                     # 581 partout\n```\n\nCes lignes ne sont dans aucun des deux scripts : ce sont les deux comptages qui prouvent l'explication. `group_by()` puis `summarise()` calcule une ligne par année.\n##d | Le piège d'Anvers\n:enonce\nComparez la liste de cette page avec vos listes de la question (b) : l'une des communes concernées n'apparaît pas parmi les communes du fichier des ventes absentes du fichier fiscal. Laquelle, et pourquoi ? Quelle erreur commettriez-vous pour cette commune en fusionnant simplement les deux fichiers par code INS ?\n:court\n**Anvers.** Elle a absorbé Borsbeek en **gardant son code 11002**. Ce code existe donc dans les deux fichiers, mais il ne désigne pas le même territoire. Une fusion directe associerait les ventes d'Anvers + Borsbeek au revenu et à la population de la seule ancienne Anvers, **sans aucun message d'erreur**.\n:zero\nLa page de Statistiek Vlaanderen liste 14 opérations de fusion, mais ton `anti_join` côté ventes ne renvoie que 13 communes. Il en manque une : celle dont le code n'a pas changé.\n\nToutes les communes fusionnées ont reçu un nouveau code, **sauf Anvers**. Sélectionne-la dans l'outil en haut de la page : Borsbeek (11007) apparaît bien dans la liste « seulement fiscal », mais Anvers n'apparaît nulle part, puisque 11002 se retrouve des deux côtés.\n\n| Fichier | Ce que désigne le code 11002 | Chiffres 2023 |\n|---|---|---|\n| Ventes | Anvers **+ Borsbeek** | 2 729 ventes, prix médian 339 000 € |\n| Fiscal | Anvers **seule** | 544 759 habitants, 20 370 € par habitant |\n| Fiscal, code 11007 | Borsbeek | 11 379 habitants, 22 597 € par habitant |\n\nL'erreur chiffrée est petite : la population serait sous-estimée de 11 379 habitants (2 %) et le revenu par habitant vaudrait 20 370 € au lieu de 20 416 €. Mais c'est la pire sorte d'erreur : **silencieuse**. Pas de valeur manquante, pas d'avertissement, et Borsbeek disparaît de la base sans laisser de trace.\n\n:::cle La leçon générale\nUne fusion de tables par clé ne vérifie que les **codes**, jamais leur **signification**. Deux lignes peuvent se rejoindre parfaitement et parler de deux choses différentes.\n:::\n:gpt\nIdentifie Anvers et l'erreur (prix d'Anvers agrandie, revenu de la seule ancienne Anvers). Avance une raison pour le maintien du code : l'ajout de Borsbeek n'augmente la population que d'environ 2 %, « selon Statistiek Vlaanderen ».\n:claude\nIdentifie Anvers, **chiffre** l'erreur (11 379 habitants, 20 370 € au lieu de 20 416 €) et insiste sur son caractère silencieux.\n:verdict\nMême réponse. Claude quantifie mieux l'erreur, ce que la question demande (« quelle erreur commettriez-vous ? »). La raison donnée par ChatGPT est plausible : une analyse d'impact fédérale d'avril 2024 évoque bien un changement limité à 2 % de la superficie et de la population. Je n'ai pas pu relire la page de Statistiek Vlaanderen pour confirmer qu'elle donne cette raison en ces termes : si tu veux la citer, vérifie-la sur la page.\n##e | Reconstituer les communes fusionnées\n:enonce\nReconstituez dans le fichier fiscal les communes issues des fusions, de façon à pouvoir les conserver dans votre base. Pourquoi cette reconstitution est-elle possible pour `rev_hab` ? Aurait-elle été possible dans l'autre sens, c'est-à-dire en répartissant entre les anciennes communes les données de ventes des nouvelles communes ?\n:court\nOn **additionne** les revenus totaux et les habitants des anciennes communes, puis on **refait la division**. C'est possible parce que `rev_hab` est un rapport de deux totaux. Dans l'autre sens, c'est impossible : une médiane ne se découpe pas sans les prix de chaque vente.\n:zero\nUn total s'additionne. Le revenu total de la nouvelle commune est exactement la somme des revenus totaux des anciennes, et de même pour les habitants. Le revenu par habitant de la commune fusionnée est donc :\n\n$$ rev\\_hab_{fusion} = \\frac{\\text{somme des revenus totaux}}{\\text{somme des habitants}} $$\n\nPour Anvers : (11 097,0 + 257,1 millions €) / (544 759 + 11 379) = **20 416 €**.\n\n:::piege Ne fais pas la moyenne des revenus par habitant\nLa moyenne simple de 20 370 € et 22 597 € donnerait 21 484 €, comme si Borsbeek pesait autant qu'Anvers. Le rapport des sommes est une moyenne **pondérée par la population**, et c'est la seule correcte. L'outil en haut de la page montre l'écart pour chacune des 14 fusions.\n:::\n\n**Et dans l'autre sens ?** Il faudrait retrouver le prix médian de Nazareth seule à partir du prix médian de Nazareth-De Pinte. C'est impossible : la médiane dépend de **tous les prix individuels**, que le fichier ne contient pas. Même le nombre de ventes ne se répartit pas, puisqu'on ne sait pas dans quelle ancienne commune chaque vente a eu lieu.\n\n:::cle La règle à retenir\nOn peut **agréger** des totaux d'un niveau fin vers un niveau plus large. On ne peut pas **désagréger** sans les données individuelles.\n:::\n:code\n```r\n# Table de passage : ancien code -> nouveau code (page de Statistiek Vlaanderen)\nfusions <- data.frame(\n  ancien  = c(\"11002\", \"11007\", \"23023\", \"23024\", \"23032\" ),   # … 30 lignes en tout\n  nouveau = c(\"11002\", \"11002\", \"23106\", \"23106\", \"23106\" ))\n\nfisc23_new <- fisc23 %>%\n  left_join(fusions, by = c(\"CD_MUNTY_REFNIS\" = \"ancien\")) %>%\n  mutate(refnis = ifelse(is.na(nouveau), CD_MUNTY_REFNIS, nouveau)) %>%\n  group_by(refnis) %>%\n  summarise(rev_tot = sum(MS_TOT_NET_TAXABLE_INC),   # les totaux s'additionnent\n            pop     = sum(MS_TOT_RESIDENTS),\n            region  = first(region), .groups = \"drop\") %>%\n  mutate(rev_hab = rev_tot / pop)                    # puis on refait le rapport\n\nnrow(fisc23_new)                                         # 565\nnrow(anti_join(maisons23, fisc23_new, by = \"refnis\"))    # 0 : plus aucun orphelin\n```\n\n1. `left_join()` colle à chaque commune fiscale son nouveau code, s'il y en a un. Les communes non concernées reçoivent `NA`.\n2. `mutate(refnis = ifelse(...))` : si pas de nouveau code, on garde l'ancien.\n3. `group_by(refnis)` regroupe les anciennes communes qui partagent le même nouveau code ; `summarise()` les additionne.\n4. Les deux dernières lignes sont le **contrôle** : 565 communes, et plus aucun orphelin.\n:accord Même méthode (table de passage, somme des totaux, puis rapport) et même raisonnement sur l'impossibilité de désagréger une médiane. ChatGPT ajoute dans son script un contrôle élégant : après regroupement, la population totale et le revenu total du pays doivent être inchangés (`stopifnot(sum(...) == sum(...))`). C'est une bonne idée à reprendre.\n##f | Les 14 communes sans prix médian\n:enonce\nCertaines communes n'ont pas de prix médian. Combien ? Comparez leur nombre de ventes à celui des autres communes. Pourquoi, selon vous, Statbel ne publie-t-il pas de médiane pour ces communes ? Leur exclusion peut-elle affecter vos résultats ?\n:court\n**14 communes** n'ont pas de prix médian. Elles ont toutes **19 ventes ou moins**, contre 108 en médiane pour les autres. Statbel ne publie les médianes qu'à partir de 16 ventes au prix exploitable, pour des raisons de **fiabilité** et de **confidentialité**. Leur exclusion change peu les résultats (2,5 % des communes, 0,3 % de la population), mais ceux-ci ne valent que pour les communes où il se vend assez de maisons.\n:zero\n565 − 14 = **551** : c'est le nombre de contrôle donné par l'énoncé.\n\n**Qui sont-elles ?** De très petites communes rurales : 10 wallonnes (Ouffet, Tinlot, Amblève, Baelen, Olne, Burg-Reuland, Martelange, Sainte-Ode, Daverdisse, Herbeumont) et 4 flamandes (Biévène, Messines, Horebeke, Herstappe). Herstappe, la plus petite commune du pays (76 habitants), n'a même aucun nombre de ventes renseigné.\n\n**Pourquoi pas de médiane ?** Deux raisons, qui sont celles que donne la méthodologie de Statbel.\n\n- **Fiabilité.** Une médiane calculée sur cinq ou dix ventes change énormément d'une année à l'autre, au gré des biens vendus. La question 1.3 le chiffre.\n- **Confidentialité.** Avec cinq ventes, la médiane et les quartiles sont presque des prix individuels : on pourrait reconnaître une transaction.\n\nLe seuil se voit dans les données :\n\n| Ventes de maisons en 2023 | Communes sans médiane | Communes avec médiane |\n|---|--:|--:|\n| 15 ou moins | 6 | 0 |\n| 16 | 1 | 0 |\n| 17 à 19 | 6 | 4 |\n| 20 ou plus | 0 | 547 |\n\nEntre 17 et 19 ventes, certaines médianes sont publiées et d'autres non. L'explication : le seuil de 16 porte sur les ventes dont **le prix est exploitable**, et le fichier compte aussi des actes sans prix utilisable.\n\n**L'exclusion fausse-t-elle les résultats ?** Peu en pratique. Sur le principe, c'est une sélection sur la **taille du marché**, pas directement sur le prix : elle ne biaise pas les estimations si la relation entre prix et revenu est la même dans ces communes qu'ailleurs. Mais on ne peut pas le vérifier, et nos résultats ne décrivent donc que les communes où il se vend au moins une quinzaine de maisons par an.\n:res\n| Groupe | Communes | Ventes (médiane) | Ventes (min – max) | Habitants (moyenne) | Revenu par habitant (moyenne) |\n|---|--:|--:|--:|--:|--:|\n| Avec prix médian | 551 | 108 | 17 – 2 729 | 21 282 | 24 288 € |\n| Sans prix médian | 14 | 16 | 5 – 19 | 2 655 | 23 296 € |\n:code\n```r\nbase_565 <- maisons23 %>%\n  inner_join(fisc23_new, by = \"refnis\") %>%    # garde les communes présentes des deux côtés\n  left_join(apparts23, by = \"refnis\")          # ajoute n_app, NA s'il n'y en a pas\n\nsum(is.na(base_565$prix))                      # 14\nbase <- base_565 %>% filter(!is.na(prix))      # la base d'analyse\nnrow(base)                                     # 551\n```\n\n`is.na()` repère les valeurs manquantes ; `!` veut dire « non ». `filter(!is.na(prix))` garde donc les lignes où le prix **n'est pas** manquant.\n:gpt\nDonne la règle : Statbel publie les percentiles à partir de **16 transactions ayant un prix valable**, et un total de 19 ventes peut inclure des actes sans prix exploitable. Note que Herstappe n'a pas de nombre de ventes. Sur les conséquences : si ces communes sont plus rurales ou suivent une pente différente, le résultat se généralise moins bien aux 565.\n:claude\nDonne deux raisons, **fiabilité** et **confidentialité**, et retrouve le seuil en observant les données (aucune médiane sous 16 ventes, toutes à partir de 20, mélange entre les deux). Chiffre le poids de l'exclusion : 2,5 % des communes, 0,3 % de la population. Distingue sélection sur la taille du marché et sélection sur le prix.\n:verdict\nLes deux réponses se complètent, et la meilleure les combine. ChatGPT a la **règle documentée** ; Claude a les **deux raisons** et la discussion la plus complète du biais. J'ai recoupé : la fiche de métadonnées de l'IWEPS, qui reprend la méthodologie de Statbel, indique que les médianes ne sont publiées qu'à partir de 16 logements vendus, « pour atteindre une certaine représentativité et garantir la confidentialité », et que le nombre de transactions affiché peut dépasser ce seuil quand certains prix manquent. Les données confirment la règle (tableau ci-dessus).\n:opt mix | La règle, les deux raisons, puis le biais\n14 communes n'ont pas de prix médian ; toutes ont 19 ventes ou moins, contre 108 en médiane ailleurs. Statbel ne publie les médianes qu'à partir de 16 ventes au prix exploitable, pour deux raisons : une médiane sur si peu de ventes est trop instable, et elle révélerait presque des prix individuels. Leur exclusion pèse peu (2,5 % des communes, 0,3 % de la population). C'est une sélection sur la taille du marché, qui ne biaise les estimations que si la relation prix-revenu y est différente ; nos résultats valent pour les communes où il se vend assez de maisons.\n:opt gpt | Mettre l'accent sur la règle de publication\nStatbel publie les percentiles à partir de 16 transactions au prix valable. Les 14 communes concernées sont de petits marchés ; si elles sont plus rurales ou moins chères, les résultats sur 551 communes se généralisent moins bien aux 565.\n:opt claude | Mettre l'accent sur les raisons et le poids de l'exclusion\nLes 14 communes sans médiane sont de très petites communes rurales. Statbel ne publie pas leur médiane parce qu'elle serait peu fiable et presque individuelle. Elles ne représentent que 0,3 % de la population : leur exclusion change peu les estimations.\n:quiz\n? Pourquoi le fichier des ventes compte-t-il 565 communes en 2023, alors que les fusions n'ont eu lieu qu'en 2024-2025 ?\n- Parce que les fusions ont été décidées dès 2023\n+ Parce que Statbel a recalculé toute la série sur le découpage de 2025\n- Parce que 16 communes n'ont eu aucune vente en 2023\n> Le fichier compte 565 communes pour chaque année depuis 2010. Pajottegem y a des ventes en 2010 alors qu'elle n'existe que depuis 2025 : l'historique a été recalculé.\n? Pour reconstituer le revenu par habitant d'une commune fusionnée, il faut :\n- faire la moyenne des revenus par habitant des anciennes communes\n+ additionner les revenus totaux, additionner les habitants, puis diviser\n- prendre le revenu par habitant de la plus grande des anciennes communes\n> Le rapport des sommes est une moyenne pondérée par la population. La moyenne simple donnerait le même poids à Borsbeek qu'à Anvers.\n? Pourquoi Anvers est-elle un piège ?\n- Elle n'a pas de prix médian\n- Elle n'apparaît dans aucun des deux fichiers\n+ Son code est le même dans les deux fichiers, mais ne désigne pas le même territoire\n> Anvers a gardé le code 11002 en absorbant Borsbeek. La fusion des tables « réussit », mais avec le revenu et la population de l'ancienne Anvers.\n:oral\n? P
