<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Atelier ECGEB352</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Mise en page : sommaire fixe à gauche, colonne de lecture étroite (≈ 70 caractères),
   outils interactifs qui débordent légèrement de la colonne. Encre bleu nuit sur gris froid ;
   un seul accent (encre bleue) ; les couleurs vives sont réservées aux données. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f7f8fa; --surface-3: #eceff3;
  --ink: #0f1b2d; --ink-2: #3f4b5e; --muted: #6b7687; --line: #dfe3ea; --line-2: #c6cdd8;
  --accent: #2747c9; --accent-ink: #1c3394; --accent-soft: #e9edfc; --on-accent: #ffffff;
  --gpt: #0d7a5f; --gpt-soft: #e2f3ee; --claude: #b4531a; --claude-soft: #f9ece2;
  --ok: #0a6b0a; --ok-soft: #e3f3e3; --ok-mark: #0ca30c;
  --warn: #7a4f00; --warn-soft: #fdf2d6; --warn-mark: #fab219;
  --bad: #a82424; --bad-soft: #fbe7e7; --bad-mark: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s-mute: #9aa3b0;
  --s1-soft: rgba(42,120,214,.12); --s2-soft: rgba(235,104,52,.12); --s3-soft: rgba(27,175,122,.14);
  --grid: #e7eaef; --axis: #c3cad4;
  --code-bg: #f1f3f7; --tok-com: #6b7687; --tok-str: #0d7a5f; --tok-num: #b4531a; --tok-fn: #2747c9;
  --ombre: 0 1px 2px rgba(15,27,45,.06), 0 6px 20px rgba(15,27,45,.07);
  --f-texte: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-titre: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --r: 8px; --r-s: 5px; --nav-l: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1016; --surface: #151a22; --surface-2: #1a2029; --surface-3: #212835;
    --ink: #e7ebf1; --ink-2: #b5bdca; --muted: #8791a2; --line: #262d39; --line-2: #37414f;
    --accent: #8ea6ff; --accent-ink: #b6c5ff; --accent-soft: #1b2548; --on-accent: #0c1016;
    --gpt: #4fc4a6; --gpt-soft: #12302a; --claude: #ee9960; --claude-soft: #35210f;
    --ok: #6fd96f; --ok-soft: #12301a; --ok-mark: #0ca30c;
    --warn: #f5c451; --warn-soft: #33270a; --warn-mark: #fab219;
    --bad: #f39a9a; --bad-soft: #3a1717; --bad-mark: #d03b3b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-mute: #6c7584;
    --s1-soft: rgba(57,135,229,.18); --s2-soft: rgba(217,89,38,.18); --s3-soft: rgba(25,158,112,.2);
    --grid: #232a35; --axis: #3a4350;
    --code-bg: #10151c; --tok-com: #8791a2; --tok-str: #4fc4a6; --tok-num: #ee9960; --tok-fn: #8ea6ff;
    --ombre: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1016; --surface: #151a22; --surface-2: #1a2029; --surface-3: #212835;
  --ink: #e7ebf1; --ink-2: #b5bdca; --muted: #8791a2; --line: #262d39; --line-2: #37414f;
  --accent: #8ea6ff; --accent-ink: #b6c5ff; --accent-soft: #1b2548; --on-accent: #0c1016;
  --gpt: #4fc4a6; --gpt-soft: #12302a; --claude: #ee9960; --claude-soft: #35210f;
  --ok: #6fd96f; --ok-soft: #12301a; --ok-mark: #0ca30c;
  --warn: #f5c451; --warn-soft: #33270a; --warn-mark: #fab219;
  --bad: #f39a9a; --bad-soft: #3a1717; --bad-mark: #d03b3b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-mute: #6c7584;
  --s1-soft: rgba(57,135,229,.18); --s2-soft: rgba(217,89,38,.18); --s3-soft: rgba(25,158,112,.2);
  --grid: #232a35; --axis: #3a4350;
  --code-bg: #10151c; --tok-com: #8791a2; --tok-str: #4fc4a6; --tok-num: #ee9960; --tok-fn: #8ea6ff;
  --ombre: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-texte); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ------------------------------------------------------------- structure */
.app { display: grid; grid-template-columns: var(--nav-l) minmax(0, 1fr); min-height: 100vh; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px;
  padding: 18px 14px 14px max(14px, env(safe-area-inset-left, 0px)); z-index: 20; }
.colonne { min-width: 0; display: flex; flex-direction: column; }
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 12px; min-height: 52px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.vue { width: 100%; max-width: 900px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.bouton-icone { display: none; width: 38px; height: 38px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-s); align-items: center; justify-content: center; cursor: pointer; flex: none; }
.voile { position: fixed; inset: 0; background: rgba(8,12,20,.45); z-index: 15; }
.fil { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fil a { color: var(--ink-2); text-decoration: none; } .fil a:hover { text-decoration: underline; }
.fil .sep { margin: 0 6px; color: var(--line-2); }
.progression { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); text-decoration: none; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-variant-numeric: tabular-nums; }
.progression .jauge { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.progression .jauge i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); height: auto; transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--ombre); padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .nav.ouvert { transform: none; }
  .bouton-icone { display: inline-flex; }
}

/* --------------------------------------------------------------- sommaire */
.marque { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); padding: 2px 4px; }
.marque-sigle { flex: none; width: 40px; height: 40px; display: grid; place-items: center; background: var(--ink); color: var(--bg); border-radius: var(--r); font: italic 600 22px/1 var(--f-math); padding-top: 4px; }
.marque-texte { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.marque-texte strong { font: 600 16px/1.2 var(--f-titre); letter-spacing: -.01em; }
.marque-texte small { font-size: 12px; color: var(--muted); }
.recherche { position: relative; }
.recherche input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface-2); font-size: 14px; }
.recherche-resultats { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-s); box-shadow: var(--ombre); max-height: 60vh; overflow: auto; z-index: 5; }
.recherche-resultats a { display: block; padding: 8px 10px; text-decoration: none; color: var(--ink); font-size: 13.5px; border-bottom: 1px solid var(--line); }
.recherche-resultats a:last-child { border-bottom: 0; }
.recherche-resultats a:hover, .recherche-resultats a:focus { background: var(--accent-soft); }
.recherche-resultats small { display: block; color: var(--muted); font-size: 12px; }
.recherche-resultats .vide { padding: 10px; color: var(--muted); font-size: 13.5px; }
#nav-liste { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-lien { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 500; }
.nav-lien:hover { background: var(--surface-3); color: var(--ink); }
.nav-lien.actif { background: var(--accent-soft); color: var(--accent-ink); }
.nav-lien .pico { flex: none; width: 22px; text-align: center; font: 600 13px/1 var(--f-code); color: var(--muted); }
.nav-lien.actif .pico { color: var(--accent); }
.nav-titre { margin: 14px 8px 4px; font: 600 11px/1.2 var(--f-texte); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav-partie > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-s); font-size: 14.5px; font-weight: 600; color: var(--ink); }
.nav-partie > summary::-webkit-details-marker { display: none; }
.nav-partie > summary:hover { background: var(--surface-3); }
.nav-partie > summary .num { flex: none; width: 22px; height: 22px; border-radius: 4px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 600 12px/1 var(--f-titre); }
.nav-partie > summary .compte { margin-left: auto; font: 500 12px/1 var(--f-code); color: var(--muted); }
.nav-partie > summary .chevron { flex: none; width: 10px; height: 10px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; margin-right: 3px; }
.nav-partie[open] > summary .chevron { transform: rotate(45deg); }
.nav-questions { display: flex; flex-direction: column; margin: 2px 0 6px 18px; border-left: 1px solid var(--line); }
.nav-sec { margin: 8px 0 2px 12px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.nav-q { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--ink-2); text-decoration: none; font-size: 13.5px; line-height: 1.35; }
.nav-q:hover { color: var(--ink); background: var(--surface-2); }
.nav-q.actif { border-left-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav-q .n { flex: none; font: 500 12px/1.4 var(--f-code); color: var(--muted); min-width: 30px; }
.nav-q .etat { flex: none; margin-left: auto; width: 14px; height: 14px; }
.nav-q.fait .n { color: var(--ok); }
.nav-pied { border-top: 1px solid var(--line); padding-top: 10px; }
.sauvegarde { font-size: 12px; color: var(--muted); line-height: 1.4; }
.sauvegarde b { color: var(--ink-2); font-weight: 600; }

/* ------------------------------------------------------------ typographie */
.vue h1 { font: 700 clamp(26px, 4.2vw, 36px)/1.14 var(--f-titre); letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
.vue h2 { font: 600 23px/1.25 var(--f-titre); letter-spacing: -.012em; margin: 44px 0 12px; text-wrap: balance; }
.vue h3 { font: 600 18.5px/1.3 var(--f-titre); margin: 30px 0 8px; text-wrap: balance; }
.vue h4 { font: 600 15.5px/1.35 var(--f-texte); margin: 22px 0 6px; }
.vue p, .vue li { font-size: 16.5px; line-height: 1.65; }
.vue p { margin: 0 0 14px; max-width: 72ch; }
.vue ul, .vue ol { margin: 0 0 14px; padding-left: 22px; max-width: 72ch; }
.vue li { margin-bottom: 5px; } .vue li > ul, .vue li > ol { margin-top: 5px; }
.vue strong { font-weight: 600; }
.chapo { font-size: 18.5px !important; line-height: 1.55 !important; color: var(--ink-2); max-width: 66ch !important; }
.surtitre { font: 600 12px/1.2 var(--f-texte); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
code { font: 500 .88em var(--f-code); background: var(--code-bg); padding: .1em .36em; border-radius: 4px; overflow-wrap: anywhere; }
.math { font-family: var(--f-math); font-size: 1.08em; white-space: nowrap; }
.math i { font-style: italic; }
.math .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .18em; line-height: 1.25; }
.math .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .3em .05em; }
.math .frac > span:last-child { padding: .05em .3em 0; }
.math .chap { position: relative; display: inline-block; }
.math .chap::before { content: "^"; position: absolute; left: 50%; top: -.52em; transform: translateX(-50%); font-style: normal; font-size: .8em; }
.math .barre-h { text-decoration: overline; }
.math .rac { border-top: 1px solid currentColor; padding: 0 .12em; margin-left: -.02em; }
.math sub, .math sup { font-size: .72em; line-height: 0; }
.equation { display: block; overflow-x: auto; overflow-y: hidden; padding: 14px 4px; margin: 4px 0 16px; text-align: center; font-size: 1.12em; }
.equation .math { font-size: 1.12em; }
blockquote { margin: 0 0 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: 16.5px; }
blockquote p:last-child { margin-bottom: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 34px 0; }
.terme { border-bottom: 1px dotted var(--muted); cursor: help; background: none; padding: 0; border-top: 0; border-left: 0; border-right: 0; color: inherit; font: inherit; }
.terme:hover { border-bottom-color: var(--accent); color: var(--accent-ink); }

/* ----------------------------------------------------------------- tables */
.table-boite { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.4; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 13px; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.d, th.d { text-align: right; white-space: nowrap; } td.c, th.c { text-align: center; }
td code { font-size: .86em; }

/* ------------------------------------------------------------------- code */
pre.code { margin: 0 0 16px; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; font: 400 13.5px/1.6 var(--f-code); tab-size: 2; }
pre.code code { background: none; padding: 0; font: inherit; overflow-wrap: normal; }
pre.code .com { color: var(--tok-com); font-style: italic; } pre.code .str { color: var(--tok-str); }
pre.code .num { color: var(--tok-num); } pre.code .fn { color: var(--tok-fn); }
pre.sortie { background: var(--surface); border-style: dashed; color: var(--ink-2); }

/* --------------------------------------------------------------- encadrés */
.encadre { margin: 0 0 18px; padding: 14px 16px 2px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.encadre > .etiquette { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 var(--f-texte); letter-spacing: .07em; text-transform: uppercase; margin: 0 0 9px; padding: 4px 8px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); }
.encadre > .etiquette svg { width: 13px; height: 13px; flex: none; }
.encadre.cle { background: var(--accent-soft); border-color: transparent; } .encadre.cle > .etiquette { background: var(--accent); color: var(--on-accent); }
.encadre.piege { background: var(--bad-soft); border-color: transparent; } .encadre.piege > .etiquette { background: var(--bad-mark); color: #fff; }
.encadre.astuce { background: var(--warn-soft); border-color: transparent; } .encadre.astuce > .etiquette { background: var(--warn-mark); color: #0b0b0b; }
.encadre.verif { background: var(--ok-soft); border-color: transparent; } .encadre.verif > .etiquette { background: var(--ok-mark); color: #fff; }
.encadre p, .encadre li { font-size: 15.5px; }
details.plus { margin: 0 0 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.plus > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 9px; }
details.plus > summary::-webkit-details-marker { display: none; }
details.plus > summary::before { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.plus[open] > summary::before { transform: rotate(45deg); }
details.plus > .interieur { padding: 4px 16px 4px; border-top: 1px solid var(--line); }
details.plus > .interieur > :first-child { margin-top: 12px; }

/* ---------------------------------------------------------------- boutons */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink); line-height: 1.3; }
.btn:hover { border-color: var(--ink-2); color: var(--ink); }
.btn.plein { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.plein:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--on-accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.petit { padding: 4px 9px; font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface-2); padding: 2px; gap: 2px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; padding: 4px 10px; font-size: 13.5px; border-radius: 3px; color: var(--ink-2); white-space: nowrap; }
.seg input:checked + span { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line-2); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.puce { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; color: var(--ink-2); text-decoration: none; }
a.puce:hover { border-color: var(--accent); color: var(--accent-ink); }

/* ------------------------------------------------------- page d'accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 26px; }
.grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 0 0 22px; }
.carte { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 0; }
a.carte:hover { border-color: var(--accent); color: var(--ink); }
.carte .num { font: 700 13px/1 var(--f-titre); color: var(--muted); letter-spacing: .06em; }
.carte h3 { margin: 0; font: 600 17px/1.25 var(--f-titre); }
.carte p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }

window.__CONTENU = {"accueil":"# Comprendre, refaire et défendre le travail d'économétrie\n\n>> Trois enquêtes, 41 questions, 141 sous-questions. Pour chacune : la réponse, le raisonnement expliqué depuis zéro, les chiffres recalculés sur tes fichiers, ce qu'ont fait ChatGPT et Claude, et un espace pour écrire ta propre version.\n\n{{w:reprise}}\n\n## Les trois enquêtes\n\n{{w:cartes-parties}}\n\n## Le fil rouge : de l'association à la cause\n\nLes trois parties posent la même question de fond : **quand a-t-on le droit de dire qu'une chose en cause une autre ?** Chaque partie utilise un outil plus ambitieux que la précédente.\n\n| Partie | Ce qu'on compare | L'outil | Ce qu'on a le droit de conclure |\n|---|---|---|---|\n| 1. Communes belges | Des communes riches et des communes pauvres, la même année | Régression (MCO), logarithmes, indicatrices | Une **association** : les communes plus riches ont des maisons plus chères. Pas un effet causal. |\n| 2. Mères américaines | Des mères dont les deux premiers enfants sont de même sexe ou non | Variables instrumentales (VI, 2SLS) | Un **effet causal**, mais seulement si l'instrument est valide, et seulement pour certaines mères. |\n| 3. Localités burkinabè | L'évolution de localités électrifiées tôt et de localités électrifiées tard | Double différence, effets fixes | Un **effet causal**, si les deux groupes auraient évolué de la même façon sans le réseau. |\n\nSi tu retiens cela, tu as déjà la colonne vertébrale de l'oral : dans chaque partie, on te demandera *ce que tu mesures*, *à quelle condition c'est un effet causal*, et *ce qui pourrait fausser le résultat*.\n\n## Comment une question est présentée\n\nChaque sous-question suit le même plan, toujours dans le même ordre.\n\n| Bloc | À quoi il sert |\n|---|---|\n| **La réponse en bref** | Ce que tu dois pouvoir dire en deux phrases, chiffre compris. |\n| **Comprendre pas à pas** | Le raisonnement sans prérequis : d'où vient l'idée, pourquoi cette formule, comment lire le résultat. Les mots soulignés en pointillés ouvrent leur définition. |\n| **Les chiffres** | Les tableaux et les valeurs, tels que R les produit sur tes fichiers. |\n| **Le code R** | Les lignes du script qui donnent ces chiffres, commentées une par une. |\n| **ChatGPT et Claude** | Ce que chacun a fait, là où ils diffèrent, et un conseil argumenté. Quand les deux sont d'accord, c'est dit en une ligne. |\n| **Ma version pour le rapport** | Tu coches le raisonnement qui te convainc, tu le réécris avec tes mots, tu coches « je sais l'expliquer ». Tout est enregistré. |\n\nBeaucoup de questions contiennent en plus un **outil interactif** : un graphique construit sur les vraies données, que tu peux manipuler pour voir ce que fait une hypothèse ou un choix de méthode.\n\n## Par où commencer\n\n1. **Tu pars de zéro ?** Lis d'abord [les bases](#bases) : dix leçons courtes, dans l'ordre, avec un outil à manipuler dans presque chacune. Compte une heure et demie.\n2. **Avance partie par partie**, question par question. Ne saute pas la partie 1 : elle installe tout le vocabulaire (coefficient, erreur-type, logarithme, biais de variable omise).\n3. **À chaque sous-question, écris ta version.** C'est le meilleur test : si tu n'arrives pas à la reformuler sans regarder, relis le bloc « Comprendre pas à pas ».\n4. **Refais le code** avec l'[atelier R](#atelier), en comparant tes résultats aux valeurs de contrôle.\n5. **Rassemble** tes choix et tes textes dans [Mon rapport](#choix), puis exporte-les.\n6. **Entraîne-toi pour l'oral** avec les [cartes de questions](#oral).\n\n## Ce qui a été vérifié pour construire cet atelier\n\n:::verif Vérifications faites sur tes fichiers\n- **Les deux scripts R tournent du début à la fin** sans erreur (R 4.3.3) et donnent **les mêmes chiffres** sur tous les résultats principaux : 551 communes, élasticités 1,444 et 1,608, effet 2SLS de −5,46 semaines, double différence de 0,380.\n- **Les outils interactifs recalculent tout en direct** à partir des données réelles. Leurs résultats sont comparés automatiquement à ceux de R (48 contrôles, tous identiques).\n- **Une erreur de date commune aux deux versions** : la fusion de Bastogne et Bertogne a pris effet le **2 décembre 2024**, et non le 1er (voir la question 1.1).\n- **Un chiffre que je n'ai pas pu vérifier** : la valeur du tableau 4 de l'article sur le Burkina Faso (question 3.4 c). ChatGPT donne 0,396 ; Claude dit ne pas avoir pu lire le tableau. Tu dois la lire toi-même dans ta copie de l'article.\n- **Un piège technique** : les deux scripts échouent dès la lecture des fichiers si la session R n'est pas en UTF-8. Détails dans l'atelier R.\n:::\n\n## La consigne du cours\n\n:::note À garder en tête\nL'énoncé précise que l'usage d'outils d'intelligence artificielle n'est pas autorisé pour ce travail, que chaque membre du groupe doit pouvoir expliquer le code et l'ensemble du travail, et qu'un examen oral par groupe suit la remise. Cet atelier est construit pour que tu comprennes la matière et puisses tout refaire et tout expliquer toi-même. Ce que tu remets reste ta décision et ta responsabilité.\n:::\n","bases":"# Les bases, depuis zéro\n\n>> Dix leçons courtes, dans l'ordre, pour comprendre tout le vocabulaire du travail sans aucun prérequis. Chaque leçon s'appuie sur les vraies données du travail.\n\n:::cle Comment lire ces leçons\nNe cherche pas à tout mémoriser. À la fin de chaque leçon, vérifie seulement que tu sais répondre à la question posée dans l'encadré « Tu dois savoir dire ». Tu reviendras ici depuis les questions du travail, par les liens « À revoir avant ».\n:::\n\n#L donnees | Données, variables, moyenne et médiane | 6 min\n>> Avant toute régression, il faut savoir ce qu'est une ligne du tableau. C'est la première chose qu'on te demandera à l'oral, et c'est la source de beaucoup d'erreurs.\n\n### Une ligne, une colonne\n\nUn jeu de données est un tableau. Chaque **ligne** est une [[observation]] : une commune, une mère, une localité observée une année donnée. Ce que représente une ligne s'appelle l'[[unité statistique]]. Chaque **colonne** est une **variable** : une caractéristique mesurée pour chaque observation (le prix médian, le revenu par habitant, le nombre d'enfants).\n\n| Partie | Une ligne = | Nombre de lignes | Exemples de variables |\n|---|---|--:|---|\n| 1 | une commune belge en 2023 | 551 | `prix`, `rev_hab`, `region` |\n| 2 | une mère américaine au recensement de 1980 | 254 654 | `work`, `morekids`, `age` |\n| 3 | une localité burkinabè, une année donnée | 2 970 | `nl_extensive`, `year`, `treated` |\n\nDans la partie 3, la même localité revient sur plusieurs lignes, une par année : on appelle cela un [[panel]]. Compter les lignes et compter les localités ne donne donc pas le même nombre (2 970 lignes, 297 localités).\n\n### Résumer une variable\n\n- La **moyenne** additionne toutes les valeurs et divise par leur nombre. Elle est tirée par les valeurs extrêmes.\n- La **[[médiane]]** est la valeur du milieu quand on range les observations par ordre croissant : la moitié est en dessous, la moitié au-dessus. Elle résiste aux valeurs extrêmes.\n- Les **quartiles** coupent les observations en quatre : le premier quartile (p25) laisse un quart des valeurs sous lui, le troisième (p75) trois quarts. L'[[écart interquartile]] p75 − p25 mesure la dispersion de la moitié centrale.\n- L'**écart-type** mesure la dispersion autour de la moyenne, dans l'unité de la variable.\n\n:::ex Dans le travail\nLe prix médian communal vaut en moyenne 296 148 €, mais sa médiane est de 285 000 €. La moyenne est plus haute parce que quelques communes très chères (Ixelles, 840 000 €) la tirent vers le haut. Pour le nombre de ventes, l'écart est énorme : moyenne 156, médiane 108, à cause d'Anvers (2 729 ventes).\n:::\n\n:::piege Deux médianes à ne pas confondre\nDans la partie 1, la variable `prix` est déjà une médiane : celle des maisons vendues dans la commune. Quand on calcule ensuite « la médiane de `prix` », on prend la médiane, entre communes, de ces médianes communales. Ce n'est pas le prix médian d'une maison en Belgique : une petite commune pèse autant qu'Anvers.\n:::\n\n:::cle Tu dois savoir dire\nPour chaque partie : que représente une ligne ? Combien y en a-t-il ? Quelle est la différence entre une moyenne et une médiane ?\n:::\n\n#L causalite | Corrélation n'est pas causalité | 7 min\n>> C'est l'idée la plus importante du travail. Les trois parties tournent autour d'elle.\n\n### Deux phrases qui ne veulent pas dire la même chose\n\n- « Les communes où les habitants sont plus riches ont des maisons plus chères. » C'est une **association** (ou corrélation) : deux choses varient ensemble.\n- « Si le revenu des habitants d'une commune augmentait, le prix des maisons monterait. » C'est une affirmation **causale** : on prétend savoir ce qui se passerait si on changeait une chose en laissant tout le reste identique.\n\nLes données montrent directement la première. La seconde demande une hypothèse supplémentaire, qu'il faut énoncer et défendre.\n\n### Trois raisons pour lesquelles une association n'est pas un effet\n\n1. **Un facteur caché agit sur les deux.** Une commune proche de Bruxelles, verte et bien desservie attire des ménages aisés *et* a des maisons chères. Le revenu et le prix montent ensemble sans que l'un cause l'autre. C'est un [[facteur de confusion]], et le biais qu'il crée s'appelle le [[biais de variable omise]].\n2. **La causalité va dans l'autre sens.** Des maisons chères empêchent les ménages modestes de s'installer : c'est le prix qui « choisit » le revenu des habitants. On parle de [[causalité inverse]].\n3. **Les groupes comparés se sont formés eux-mêmes.** Les mères de trois enfants ne ressemblent pas aux mères de deux enfants : elles ont choisi d'en avoir un de plus. C'est un [[biais de sélection]].\n\n{{w:dag jeu=generique titre=\"Le schéma du facteur caché\"}}\n\n### Les trois parties du travail, relues avec cette idée\n\n| Partie | Ce qu'on voudrait savoir | Le facteur caché | La parade |\n|---|---|---|---|\n| 1 | L'effet du revenu sur les prix | Localisation, cadre de vie, emplois | Aucune : on conclut à une association (question 1.18). |\n| 2 | L'effet d'un 3ᵉ enfant sur le travail de la mère | Préférences, carrière, revenu du conjoint | Un **instrument** : le sexe des deux premiers enfants, dû au hasard. |\n| 3 | L'effet du réseau électrique sur une localité | Taille, proximité du réseau | La **double différence** : comparer des évolutions, pas des niveaux. |\n\n:::cle Tu dois savoir dire\nPourquoi comparer deux groupes ne suffit pas à mesurer un effet, avec un exemple concret pour chaque partie.\n:::\n\n#L mco | La régression : une droite au milieu d'un nuage | 10 min\n>> La régression linéaire résume la relation entre deux variables par une droite. Presque tout le travail en découle.\n\n### L'idée\n\nOn dispose, pour chaque commune, de son revenu par habitant (x) et de son prix médian (y). On cherche la droite qui passe « au mieux » au milieu du nuage de points :\n\n$$ y_{i} = β₀ + β₁ x_{i} + u_{i} $$\n\n- $y$ est la [[variable dépendante]] (ce qu'on explique), $x$ le [[régresseur]] (ce qui explique).\n- $β₁$ est la **pente** : de combien y change, en moyenne, quand x augmente d'une unité.\n- $β₀$ est la **constante** : la valeur de y prédite quand x vaut zéro. Elle n'a souvent aucun sens concret (une commune au revenu nul n'existe pas).\n- $u$ est le [[terme d'erreur]] : tout ce qui fait varier y en dehors de x.\n\n### « Au mieux », c'est-à-dire ?\n\nPour chaque commune, la droite fait une erreur de prédiction, le [[résidu]] : prix observé moins prix prédit. La méthode des **moindres carrés ordinaires** ([[MCO]]) choisit la droite qui rend la **somme des carrés des résidus** la plus petite possible. On met les résidus au carré pour que les erreurs positives et négatives ne se compensent pas, et pour pénaliser davantage les grosses erreurs.\n\n{{w:mco}}\n\nLes valeurs estimées se notent avec un chapeau : $\\hat{β}₁$ est la pente calculée sur *tes* données, alors que $β₁$ est la vraie pente, inconnue.\n\n### Le R²\n\nLe [[R²]] est la part de la dispersion de y que la droite « explique ». Il va de 0 (la droite n'explique rien) à 1 (tous les points sont sur la droite). Deux mises en garde qui reviennent dans le travail :\n\n- un R² élevé ne prouve aucun effet causal ;\n- on ne compare des R² qu'entre modèles qui expliquent **la même variable dépendante** (question 1.8).\n\n### Plusieurs régresseurs\n\nOn peut ajouter d'autres variables : $y = β₀ + β₁ x₁ + β₂ x₂ + u$. Chaque coefficient se lit alors « **toutes choses égales par ailleurs** » : $β₁$ est l'effet de x₁ quand x₂ ne change pas. Dans R, tout cela s'écrit `lm(y ~ x1 + x2, data = base)`.\n\n:::cle Tu dois savoir dire\nCe qu'est un résidu, ce que minimisent les MCO, et comment se lit une pente avec ses unités.\n:::\n\n#L incertitude | Erreur-type, intervalle de confiance et test | 12 min\n>> Une estimation n'est jamais « le » vrai nombre. Cette leçon explique comment on mesure le doute, et comment on lit toutes les sorties de R.\n\n### Pourquoi une estimation est incertaine\n\nTes 551 communes, tes 254 654 mères sont un échantillon parmi d'autres possibles. Avec d'autres observations, tu aurais obtenu une pente un peu différente. L'[[erreur-type]] mesure de combien l'estimation bougerait d'un échantillon à l'autre.\n\n{{w:echantillon}}\n\nDeux choses à retenir de cet outil :\n\n- l'erreur-type **diminue quand le nombre d'observations augmente**, comme $1/\\sqrt{n}$ : quatre fois plus de données, deux fois plus de précision ;\n- R calcule l'erreur-type à partir d'**un seul** échantillon, grâce à une formule. Cette formule repose sur des hypothèses, et c'est pour cela qu'il existe plusieurs erreurs-types (classiques, robustes, groupées) : voir la leçon 7.\n\n### L'intervalle de confiance\n\nOn entoure l'estimation d'une marge : **estimation ± 1,96 × erreur-type**. C'est l'[[intervalle de confiance]] à 95 %. Lecture correcte : la méthode qui construit ces intervalles attrape la vraie valeur 95 fois sur 100.\n\nExemple : élasticité 1,608, erreur-type 0,074. Intervalle : 1,608 ± 1,96 × 0,074 = [1,46 ; 1,75].\n\n### Le test d'hypothèse, toujours en quatre étapes\n\nL'énoncé demande plusieurs fois de dérouler un test « étape par étape ». Le plan est toujours le même.\n\n1. **Hypothèses.** L'[[hypothèse nulle]] H₀ est l'affirmation qu'on met à l'épreuve (souvent « le coefficient vaut zéro », c'est-à-dire « pas d'effet »). H₁ est son contraire.\n2. **Statistique.** Un nombre calculé sur les données. Pour un coefficient : $t = \\frac{\\hat{β}}{\\text{erreur-type}}$, c'est-à-dire « à combien d'erreurs-types de zéro se trouve l'estimation ».\n3. **Loi sous H₀.** Ce que vaudrait cette statistique par pur hasard si H₀ était vraie : une loi normale pour un t, une loi du khi-deux pour certains tests (Breusch-Pagan, Sargan).\n4. **Décision.** Si la statistique tombe là où le hasard l'envoie rarement (au-delà de 1,96 en valeur absolue pour un t au seuil de 5 %), on **rejette** H₀.\n\nLa [[p-valeur]] résume les étapes 3 et 4 : c'est la probabilité d'obtenir une statistique au moins aussi extrême si H₀ était vraie. **p < 0,05 : on rejette H₀ au seuil de 5 %**, et on dit que le coefficient est « significatif ».\n\n{{w:loi test=interaction}}\n\n:::piege Trois erreurs classiques à l'oral\n- **Ne pas rejeter H₀ ne prouve pas H₀.** Un test peut manquer de puissance : il ne voit pas un écart qui existe.\n- **Significatif ne veut pas dire important.** Avec 254 654 mères, un écart minuscule devient significatif.\n- **La p-valeur n'est pas la probabilité que H₀ soit vraie.**\n:::\n\n:::cle Tu dois savoir dire\nCe que mesure une erreur-type, comment on construit un intervalle à 95 %, et les quatre étapes d'un test.\n:::\n\n#L log | Logarithmes, pourcentages et élasticités | 10 min\n>> Le logarithme transforme des écarts en pourcentages. C'est pour cela que la partie 1 l'utilise partout.\n\n### Ce que fait le logarithme\n\nLe logarithme naturel, noté ln (dans R : `log()`), a une propriété qui suffit à tout comprendre : **il transforme les multiplications en additions**.\n\n$$ \\ln(a × b) = \\ln(a) + \\ln(b) \\quad \\text{donc} \\quad \\ln(1,10 × x) − \\ln(x) = \\ln(1,10) ≈ 0,095 $$\n\nAugmenter une valeur de 10 % ajoute toujours à peu près 0,095 à son logarithme, que l'on parte de 100 000 € ou de 800 000 €. En logarithme, **un même écart représente un même pourcentage**.\n\nD'où l'approximation à connaître par cœur : pour une petite variation, **100 × (différence de logarithmes) ≈ variation en pourcentage**.\n\n{{w:logpct}}\n\n### Les quatre formes d'une régression\n\nSelon qu'on met y, x, les deux ou aucun des deux en logarithme, la pente ne se lit pas de la même façon. C'est toute la question 1.6.\n\n| Modèle | Équation | Lecture de β₁ |\n|---|---|---|\n| Niveau-niveau | $y = β₀ + β₁ x$ | x augmente d'**une unité** → y change de β₁ **unités** |\n| Log-log | $\\ln(y) = β₀ + β₁ \\ln(x)$ | x augmente de **1 %** → y change de β₁ **%** : c'est une [[élasticité]] |\n| Log-niveau | $\\ln(y) = β₀ + β₁ x$ | x augmente d'**une unité** → y change d'environ 100 × β₁ **%** : une [[semi-élasticité]] |\n| Niveau-log | $y = β₀ + β₁ \\ln(x)$ | x augmente de **1 %** → y change de β₁ / 100 **unités** |\n\n:::astuce La règle pour ne jamais se tromper\nRegarde de quel côté se trouve le logarithme. Un **y en log** donne un effet **en pourcentage**. Un **x en log** se lit « pour une hausse de **1 %** de x ».\n:::\n\n### Quand l'approximation ne suffit plus\n\nL'approximation « 100 × Δln ≈ % » ne vaut que pour les petites variations. Pour un grand écart, ou pour le coefficient d'une variable indicatrice, on utilise la formule exacte :\n\n$$ \\text{variation exacte en %} = 100 × (\\exp(δ) − 1) $$\n\nExemple du travail : le coefficient de l'indicatrice Bruxelles vaut 0,895. L'approximation donnerait +89,5 % ; la valeur exacte est 100 × (exp(0,895) − 1) = **+144,7 %**.\n\n:::cle Tu dois savoir dire\nPourquoi une différence de logarithmes est un pourcentage, comment lire une élasticité, et quand il faut passer à la formule exacte.\n:::\n\n#L indicatrices | Variables indicatrices et interactions | 8 min\n>> Comment faire entrer une information qualitative (la région, le sexe d'un enfant, « traité ou non ») dans une régression.\n\n### Une variable qui vaut 0 ou 1\n\nUne [[indicatrice]] (ou variable muette, *dummy*) vaut 1 si l'observation appartient à une catégorie, 0 sinon : `Wallonie` vaut 1 pour une commune wallonne, 0 pour les autres.\n\nAvec une **seule indicatrice** comme régresseur, la régression ne fait que comparer deux moyennes :\n\n$$ y = β₀ + β₁ D + u \\quad → \\quad β₀ = \\text{moyenne du groupe } D = 0, \\quad β₁ = \\text{écart entre les deux moyennes} $$\n\nRetiens-le : c'est exactement la question 2.2, et la base de la double différence.\n\n### La catégorie de référence\n\nPour trois régions, on ne met que **deux** indicatrices. La région laissée de côté (la Flandre, dans le travail) est la [[catégorie de référence]] : chaque coefficient mesure un écart **par rapport à elle**. Mettre les trois indicatrices *et* la constante est impossible : leur somme vaut toujours 1, comme la constante. C'est le piège de la [[colinéarité parfaite]] (question 1.9 b).\n\nGéométriquement, des indicatrices ajoutées à un modèle donnent des **droites parallèles** : même pente, hauteurs différentes.\n\n### L'interaction : des pentes différentes\n\nPour autoriser une pente propre à chaque région, on multiplie le régresseur par l'indicatrice. Ce produit s'appelle une [[interaction]] :\n\n$$ \\ln(prix) = β₀ + β₁ \\ln(rev) + δ W + θ (W × \\ln(rev)) + u $$\n\n- en Flandre (W = 0), la pente est $β₁$ ;\n- en Wallonie (W = 1), la pente est $β₁ + θ$.\n\nLe coefficient $θ$ est donc la **différence de pente** entre les deux régions. Tester « les deux pentes sont égales » revient à tester $θ = 0$.\n\n{{w:nuage modele=pentes titre=\"Essaie : droites parallèles, puis une pente par région\"}}\n\n:::cle Tu dois savoir dire\nCe que mesure le coefficient d'une indicatrice, pourquoi on en omet une, et ce que mesure le coefficient d'une interaction.\n:::\n\n#L hypotheses | Quand peut-on faire confiance aux MCO ? | 10 min\n>> Deux hypothèses à distinguer absolument : l'une concerne la justesse du coefficient, l'autre seulement sa précision annoncée.\n\n### L'exogénéité : le coefficient est-il juste ?\n\nPour que $\\hat{β}₁$ mesure bien l'effet de x sur y, il faut que tout ce qui se trouve dans le terme d'erreur soit sans lien avec x :\n\n$$ E(u \\mid x) = 0 $$\n\nEn mots : parmi les observations qui ont le même x, les autres causes de y ne sont en moyenne ni favorables ni défavorables. On dit que x est [[exogène]]. Si un facteur caché influence y *et* est corrélé à x, l'hypothèse tombe : x est [[endogène]], et le coefficient est **biaisé**.\n\n### Le biais de variable omise, avec son signe\n\nSi on oublie une variable z, le coefficient de x absorbe une partie de son effet :\n\n$$ \\text{biais} = (\\text{effet de z sur y}) × (\\text{lien entre z et x}) $$\n\nIl suffit de connaître les deux signes pour connaître le sens du biais.\n\n| Effet de z sur y | Lien entre z et x | Biais |\n|---|---|---|\n| + | + | vers le haut |\n| − | − | vers le haut |\n| + | − | vers le bas |\n| − | + | vers le bas |\n\nLe travail te fait vérifier cette formule au chiffre près à la question 1.12, et l'utiliser pour raisonner aux questions 2.2 et 1.18.\n\n### L'homoscédasticité : l'erreur-type est-elle juste ?\n\nLa formule « classique » de l'erreur-type suppose que la dispersion des erreurs est **la même pour toutes les observations** : c'est l'[[homoscédasticité]]. Si elle varie (par exemple, des erreurs plus dispersées dans les petites communes), on parle d'[[hétéroscédasticité]].\n\n:::cle La distinction à ne jamais rater\n- **Endogénéité** : le **coefficient** est faux. C'est grave et aucune option de R ne le corrige.\n- **Hétéroscédasticité** : le coefficient reste juste, seules les **erreurs-types classiques** sont fausses. On les remplace par des erreurs-types **robustes**.\n:::\n\n### Les erreurs-types robustes HC1\n\nL'énoncé impose partout les erreurs-types « robustes à l'hétéroscédasticité (HC1) ». Elles restent valables que la dispersion soit constante ou non. Dans R :\n\n```r\ncoeftest(m, vcov = vcovHC(m, type = \"HC1\"))\n```\n\nLes coefficients sont **identiques** à ceux de `summary(m)` ; seules les colonnes erreur-type, t et p-valeur changent.\n\n:::piege À l'oral\nNe dis jamais « l'hétéroscédasticité biaise les coefficients ». Elle fausse les erreurs-types classiques, donc les tests et les intervalles. Rien d'autre.\n:::\n\n:::cle Tu dois savoir dire\nLa différence entre un problème de biais et un problème d'erreur-type, et le signe d'un biais de variable omise.\n:::\n\n#L instruments | Variables instrumentales : l'idée | 9 min\n>> Que faire quand la variable qui nous intéresse est endogène ? Trouver quelque chose qui la fait varier « par hasard ».\n\n### Le problème\n\nOn veut l'effet d'un troisième enfant (X) sur le travail de la mère (Y). Mais avoir un troisième enfant est un **choix**, lié aux préférences, à la carrière, au revenu du conjoint : autant de facteurs cachés qui jouent aussi sur le travail. Les MCO sont biaisés.\n\n### La solution\n\nOn cherche une variable Z, l'[[instrument]], qui remplit deux conditions.\n\n1. **Pertinence.** Z fait réellement varier X. Ici : les parents de deux enfants de même sexe ont plus souvent un troisième enfant (41,4 % contre 34,6 %). Cette condition **se vérifie** dans les données.\n2. **Exogénéité.** Z n'est lié à aucun facteur caché, et n'agit sur Y **que par l'intermédiaire de X**. Ici : le sexe d'un enfant est dû au hasard, et il ne devrait pas changer le travail de la mère autrement que par le nombre d'enfants. Cette condition **ne se vérifie pas** directement : elle se défend par des arguments.\n\n{{w:dag schema=vi}}\n\n### Le calcul, en une division\n\nSi Z ne touche Y qu'à travers X, alors :\n\n$$ \\text{effet de X sur Y} = \\frac{\\text{effet de Z sur Y}}{\\text{effet de Z sur X}} = \\frac{\\text{forme réduite}}{\\text{première étape}} $$\n\nDans le travail : −0,426 semaine / 0,0675 = **−6,3 semaines** par enfant supplémentaire. C'est l'[[estimateur de Wald]]. Les doubles moindres carrés ([[2SLS]]) généralisent cette idée quand il y a des variables de contrôle ou plusieurs instruments.\n\n### Le prix à payer\n\nLa VI n'utilise que la petite part des variations de X provoquée par Z. Elle est donc **beaucoup moins précise** que les MCO : dans le travail, l'erreur-type est quinze fois plus grande. On échange du biais contre de l'imprécision.\n\n{{w:simiv}}\n\n:::cle Tu dois savoir dire\nLes deux conditions d'un bon instrument, laquelle se teste, et pourquoi l'estimation par VI est moins précise.\n:::\n\n#L did | Double différence, effets fixes et erreurs groupées | 9 min\n>> Quand on suit les mêmes unités dans le temps, on peut comparer des évolutions plutôt que des niveaux.\n\n### Deux comparaisons naïves, deux biais\n\nDes localités reçoivent l'électricité en 2008-2009 (les « traitées »), d'autres seulement en 2015-2017 (le « groupe de comparaison »).\n\n- **Comparer les deux groupes après** mélange l'effet du réseau avec tout ce qui les distinguait déjà avant.\n- **Comparer les traitées avant et après** mélange l'effet du réseau avec tout ce qui a changé pour tout le monde entre-temps.\n\n### La double différence\n\nOn fait les deux soustractions à la fois :\n\n$$ DD = (\\bar{y}_{T, après} − \\bar{y}_{T, avant}) − (\\bar{y}_{C, après} − \\bar{y}_{C, avant}) $$\n\nLa première différence retire ce qui distingue durablement les groupes ; la seconde retire ce qui change pour tout le monde. Il reste ce qui change **seulement pour les traitées, seulement après**.\n\n{{w:did}}\n\n### L'hypothèse qui porte tout : les tendances parallèles\n\nLa double différence mesure un effet causal **si**, sans électricité, les traitées auraient évolué comme le groupe de comparaison. C'est l'hypothèse des [[tendances parallèles]]. Elle porte sur une situation qu'on n'observe jamais (le [[contrefactuel]]) : on peut la rendre plausible, jamais la prouver.\n\n### Les effets fixes\n\nUn [[effets fixes::effet fixe]] de localité est une constante propre à chaque localité : il absorbe tout ce qui ne change pas dans le temps pour elle (sa taille, sa situation). Un effet fixe d'année absorbe tout ce qui touche toutes les localités la même année. Avec les deux, il ne reste que la variation de la double différence.\n\n{{w:effetsfixes}}\n\n### Les erreurs-types groupées\n\nDix observations de la même localité ne sont pas dix informations indépendantes : ce qui rend une localité plus lumineuse que prévu une année a de bonnes chances de persister l'année suivante. Les [[erreurs-types groupées]] (*clustered*) en tiennent compte ; sans elles, on surestime la précision.\n\n:::cle Tu dois savoir dire\nCe que retire chacune des deux différences, l'hypothèse des tendances parallèles, et pourquoi on groupe les erreurs-types par localité.\n:::\n\n#L lire-r | Lire une sortie de R | 6 min\n>> Toutes les régressions du travail se lisent de la même façon. Autant apprendre le format une fois.\n\n### Une ligne de `coeftest()`\n\n```txt\n                 Estimate Std. Error  t value  Pr(>|t|)\n(Intercept)     -3.613805   0.752053  -4.8053 1.999e-06 ***\nlrev             1.607820   0.074037  21.7165 < 2.2e-16 ***\nregionWallonie  -0.204929   0.016638 -12.3170 < 2.2e-16 ***\nregionBruxelles  0.894930   0.054719  16.3551 < 2.2e-16 ***\n```\n\n| Colonne | Ce que c'est | Sur la ligne `lrev` |\n|---|---|---|\n| `Estimate` | le coefficient estimé | 1,608 : l'élasticité |\n| `Std. Error` | son erreur-type (ici robuste HC1) | 0,074 |\n| `t value` | Estimate / Std. Error | 21,7 : très loin de zéro |\n| `Pr(>\\|t\\|)` | la p-valeur du test « coefficient = 0 » | < 2,2 × 10⁻¹⁶ : pratiquement nulle |\n\n- `(Intercept)` est la constante.\n- `regionWallonie` est l'indicatrice créée automatiquement par R à partir du facteur `region` : le nom de la variable collé au nom de la catégorie.\n- Les étoiles résument la p-valeur : `***` < 0,001, `**` < 0,01, `*` < 0,05.\n- `1.999e-06` se lit 1,999 × 10⁻⁶, soit 0,000002.\n\n:::astuce Trois réflexes\n- L'intervalle de confiance à 95 % n'est pas affiché : c'est Estimate ± 1,96 × Std. Error.\n- Le R² n'est pas dans `coeftest()` : `summary(m)$r.squared`.\n- Vérifie toujours le nombre d'observations avec `nobs(m)` : R supprime sans prévenir les lignes qui ont une valeur manquante.\n:::\n\n:::piege `summary()` n'est pas `coeftest()`\n`summary(lm(...))` affiche les erreurs-types **classiques**. L'énoncé demande les robustes : les coefficients sont les mêmes, mais pas les erreurs-types, ni les t, ni les p-valeurs. Tous les chiffres du rapport doivent venir de `coeftest(m, vcov = vcovHC(m, type = \"HC1\"))`.\n:::\n\n:::cle Tu dois savoir dire\nLire à voix haute n'importe quelle ligne d'une sortie : le coefficient et son unité, son erreur-type, s'il est significatif, et son intervalle de confiance.\n:::\n","p1":"#PART 1 | Revenus et prix des maisons | Régression, logarithmes, indicatrices\n:resultat 1,61 | élasticité du prix au revenu, à région donnée\n:intro\nIntro de la partie.\n#SEC A | Construction\n#Q 1.1 | Construire la base\n:enonce\nÉnoncé global.\n:intro\nIntro question. Voir [[élasticité]].\n:concepts mco\n##a | Compter les communes\n:enonce\nCombien de communes ?\n:court\n**565** et **581**.\n:zero\nExplication.\n\n| Fichier | Communes |\n|---|--:|\n| Ventes | 565 |\n| Fiscal | 581 |\n\n:::piege\nAttention au code `11002`.\n:::\n:code\n```r\nn_distinct(maisons23$refnis)   # 565\n```\n:accord Mêmes chiffres.\n##b | Anti-join\n:court\n13 et 29.\n:gpt\nVersion ChatGPT.\n:claude\nVersion Claude.\n:verdict\nVerdict.\n:opt claude | Option Claude\nTexte de l'option Claude.\n:opt gpt | Option ChatGPT\nTexte de l'option ChatGPT.\n:quiz\n? Combien de communes dans la base ?\n- 565\n+ 551\n- 581\n> Car 14 n'ont pas de prix médian.\n:oral\n? Pourquoi 551 ?\n> Parce que 565 − 14.\n","p2":"#PART 2 | Enfants et travail des mères | Variables instrumentales\n:intro\nIntro.\n#Q 2.1 | Décrire\n:court\nRéponse.\n","p3":"#PART 3 | Électrification au Burkina Faso | Différences-en-différences\n:intro\nIntro.\n#Q 3.1 | Décrire\n:court\nRéponse.\n","comparatif":"## Comparatif\n\n{{w:divergences}}\n","atelier":"## Atelier R\n\nTexte.\n","glossaire":"#T Observation | observations\nUne ligne du tableau de données : une commune, une mère, une localité observée une année donnée.\n@voir b-donnees\n\n#T Unité statistique | unite statistique\nCe que représente une ligne du tableau. Partie 1 : une commune en 2023. Partie 2 : une mère. Partie 3 : une localité une année donnée.\n@voir b-donnees\n\n#T Panel | donnees de panel\nDonnées où les mêmes unités sont observées à plusieurs dates. Dans la partie 3, 574 localités suivies chaque année.\n@voir q-3-1\n\n#T Médiane | mediane, prix median\nValeur qui partage les observations en deux moitiés égales. Peu sensible aux valeurs extrêmes, contrairement à la moyenne.\n@voir b-donnees\n\n#T Écart interquartile | ecart interquartile, EIQ, quartile, quartiles\nDifférence entre le troisième quartile (p75) et le premier (p25). Mesure la dispersion de la moitié centrale des observations.\n@voir q-1-3\n\n#T Coefficient d'asymétrie | asymetrie, skewness\nMesure du déséquilibre entre les deux queues d'une distribution : nul si elle est symétrique, positif si la queue de droite est plus longue, négatif si c'est celle de gauche.\n@voir q-1-4\n\n#T Variable dépendante | variable dependante, variable expliquee\nLa variable qu'on cherche à expliquer, notée y, à gauche du `~` dans une formule R.\n@voir b-mco\n\n#T Régresseur | regresseur, variable explicative, regresseurs\nUne variable placée à droite du `~`, qui sert à expliquer la variable dépendante.\n@voir b-mco\n\n#T MCO | moindres carres ordinaires, moindres carres, OLS\nMoindres carrés ordinaires : méthode qui choisit la droite (ou le plan) rendant la somme des carrés des résidus la plus petite possible. Fonction `lm()` dans R.\n@voir b-mco\n\n#T Coefficient | coefficients, pente, coefficient de pente\nNombre estimé qui mesure de combien la variable dépendante change quand un régresseur augmente d'une unité, les autres régresseurs restant fixes.\n@voir b-mco\n\n#T Constante | intercept, ordonnee a l'origine\nValeur prédite de y quand tous les régresseurs valent zéro. Notée `(Intercept)` dans R. Souvent sans interprétation concrète.\n@voir b-mco\n\n#T Résidu | residu, residus\nÉcart entre la valeur observée et la valeur prédite par le modèle estimé. C'est l'estimation du terme d'erreur, observation par observation.\n@voir b-mco\n\n#T Terme d'erreur | terme d erreur, erreur, u\nTout ce qui fait varier y en dehors des régresseurs du modèle. On ne l'observe pas. Les hypothèses importantes portent sur lui.\n@voir b-hypotheses\n\n#T Valeur ajustée | valeurs ajustees, valeur predite, prediction\nValeur de y prédite par le modèle estimé pour une observation. Valeur observée = valeur ajustée + résidu.\n\n#T R² | r2, r carre, coefficient de determination\nPart de la variance de la variable dépendante expliquée par le modèle, entre 0 et 1. Ne se compare qu'entre modèles ayant la même variable dépendante.\n@voir q-1-8\n\n#T Erreur-type | erreur type, erreurs-types, standard error, ET\nMesure de l'imprécision d'une estimation : de combien elle varierait d'un échantillon à l'autre. Plus elle est petite, plus l'estimation est précise.\n@voir b-incertitude\n\n#T Statistique t | t, t value, statistique de test\nCoefficient divisé par son erreur-type. Indique à combien d'erreurs-types de zéro se trouve l'estimation. Au-delà de 1,96 en valeur absolue : significatif à 5 %.\n@voir b-incertitude\n\n#T p-valeur | p valeur, p-value, valeur p\nProbabilité d'obtenir une statistique au moins aussi extrême que celle observée si l'hypothèse nulle était vraie. Petite p-valeur : les données contredisent H₀.\n@voir b-incertitude\n\n#T Intervalle de confiance | IC, intervalle de confiance a 95\nPlage de valeurs plausibles pour le vrai coefficient : estimation ± 1,96 × erreur-type pour un niveau de 95 %.\n@voir b-incertitude\n\n#T Hypothèse nulle | H0, hypothese nulle\nL'affirmation qu'un test met à l'épreuve, par exemple « le coefficient vaut zéro ». On la rejette si les données la rendent trop peu plausible ; ne pas la rejeter ne la prouve pas.\n@voir b-incertitude\n\n#T Significatif | significativite, significatif a 5\nSe dit d'un coefficient dont on rejette qu'il soit nul, à un seuil donné (5 % en général). Ne dit rien de l'importance pratique de l'effet.\n@voir b-incertitude\n\n#T Puissance d'un test | puissance\nCapacité d'un test à rejeter H₀ quand elle est fausse. Un test peu puissant laisse passer des écarts réels : son non-rejet n'est pas une preuve.\n\n#T Loi du khi-deux | khi-deux, khi2, chi-deux, chi2\nLoi suivie sous H₀ par les statistiques de plusieurs tests du travail (Breusch-Pagan, Sargan). Dépend d'un nombre de degrés de liberté.\n@voir q-1-14\n\n#T Degrés de liberté | degres de liberte, ddl\nParamètre d'une loi de test. Pour un khi-deux : le nombre de restrictions testées. Pour Sargan : nombre d'instruments moins nombre de variables endogènes.\n\n#T Logarithme | log, ln, logarithme naturel\nFonction qui transforme les multiplications en additions. Une différence de logarithmes est approximativement une variation en pourcentage. `log()` dans R.\n@voir b-log\n\n#T Élasticité | elasticite, elasticites\nVariation en pourcentage de y associée à une variation de 1 % de x. C'est la pente d'un modèle log-log.\n@voir q-1-6\n\n#T Semi-élasticité | semi-elasticite\nVariation en pourcentage de y associée à une hausse d'une unité de x. C'est 100 fois la pente d'un modèle log-niveau.\n@voir q-1-6\n\n#T Forme fonctionnelle | formes fonctionnelles\nChoix de mettre ou non la variable dépendante et les régresseurs en logarithme (niveau-niveau, log-log, log-niveau, niveau-log). Chaque forme impose une relation différente.\n@voir q-1-6\n\n#T Indicatrice | indicatrices, variable indicatrice, dummy, variable muette, variable binaire\nVariable qui vaut 1 si l'observation appartient à une catégorie, 0 sinon.\n@voir b-indicatrices\n\n#T Catégorie de référence | categorie de reference, reference\nLa catégorie pour laquelle on ne met pas d'indicatrice. Tous les coefficients d'indicatrices mesurent un écart par rapport à elle.\n@voir q-1-9\n\n#T Colinéarité parfaite | colinearite parfaite, colinearite, piege des variables indicatrices\nSituation où un régresseur est une combinaison exacte des autres. Les MCO n'ont alors pas de solution unique, et R renvoie `NA` pour un coefficient.\n@voir q-1-9\n\n#T Interaction | interactions, terme d'interaction\nProduit de deux régresseurs. Son coefficient mesure de combien l'effet de l'un change selon la valeur de l'autre (une pente différente par région, par exemple).\n@voir q-1-13\n\n#T Centrage | centrer, variable centree\nSoustraire une constante à un régresseur pour déplacer son point zéro. Ne change pas les pentes, mais rend interprétables la constante et les indicatrices.\n@voir q-1-13\n\n#T Exogène | exogene, exogeneite, exogenes\nSe dit d'un régresseur sans lien avec le terme d'erreur : $E(u \\mid x) = 0$. Condition pour que son coefficient ne soit pas biaisé.\n@voir b-hypotheses\n\n#T Endogène | endogene, endogeneite\nSe dit d'un régresseur corrélé au terme d'erreur. Son coefficient MCO est biaisé. Causes : variable omise, causalité inverse, erreur de mesure.\n@voir q-2-2\n\n#T Biais de variable omise | variable omise, biais de variable omise\nBiais d'un coefficient quand on oublie une variable qui influence y et qui est corrélée au régresseur. Signe = (effet de la variable omise sur y) × (son lien avec le régresseur).\n@voir q-1-12\n\n#T Facteur de confusion | confusion, facteur cache\nVariable qui agit à la fois sur la cause supposée et sur le résultat, et crée une association sans lien causal.\n@voir b-causalite\n\n#T Causalité inverse | causalite inverse\nSituation où c'est y qui influence x, et non (seulement) l'inverse.\n@voir q-1-18\n\n#T Biais de sélection | selection, biais de selection\nBiais qui apparaît quand les groupes comparés se sont formés selon des caractéristiques liées au résultat.\n@voir q-2-2\n\n#T Erreur de mesure | erreur de mesure\nÉcart entre la valeur observée d'une variable et sa vraie valeur. Sur y : ajoute du bruit. Sur x : tire le coefficient vers zéro.\n@voir q-1-2\n\n#T Biais d'atténuation | attenuation\nBiais vers zéro d'un coefficient quand le régresseur est mesuré avec une erreur aléatoire.\n@voir q-1-18\n\n#T Homoscédasticité | homoscedasticite\nHypothèse selon laquelle la variance du terme d'erreur est la même pour toutes les observations.\n@voir q-1-14\n\n#T Hétéroscédasticité | heteroscedasticite\nSituation où la variance du terme d'erreur dépend des observations. Les coefficients MCO restent sans biais, mais les erreurs-types classiques sont fausses.\n@voir q-1-14\n\n#T Erreurs-types robustes HC1 | HC1, erreurs-types robustes, robuste, robustes\nErreurs-types valables même en cas d'hétéroscédasticité. HC1 est la version de White multipliée par n/(n − k). Dans R : `vcovHC(m, type = \"HC1\")`.\n@voir b-hypotheses\n\n#T Test de Breusch-Pagan | breusch-pagan, BP\nTest d'homoscédasticité : on régresse les résidus au carré sur des variables, et n × R² suit un khi-deux si la variance est constante.\n@voir q-1-14\n\n#T Moindres carrés pondérés | moindres carres ponderes, WLS\nVariante des MCO qui donne plus de poids aux observations les plus précises. Plus efficace que les MCO en présence d'hétéroscédasticité de forme connue.\n\n#T Variable de contrôle | controle, controles, variable de controle\nVariable ajoutée au modèle pour tenir constant un facteur qui influence y et qui est lié au régresseur d'intérêt.\n@voir q-2-7\n\n#T Mauvais contrôle | mauvais controle, bad control\nVariable qui est elle-même une conséquence du régresseur d'intérêt (ou de y). La contrôler fausse l'interprétation.\n@voir q-1-16\n\n#T Instrument | instruments, variable instrumentale, variables instrumentales, VI\nVariable qui fait varier le régresseur endogène sans être liée au terme d'erreur. Permet d'isoler une variation « propre » du régresseur.\n@voir q-2-3\n\n#T Pertinence | condition de pertinence\nPremière condition d'un instrument : il doit réellement faire varier le régresseur endogène. Se vérifie avec la première étape.\n@voir q-2-4\n\n#T Restriction d'exclusion | exclusion, restriction d exclusion\nCondition selon laquelle l'instrument n'agit sur le résultat que par l'intermédiaire du régresseur endogène. Ne se teste pas directement.\n@voir q-2-3\n\n#T Indépendance | independance de l'instrument\nCondition selon laquelle l'instrument est « comme tiré au sort », sans lien avec les caractéristiques des individus.\n@voir q-2-3\n\n#T Monotonie | condition de monotonie\nHypothèse selon laquelle l'instrument pousse tout le monde dans le même sens (personne ne fait l'inverse). Nécessaire pour interpréter la VI comme un effet local.\n@voir q-2-14\n\n#T Première étape | premiere etape, first stage\nRégression du régresseur endogène sur l'instrument (et les contrôles). Mesure la force de l'instrument.\n@voir q-2-4\n\n#T Forme réduite | forme reduite, reduced form\nRégression directe du résultat sur l'instrument. Mesure l'effet total de l'instrument sur le résultat.\n@voir q-2-6\n\n#T Estimateur de Wald | wald\nAvec un instrument binaire : forme réduite divisée par première étape.\n@voir q-2-6\n\n#T 2SLS | doubles moindres carres, 2sls, tsls\nDoubles moindres carrés : on prédit le régresseur endogène à l'aide des instruments et des contrôles, puis on utilise cette prédiction dans l'équation d'intérêt. Fonction `ivreg()`.\n@voir q-2-8\n\n#T Instrument faible | instruments faibles\nInstrument qui fait très peu varier le régresseur endogène. L'estimation devient imprécise et peu fiable. Repère usuel : F de première étape inférieur à 10.\n@voir q-2-4\n\n#T F de première étape | f de premiere etape, statistique F\nStatistique qui teste que les coefficients des instruments sont nuls dans la première étape. Avec un seul instrument, F = t².\n@voir q-2-4\n\n#T Suridentification | suridentifie, test de sargan, sargan, test J, hansen\nSituation où il y a plus d'instruments que de variables endogènes. On peut alors tester si les instruments donnent des réponses compatibles (test de Sargan ou test J).\n@voir q-2-11\n\n#T Test de Hausman | hausman, wu-hausman, test d'endogeneite\nTest qui compare les MCO et la VI pour savoir si le régresseur est réellement endogène. Suppose que les instruments sont valides.\n@voir q-2-12\n\n#T LATE | effet local, effet local moyen du traitement\nEffet moyen du traitement chez les « compliers » : c'est ce que mesure la VI quand l'effet diffère d'un individu à l'autre.\n@voir q-2-14\n\n#T Compliers | complier\nIndividus dont le traitement dépend de l'instrument : ici, les mères qui ont un troisième enfant parce que les deux premiers sont de même sexe, et pas sinon.\n@voir q-2-14\n\n#T Modèle de probabilité linéaire | probabilite lineaire\nRégression linéaire dont la variable dépendante vaut 0 ou 1. Les coefficients se lisent en points de probabilité.\n@voir q-2-4\n\n#T Marge extensive | marge intensive, marges\nMarge extensive : participer ou non (travailler ou pas, être éclairé ou pas). Marge intensive : combien, parmi ceux qui participent.\n@voir q-2-13\n\n#T Double différence | double difference, differences-en-differences, DiD, DD\nDifférence, entre le groupe traité et le groupe de comparaison, de leurs évolutions avant-après.\n@voir q-3-4\n\n#T Tendances parallèles | tendances paralleles\nHypothèse centrale de la double différence : sans traitement, les deux groupes auraient évolué de la même façon.\n@voir q-3-6\n\n#T Contrefactuel | contrefactuelle\nCe qui serait arrivé au groupe traité s'il n'avait pas été traité. On ne l'observe jamais ; toute la méthode consiste à l'approcher.\n@voir q-3-6\n\n#T Placebo | test placebo\nEstimation refaite là où il ne devrait y avoir aucun effet (une fausse date de traitement, par exemple). Un « effet » placebo signale un problème.\n@voir q-3-6\n\n#T Effets fixes | effet fixe, effets fixes de localite, effets fixes d'annee\nUne constante propre à chaque unité (localité) ou à chaque période (année). Absorbent tout ce qui ne varie pas dans le temps, ou tout ce qui est commun à une année.\n@voir q-3-7\n\n#T TWFE | two-way fixed effects, effets fixes doubles\nRégression avec à la fois des effets fixes d'unité et des effets fixes de période.\n@voir q-3-7\n\n#T Erreurs-types groupées | erreurs-types groupees, cluster, clustered, groupees\nErreurs-types qui autorisent les erreurs d'un même groupe (une même localité) à être corrélées entre elles. Dans R : `vcovCL()`.\n@voir q-3-8\n\n#T Code INS | REFNIS, code refnis, code NIS\nCode à cinq chiffres qui identifie chaque commune belge. C'est la clé qui permet de fusionner les deux fichiers de la partie 1.\n@voir q-1-1\n\n#T anti_join | anti-join, antijoin\nFonction de `dplyr` qui renvoie les lignes d'une table sans correspondant dans une autre. Sert à repérer les communes présentes dans un seul fichier.\n@voir q-1-1\n"};

  A.md = function (src) {
    if (!src) return '';
    const L = String(src).replace(/\r\n?/g, '\n').split('\n');
    let out = '', i = 0;
    while (i < L.length) {
      const l = L[i];
      if (!l.trim()) { i++; continue; }
      if (/^```/.test(l)) {
        const lang = l.slice(3).trim(), corps = [];
        i++;
        while (i < L.length && !/^```\s*$/.test(L[i])) corps.push(L[i++]);
        i++;
        const code = corps.join('\n');
        out += lang === 'r' ? '<pre class="code"><code>' + A.colorierR(code) + '</code></pre>' : '<pre class="code sortie"><code>' + esc(code) + '</code></pre>';
        continue;
      }
      if (/^:::/.test(l)) {
        const m = /^:::(\w+)\s*(.*)$/.exec(l), corps = [];
        i++;
        while (i < L.length && !/^:::\s*$/.test(L[i])) corps.push(L[i++]);
        i++;
        const type = m ? m[1] : 'note', titre = (m && m[2]) || ENCADRES[type] || 'Note';
        out += '<div class="encadre ' + type + '"><div class="etiquette">' + (ICO[type] ? A.ICONES[ICO[type]] : '') + inline(titre) + '</div>' + A.md(corps.join('\n')) + '</div>';
        continue;
      }
      if (/^\+\+\+/.test(l)) {
        const titre = l.slice(3).trim() || 'Aller plus loin', corps = [];
        i++;
        while (i < L.length && !/^\+\+\+\s*$/.test(L[i])) corps.push(L[i++]);
        i++;
        out += '<details class="plus"><summary>' + inline(titre) + '</summary><div class="interieur">' + A.md(corps.join('\n')) + '</div></details>';
        continue;
      }
      if (/^\$\$/.test(l)) {
        let f = l.replace(/^\$\$/, '');
        while (!/\$\$\s*$/.test(f) && i + 1 < L.length) f += ' ' + L[++i];
        i++;
        out += '<div class="equation">' + A.math(f.replace(/\$\$\s*$/, '')) + '</div>';
        continue;
      }
      if (/^\{\{w:/.test(l)) {
        const m = /^\{\{w:([\w-]+)\s*(.*?)\}\}\s*$/.exec(l);
        if (m) {
          const p = {};
          m[2].replace(/([\w-]+)=("[^"]*"|\S+)/g, (_, k, v) => { p[k] = v.replace(/^"|"$/g, ''); return ''; });
          out += '<div class="widget" data-w="' + m[1] + '" data-p="' + esc(JSON.stringify(p)) + '"></div>';
        }
        i++; continue;
      }
      let m;
      if ((m = /^(#{1,4}) (.*)$/.exec(l))) { out += '<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
      if (/^---\s*$/.test(l)) { out += '<hr>'; i++; continue; }
      if (/^\|/.test(l)) { const t = []; while (i < L.length && /^\|/.test(L[i])) t.push(L[i++]); out += tableau(t); continue; }
      if (/^>> /.test(l)) { let t = l.slice(3); i++; while (i < L.length && L[i].trim() && !estDebutBloc(L[i])) t += ' ' + L[i++]; out += '<p class="chapo">' + inline(t) + '</p>'; continue; }
      if (/^> /.test(l)) { const t = []; while (i < L.length && /^>( |$)/.test(L[i])) t.push(L[i++].replace(/^> ?/, '')); out += '<blockquote>' + A.md(t.join('\n')) + '</blockquote>'; continue; }
      if (/^(- |\d+\. )/.test(l)) {
        const t = [];
        while (i < L.length && (/^(- |\d+\. )/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && t.length))) t.push(L[i++]);
        out += liste(t); continue;
      }
      let p = l; i++;
      while (i < L.length && L[i].trim() && !estDebutBloc(L[i])) p += ' ' + L[i++];
      out += '<p>' + inline(p) + '</p>';
    }
    return out;
  };

  // Texte brut (pour la recherche).
  A.brut = (src) => String(src || '').replace(/```[\s\S]*?```/g, ' ').replace(/\{\{w:[^}]*\}\}/g, ' ').replace(/[`*$#>|\\{}\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
})();
