  // ------------------------------------------------------------------ maths
  const GREC = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', theta: 'θ', lambda: 'λ', mu: 'μ', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ', chi: 'χ', Delta: 'Δ', Sigma: 'Σ' };
  const SYM = Object.assign({ cdot: '·', times: '×', approx: '≈', neq: '≠', leq: '≤', geq: '≥', sum: 'Σ', to: '→', pm: '±', infty: '∞', perp: '⊥', ln: 'ln', exp: 'exp', log: 'log', min: 'min', max: 'max', quad: '\u2003', mid: '|' }, GREC);
  function groupe(s, i) {
    let d = 0, j = i;
    for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}') { d--; if (!d) break; } }
    return [s.slice(i + 1, j), j + 1];
  }
  const italiques = (t) => t.replace(/&[a-z]+;|[A-Za-zÀ-ÖØ-öø-ÿ_]+|[α-ω]/g, (w) => (w[0] !== '&' && w.length === 1 && w !== '_') ? '<i>' + w + '</i>' : w);
  function rendu(s) {
    let out = '', buf = '', i = 0;
    const vider = () => { out += italiques(buf); buf = ''; };
    while (i < s.length) {
      const c = s[i];
      if (c === '\\') {
        const m = /^\\([a-zA-Z]+)/.exec(s.slice(i));
        if (m) {
          const nom = m[1]; i += m[0].length;
          if (s[i] === '{' && /^(frac|hat|bar|sqrt|text)$/.test(nom)) {
            vider();
            let a; [a, i] = groupe(s, i);
            if (nom === 'frac') { let b; [b, i] = groupe(s, i); out += '<span class="frac"><span>' + rendu(a) + '</span><span>' + rendu(b) + '</span></span>'; }
            else if (nom === 'hat') out += '<span class="chap">' + rendu(a) + '</span>';
            else if (nom === 'bar') out += '<span class="barre-h">' + rendu(a) + '</span>';
            else if (nom === 'sqrt') out += '√<span class="rac">' + rendu(a) + '</span>';
            else out += a;
            continue;
          }
          buf += SYM[nom] != null ? SYM[nom] : m[0];
          continue;
        }
        // "\_", "\%"… : le caractère suivant est pris tel quel.
        if (i + 1 < s.length) { buf += s[i + 1]; i += 2; continue; }
      }
      if ((c === '_' || c === '^') && s[i + 1] === '{') {
        vider();
        let a; [a, i] = groupe(s, i + 1);
        out += (c === '_' ? '<sub>' : '<sup>') + rendu(a) + (c === '_' ? '</sub>' : '</sup>');
        continue;
      }
      buf += c; i++;
    }
    vider();
    return out;
  }
  A.math = (src) => '<span class="math">' + rendu(esc(src.trim())) + '</span>';

  // ------------------------------------------------------- coloration du R
  const RE_R = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?L?\b)|([A-Za-z_.][A-Za-z0-9_.]*)(?=\s*\()/gm;
  A.colorierR = function (code) {
    let out = '', dernier = 0, m;
    RE_R.lastIndex = 0;
    while ((m = RE_R.exec(code))) {
      out += esc(code.slice(dernier, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : 'fn';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
      dernier = m.index + m[0].length;
    }
    return out + esc(code.slice(dernier));
  };

  // ----------------------------------------------------------------- inline
  function typo(t) {
    return t.replace(/ ([:;?!»%€])/g, '\u00a0$1').replace(/« /g, '«\u00a0').replace(/(\d) (?=\d{3}(?!\d))/g, '$1\u202f');
  }
  function inline(src) {
    const cases = [];
    const garder = (html) => { cases.push(html); return '\u0000' + (cases.length - 1) + '\u0000'; };
    let t = src.replace(/`([^`]+)`/g, (_, c) => garder('<code>' + esc(c) + '</code>'));
    t = t.replace(/\$([^$\n]+)\$/g, (_, m) => garder(A.math(m)));
    t = typo(esc(t));
    t = t.replace(/\[\[([^\]]+?)(?:::([^\]]+))?\]\]/g, (_, terme, aff) => '<button type="button" class="terme" data-terme="' + terme.trim() + '">' + (aff || terme).trim() + '</button>');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) => /^#/.test(url) ? '<a href="' + url + '">' + txt + '</a>' : '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[\s(«\u00a0'’>])\*([^*\s][^*]*?)\*(?=$|[\s.,;:!?)»\u00a0'’<])/g, '$1<em>$2</em>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, n) => cases[+n]);
  }
  A.inline = inline;

  // ------------------------------------------------------------------ blocs
  const ENCADRES = { cle: 'Idée clé', piege: 'Piège', astuce: 'Astuce', verif: 'À vérifier toi-même', ex: 'Exemple', def: 'Définition', note: 'Note', oral: 'À l’oral', image: 'Une image pour comprendre', calcul: 'Le calcul' };
  const ICO = { cle: 'cle', piege: 'piege', verif: 'ok' };
  const estDebutBloc = (l) => /^(```|:::|\+\+\+|\$\$|\{\{w:|#{1,4} |\||> |>> |- |\d+\. |---\s*$)/.test(l);

  function tableau(lignes) {
    // "\|" = barre verticale littérale dans une cellule (ex. la barre de ivreg).
    const cellules = (l) => l.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
    const tete = cellules(lignes[0]);
    let align = tete.map(() => ''), debut = 1;
    if (lignes[1] && /^\|?[\s:|-]+\|?$/.test(lignes[1]) && lignes[1].includes('-')) {
      align = cellules(lignes[1]).map((c) => /^-+:$/.test(c) ? 'd' : /^:-+:$/.test(c) ? 'c' : '');
      debut = 2;
    }
    const cl = (i) => align[i] ? ' class="' + align[i] + '"' : '';
    let h = '<div class="table-boite"><table><thead><tr>' + tete.map((c, i) => '<th' + cl(i) + '>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
    for (let k = debut; k < lignes.length; k++) h += '<tr>' + cellules(lignes[k]).map((c, i) => '<td' + cl(i) + '>' + inline(c) + '</td>').join('') + '</tr>';
    return h + '</tbody></table></div>';
  }

  function liste(lignes) {
    // Un seul niveau d'imbrication (indentation de 2 espaces ou plus).
    const ordonnee = /^\d+\. /.test(lignes[0]);
    const items = [];
    lignes.forEach((l) => {
      const m = /^(?:- |\d+\. )(.*)$/.exec(l);
      if (m) items.push({ texte: m[1], sous: [] });
      else if (items.length) {
        const t = l.replace(/^\s+/, '');
        if (/^(- |\d+\. )/.test(t)) items[items.length - 1].sous.push(t);
        else if (items[items.length - 1].sous.length) items[items.length - 1].sous[items[items.length - 1].sous.length - 1] += ' ' + t;
        else items[items.length - 1].texte += ' ' + t;
      }
    });
    const tag = ordonnee ? 'ol' : 'ul';
    return '<' + tag + '>' + items.map((it) => '<li>' + inline(it.texte) + (it.sous.length ? liste(it.sous) : '') + '</li>').join('') + '</' + tag + '>';
  }

  A.md = function (src) {
    if (!src) return '';
    const L = String(src).replace(/\r\n?/g, '\n').split('\n');
    let out = '', i = 0;
    while (i < L.length) {
      const l = L[i];
      if (!l.trim()) { i++; continue; }
      if (/^```/.test(l)) {
        const lang = l.slice(3).trim(), corps = [];
        i++;
        while (i < L.length && !/^```\s*$/.test(L[i])) corps.push(L[i++]);
        i++;
        const code = corps.join('\n');
        out += lang === 'r' ? '<pre class="code"><code>' + A.colorierR(code) + '</code></pre>' : '<pre class="code sortie"><code>' + esc(code) + '</code></pre>';
        continue;
      }
      if (/^:::/.test(l)) {
        const m = /^:::(\w+)\s*(.*)$/.exec(l), corps = [];
        i++;
        while (i < L.length && !/^:::\s*$/.test(L[i])) corps.push(L[i++]);
        i++;
        const type = m ? m[1] : 'note', titre = (m && m[2]) || ENCADRES[type] || 'Note';
        out += '<div class="encadre ' + type + '"><div class="etiquette">' + (ICO[type] ? A.ICONES[ICO[type]] : '') + inline(titre) + '</div>' + A.md(corps.join('\n')) + '</div>';
        continue;
      }
      if (/^\+\+\+/.test(l)) {
        const titre = l.slice(3).trim() || 'Aller plus loin', corps = [];
        i++;
        while (i < L.length && !/^\+\+\+\s*$/.test(L[i])) corps.push(L[i++]);
        i++;
        out += '<details class="plus"><summary>' + inline(titre) + '</summary><div class="interieur">' + A.md(corps.join('\n')) + '</div></details>';
        continue;
      }
      if (/^\$\$/.test(l)) {
        let f = l.replace(/^\$\$/, '');
        while (!/\$\$\s*$/.test(f) && i + 1 < L.length) f += ' ' + L[++i];
        i++;
        out += '<div class="equation">' + A.math(f.replace(/\$\$\s*$/, '')) + '</div>';
        continue;
      }
      if (/^\{\{w:/.test(l)) {
        const m = /^\{\{w:([\w-]+)\s*(.*?)\}\}\s*$/.exec(l);
        if (m) {
          const p = {};
          m[2].replace(/([\w-]+)=("[^"]*"|\S+)/g, (_, k, v) => { p[k] = v.replace(/^"|"$/g, ''); return ''; });
          out += '<div class="widget" data-w="' + m[1] + '" data-p="' + esc(JSON.stringify(p)) + '"></div>';
        }
        i++; continue;
      }
      let m;
      if ((m = /^(#{1,4}) (.*)$/.exec(l))) { out += '<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
      if (/^---\s*$/.test(l)) { out += '<hr>'; i++; continue; }
      if (/^\|/.test(l)) { const t = []; while (i < L.length && /^\|/.test(L[i])) t.push(L[i++]); out += tableau(t); continue; }
      if (/^>> /.test(l)) { let t = l.slice(3); i++; while (i < L.length && L[i].trim() && !estDebutBloc(L[i])) t += ' ' + L[i++]; out += '<p class="chapo">' + inline(t) + '</p>'; continue; }
      if (/^> /.test(l)) { const t = []; while (i < L.length && /^>( |$)/.test(L[i])) t.push(L[i++].replace(/^> ?/, '')); out += '<blockquote>' + A.md(t.join('\n')) + '</blockquote>'; continue; }
      if (/^(- |\d+\. )/.test(l)) {
        const t = [];
        while (i < L.length && (/^(- |\d+\. )/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && t.length))) t.push(L[i++]);
        out += liste(t); continue;
      }
      let p = l; i++;
      while (i < L.length && L[i].trim() && !estDebutBloc(L[i])) p += ' ' + L[i++];
      out += '<p>' + inline(p) + '</p>';
    }
    return out;
  };

  // Texte brut (pour la recherche).
  A.brut = (src) => String(src || '').replace(/```[\s\S]*?```/g, ' ').replace(/\{\{w:[^}]*\}\}/g, ' ').replace(/[`*$#>|\\{}\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
})();

<script>
// ---- contenu.js ----
// Lit les fichiers de contenu (src/content/*.md) et construit le modèle de l'atelier.
//
//   #PART 1 | Titre | sous-titre        une partie du travail
//   #SEC A | Titre                      une section de l'énoncé
//   #Q 1.6 | Titre court                une question
//   ##a | Titre                         une sous-question (a), (b)…  ("## | Titre" si la question n'en a pas)
//   :champ [arguments]                  un champ ; son texte court jusqu'au prochain marqueur
//
// Champs d'une question  : enonce, intro, concepts, quiz, oral, retenir
// Champs d'une sous-question : enonce, court, zero, res, code, accord, gpt, claude, verdict,
//                              opt <origine> | <titre>, piege, plus
(function () {
  'use strict';
  const A = window.A;
  const M = A.modele = { parties: [], questions: {}, ordre: [], lecons: [], glossaire: {}, alias: {}, pages: {} };
  const DE_QUESTION = { quiz: 1, oral: 1, retenir: 1, concepts: 1, intro: 1 };

  function lirePartie(src) {
    let partie = null, section = null, q = null, sous = null, champ = null, cible = null;
    const fermer = () => { if (champ && cible) { cible[champ.nom] = champ.multi ? (cible[champ.nom] || []).concat([Object.assign({ texte: champ.lignes.join('\n').trim() }, champ.args)]) : champ.lignes.join('\n').trim(); } champ = null; };
    String(src).replace(/\r\n?/g, '\n').split('\n').forEach((l) => {
      let m;
      if ((m = /^#PART (\d+) \| (.*?)(?: \| (.*))?$/.exec(l))) {
        fermer();
        partie = { num: +m[1], id: 'p' + m[1], titre: m[2].trim(), sousTitre: (m[3] || '').trim(), sections: [], questions: [] };
        M.parties.push(partie); q = sous = null; cible = partie; return;
      }
      if ((m = /^#SEC (\w+) \| (.*)$/.exec(l))) { fermer(); section = { id: m[1], titre: m[2].trim(), questions: [] }; partie.sections.push(section); return; }
      if ((m = /^#Q ([\d.]+) \| (.*)$/.exec(l))) {
        fermer();
        q = { id: m[1], route: 'q-' + m[1].replace('.', '-'), titre: m[2].trim(), partie: partie.num, section: section ? section.id : '', sous: [] };
        M.questions[q.id] = q; M.ordre.push(q.id); partie.questions.push(q.id); if (section) section.questions.push(q.id);
        sous = null; cible = q; return;
      }
      if ((m = /^##(\w*) ?\|? ?(.*)$/.exec(l)) && q && !/^###/.test(l)) {
        fermer();
        sous = { id: m[1] || '', titre: (m[2] || '').trim() };
        q.sous.push(sous); cible = sous; return;
      }
      if ((m = /^:(\w+)(?: (.*))?$/.exec(l))) {
        fermer();
        const nom = m[1];
        cible = (q && DE_QUESTION[nom]) ? q : (sous || q || partie);
        if (nom === 'enonce' && sous) cible = sous;
        if (nom === 'opt') {
          const p = (m[2] || '').split('|').map((x) => x.trim());
          champ = { nom: 'opts', multi: true, args: { origine: p[0] || 'mix', titre: p[1] || '' }, lignes: [] };
        } else if (nom === 'resultat') {
          const p = (m[2] || '').split('|').map((x) => x.trim());
          cible.resultat = { valeur: p[0], texte: p[1] || '' };
        } else champ = { nom, lignes: m[2] ? [m[2]] : [] };
        return;
      }
      if (champ) champ.lignes.push(l);
    });
    fermer();
  }

  function lireQuiz(src) {
    const out = []; let cur = null;
    String(src || '').split('\n').forEach((l) => {
      if (/^\? /.test(l)) { cur = { q: l.slice(2).trim(), choix: [], juste: -1, pourquoi: '' }; out.push(cur); }
      else if (cur && /^[-+] /.test(l)) { if (l[0] === '+') cur.juste = cur.choix.length; cur.choix.push(l.slice(2).trim()); }
      else if (cur && /^> ?/.test(l)) cur.pourquoi += (cur.pourquoi ? '\n' : '') + l.replace(/^> ?/, '');
      else if (cur && l.trim() && cur.pourquoi) cur.pourquoi += '\n' + l;
    });
    return out;
  }
  function lireOral(src) {
    const out = []; let cur = null;
    String(src || '').split('\n').forEach((l) => {
      if (/^\? /.test(l)) { cur = { q: l.slice(2).trim(), r: '' }; out.push(cur); }
      else if (cur) cur.r += (cur.r ? '\n' : '') + l.replace(/^> ?/, '');
    });
    return out;
  }

  ['p1', 'p2', 'p3'].forEach((n) => { if (A.C[n]) lirePartie(A.C[n]); });
  M.ordre.forEach((id) => {
    const q = M.questions[id];
    q.quiz = lireQuiz(q.quiz); q.oral = lireOral(q.oral);
    q.concepts = (q.concepts || '').split(',').map((x) => x.trim()).filter(Boolean);
    if (!q.sous.length) q.sous.push({ id: '', titre: '' });
  });

  // Leçons des bases : "#L id | Titre | durée" puis le texte.
  (function () {
    let cur = null;
    String(A.C.bases || '').replace(/\r\n?/g, '\n').split('\n').forEach((l) => {
      const m = /^#L ([\w-]+) \| (.*?)(?: \| (.*))?$/.exec(l);
      if (m) { cur = { id: m[1], route: 'b-' + m[1], titre: m[2].trim(), duree: (m[3] || '').trim(), lignes: [] }; M.lecons.push(cur); }
      else if (cur) cur.lignes.push(l);
      else (M.pages.basesIntro = M.pages.basesIntro || []).push(l);
    });
    M.lecons.forEach((x, i) => { x.texte = x.lignes.join('\n'); x.n = i + 1; delete x.lignes; });
    M.pages.basesIntro = (M.pages.basesIntro || []).join('\n');
  })();

  // Glossaire : "#T terme | alias, alias" puis la définition ; "@voir route" facultatif.
  (function () {
    let cur = null;
    const norm = A.norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/[^a-z0-9]+/g, ' ').trim();
    String(A.C.glossaire || '').replace(/\r\n?/g, '\n').split('\n').forEach((l) => {
      const m = /^#T (.*?)(?: \| (.*))?$/.exec(l);
      if (m) {
        cur = { terme: m[1].trim(), lignes: [], voir: '' };
        M.glossaire[norm(cur.terme)] = cur;
        (m[2] || '').split(',').map((x) => x.trim()).filter(Boolean).forEach((a) => { M.alias[norm(a)] = norm(cur.terme); });
      } else if (cur) { const v = /^@voir (\S+)/.exec(l); if (v) cur.voir = v[1]; else cur.lignes.push(l); }
    });
    Object.keys(M.glossaire).forEach((k) => { const g = M.glossaire[k]; g.def = g.lignes.join('\n').trim(); delete g.lignes; });
    A.definition = (terme) => { const k = norm(terme); return M.glossaire[k] || M.glossaire[M.alias[k]] || null; };
  })();

  A.voisins = function (id) { const i = M.ordre.indexOf(id); return { avant: M.ordre[i - 1] || null, apres: M.ordre[i + 1] || null }; };
  A.cleSous = (q, s) => q.id + (s.id ? s.id : '');
})();

</script>
<script>
// ---- store.js ----
// Sauvegarde des notes, des choix de raisonnement et de la progression.
//  - toujours dans le navigateur (localStorage), pour un affichage immédiat ;
//  - en plus, dans l'espace privé du lecteur quand la page est ouverte comme artifact
//    claude.ai (capacités "db" + "user") : une fiche par question sous data/users/<id>/.
// L'application fonctionne à l'identique sans aucune des deux.
(function () {
  'use strict';
  const A = window.A;
  const CLE = 'atelier-ecgeb352-v1';
  const etat = { q: {}, oral: { t: 0, c: {} }, ui: { t: 0 } };
  const abonnes = [];
  let mode = 'memoire', collection = null;
  const files = {};            // docId -> { enCours, attente, minuteur }

  function lireLocal() {
    try {
      const brut = window.localStorage.getItem(CLE);
      mode = 'local';
      if (!brut) return;
      const d = JSON.parse(brut);
      if (d && typeof d === 'object') { etat.q = d.q || {}; etat.oral = d.oral || etat.oral; etat.ui = d.ui || etat.ui; }
    } catch (e) { mode = 'memoire'; }
  }
  const ecrireLocal = A.debounce(function () {
    try { window.localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* stockage refusé : on continue en mémoire */ }
  }, 250);

  const docId = (qid) => 'q-' + String(qid).replace('.', '-');
  function donneesDe(id) {
    if (id === 'oral') return etat.oral;
    if (id === 'ui') return etat.ui;
    return etat.q[id.slice(2).replace('-', '.')];
  }
  function pousser(id) {
    if (!collection) return;
    const f = files[id] = files[id] || {};
    if (f.enCours) { f.attente = true; return; }
    const d = donneesDe(id);
    if (!d) return;
    f.enCours = collection.doc(id).set(JSON.parse(JSON.stringify(d)))
      .then(function () { f.essais = 0; }, function (e) {
        // Panne passagère : un seul nouvel essai, après un délai aléatoire. La copie du navigateur reste à jour.
        if (e && e.code === 'unavailable') { if (!f.essais) { f.essais = 1; setTimeout(function () { pousser(id); }, 1500 + Math.random() * 1500); } return; }
        // Écriture refusée (lecteur en lecture seule, quota…) : on reste sur le navigateur pour cette visite.
        collection = null; if (mode === 'compte') mode = 'local'; notifier('mode');
      })
      .then(function () { f.enCours = null; if (f.attente && collection) { f.attente = false; pousser(id); } });
  }
  function planifier(id) {
    ecrireLocal();
    if (!collection) return;
    const f = files[id] = files[id] || {};
    clearTimeout(f.minuteur);
    f.minuteur = setTimeout(() => pousser(id), 1200);
  }
  function notifier(quoi) { abonnes.forEach((fn) => { try { fn(quoi); } catch (e) { /* un abonné défaillant ne bloque pas les autres */ } }); }

  async function brancherCompte() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    let db, user;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    let col;
    try { col = db.collection('data/users/' + uid); } catch (e) { return; }
    let instantane;
    try {
      instantane = await Promise.race([col.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('delai')), 10000))]);
    } catch (e) { return; }
    collection = col; mode = 'compte';
    let change = false;
    const vus = {};
    instantane.docs.forEach(function (doc) {
      const d = doc.data(); if (!d) return;
      vus[doc.id] = true;
      const local = donneesDe(doc.id);

    if (!vus.oral && etat.oral.t) pousser('oral');

    notifier(change ? 'charge' : 'mode');
  }

  A.store = {

    mode: () => mode,
    abonner(fn) { abonnes.push(fn); },
    q(qid) { return etat.q[qid] || (etat.q[qid] = { t: 0, fait: false, s: {}, quiz: {} }); },

(function () {

// ---- charts.js ----
// Graphiques SVG dessinés à l'échelle réelle du conteneur (le texte reste lisible sur téléphone).

(function () {

  // Tableau de données sous un graphique (alternative accessible au survol).
  A.vueTable = function (titre, colonnes, lignes) {

  A.animer = function (ms, etape, fin) {
    const reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduit) { etape(1); if (fin) fin(); return; }
    const t0 = performance.now();
    const tic = (t) => { const u = Math.min(1, (t - t0) / ms), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; etape(e); if (u < 1) requestAnimationFrame(tic); else if (fin) fin(); };

  // Gabarit commun d'un widget : titre, aide, commandes, zone graphique, lecture.

<script>
// ---- widgets-bases.js ----
// Outils des « bases » : moindres carrés, erreur-type et intervalle de confiance,
// lecture d'un test (où tombe la statistique ?), logarithmes et pourcentages.
(function () {
  'use strict';
  const A = window.A, h = A.h, S = A.stats, fmt = A.fmt;

  // Données communales partagées par plusieurs outils.
  A.communes = (function () {
    const C = A.D.communes; if (!C) return [];
    const k = {}; C.colonnes.forEach((c, i) => { k[c] = i; });
    return C.lignes.map((l) => ({ nom: l[k.nom], region: l[k.region], prix: l[k.prix], rev: l[k.rev_hab], ventes: l[k.n_ventes], p25: l[k.p25], p75: l[k.p75], napp: l[k.n_app], pop: l[k.pop],
      lprix: Math.log(l[k.prix]), lrev: Math.log(l[k.rev_hab]), W: +(l[k.region] === 'W'), B: +(l[k.region] === 'B') }));
  })();
  A.REG = { F: { nom: 'Flandre', c: 's1', p: 'c1', t: 't1', f: 'f1' }, W: { nom: 'Wallonie', c: 's2', p: 'c2', t: 't2', f: 'f2' }, B: { nom: 'Bruxelles', c: 's3', p: 'c3', t: 't3', f: 'f3' } };

  // ---------------------------------------------------------------- 1. MCO
  A.widgets.mco = function (el) {
    const g = A.gabarit(el, 'Trouve toi-même la droite des moindres carrés', 'Douze communes belges réelles. Règle la **pente** et la **constante** : les traits verticaux sont les **résidus** (l’écart entre le prix observé et le prix prédit par ta droite). La méthode des MCO choisit la droite qui rend la somme de leurs carrés la plus petite possible.');
    const u = A.alea(7), tous = A.communes.filter((c) => c.region !== 'B' && c.ventes > 60), pts = [];
    while (pts.length < 12) { const c = tous[Math.floor(u() * tous.length)]; if (!pts.includes(c)) pts.push(c); }
    const x = pts.map((c) => c.rev / 1000), y = pts.map((c) => c.prix / 1000);
    const m = S.mco(x.map((v) => [1, v]), y), b0 = m.b[0], b1 = m.b[1];
    const etat = { pente: 8, cst: 120 };
    const scr = (c, p) => y.reduce((s, yi, i) => s + Math.pow(yi - c - p * x[i], 2), 0);
    const cPente = A.curseur('Pente (k€ de prix par k€ de revenu)', -5, 40, 0.5, etat.pente, (v) => fmt(v, 1), (v) => { etat.pente = v; dessiner(); });
    const cCst = A.curseur('Constante (k€)', -600, 400, 5, etat.cst, (v) => fmt(v, 0), (v) => { etat.cst = v; dessiner(); });
    const bouton = h('button', { class: 'btn plein', type: 'button', onclick: () => {
      const d = { p: etat.pente, c: etat.cst };
      A.animer(900, (e) => { etat.pente = d.p + (b1 - d.p) * e; etat.cst = d.c + (b0 - d.c) * e; cPente.regler(Math.round(etat.pente * 2) / 2); cCst.regler(Math.round(etat.cst / 5) * 5); dessiner(); });
    } }, 'Laisser les MCO trouver la droite');
    g.commandes.append(cPente, cCst, bouton);
    function dessiner() {
      const G = A.graphe(g.zone, { nom: 'Douze communes, leur prix médian selon le revenu par habitant, et une droite réglable', x: { dom: [19, 33], titre: 'Revenu par habitant (milliers d’euros)' }, y: { dom: [100, 650], titre: 'Prix médian (milliers d’euros)' } }).axes();
      x.forEach((xi, i) => G.segment(xi, y[i], xi, A.clamp(etat.cst + etat.pente * xi, 100, 650), 't2'));

      const P = pts.map((c, i) => ({ x: x[i], y: y[i], c }));
      P.forEach((p) => G.point(p.x, p.y, 'c1', 4.5));
      G.survolProche(P, (p) => [p.c.nom, [['Revenu par habitant', A.eur(p.c.rev)], ['Prix médian', A.eur(p.c.prix)], ['Prix prédit par ta droite', A.eur(1000 * (etat.cst + etat.pente * p.x))], ['Résidu', A.signe(1000 * (p.y - etat.cst - etat.pente * p.x), 0) + ' €']]]);
      const s = scr(etat.cst, etat.pente), smin = scr(b0, b1), sct = y.reduce((t, yi) => t + Math.pow(yi - S.moyenne(y), 2), 0);
      g.lecture.innerHTML = '<p>Somme des carrés des résidus avec ta droite : <b>' + fmt(s, 0) + '</b> — le minimum possible est <b>' + fmt(smin, 0) + '</b>' + (s < smin * 1.02 ? ' : tu y es.' : ' (' + fmt(s / smin, 1) + ' fois plus).') + '</p><p>La droite des MCO pour ces douze communes : prix = ' + fmt(b0, 0) + ' + <b>' + fmt(b1, 1) + '</b> × revenu. Lecture de la pente : une commune dont le revenu par habitant est plus élevé de 1 000 € a, en moyenne, un prix médian plus élevé de ' + fmt(b1 * 1000, 0) + ' €. Le R² vaut ' + fmt(1 - smin / sct, 2) + ' : la droite « explique » ' + fmt(100 * (1 - smin / sct), 0) + ' % des écarts de prix entre ces communes.</p>';
    }
    A.adapter(g.zone, dessiner);
  };

  // ------------------------------------------ 2. erreur-type et intervalle
  A.widgets.echantillon = function (el) {
    const g = A.gabarit(el, 'D’où vient l’erreur-type ? Tire des échantillons', 'On connaît ici la « vérité » : sur les 551 communes, l’élasticité du prix au revenu vaut **1,444**. Imagine que tu ne puisses observer que *n* communes tirées au hasard. Chaque tirage donne une estimation différente : leur dispersion, c’est exactement ce que mesure l’**erreur-type**.');
    const C = A.communes, VRAI = S.mco(C.map((c) => [1, c.lrev]), C.map((c) => c.lprix)).b[1];
    const etat = { n: 60, est: [], dernier: null, couverts: 0 };
    const u = A.alea(2026);
    function tirer(k) {
      for (let r = 0; r < k; r++) {
        const X = [], y = [];
        for (let i = 0; i < etat.n; i++) { const c = C[Math.floor(u() * C.length)]; X.push([1, c.lrev]); y.push(c.lprix); }
        const m = S.mco(X, y); if (!m) continue;
        const b = m.b[1], se = m.seHC1[1], couvre = Math.abs(b - VRAI) <= 1.96 * se;
        etat.est.push(b); etat.dernier = { b, se, couvre }; if (couvre) etat.couverts++;
      }
      dessiner();
    }
    g.commandes.append(
      A.choix('Taille de l’échantillon', [[30, 'n = 30'], [60, 'n = 60'], [150, 'n = 150'], [400, 'n = 400']], etat.n, (v) => { etat.n = +v; etat.est = []; etat.dernier = null; etat.couverts = 0; dessiner(); }),
      h('button', { class: 'btn', type: 'button', onclick: () => tirer(1) }, 'Tirer 1 échantillon'),
      h('button', { class: 'btn plein', type: 'button', onclick: () => tirer(200) }, 'En tirer 200'),
      h('button', { class: 'btn', type: 'button', onclick: () => { etat.est = []; etat.dernier = null; etat.couverts = 0; dessiner(); } }, 'Effacer'));
    function dessiner() {
      const a = 0.2, b = 2.7, nb = 50, pas = (b - a) / nb, cases = new Array(nb).fill(0);
      etat.est.forEach((e) => { const i = Math.floor((e - a) / pas); if (i >= 0 && i < nb) cases[i]++; });
      const hmax = Math.max(6, Math.max.apply(null, cases));
      const G = A.graphe(g.zone, { nom: 'Répartition des élasticités estimées sur des échantillons aléatoires', ratio: 0.46, hmin: 220, x: { dom: [a, b], titre: 'Élasticité estimée sur l’échantillon' }, y: { dom: [0, hmax * 1.25], titre: 'Nombre de tirages' } }).axes();
      const largeur = (G.px(a + pas) - G.px(a)) - 2;
      cases.forEach((c, i) => { if (c) G.barre(a + (i + 0.5) * pas, c, largeur, 'c1'); });
      G.verticale(VRAI, 'tink'); G.texte(VRAI, hmax * 1.25, 'vraie valeur 1,444', { dx: 6, dy: 12 });
      if (etat.dernier) { const d = etat.dernier, yb = hmax * 1.12; G.intervalle(A.clamp(d.b - 1.96 * d.se, a, b), A.clamp(d.b + 1.96 * d.se, a, b), yb, 't2'); G.point(A.clamp(d.b, a, b), yb, 'c2', 4.5); }
      const n = etat.est.length;
      if (!n) { g.lecture.innerHTML = '<p>Tire un premier échantillon de ' + etat.n + ' communes. Le point orange sera son estimation, la barre orange son intervalle de confiance à 95 %.</p>'; return; }
      const d = etat.dernier, sd = n > 1 ? S.ecartType(etat.est) : NaN;
      g.lecture.innerHTML = '<p>Dernier tirage : élasticité estimée <b>' + fmt(d.b, 3) + '</b>, erreur-type calculée par R sur ce seul échantillon <b>' + fmt(d.se, 3) + '</b>, intervalle à 95 % [' + fmt(d.b - 1.96 * d.se, 2) + ' ; ' + fmt(d.b + 1.96 * d.se, 2) + '] — il ' + (d.couvre ? 'contient' : '<b>ne contient pas</b>') + ' la vraie valeur.</p>' +
        (n > 1 ? '<p>Sur ' + fmt(n) + ' tirages : les estimations se dispersent avec un écart-type de <b>' + fmt(sd, 3) + '</b>. C’est cette dispersion que l’erreur-type cherche à deviner à partir d’un seul échantillon. ' + fmt(100 * etat.couverts / n, 0) + ' % des intervalles contiennent la vraie valeur (on en attend environ 95 %).</p>' : '') +
        '<p>Passe à un échantillon plus grand : l’histogramme se resserre. Quatre fois plus d’observations divisent l’erreur-type par deux (elle diminue comme 1/√n).</p>';
    }
    for (let r = 0; r < 80; r++) { const X = [], y = []; for (let i = 0; i < etat.n; i++) { const c = C[Math.floor(u() * C.length)]; X.push([1, c.lrev]); y.push(c.lprix); } const m = S.mco(X, y); if (m) { const couvre = Math.abs(m.b[1] - VRAI) <= 1.96 * m.seHC1[1]; etat.est.push(m.b[1]); etat.dernier = { b: m.b[1], se: m.seHC1[1], couvre }; if (couvre) etat.couverts++; } }
    A.adapter(g.zone, dessiner);
  };

  // ----------------------------------------------- 3. lecture d'un test
  const TESTS = {
    interaction: { nom: '1.13 (b) — élasticités flamande et wallonne égales ?', loi: 'normale', stat: 2.594, h0: 'θ_W = 0 : même élasticité en Flandre et en Wallonie', unite: 't' },
    bp16: { nom: '1.14 (b) — Breusch-Pagan, modèle 1.6, régresseurs', loi: 'khi2', ddl: 1, stat: 82.62, h0: 'variance des erreurs constante (homoscédasticité)', unite: 'LM' },
    bp19: { nom: '1.14 (b) — Breusch-Pagan, modèle 1.9, régresseurs', loi: 'khi2', ddl: 3, stat: 9.26, h0: 'variance des erreurs constante (homoscédasticité)', unite: 'LM' },
    bp19v: { nom: '1.14 (b) — Breusch-Pagan, modèle 1.9, ln(ventes)', loi: 'khi2', ddl: 1, stat: 0.483, h0: 'la variance ne dépend pas du nombre de ventes', unite: 'LM' },
    garcons: { nom: '2.5 (b) — deux garçons = deux filles ?', loi: 'normale', stat: -5.292, h0: 'twoboys et twogirls ont le même coefficient', unite: 't' },
    ecart: { nom: '2.10 (b) — les deux instruments donnent-ils le même effet ?', loi: 'normale', stat: -1.961, h0: 'même effet estimé avec twoboys et avec twogirls', unite: 'z' },
    sargan: { nom: '2.11 — suridentification (Sargan / J)', loi: 'khi2', ddl: 1, stat: 3.856, h0: 'tous les instruments sont exogènes', unite: 'J' },
    hausman: { nom: '2.12 — morekids est-il exogène ? (Hausman)', loi: 'normale', stat: -0.626, h0: 'morekids est exogène (MCO et 2SLS estiment la même chose)', unite: 't' },
    placebo: { nom: '3.6 (c) — double différence placebo', loi: 'normale', stat: 0.467, h0: 'aucune divergence entre les groupes avant le traitement', unite: 't' },
    did: { nom: '3.8 — effet de l’électrification (erreurs groupées)', loi: 'normale', stat: 8.59, h0: 'l’électrification n’a aucun effet sur la lumière', unite: 't' }
  };
  A.widgets.loi = function (el, p) {
    const g = A.gabarit(el, 'Où tombe la statistique de test ?', 'Un test compare un nombre calculé sur tes données (la **statistique**) à ce qu’on obtiendrait par pur hasard **si l’hypothèse nulle H₀ était vraie** (la courbe). Si la statistique tombe dans une zone où le hasard seul l’envoie rarement (zone colorée), on rejette H₀.');
    const etat = { test: TESTS[p.test] ? p.test : 'sargan', seuil: 0.05, stat: null };
    const select = h('select', { id: A.uid('sel'), 'aria-label': 'Test' });
    Object.keys(TESTS).forEach((k) => select.append(h('option', { value: k, text: TESTS[k].nom })));
    select.value = etat.test;
    select.addEventListener('change', () => { etat.test = select.value; etat.stat = null; reconstruire(); });
    const zoneCurseur = h('span');
    g.commandes.append(h('label', { class: 'commande' }, h('span', { text: 'Test du travail' }), select), A.choix('Seuil', [[0.1, '10 %'], [0.05, '5 %'], [0.01, '1 %']], etat.seuil, (v) => { etat.seuil = +v; dessiner(); }), zoneCurseur);
    function critique(T) {
      if (T.loi === 'normale') return { 0.1: 1.645, 0.05: 1.96, 0.01: 2.576 }[etat.seuil];
      let a = 0, b = 60; for (let i = 0; i < 60; i++) { const m = (a + b) / 2; if (1 - S.khi2CDF(m, T.ddl) > etat.seuil) a = m; else b = m; } return (a + b) / 2;
    }
    function reconstruire() {
      const T = TESTS[etat.test]; if (etat.stat == null) etat.stat = T.stat;
      zoneCurseur.textContent = '';
      const max = T.loi === 'normale' ? 6 : Math.max(14, T.ddl * 6);
      zoneCurseur.append(A.curseur('Et si la statistique valait…', T.loi === 'normale' ? -6 : 0, max, 0.01, A.clamp(etat.stat, T.loi === 'normale' ? -6 : 0, max), (v) => fmt(v, 2), (v) => { etat.stat = v; dessiner(); }),
        h('button', { class: 'btn petit', type: 'button', style: 'margin-left:10px', onclick: () => { etat.stat = T.stat; reconstruire(); } }, 'Valeur du travail'));
      dessiner();
    }
    function dessiner() {
      const T = TESTS[etat.test], norm = T.loi === 'normale', a = norm ? -4.5 : 0, b = norm ? 4.5 : Math.max(12, T.ddl * 5), c = critique(T);
      const dens = (x) => norm ? S.normalePDF(x) : S.khi2PDF(x, T.ddl);
      let ymax = norm ? 0.42 : 0; if (!norm) { for (let i = 1; i <= 200; i++) ymax = Math.max(ymax, dens(a + (b - a) * i / 200)); ymax = Math.min(ymax, T.ddl === 1 ? 1.1 : ymax) * 1.08; }
      const G = A.graphe(g.zone, { nom: 'Loi de la statistique sous l’hypothèse nulle, zone de rejet et valeur observée', ratio: 0.42, hmin: 210, x: { dom: [a, b], titre: norm ? 'Statistique (loi normale centrée réduite sous H₀)' : 'Statistique (loi du khi-deux à ' + T.ddl + ' degré' + (T.ddl > 1 ? 's' : '') + ' de liberté sous H₀)' }, y: { dom: [0, ymax], masque: true, sansGrille: true } }).axes();
      const courbe = (de, vers) => { const pts = []; for (let i = 0; i <= 80; i++) { const x = de + (vers - de) * i / 80; pts.push([x, Math.min(dens(x), ymax)]); } return pts; };
      const zone = (de, vers) => { const haut = courbe(de, vers); G.bande(haut.map((q) => [q[0], 0]), haut, 'f2'); };
      if (norm) { zone(a, -c); zone(c, b); } else zone(c, b);
      G.chemin(courbe(norm ? a : 0.02, b), 'tink');
      const xs = A.clamp(etat.stat, a, b);
      G.verticale(xs, 't1').setAttribute('stroke-width', 2.5);
      G.texte(xs, ymax, T.unite + ' = ' + fmt(etat.stat, 2) + (etat.stat !== xs ? ' (hors cadre)' : ''), { dx: xs > (a + b) / 2 ? -6 : 6, dy: 14, ancre: xs > (a + b) / 2 ? 'end' : 'start' });
      const pres = Math.abs(G.px(xs) - G.px(c)) < 78, aGauche = pres && xs >= c;
      G.texte(c, 0, 'seuil ' + fmt(c, 2), { dy: -6, dx: aGauche ? -5 : 4, ancre: aGauche ? 'end' : 'start', cls: 'etq2' });
      const pv = norm ? S.pBilaterale(etat.stat) : 1 - S.khi2CDF(etat.stat, T.ddl), rejet = pv < etat.seuil;
      const ptxt = pv < 0.0001 ? 'inférieure à 0,0001' : 'de ' + fmt(pv, pv < 0.1 ? 4 : 2);

    }
    A.adapter(g.zone, reconstruire);

  // ------------------------------------------- 4. logarithmes et pourcentages
  A.widgets.logpct = function (el) {

    const etat = { g: 0.05 };
    g.commandes.append(A.curseur('Variation réelle', -60, 150, 1, 5, (v) => A.signe(v, 0) + ' %', (v) => { etat.g = v / 100; dessiner(); }),
      h('button', { class: 'btn petit', type: 'button', onclick: (ev) => { etat.g = Math.exp(0.895) - 1; ev.target.closest('.commandes').querySelector('.commande').regler(Math.round(etat.g * 100)); dessiner(); } }, 'Exemple : Bruxelles (δ = 0,895)'));
    function dessiner() {

      G.fonction((x) => x, 't0');
      G.fonction((x) => 100 * Math.log(1 + x / 100), 't1');
      const x = 100 * etat.g, y = 100 * Math.log(1 + etat.g);
      G.segment(x, x, x, y, 't2'); G.point(x, y, 'c1', 5); G.point(x, x, 'c0', 4);
      G.texte(150, 150, 'si les deux étaient égaux', { ancre: 'end', dy: 16, dx: -4, cls: 'etq2' });
      G.texte(150, 100 * Math.log(2.5), '100 × Δln', { ancre: 'end', dy: -8, dx: -4 });
      g.lecture.innerHTML = '<p>Variation exacte : <b>' + A.signe(x, 1) + ' %</b>. Différence de logarithmes : ln(' + fmt(1 + etat.g, 3) + ') = ' + fmt(Math.log(1 + etat.g), 4) + ', soit <b>' + A.signe(y, 1) + '</b> « points de log ». Écart : ' + fmt(Math.abs(x - y), 1) + ' point' + (Math.abs(x - y) >= 2 ? 's' : '') + '.</p><p>Dans l’autre sens, la formule exacte est <b>100 × (exp(Δ) − 1)</b> : un coefficient de ' + fmt(Math.log(1 + etat.g), 3) + ' devant une indicatrice signifie ' + A.signe(x, 1) + ' %, pas ' + A.signe(y, 1) + ' %.</p>';
    }
    A.adapter(g.zone, dessiner);
  };
})();

<script>
// ---- widgets-p1.js ----
// Outils de la partie 1 (communes belges) : fusions, précision d'une médiane, histogrammes,
// explorateur du nuage, formes fonctionnelles, catégorie de référence, biais de variable omise,
// centrage, hétéroscédasticité, graphique « en forêt ».
(function () {
  'use strict';
  const A = window.A, h = A.h, S = A.stats, fmt = A.fmt, REG = A.REG;
  const C = A.communes, K = (v) => v / 1000;
  const lig = (pts, f) => pts.map(f);
  const pctExp = (d) => A.signe(100 * (Math.exp(d) - 1), 1) + ' %';
  const table = function (tete, lignes) {
    const t = h('table'); t.append(h('thead', null, h('tr', null, tete.map((c, i) => h('th', { class: i ? 'd' : '', html: A.inline(c) })))));
    const b = h('tbody'); lignes.forEach((l) => b.append(h('tr', null, l.map((c, i) => h('td', { class: i ? 'd' : '', html: A.inline(String(c)) }))))); t.append(b);
    return h('div', { class: 'table-boite' }, t);
  };
  // Modèles de référence (calculés une fois sur les 551 communes).
  const MOD = (function () {
    if (!C.length) return {};
    const y = C.map((c) => c.lprix), yk = C.map((c) => K(c.prix));
    return {
      nn: S.mco(lig(C, (c) => [1, K(c.rev)]), yk), ll: S.mco(lig(C, (c) => [1, c.lrev]), y),
      ln: S.mco(lig(C, (c) => [1, K(c.rev)]), y), nl: S.mco(lig(C, (c) => [1, c.lrev]), yk),
      m9: S.mco(lig(C, (c) => [1, c.lrev, c.W, c.B]), y),
      m13: S.mco(lig(C, (c) => [1, c.lrev, c.W, c.B, c.lrev * c.W, c.lrev * c.B]), y),
      m15: S.mco(lig(C, (c) => { const a = c.napp || 0; return [1, c.lrev, c.W, c.B, Math.log(c.pop), a / (a + c.ventes)]; }), y)
    };
  })();
  A.MOD1 = MOD;

  // ------------------------------------------------------------ 1.1 fusions
  A.widgets.fusion = function (el) {
    const D = A.D.communes, g = A.gabarit(el, 'Les 14 fusions : retrouver les mêmes territoires dans les deux fichiers', 'Choisis une commune fusionnée. À gauche, les codes qui n’existent **que dans le fichier des ventes** (nouvelles communes) ; à droite, ceux qui n’existent **que dans le fichier fiscal** (anciennes communes). C’est exactement ce que renvoient les deux `anti_join()`.');
    let actif = 0;
    const select = h('select', { id: A.uid('sel'), 'aria-label': 'Commune fusionnée' });
    D.fusions.forEach((f, i) => select.append(h('option', { value: i, text: f.nom + ' (' + f.code + ')' })));
    select.addEventListener('change', () => { actif = +select.value; dessiner(); });
    g.commandes.append(h('label', { class: 'commande' }, h('span', { text: 'Nouvelle commune (découpage 2025)' }), select));
    function dessiner() {
      const f = D.fusions[actif], anciens = f.anciennes.map((a) => a.code);
      g.zone.textContent = '';
      const liste = (titre, items, estVif) => h('div', null, h('div', { class: 'rubrique', text: titre }), h('div', { class: 'puces' }, items.map((it) => h('span', { class: 'puce' + (estVif(it) ? ' vif' : ''), text: it.nom + ' ' + it.code }))));
      g.zone.append(h('div', { class: 'deux-col' }, liste('Seulement dans les ventes (' + D.seul_ventes.length + ')', D.seul_ventes, (it) => it.code === f.code), liste('Seulement dans le fiscal (' + D.seul_fisc.length + ')', D.seul_fisc, (it) => anciens.includes(it.code))));
      const pop = S.somme(f.anciennes.map((a) => a.pop)), rev = S.somme(f.anciennes.map((a) => a.rev));
      const lignes = f.anciennes.map((a) => [a.nom, a.code, fmt(a.pop), fmt(a.rev / 1e6, 1), A.eur(a.rev / a.pop)]);
      lignes.push(['**' + f.nom + ' (somme)**', '**' + f.code + '**', '**' + fmt(pop) + '**', '**' + fmt(rev / 1e6, 1) + '**', '**' + A.eur(rev / pop) + '**']);
      g.zone.append(table(['Commune', 'Code INS', 'Habitants', 'Revenu total (millions €)', 'Revenu par habitant'], lignes));
      const simple = S.moyenne(f.anciennes.map((a) => a.rev / a.pop)), anvers = f.code === '11002';
      g.lecture.innerHTML = '<p><b>Le bon calcul</b> : on additionne les revenus totaux et les habitants des anciennes communes, puis on divise : ' + fmt(rev / 1e6, 1) + ' millions € / ' + fmt(pop) + ' habitants = <b>' + A.eur(rev / pop) + '</b> par habitant.</p>' +
        '<p><b>L’erreur à éviter</b> : faire la moyenne simple des revenus par habitant donnerait ' + A.eur(simple) + ' (écart de ' + A.signe(simple - rev / pop, 0) + ' €), car chaque ancienne commune pèserait autant, quelle que soit sa taille.</p>' +
        (anvers ? '<p><b>Le piège d’Anvers</b> : son code 11002 existe dans les <em>deux</em> fichiers, donc aucun anti_join ne le signale. Une fusion directe associerait pourtant les ventes d’Anvers + Borsbeek au revenu de la seule ancienne Anvers (' + A.eur(f.anciennes[0].rev / f.anciennes[0].pop) + ' au lieu de ' + A.eur(rev / pop) + ') et à ' + fmt(f.anciennes[0].pop) + ' habitants au lieu de ' + fmt(pop) + '.</p>' :
          '<p>Sans reconstitution, le code ' + f.code + ' ne trouve aucun correspondant dans le fichier fiscal : la commune (' + fmt(f.n_ventes) + ' ventes, prix médian ' + A.eur(f.prix) + ') disparaîtrait de la base ou garderait un revenu manquant.</p>');
    }
    dessiner();
  };

  // ---------------------------------------------- 1.3 précision d'une médiane
  A.widgets.mediane = function (el) {
    const g = A.gabarit(el, 'Une médiane sur 17 ventes, une médiane sur 1 854 ventes', 'Chaque point est le prix médian qu’on aurait observé une « autre année », si les ventes étaient tirées au hasard dans la même distribution de prix (supposée normale, comme dans l’énoncé). Plus les points s’étalent, moins la médiane publiée est fiable.');
    const COM = [{ nom: 'Rouvroy', n: 17, med: 158.5, eiq: 172, cls: 'c2' }, { nom: 'Charleroi', n: 1854, med: 137.75, eiq: 90, cls: 'c1' }];
    const u = A.alea(17);
    COM.forEach((c) => { c.tirages = []; c.formule = 0.93 * c.eiq / Math.sqrt(c.n); });
    const tirer = (k) => { COM.forEach((c) => { const sd = c.eiq / 1.349; for (let r = 0; r < k; r++) { const x = new Float64Array(c.n); for (let i = 0; i < c.n; i++) x[i] = c.med + sd * u.normale(); x.sort(); c.tirages.push(c.n % 2 ? x[(c.n - 1) / 2] : (x[c.n / 2 - 1] + x[c.n / 2]) / 2); } if (c.tirages.length > 600) c.tirages = c.tirages.slice(-600); }); dessiner(); };
    g.commandes.append(h('button', { class: 'btn', type: 'button', onclick: () => tirer(1) }, 'Simuler 1 année'), h('button', { class: 'btn plein', type: 'button', onclick: () => tirer(200) }, 'Simuler 200 années'), h('button', { class: 'btn', type: 'button', onclick: () => { COM.forEach((c) => { c.tirages = []; }); dessiner(); } }, 'Effacer'));
    g.legende.append(A.legende(COM.map((c) => ({ c: c.cls === 'c1' ? 's1' : 's2', nom: c.nom + ' (' + fmt(c.n) + ' ventes)' }))));
    function dessiner() {
      const G = A.graphe(g.zone, { nom: 'Médianes simulées pour Rouvroy et Charleroi', ratio: 0.36, hmin: 200, hmax: 300, x: { dom: [20, 300], titre: 'Prix médian de l’échantillon (milliers d’euros)', grille: true }, y: { dom: [-0.6, 1.6], masque: true, sansGrille: true } }).axes();
      const j = A.alea(5);
      COM.forEach((c, r) => {
        const y0 = 1 - r;
        c.tirages.forEach((t) => { const p = G.point(A.clamp(t, 20, 300), y0 + (j() - 0.5) * 0.62, c.cls, 2.6); p.setAttribute('opacity', 0.55); p.setAttribute('class', c.cls); });
        G.segment(c.med, y0 - 0.42, c.med, y0 + 0.42, 'tink');
        G.texte(c.med, y0 + 0.42, c.nom + ' : médiane publiée ' + fmt(c.med * 1000, 0) + ' €', { dy: -5, dx: 5 });
      });
      const n = COM[0].tirages.length;
      g.lecture.innerHTML = '<p>Formule de l’énoncé, erreur-type ≈ 0,93 × (p75 − p25) / √n : <b>Rouvroy ' + fmt(COM[0].formule * 1000, 0) + ' €</b> (0,93 × 172 000 / √17), <b>Charleroi ' + fmt(COM[1].formule * 1000, 0) + ' €</b> (0,93 × 90 000 / √1 854), soit un rapport de ' + fmt(COM[0].formule / COM[1].formule, 0) + '.</p>' +
        (n > 20 ? '<p>Dans la simulation (' + n + ' années) : l’écart-type des médianes vaut ' + fmt(S.ecartType(COM[0].tirages) * 1000, 0) + ' € à Rouvroy et ' + fmt(S.ecartType(COM[1].tirages) * 1000, 0) + ' € à Charleroi. La formule donne bien l’ordre de grandeur de cette dispersion.</p>' : '<p>Lance la simulation pour comparer la dispersion réelle des médianes à la formule.</p>');
    }
    COM.forEach((c) => { const sd = c.eiq / 1.349; for (let r = 0; r < 150; r++) { const x = new Float64Array(c.n); for (let i = 0; i < c.n; i++) x[i] = c.med + sd * u.normale(); x.sort(); c.tirages.push(c.n % 2 ? x[(c.n - 1) / 2] : (x[c.n / 2 - 1] + x[c.n / 2]) / 2); } });
    A.adapter(g.zone, dessiner);
  };

  // ----------------------------------------------------- 1.4 histogrammes
  A.widgets.histos = function (el) {
    const g = A.gabarit(el, 'Distribution du prix et du revenu, en niveau et en logarithme', 'Compare la forme des quatre distributions. Le trait plein est la moyenne, le trait en tirets la médiane : quand ils se séparent, la distribution est asymétrique.');
    const etat = { v: 'prix', log: false };
    const NOM = { prix: 'Prix médian', rev: 'Revenu par habitant' };
    g.commandes.append(A.choix('Variable', [['prix', 'Prix médian'], ['rev', 'Revenu par habitant']], etat.v, (v) => { etat.v = v; dessiner(); }), A.choix('Échelle', [['niv', 'Niveau (€)'], ['log', 'Logarithme']], 'niv', (v) => { etat.log = v === 'log'; dessiner(); }));
    const asym = { prix: S.asymetrie(C.map((c) => c.prix)), lprix: S.asymetrie(C.map((c) => c.lprix)), rev: S.asymetrie(C.map((c) => c.rev)), lrev: S.asymetrie(C.map((c) => c.lrev)) };
    function dessiner() {
      const x = C.map((c) => etat.log ? Math.log(c[etat.v]) : K(c[etat.v])), min = Math.min.apply(null, x), max = Math.max.apply(null, x);
      const nb = 30, pas = (max - min) / nb, cases = new Array(nb).fill(0);
      x.forEach((v) => { cases[Math.min(nb - 1, Math.floor((v - min) / pas))]++; });
      const G = A.graphe(g.zone, { nom: 'Histogramme de ' + NOM[etat.v], ratio: 0.46, x: { dom: [min - pas / 2, max + pas / 2], titre: etat.log ? 'ln(' + (etat.v === 'prix' ? 'prix' : 'rev_hab') + '), montants en euros' : NOM[etat.v] + ' (milliers d’euros)' }, y: { dom: [0, Math.max.apply(null, cases) * 1.12], titre: 'Nombre de communes' } }).axes();
      const l = G.px(min + pas) - G.px(min) - 2, P = [];
      cases.forEach((c, i) => { const xc = min + (i + 0.5) * pas; if (c) G.barre(xc, c, l, etat.v === 'prix' ? 'c1' : 'c2'); P.push({ x: xc, y: c, i }); });
      const moy = S.moyenne(x), med = S.mediane(x);
      G.verticale(moy, 'tink'); G.verticale(med, 'tink tirets');
      G.survolProche(P, (p) => { const a = min + p.i * pas, b = a + pas, f = (v) => etat.log ? fmt(v, 2) + ' (soit ' + A.eur(Math.exp(v)) + ')' : A.eur(v * 1000); return [fmt(p.y) + ' commune' + (p.y > 1 ? 's' : ''), [['de', f(a)], ['à', f(b)]]]; });
      const cle = (etat.log ? 'l' : '') + etat.v, f = (v) => etat.log ? fmt(v, 3) : A.eur(v * 1000);
      g.lecture.innerHTML = '<p>Moyenne ' + f(moy) + ' (trait plein), médiane ' + f(med) + ' (tirets). Coefficient d’asymétrie : <b>' + fmt(asym[cle], 2) + '</b> — ' + (Math.abs(asym[cle]) < 0.1 ? 'distribution quasi symétrique.' : asym[cle] > 0 ? 'queue plus longue à droite (quelques communes très chères tirent la moyenne vers le haut).' : 'queue plus longue à gauche (quelques communes très pauvres s’écartent vers le bas).') + '</p>';
      g.apres.textContent = '';
      g.apres.append(h('div', { class: 'chiffres' }, A.chiffre('Asymétrie de prix', fmt(asym.prix, 2)), A.chiffre('Asymétrie de ln(prix)', fmt(asym.lprix, 2)), A.chiffre('Asymétrie de rev_hab', fmt(asym.rev, 2)), A.chiffre('Asymétrie de ln(rev_hab)', fmt(asym.lrev, 2))));
    }
    A.adapter(g.zone, dessiner);
  };

  // ------------------------------------------------ 1.5 à 1.13 explorateur
  A.widgets.nuage = function (el, p) {
    const g = A.gabarit(el, p.titre || 'Explorateur : 551 communes, prix médian et revenu par habitant', 'Chaque point est une commune (survole-la pour lire son nom). Change l’échelle et le modèle : la droite, son équation et son R² sont **recalculés en direct** sur les vraies données.');
    const etat = { ech: p.echelle === 'niveaux' ? 'niv' : 'log', mod: p.modele || 'unique', taille: p.taille === 'ventes', nom: p.commune || '' };
    const MODS = [['aucun', 'Aucune droite'], ['unique', 'Une seule droite'], ['paralleles', 'Droites parallèles (indicatrices)'], ['pentes', 'Une pente par région (interaction)']];
    g.commandes.append(A.choix('Échelles', [['niv', 'Niveaux'], ['log', 'Logarithmiques']], etat.ech, (v) => { etat.ech = v; dessiner(); }), A.choix('Modèle', MODS, etat.mod, (v) => { etat.mod = v; dessiner(); }));
    const idListe = A.uid('liste'), champ = h('input', { type: 'text', id: A.uid('com'), list: idListe, placeholder: 'ex. Rouvroy', value: etat.nom });
    champ.addEventListener('change', () => { etat.nom = champ.value; dessiner(); });
    g.commandes.append(h('label', { class: 'commande' }, h('span', { text: 'Repérer une commune' }), champ, h('datalist', { id: idListe }, C.map((c) => h('option', { value: c.nom })))), A.case('Taille des points = nombre de ventes', etat.taille, (v) => { etat.taille = v; dessiner(); }));
    g.legende.append(A.legende(['F', 'W', 'B'].map((r) => ({ c: REG[r].c, nom: REG[r].nom + ' (' + C.filter((c) => c.region === r).length + ')' }))));
    g.apres.append(A.vueTable('Voir les 551 communes en tableau', ['Commune', 'Région', 'Revenu par habitant (€)', 'Prix médian (€)', 'Ventes de maisons'], C.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map((c) => [c.nom, REG[c.region].nom, fmt(c.rev), fmt(c.prix), fmt(c.ventes)])));
    function dessiner() {
      const log = etat.ech === 'log';
      const G = A.graphe(g.zone, { nom: 'Nuage de points du prix médian selon le revenu par habitant, 551 communes', ratio: 0.62, hmin: 300, hmax: 500, x: { dom: [12, 38], log, titre: 'Revenu net imposable par habitant (milliers d’euros' + (log ? ', échelle log)' : ')'), grad: log ? [13, 15, 20, 25, 30, 35] : null }, y: { dom: log ? [85, 900] : [0, 900], log, titre: 'Prix médian (milliers d’euros' + (log ? ', échelle log)' : ')'), grad: log ? [100, 150, 200, 300, 500, 800] : null } }).axes();
      const P = C.map((c) => ({ x: K(c.rev), y: K(c.prix), c }));
      P.forEach((q) => { const pt = G.point(q.x, q.y, REG[q.c.region].p, etat.taille ? A.clamp(1.2 + Math.sqrt(q.c.ventes) / 3.4, 2, 16) : 3.3); pt.setAttribute('opacity', etat.taille ? 0.5 : 0.72); if (etat.taille) pt.setAttribute('class', REG[q.c.region].p); });
      // Modèle : dans l'échelle choisie.
      const xv = (c) => log ? c.lrev : K(c.rev), y = C.map((c) => log ? c.lprix : K(c.prix));
      const inv = (v) => log ? Math.exp(v) / 1000 : v, tx = (r) => log ? Math.log(1000 * r) : r;
      let txt = '';
      const sg = (v, d) => (v < 0 ? ' − ' : ' + ') + fmt(Math.abs(v), d), Y = log ? 'ln(prix)' : 'prix', Xn = log ? 'ln(revenu)' : 'revenu';
      if (etat.mod === 'unique') {
        const m = S.mco(lig(C, (c) => [1, xv(c)]), y);
        G.fonction((r) => inv(m.b[0] + m.b[1] * tx(r)), 'tink');
        txt = '<p><b>' + Y + ' = ' + fmt(m.b[0], log ? 3 : 1) + sg(m.b[1], log ? 3 : 2) + ' × ' + Xn + '</b> &nbsp; (R² = ' + fmt(m.r2, 3) + ', erreur-type HC1 de la pente : ' + fmt(m.seHC1[1], log ? 3 : 2) + ')</p><p>' + (log ? 'En logarithmes, la pente est une <b>élasticité</b> : un revenu plus élevé de 1 % va de pair avec un prix plus élevé de ' + fmt(m.b[1], 2) + ' %.' : 'En niveaux : 1 000 € de revenu par habitant en plus vont de pair avec ' + fmt(m.b[1] * 1000, 0) + ' € de prix médian en plus.') + ' Regarde les couleurs : presque toute la Wallonie est sous la droite, tout Bruxelles au-dessus.</p>';
      } else if (etat.mod === 'paralleles') {
        const m = S.mco(lig(C, (c) => [1, xv(c), c.W, c.B]), y), d = { F: 0, W: m.b[2], B: m.b[3] };

  // ------------------------------------- 1.6 et 1.7 formes fonctionnelles
  A.widgets.formes = function (el) {
    const g = A.gabarit(el, 'Quatre formes fonctionnelles, quatre prédictions', 'Les quatre modèles de la question 1.6, estimés sur les mêmes 551 communes. Déplace le revenu de départ et d’arrivée : le tableau refait les calculs de la question 1.7.');
    const etat = { r0: 24, r1: 25, vif: 'll' };
    const F = { nn: { nom: 'Niveau-niveau', f: (r) => MOD.nn.b[0] + MOD.nn.b[1] * r }, ll: { nom: 'Log-log', f: (r) => Math.exp(MOD.ll.b[0] + MOD.ll.b[1] * Math.log(1000 * r)) / 1000 }, ln: { nom: 'Log-niveau', f: (r) => Math.exp(MOD.ln.b[0] + MOD.ln.b[1] * r) / 1000 }, nl: { nom: 'Niveau-log', f: (r) => MOD.nl.b[0] + MOD.nl.b[1] * Math.log(1000 * r) } };
    const c0 = A.curseur('Revenu de départ', 14, 34, 0.5, etat.r0, (v) => A.eur(v * 1000), (v) => { etat.r0 = v; dessiner(); });
    const c1 = A.curseur('Revenu d’arrivée', 15, 36, 0.5, etat.r1, (v) => A.eur(v * 1000), (v) => { etat.r1 = v; dessiner(); });
    const preset = (a, b, t) => h('button', { class: 'btn petit', type: 'button', onclick: () => { etat.r0 = a; etat.r1 = b; c0.regler(a); c1.regler(b); dessiner(); } }, t);
    g.commandes.append(c0, c1, h('div', { class: 'commande' }, h('span', { text: 'Cas de l’énoncé' }), h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' }, preset(24, 25, '(a) 24 000 → 25 000 €'), preset(20, 30, '(b) 20 000 → 30 000 €'))),
      A.choix('Courbe mise en avant', Object.keys(F).map((k) => [k, F[k].nom]), etat.vif, (v) => { etat.vif = v; dessiner(); }));
    function dessiner() {
      const G = A.graphe(g.zone, { nom: 'Prix prédit selon le revenu par les quatre modèles', ratio: 0.56, x: { dom: [12, 37], titre: 'Revenu par habitant (milliers d’euros)' }, y: { dom: [0, 700], titre: 'Prix médian prédit (milliers d’euros)' } }).axes();
      C.forEach((c) => { if (c.prix < 700000) { const pt = G.point(K(c.rev), K(c.prix), 'c0', 1.8); pt.setAttribute('class', 'c0'); pt.setAttribute('opacity', 0.45); } });
      G.verticale(etat.r0, 't0'); G.verticale(etat.r1, 't0');
      Object.keys(F).forEach((k) => { if (k !== etat.vif) G.fonction(F[k].f, 't0'); });
      const v = F[etat.vif]; G.fonction(v.f, 't1').setAttribute('stroke-width', 3);
      // Étiquettes au bout des courbes, écartées d'au moins 15 px pour ne pas se chevaucher.
      const etqs = Object.keys(F).map((k) => ({ k, y: G.py(F[k].f(37)) })).sort((a, b) => a.y - b.y);
      for (let i = 1; i < etqs.length; i++) if (etqs[i].y - etqs[i - 1].y < 15) etqs[i].y = etqs[i - 1].y + 15;
      etqs.forEach((e) => G.dessus.append(A.s('text', { x: G.x1 - 4, y: e.y - 5, 'text-anchor': 'end', class: e.k === etat.vif ? 'etq' : 'etq2', text: F[e.k].nom })));
      G.point(etat.r0, v.f(etat.r0), 'c1', 5); G.point(etat.r1, v.f(etat.r1), 'c1', 5);
      const r0 = etat.r0, r1 = etat.r1, d = r1 - r0, pc = 100 * d / r0;
      const approx = { nn: null, ll: MOD.ll.b[1] * pc, ln: 100 * MOD.ln.b[1] * d, nl: null };
      g.apres.textContent = '';
      g.apres.append(table(['Modèle', 'Prix prédit au départ', 'Variation en €', 'Approximation usuelle', 'Variation exacte'], Object.keys(F).map((k) => { const p0 = F[k].f(r0), p1 = F[k].f(r1); return [(k === etat.vif ? '**' + F[k].nom + '**' : F[k].nom), A.eur(p0 * 1000), A.signe((p1 - p0) * 1000, 0) + ' €', approx[k] == null ? '—' : A.signe(approx[k], 2) + ' %', A.signe(100 * (p1 / p0 - 1), 2) + ' %']; })));
      const ecartLL = Math.abs(approx.ll - 100 * (F.ll.f(r1) / F.ll.f(r0) - 1)), ecartLN = Math.abs(approx.ln - 100 * (F.ln.f(r1) / F.ln.f(r0) - 1));

  // --------------------------------------- 1.9 à 1.11 catégorie de référence
  A.widgets.reference = function (el) {

      ['F', 'W', 'B'].forEach((r) => { const e = G.fonction((v) => Math.exp(cst[r] + b[1] * Math.log(1000 * v)) / 1000, REG[r].t); if (r === ref) e.setAttribute('stroke-width', 4); });

      autres.forEach((r) => { const d = cst[r] - cst[ref], c = vec[r].map((v, i) => v - vec[ref][i]); lignes.push(['Indicatrice ' + REG[r].nom, '(' + nomCoef[r] + ') − (' + nomCoef[ref] + ') = ' + fmt(cst[r], 3) + ' − (' + fmt(cst[ref], 3) + ')', A.signe(d, 3), fmt(S.seCombinaison(m.V, c), 3), pctExp(d)]); });

  };

  // ---------------------------------------- 1.12 biais de variable omise
  A.widgets.bvo = function (el) {
    const g = A.gabarit(el, 'De 1,608 à 1,444 : la formule du biais de variable omise', 'Le modèle « court » (sans régions) a une élasticité différente du modèle « long » (avec régions). La différence se décompose exactement : pour chaque région omise, **son effet sur le prix × son lien avec le revenu**.');
    let ech = 'tout';
    g.commandes.append(A.choix('Communes utilisées', [['tout', 'Les 551 communes'], ['sansB', 'Sans Bruxelles'], ['sansW', 'Sans la Wallonie']], ech, (v) => { ech = v; dessiner(); }));
    function dessiner() {
      const pts = C.filter((c) => (ech === 'sansB' ? c.region !== 'B' : ech === 'sansW' ? c.region !== 'W' : true)), y = pts.map((c) => c.lprix);
      const regs = ['W', 'B'].filter((r) => pts.some((c) => c.region === r));
      const long = S.mco(lig(pts, (c) => [1, c.lrev].concat(regs.map((r) => c[r]))), y), court = S.mco(lig(pts, (c) => [1, c.lrev]), y);
      const termes = regs.map((r, i) => { const aux = S.mco(lig(pts, (c) => [1, c.lrev]), pts.map((c) => c[r])); return { r, delta: long.b[2 + i], pi: aux.b[1], contrib: long.b[2 + i] * aux.b[1] }; });
      const etapes = [long.b[1]]; termes.forEach((t) => etapes.push(etapes[etapes.length - 1] + t.contrib));
      const lo = Math.min.apply(null, etapes.concat([court.b[1]])) - 0.12, hi = Math.max.apply(null, etapes) + 0.12, nl = etapes.length;
      const G = A.graphe(g.zone, { nom: 'Décomposition de l’écart entre l’élasticité avec et sans régions', h: 70 + 54 * nl, x: { dom: [lo, hi], titre: 'Élasticité du prix au revenu', grille: true }, y: { dom: [0, nl], masque: true, sansGrille: true }, marges: { g: 14 } }).axes();
      const yy = (i) => nl - 0.5 - i;
      G.point(etapes[0], yy(0), 'cink', 5.5); G.texte(etapes[0], yy(0), 'Avec régions (1.9) : ' + fmt(etapes[0], 3), { dx: 10, dy: 4 });
      termes.forEach((t, i) => {
        const a = etapes[i], b2 = etapes[i + 1], cl = REG[t.r].t, yl = yy(i + 1);
        G.segment(a, yy(i) - 0.18, a, yl, 't0').setAttribute('stroke-width', 1);
        G.segment(a, yl, b2, yl, cl).setAttribute('stroke-width', 3);
        const xp = G.px(b2), yp = G.py(yl), s = b2 > a ? 1 : -1;
        G.marques.append(A.s('polygon', { points: [xp, yp, xp - s * 9, yp - 5.5, xp - s * 9, yp + 5.5].join(' '), class: REG[t.r].p }));
        G.texte(Math.max(a, b2), yl, REG[t.r].nom + ' : ' + A.signe(t.contrib, 3), { dx: 10, dy: 4 });
      });
      const fin = etapes[nl - 1];
      G.verticale(court.b[1], 'tink tirets'); G.texte(court.b[1], 0, 'Sans régions (1.6) : ' + fmt(court.b[1], 3), { dy: -6, dx: court.b[1] < (lo + hi) / 2 ? 6 : -6, ancre: court.b[1] < (lo + hi) / 2 ? 'start' : 'end' });
      g.apres.textContent = '';
      g.apres.append(table(['Région omise', 'Effet sur ln(prix) à revenu égal (δ)', 'Pente de l’indicatrice sur ln(rev_hab) (π)', 'Contribution δ × π'], termes.map((t) => [REG[t.r].nom, A.signe(t.delta, 4), A.signe(t.pi, 4), '**' + A.signe(t.contrib, 4) + '**'])));
      g.lecture.innerHTML = '<p><b>' + fmt(long.b[1], 4) + termes.map((t) => (t.contrib < 0 ? ' − ' : ' + ') + fmt(Math.abs(t.contrib), 4)).join('') + ' = ' + fmt(fin, 4) + '</b>, exactement l’élasticité du modèle sans régions (' + fmt(court.b[1], 4) + ') : ce n’est pas une approximation, c’est une identité des MCO (' + pts.length + ' communes).</p>' +
        (ech === 'tout' ? '<p>La Wallonie (plus pauvre <em>et</em> moins chère à revenu égal) gonfle la pente ; Bruxelles (plus pauvre <em>mais</em> beaucoup plus chère) l’écrase davantage. Essaie « Sans Bruxelles » : l’écart change de signe.</p>' : ech === 'sansB' ? '<p>Sans Bruxelles, il ne reste que l’effet wallon : omettre la région <em>surestime</em> alors l’élasticité.</p>' : '<p>Sans la Wallonie, il ne reste que l’effet bruxellois : omettre la région <em>sous-estime</em> fortement l’élasticité.</p>');
    }
    A.adapter(g.zone, dessiner);
  };

  // ------------------------------------------------- 1.13 (d)(e) centrage

    g.legende.append(A.legende(['F', 'W', 'B'].map((r) => ({ c: REG[r].c, nom: REG[r].nom, type: 'ligne' }))));
    function dessiner() {
      const z = etat.zoom, G = A.graphe(g.zone, { nom: 'Droites régionales prolongées jusqu’à un revenu de un euro', ratio: 0.52, x: { dom: z ? [9.4, 10.6] : [0, 11], titre: 'ln(revenu par habitant)' }, y: { dom: z ? [11.3, 13.8] : [-7, 15], titre: 'ln(prix médian)' } }).axes();

      ['F', 'W', 'B'].forEach((r) => G.fonction((x) => cst[r][0] + cst[r][1] * x, REG[r].t));
      const u = etat.u, val = (r) => cst[r][0] + cst[r][1] * u, dom = z ? [9.4, 10.6] : [0, 11];
      if (u >= dom[0] && u <= dom[1]) { G.verticale(u, 'tink'); ['W', 'B'].forEach((r) => { const s2 = G.segment(u, val('F'), u, val(r), REG[r].t); s2.setAttribute('stroke-width', 5); s2.setAttribute('opacity', 0.55); }); }
      if (!z) { G.texte(9.95, 14.6, 'les 551 communes sont ici', { ancre: 'end', dx: -22, dy: 4, cls: 'etq2' }); }
      const dW = b[2] + b[4] * u, dB = b[3] + b[5] * u, pres = u > 9.3;

        ['Constante', '$β₀ + β₁ × ln(c)$', fmt(val('F'), 3), pres ? 'prix flamand prédit : ' + A.eur(Math.exp(val('F'))) : 'extrapolation'],
        ['lrev_c (élasticité flamande)', '$β₁$, inchangé', fmt(b[1], 3), '—'],
        ['Indicatrice Wallonie', '$δ_{W} + θ_{W} × ln(c)$', A.signe(dW, 3), pres ? 'Wallonie ' + pctExp(dW) + ' par rapport à la Flandre' : 'non interprétable'],
        ['Indicatrice Bruxelles', '$δ_{B} + θ_{B} × ln(c)$', A.signe(dB, 3), pres ? 'Bruxelles ' + pctExp(dB) + ' par rapport à la Flandre' : 'non interprétable'],
        ['Interactions', '$θ_{W}$ et $θ_{B}$, inchangées', A.signe(b[4], 3) + ' et ' + A.signe(b[5], 3), '—']]));

    }

  // ------------------------------------------- 1.14 hétéroscédasticité
  A.widgets.hetero = function (el) {
    const g = A.gabarit(el, 'Les résidus des modèles 1.6 et 1.9', 'Un résidu = ln(prix) observé − ln(prix) prédit. Si la variance des erreurs était constante, le nuage formerait une bande horizontale d’épaisseur régulière, centrée sur zéro, quelle que soit la région.');
    const etat = { mod: 'll', axe: 'ajuste' };
    g.commandes.append(A.choix('Modèle', [['ll', '1.6 : log-log'], ['m9', '1.9 : + régions']], etat.mod, (v) => { etat.mod = v; dessiner(); }), A.choix('En abscisse', [['ajuste', 'Valeurs ajustées'], ['ventes', 'ln(nombre de ventes)']], etat.axe, (v) => { etat.axe = v; dessiner(); }));

    const lv = C.map((c) => Math.log(c.ventes));

  // ------------------------------------------------ graphique « en forêt »
  A.widgets.foret = function (el, p) {

      axe = 'Effet sur les semaines travaillées en 1979'; repere = 0; dom = [-13.5, 2];

<script>
// ---- widgets-p2.js ----
// Outils de la partie 2 (enfants et travail des mères) : schéma causal, estimateur de Wald,
// simulation de l'endogénéité, compositions de la fratrie, « compliers ».
(function () {
  'use strict';
  const A = window.A, h = A.h, s = A.s, S = A.stats, fmt = A.fmt;
  const F = A.D.fert || { cellules: [] };
  // Moyennes par groupe à partir des 8 cellules (sexe 1 × sexe 2 × morekids).
  const somme = (filtre) => { const o = { n: 0, sw: 0, d: 0, nw: 0 }; F.cellules.forEach((c) => { if (filtre(c)) { o.n += c.n; o.sw += c.sw; o.d += c.mk * c.n; o.nw += c.nw; } }); o.work = o.sw / o.n; o.p = o.d / o.n; return o; };
  const Z0 = somme((c) => c.g1 !== c.g2), Z1 = somme((c) => c.g1 === c.g2);

  // ----------------------------------------------------------- schéma causal
  const JEUX = {
    enfants: { Z: ['Même sexe', '(samegender)'], X: ['3ᵉ enfant', '(morekids)'], Y: ['Semaines', 'travaillées'], U: ['Non observé :', 'préférences, carrière,', 'revenu du conjoint…'] },
    communes: { X: ['Revenu', 'des habitants'], Y: ['Prix', 'des maisons'], U: ['Non observé :', 'emplois, écoles,', 'cadre de vie…'] },
    generique: { Z: ['Instrument', 'Z'], X: ['Cause', 'supposée X'], Y: ['Résultat', 'Y'], U: ['Facteur caché', 'U'] }
  };
  const SCHEMAS = {
    mco: { nom: 'Le problème', texte: 'On veut la flèche **X → Y**. Mais un facteur non observé U agit à la fois sur X et sur Y : comparer les valeurs de Y selon X mélange l’effet de X et celui de U. C’est un **facteur de confusion** ; l’estimateur des MCO est biaisé.' },
    vi: { nom: 'La solution : un instrument', texte: 'L’instrument Z fait varier X (**pertinence**) sans être lié à U (**indépendance**) et sans agir sur Y autrement que par X (**exclusion**). La part de X provoquée par Z est donc « propre » : on n’utilise qu’elle.' },
    exclusion: { nom: 'Exclusion violée', texte: 'Si Z agit **directement** sur Y (flèche rouge) — par exemple si deux enfants de même sexe coûtent moins cher et réduisent le besoin d’un second salaire —, l’effet de Z sur Y ne passe plus seulement par X : la division de Wald attribue à X un effet qui n’est pas le sien.' },
    independance: { nom: 'Indépendance violée', texte: 'Si Z est **lié à U** (trait rouge) — par exemple si le sexe des enfants influençait le divorce, alors que l’échantillon ne garde que des femmes mariées —, Z n’est plus « comme tiré au sort » et hérite du problème de confusion.' },
    inverse: { nom: 'Causalité inverse', texte: 'Y peut aussi agir sur X (flèche rouge) : des maisons chères filtrent les ménages qui peuvent s’installer, donc le revenu des habitants est en partie une **conséquence** des prix. La pente mesure alors un mélange des deux sens.' }
  };
  A.widgets.dag = function (el, p) {
    const jeu = JEUX[p.jeu] ? p.jeu : 'enfants', N = JEUX[jeu];
    const dispo = jeu === 'communes' ? ['mco', 'inverse'] : jeu === 'generique' ? ['mco', 'vi'] : ['mco', 'vi', 'exclusion', 'independance'];
    let schema = dispo.includes(p.schema) ? p.schema : dispo[0];
    const g = A.gabarit(el, p.titre || 'Qui cause quoi ? Le schéma à avoir en tête', 'Chaque flèche se lit « agit sur ». Change de schéma pour voir ce que chaque hypothèse autorise ou interdit.');
    if (dispo.length > 1) g.commandes.append(A.choix('Schéma', dispo.map((k) => [k, SCHEMAS[k].nom]), schema, (v) => { schema = v; dessiner(); }));
    function dessiner() {
      g.zone.textContent = ''; g.zone.classList.add('graphe');
      const L = Math.max(280, Math.floor(g.zone.clientWidth || 640)), H = 250, lb = Math.min(132, L * 0.28), hb = 46;
      const svg = s('svg', { viewBox: '0 0 ' + L + ' ' + H, width: L, height: H, role: 'img', 'aria-label': 'Schéma causal : ' + SCHEMAS[schema].nom, class: 'schema' });
      g.zone.append(svg);
      const avecZ = !!N.Z && schema !== 'mco';
      const xX = (!avecZ && L < 560) ? lb / 2 + 4 : L / 2;
      const pos = { Z: [lb / 2 + 4, 178], X: [xX, 178], Y: [L - lb / 2 - 4, 178], U: [(xX + L - lb / 2 - 4) / 2, 44] };
      const fleche = function (a, b, cls, courbe) {
        let [x1, y1] = a, [x2, y2] = b;
        const d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d;
        let chemin;
        if (courbe) { const mx = (x1 + x2) / 2, my = Math.max(y1, y2) + courbe; chemin = 'M' + x1 + ' ' + y1 + 'Q' + mx + ' ' + my + ' ' + x2 + ' ' + y2; }
        else chemin = 'M' + x1 + ' ' + y1 + 'L' + (x2 - ux * 7) + ' ' + (y2 - uy * 7);
        svg.append(s('path', { d: chemin, class: 'fleche ' + cls }));
        const ax = courbe ? (x2 - (x1 + x2) / 2) : ux, ay = courbe ? (y2 - (Math.max(y1, y2) + courbe)) : uy, an = Math.hypot(ax, ay), vx = ax / an, vy = ay / an;
        svg.append(s('polygon', { points: [x2, y2, x2 - vx * 11 - vy * 5.5, y2 - vy * 11 + vx * 5.5, x2 - vx * 11 + vy * 5.5, y2 - vy * 11 - vx * 5.5].join(' '), class: 'pointe ' + cls }));
      };
      const bord = (n, vers) => { const [x, y] = pos[n], [tx, ty] = pos[vers], dx = tx - x, dy = ty - y; if (Math.abs(dx) * hb > Math.abs(dy) * lb) return [x + Math.sign(dx) * (lb / 2 + 3), y + dy * (lb / 2 + 3) / Math.abs(dx)]; return [x + dx * (hb / 2 + 3) / Math.abs(dy), y + Math.sign(dy) * (hb / 2 + 3)]; };
      fleche(bord('U', 'X'), bord('X', 'U'), 'pale'); fleche(bord('U', 'Y'), bord('Y', 'U'), 'pale');
      fleche(bord('X', 'Y'), bord('Y', 'X'), schema === 'mco' || schema === 'inverse' ? 'vif' : '');
      if (avecZ) fleche(bord('Z', 'X'), bord('X', 'Z'), schema === 'vi' ? 'vif' : '');
      if (schema === 'exclusion') fleche([pos.Z[0], pos.Z[1] + hb / 2 + 3], [pos.Y[0], pos.Y[1] + hb / 2 + 3], 'mal', 38);
      if (schema === 'independance') { const a = [pos.Z[0], pos.Z[1] - hb / 2 - 3], b = [pos.U[0] - lb / 2 - 3, pos.U[1]]; svg.append(s('path', { d: 'M' + a[0] + ' ' + a[1] + 'Q' + a[0] + ' ' + b[1] + ' ' + b[0] + ' ' + b[1], class: 'fleche mal' })); }
      if (schema === 'inverse') fleche([pos.Y[0], pos.Y[1] + hb / 2 + 3], [pos.X[0], pos.X[1] + hb / 2 + 3], 'mal', 34);
      Object.keys(pos).forEach((n) => {
        if (!N[n] || (n === 'Z' && !avecZ)) return;
        const [x, y] = pos[n], lignes = N[n], hh = n === 'U' ? 16 * lignes.length + 14 : hb, w = n === 'U' ? Math.min(170, L * 0.42) : lb;
        svg.append(s('rect', { x: x - w / 2, y: y - hh / 2, width: w, height: hh, rx: 6, class: 'noeud' + (n === 'U' ? ' cache' : '') }));
        lignes.forEach((t, i) => svg.append(s('text', { x, y: y - (lignes.length - 1) * 8 + i * 16 + 4, 'text-anchor': 'middle', class: i === 0 && n !== 'U' ? 'etq' : 'etq2', text: t })));
      });
      const etq = (x, y, t, cls) => svg.append(s('text', { x, y, 'text-anchor': 'middle', class: cls || 'etq2', text: t }));
      if (L > 520) {
        etq((pos.X[0] + pos.Y[0]) / 2, pos.X[1] - 9, 'effet causal β₁');
        if (avecZ) etq((pos.Z[0] + pos.X[0]) / 2, pos.Z[1] - 9, 'pertinence');
        if (schema === 'exclusion') etq(L / 2, 243, 'effet direct interdit');
        if (schema === 'inverse') etq((pos.X[0] + pos.Y[0]) / 2, 243, 'tri des ménages');
      }
      g.lecture.innerHTML = A.md(SCHEMAS[schema].texte);
    }
    A.adapter(g.zone, dessiner);
  };

  // -------------------------------------------------- Wald : forme réduite / 1re étape
  A.widgets.wald = function (el) {
    const g = A.gabarit(el, 'L’estimateur de Wald : une division', 'Compare les mères selon le sexe de leurs deux premiers enfants. Le sexe change **un peu** la probabilité d’un troisième enfant (première étape) et **un peu** le travail (forme réduite). Le rapport des deux donne l’effet d’un troisième enfant.');
    const REEL = { pe: Z1.p - Z0.p, fr: Z1.work - Z0.work };
    const etat = { pe: REEL.pe, fr: REEL.fr };
    const cPe = A.curseur('Première étape (points de %)', 0.2, 20, 0.05, 100 * etat.pe, (v) => A.signe(v, 2), (v) => { etat.pe = v / 100; dessiner(); });
    const cFr = A.curseur('Forme réduite (semaines)', -2, 0, 0.005, etat.fr, (v) => A.signe(v, 3), (v) => { etat.fr = v; dessiner(); });
    g.commandes.append(cPe, cFr, h('button', { class: 'btn petit', type: 'button', onclick: () => { etat.pe = REEL.pe; etat.fr = REEL.fr; cPe.regler(100 * REEL.pe); cFr.regler(REEL.fr); dessiner(); } }, 'Valeurs réelles'));
    const gauche = h('div'), droite = h('div'), formule = h('div', { class: 'formule-grande' });
    g.zone.append(h('div', { class: 'deux-col' }, gauche, droite), formule);
    g.legende.append(A.legende([{ c: 's-mute', nom: 'Sexes différents (' + fmt(Z0.n) + ' mères)' }, { c: 's1', nom: 'Même sexe (' + fmt(Z1.n) + ' mères)' }]));
    function panneau(hote, titre, v0, v1, dom, f, etiquette) {
      hote.textContent = '';
      const zone = h('div');
      hote.append(h('div', { class: 'rubrique', text: titre }), zone, h('p', { class: 'note-pied', style: 'text-align:center;margin:2px 0 0', text: etiquette }));
      const G = A.graphe(zone, { nom: titre, h: 210, x: { dom: [0.3, 2.7], grad: [1, 2], fmt: (v) => (v === 1 ? 'Sexes différents' : 'Même sexe') }, y: { dom, fmt: (v) => f(v, 0) }, marges: { g: 46 } }).axes();
      G.barre(1, v0, 24, 'c0'); G.barre(2, v1, 24, 'c1');
      G.texte(1, v0, f(v0), { ancre: 'middle', dy: -7 }); G.texte(2, v1, f(v1), { ancre: 'middle', dy: -7 });
    }
    function dessiner() {
      const p1 = Z0.p + etat.pe, w1 = Z0.work + etat.fr, effet = etat.fr / etat.pe, reel = Math.abs(etat.pe - REEL.pe) < 1e-6 && Math.abs(etat.fr - REEL.fr) < 1e-6;
      panneau(gauche, 'Part des mères avec un 3ᵉ enfant', Z0.p, p1, [0, 0.65], (v, d) => fmt(100 * v, d == null ? 1 : d) + ' %', 'Première étape : ' + A.signe(100 * etat.pe, 2) + ' points');
      panneau(droite, 'Semaines travaillées en moyenne', Z0.work, w1, [0, 26], (v, d) => fmt(v, d == null ? 2 : d), 'Forme réduite : ' + A.signe(etat.fr, 3) + ' semaine');
      formule.innerHTML = A.math('\\frac{\\text{forme réduite}}{\\text{première étape}} = \\frac{' + fmt(etat.fr, 4) + '}{' + fmt(etat.pe, 4) + '} = ') + ' <b>' + fmt(effet, 2) + ' semaines</b>';
      g.lecture.innerHTML = '<p>Prends 100 mères de chaque groupe. Dans le groupe « même sexe », il y a <b>' + fmt(100 * etat.pe, 2) + ' troisièmes enfants de plus</b>, et ces 100 mères travaillent au total <b>' + fmt(-100 * etat.fr, 1) + ' semaines de moins</b>. Si toute la baisse vient de ces enfants supplémentaires (c’est la restriction d’exclusion), chacun « coûte » ' + fmt(-100 * etat.fr, 1) + ' / ' + fmt(100 * etat.pe, 2) + ' = <b>' + fmt(-effet, 1) + ' semaines</b>.</p>' +
        (reel ? '<p>Ce sont les vraies valeurs : on retrouve exactement l’estimation par variables instrumentales de la question 2.6 (−6,31).</p>' : etat.pe < 0.02 ? '<p><b>Instrument faible</b> : la première étape est proche de zéro. On divise par presque rien : la moindre erreur sur la forme réduite fait exploser le résultat.</p>' : '<p>Valeurs modifiées. Réduis la première étape vers zéro pour voir ce qu’est un instrument faible.</p>');
    }
    A.adapter(g.zone, dessiner);
  };

  // ------------------------------------ simulation : MCO biaisés, VI imprécise
  A.widgets.simiv = function (el) {
    const g = A.gabarit(el, 'Simulation : MCO précis mais biaisés, VI juste mais imprécise', 'Un monde inventé où l’on **connaît** la vérité : un 3ᵉ enfant réduit le travail de **5 semaines**. Une variable cachée (l’attachement à la carrière) réduit la probabilité d’un 3ᵉ enfant et augmente le travail. Chaque point est l’estimation obtenue sur un échantillon simulé.');
    const etat = { conf: 0.5, force: 0.5, n: 5000 }, BETA = -5, R = 250;
    let res = null;
    g.commandes.append(A.curseur('Force de la variable cachée', 0, 1.5, 0.05, etat.conf, (v) => fmt(v, 2), (v) => { etat.conf = v; }),
      A.curseur('Force de l’instrument', 0.02, 1.2, 0.01, etat.force, (v) => fmt(v, 2), (v) => { etat.force = v; }),
      A.choix('Taille d’échantillon', [[1000, '1 000'], [5000, '5 000'], [25000, '25 000']], etat.n, (v) => { etat.n = +v; }),
      h('button', { class: 'btn plein', type: 'button', onclick: (ev) => { const bt = ev.currentTarget; bt.disabled = true; bt.textContent = 'Calcul…'; setTimeout(() => { simuler(); dessiner(); bt.disabled = false; bt.textContent = 'Lancer ' + R + ' simulations'; }, 30); } }, 'Lancer ' + R + ' simulations'));
    g.legende.append(A.legende([{ c: 's2', nom: 'MCO' }, { c: 's1', nom: 'Variables instrumentales' }]));
    function simuler() {
      const u = A.alea(Math.floor(etat.conf * 1000 + etat.force * 100000 + etat.n)), mco = [], vi = []; let pe = 0;
      for (let r = 0; r < R; r++) {
        let n1 = 0, s1 = 0, n0 = 0, s0 = 0, nz1 = 0, xz1 = 0, yz1 = 0, nz0 = 0, xz0 = 0, yz0 = 0;
        for (let i = 0; i < etat.n; i++) {
          const U = u.normale(), Z = u() < 0.5 ? 1 : 0, X = (-0.35 + etat.force * Z - etat.conf * U + u.normale()) > 0 ? 1 : 0, Y = 20 + BETA * X + 6 * etat.conf * U + 14 * u.normale();
          if (X) { n1++; s1 += Y; } else { n0++; s0 += Y; }
          if (Z) { nz1++; xz1 += X; yz1 += Y; } else { nz0++; xz0 += X; yz0 += Y; }
        }
        const d = xz1 / nz1 - xz0 / nz0;
        mco.push(s1 / n1 - s0 / n0); vi.push((yz1 / nz1 - yz0 / nz0) / d); pe += d;
      }
      res = { mco, vi, pe: pe / R };
    }
    function dessiner() {
      const a = -20, b = 10;
      const G = A.graphe(g.zone, { nom: 'Estimations simulées par MCO et par variables instrumentales', ratio: 0.36, hmin: 210, hmax: 300, x: { dom: [a, b], titre: 'Effet estimé d’un 3ᵉ enfant (semaines)', grille: true }, y: { dom: [-0.6, 1.6], masque: true, sansGrille: true } }).axes();
      G.verticale(BETA, 'tink'); G.texte(BETA, 1.6, 'vérité : −5', { dx: 6, dy: 12 });
      if (!res) return;
      const j = A.alea(3); let hors = 0;
      [['mco', 1, 'c2', 'MCO'], ['vi', 0, 'c1', 'VI']].forEach(([k, y0, cls, nom]) => {
        res[k].forEach((v) => { if (v < a || v > b) { if (k === 'vi') hors++; return; } const pt = G.point(v, y0 + (j() - 0.5) * 0.6, cls, 2.6); pt.setAttribute('class', cls); pt.setAttribute('opacity', 0.55); });
        G.texte(b, y0 + 0.42, nom, { ancre: 'end', dx: -4, dy: 0 });
      });
      const mm = S.moyenne(res.mco), sm = S.ecartType(res.mco), med = S.mediane(res.vi), sv = S.ecartType(res.vi.filter((v) => v > -60 && v < 50));
      g.lecture.innerHTML = '<p><b>MCO</b> : estimations centrées sur ' + fmt(mm, 2) + ' (biais de ' + A.signe(mm - BETA, 2) + '), très groupées (écart-type ' + fmt(sm, 2) + '). ' + (Math.abs(mm - BETA) > 3 * sm ? 'Précis… mais faux : la vérité est en dehors du nuage.' : 'Sans variable cachée, les MCO sont justes <em>et</em> précis : inutile d’instrumenter.') + '</p>' +
        '<p><b>VI</b> : estimations centrées sur ' + fmt(med, 2) + ' (médiane), mais ' + fmt(sv / sm, 0) + ' fois plus dispersées (écart-type ' + fmt(sv, 2) + ')' + (hors ? ' ; ' + hors + ' estimations sortent du cadre' : '') + '. L’instrument déplace la probabilité d’un 3ᵉ enfant de ' + fmt(100 * res.pe, 1) + ' points en moyenne.' + (res.pe < 0.03 ? ' <b>Instrument faible</b> : les estimations partent dans tous les sens.' : '') + '</p>' +
