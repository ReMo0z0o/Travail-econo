  // ---------------------------------------------- 2.5 les quatre compositions
  A.widgets.compo = function (el) {
    const g = A.gabarit(el, 'Qui a un troisième enfant ? Les quatre compositions', 'Part des mères ayant plus de deux enfants selon le sexe des deux premiers (dans l’ordre des naissances), avec l’intervalle de confiance à 95 %.');
    const ORD = [['G', 'G', 'Garçon-garçon', 'G-G'], ['G', 'F', 'Garçon-fille', 'G-F'], ['F', 'G', 'Fille-garçon', 'F-G'], ['F', 'F', 'Fille-fille', 'F-F']];
    const pts = ORD.map(([a, b, nom, court], i) => { const o = somme((c) => c.g1 === a && c.g2 === b), se = Math.sqrt(o.p * (1 - o.p) / o.n); return { x: i + 1, y: o.p, n: o.n, se, nom, court, meme: a === b }; });
    g.legende.append(A.legende([{ c: 's1', nom: 'Deux enfants de même sexe' }, { c: 's-mute', nom: 'Un garçon et une fille' }]));
    g.apres.append(A.vueTable('Voir les valeurs', ['Composition', 'Mères', 'Plus de deux enfants', 'IC à 95 %'], pts.map((q) => [q.nom, fmt(q.n), fmt(100 * q.y, 2) + ' %', '[' + fmt(100 * (q.y - 1.96 * q.se), 2) + ' ; ' + fmt(100 * (q.y + 1.96 * q.se), 2) + ']'])));
    function dessiner() {
      const etroit = (g.zone.clientWidth || 680) < 480;
      const G = A.graphe(g.zone, { nom: 'Part des mères ayant un troisième enfant selon le sexe des deux premiers', ratio: 0.5, hmax: 360, x: { dom: [0.5, 4.5], grad: [1, 2, 3, 4], fmt: (v) => pts[v - 1][etroit ? 'court' : 'nom'] }, y: { dom: [0.33, 0.44], fmt: (v) => fmt(100 * v, 0) + ' %', titre: 'Mères avec plus de deux enfants' } }).axes();
      pts.forEach((q) => { const cls = q.meme ? 't1' : 't0'; G.segment(q.x, q.y - 1.96 * q.se, q.x, q.y + 1.96 * q.se, cls); [-1, 1].forEach((sg) => { const yy = q.y + sg * 1.96 * q.se; G.marques.append(s('line', { x1: G.px(q.x) - 6, x2: G.px(q.x) + 6, y1: G.py(yy), y2: G.py(yy), class: 'trait ' + cls })); }); G.point(q.x, q.y, q.meme ? 'c1' : 'c0', 5.5); G.texte(q.x, q.y, fmt(100 * q.y, 1) + ' %', { dx: 12, dy: 4 }); });
      G.survolProche(pts, (q) => [q.nom, [['Mères', fmt(q.n)], ['Plus de deux enfants', fmt(100 * q.y, 2) + ' %'], ['IC à 95 %', '[' + fmt(100 * (q.y - 1.96 * q.se), 2) + ' ; ' + fmt(100 * (q.y + 1.96 * q.se), 2) + ']']]]);
      g.lecture.innerHTML = '<p>Les deux compositions mixtes sont au même niveau (' + fmt(100 * pts[1].y, 1) + ' % et ' + fmt(100 * pts[2].y, 1) + ' %) : l’ordre garçon-fille ou fille-garçon ne change rien. Deux garçons ajoutent ' + A.signe(100 * (pts[0].y - pts[1].y), 1) + ' points, deux filles ' + A.signe(100 * (pts[3].y - pts[2].y), 1) + ' points : l’effet existe dans les deux cas, mais il est plus fort après deux filles.</p>';
    }
    A.adapter(g.zone, dessiner);
  };

  // ------------------------------------------------------ 2.14 les compliers
  A.widgets.compliers = function (el) {
    const g = A.gabarit(el, 'Pour quelles mères l’effet est-il mesuré ? Les « compliers »', 'Sous l’hypothèse de monotonie, les mères se répartissent en trois groupes selon leur réaction à l’instrument. La VI ne mesure l’effet que pour le groupe du milieu.');
    let inst = 'samegender';
    const DEF = { samegender: [(c) => c.g1 === c.g2, (c) => c.g1 !== c.g2, 'deux enfants de même sexe'], twoboys: [(c) => c.g1 === 'G' && c.g2 === 'G', (c) => c.g1 === 'G' && c.g2 === 'F', 'deux garçons (parmi les familles dont l’aîné est un garçon)'], twogirls: [(c) => c.g1 === 'F' && c.g2 === 'F', (c) => c.g1 === 'F' && c.g2 === 'G', 'deux filles (parmi les familles dont l’aînée est une fille)'] };
    g.commandes.append(A.choix('Instrument', [['samegender', 'samegender'], ['twoboys', 'twoboys'], ['twogirls', 'twogirls']], inst, (v) => { inst = v; dessiner(); }));
    function dessiner() {
      const a = somme(DEF[inst][0]), b = somme(DEF[inst][1]), toujours = b.p, jamais = 1 - a.p, comp = a.p - b.p;
      g.zone.textContent = '';
      const seg = (part, cls, nom) => h('div', { class: 'seg-part ' + cls, style: 'flex:' + part, title: nom + ' : ' + fmt(100 * part, 1) + ' %' }, part > 0.12 ? fmt(100 * part, 1) + ' %' : '');
      g.zone.append(h('div', { class: 'segbar', role: 'img', 'aria-label': 'Jamais : ' + fmt(100 * jamais, 1) + ' %, compliers : ' + fmt(100 * comp, 1) + ' %, toujours : ' + fmt(100 * toujours, 1) + ' %' }, seg(jamais, 'p0', 'Jamais de 3ᵉ enfant'), seg(comp, 'p1', 'Compliers'), seg(toujours, 'p2', 'Toujours un 3ᵉ enfant')),
        A.legende([{ c: 's-mute', nom: '« Never-takers » : pas de 3ᵉ enfant, quel que soit le sexe des deux premiers (' + fmt(100 * jamais, 1) + ' %)' }, { c: 's1', nom: '« Compliers » : un 3ᵉ enfant seulement parce que les deux premiers sont de même sexe (' + fmt(100 * comp, 1) + ' %)' }, { c: 's2', nom: '« Always-takers » : un 3ᵉ enfant de toute façon (' + fmt(100 * toujours, 1) + ' %)' }]));
      g.lecture.innerHTML = '<p>Instrument : ' + DEF[inst][2] + '. Sans l’instrument, ' + fmt(100 * b.p, 1) + ' % des mères ont un 3ᵉ enfant : ce sont les « always-takers ». Avec, ' + fmt(100 * a.p, 1) + ' % : les ' + fmt(100 * jamais, 1) + ' % restants sont les « never-takers ». La différence, <b>' + fmt(100 * comp, 1) + ' %</b>, ce sont les compliers — et c’est aussi la première étape.</p><p>L’estimation VI est l’effet moyen <em>pour ces mères-là</em> (un effet local, « LATE »). On ne peut pas les identifier une à une, et rien ne garantit que l’effet soit le même pour les autres. Change d’instrument : la part et la composition des compliers changent, ce qui peut expliquer que <code>twoboys</code> et <code>twogirls</code> ne donnent pas la même estimation.</p>';
    }
    dessiner();
  };
})();

<script>
// ---- widgets-p3.js ----
// Outils de la partie 3 (électrification au Burkina Faso) : double différence 2×2 (avec choix
// du groupe de comparaison), tendances annuelles et placebo, effets fixes, erreurs-types groupées.
(function () {
  'use strict';
  const A = window.A, h = A.h, S = A.stats, fmt = A.fmt;
  const E = A.D.elec || { loc: [], annees: [], series: [] };
  const AN = E.annees, pts = (v, d) => A.signe(100 * v, d == null ? 1 : d) + ' point' + (Math.abs(100 * v) >= 2 ? 's' : '');
  const TRAITE = (an) => an === 2008 || an === 2009;
  const TEMOINS = { c1517: { nom: 'Électrifiées en 2015-2017 (énoncé)', f: (an) => an >= 2015 && an <= 2017 }, c1014: { nom: 'Électrifiées en 2010-2014', f: (an) => an >= 2010 && an <= 2014 }, tous: { nom: 'Toutes les autres (2010-2017)', f: (an) => an >= 2010 } };
  const table = function (tete, lignes) {
    const t = h('table'); t.append(h('thead', null, h('tr', null, tete.map((c, i) => h('th', { class: i ? 'd' : '', text: c })))));
    const b = h('tbody'); lignes.forEach((l) => b.append(h('tr', null, l.map((c, i) => h('td', { class: i ? 'd' : '', html: A.inline(String(c)) }))))); t.append(b);
    return h('div', { class: 'table-boite' }, t);
  };
  // Observations (localité × année) d'un plan : groupe traité, groupe témoin, années exclues.
  function plan(temoin, avant, apres) {
    const X = [], y = [], g = [], cel = [[0, 0, 0, 0], [0, 0, 0, 0]];   // cel[traité][période] = somme, n
    E.loc.forEach(([an, , nl], id) => {
      const t = TRAITE(an) ? 1 : temoin(an) ? 0 : -1; if (t < 0) return;
      AN.forEach((a, j) => { if (nl[j] === '-') return; const p = avant(a) ? 0 : apres(a) ? 1 : -1; if (p < 0) return; const v = +nl[j]; X.push([1, t, p, t * p]); y.push(v); g.push(id); cel[t][p * 2] += v; cel[t][p * 2 + 1]++; });
    });
    const moy = (t, p) => cel[t][p * 2] / cel[t][p * 2 + 1];
    return { X, y, g, m: { T0: moy(1, 0), T1: moy(1, 1), C0: moy(0, 0), C1: moy(0, 1) }, nT: E.loc.filter((l) => TRAITE(l[0])).length, nC: E.loc.filter((l) => !TRAITE(l[0]) && temoin(l[0])).length };
  }

  // ------------------------------------------------- 3.3 / 3.4 double différence
  A.widgets.did = function (el, p) {
    const g = A.gabarit(el, 'La double différence, pas à pas', 'Part des localités dont la lumière est détectée par satellite (`nl_extensive`). Passe d’une comparaison naïve à la double différence, puis change le groupe de comparaison pour voir ce qui se passe quand il est mal choisi.');
    const etat = { temoin: 'c1517', etape: p.etape || 'did' };
    g.commandes.append(A.choix('Comparaison', [['apres', '① Après seulement'], ['avantapres', '② Avant / après'], ['did', '③ Double différence']], etat.etape, (v) => { etat.etape = v; dessiner(); }),
      A.choix('Groupe de comparaison', Object.keys(TEMOINS).map((k) => [k, TEMOINS[k].nom]), etat.temoin, (v) => { etat.temoin = v; dessiner(); }));
    g.legende.append(A.legende([{ c: 's1', nom: 'Traitées (électrifiées en 2008-2009)', type: 'ligne' }, { c: 's2', nom: 'Groupe de comparaison', type: 'ligne' }, { c: 's1', nom: 'Traitées sans électricité (hypothèse)', type: 'tiret' }]));
    function dessiner() {
      const P = plan(TEMOINS[etat.temoin].f, (a) => a <= 2007, (a) => a >= 2010), m = P.m, e = etat.etape;
      const dd = (m.T1 - m.T0) - (m.C1 - m.C0), contre = m.T0 + (m.C1 - m.C0), reg = S.mco(P.X, P.y, { groupes: P.g });
      const G = A.graphe(g.zone, { nom: 'Part des localités éclairées avant et après, groupe traité et groupe de comparaison', ratio: 0.5, hmax: 380, x: { dom: [0.55, 2.75], grad: [1, 2], fmt: (v) => (v === 1 ? 'Avant (2003-2007)' : 'Après (2010-2014)') }, y: { dom: [0, 0.5], fmt: (v) => fmt(100 * v, 0) + ' %', titre: 'Localités éclairées' } }).axes();
      G.segment(1, m.C0, 2, m.C1, 't2'); G.segment(1, m.T0, 2, m.T1, 't1');
      [[1, m.C0, 'c2'], [2, m.C1, 'c2'], [1, m.T0, 'c1'], [2, m.T1, 'c1']].forEach(([x, y, c]) => G.point(x, y, c, 5));
      G.texte(1, m.T0, fmt(100 * m.T0, 1) + ' %', { ancre: 'end', dx: -9, dy: -5 }); G.texte(1, m.C0, fmt(100 * m.C0, 1) + ' %', { ancre: 'end', dx: -9, dy: 14 });
      const accolade = (ya, yb, txt) => { const s2 = G.segment(2.09, ya, 2.09, yb, 'tink'); s2.setAttribute('stroke-width', 2.5); [ya, yb].forEach((yy) => G.marques.append(A.s('line', { x1: G.px(2.09) - 5, x2: G.px(2.09) + 5, y1: G.py(yy), y2: G.py(yy), class: 'trait tink' }))); G.texte(2.09, (ya + yb) / 2, txt, { dx: 10, dy: 4 }); };
      let txt;
      if (e === 'apres') { accolade(m.C1, m.T1, pts(m.T1 - m.C1));
        txt = '<p><b>① Après seulement</b> : ' + fmt(100 * m.T1, 1) + ' % − ' + fmt(100 * m.C1, 1) + ' % = <b>' + pts(m.T1 - m.C1) + '</b>. Cette différence contient l’effet du réseau <em>et</em> l’écart qui existait déjà avant (' + pts(m.T0 - m.C0) + ') : c’est un <b>biais de sélection</b>.</p>';
      } else if (e === 'avantapres') { G.segment(1, m.T0, 2, m.T0, 't1 tirets'); accolade(m.T0, m.T1, pts(m.T1 - m.T0));
        txt = '<p><b>② Avant / après chez les traitées</b> : ' + fmt(100 * m.T1, 1) + ' % − ' + fmt(100 * m.T0, 1) + ' % = <b>' + pts(m.T1 - m.T0) + '</b>. Cette différence contient l’effet du réseau <em>et</em> tout ce qui a changé pour tout le monde entre les deux périodes (' + pts(m.C1 - m.C0) + ' dans le groupe de comparaison) : c’est un <b>biais de tendance</b>.</p>';
      } else { G.segment(1, m.T0, 2, contre, 't1 tirets'); G.point(2, contre, 'c1', 4).setAttribute('opacity', 0.55); accolade(contre, m.T1, 'effet : ' + pts(dd));
        txt = '<p><b>③ Double différence</b> : (' + fmt(100 * m.T1, 1) + ' − ' + fmt(100 * m.T0, 1) + ') − (' + fmt(100 * m.C1, 1) + ' − ' + fmt(100 * m.C0, 1) + ') = ' + fmt(100 * (m.T1 - m.T0), 1) + ' − ' + fmt(100 * (m.C1 - m.C0), 1) + ' = <b>' + pts(dd) + '</b>. La ligne en tirets est ce qu’auraient fait les traitées sans électricité <em>si</em> elles avaient suivi la même évolution que le groupe de comparaison (tendances parallèles) : ' + fmt(100 * contre, 1) + ' % au lieu des ' + fmt(100 * m.T1, 1) + ' % observés.</p>';
      }
      if (etat.temoin !== 'c1517') txt += '<p><b>Attention au groupe de comparaison</b> : ' + (etat.temoin === 'c1014' ? 'ces localités sont elles-mêmes raccordées <em>pendant</em> la période « après »' : 'une partie de ces localités est raccordée <em>pendant</em> la période « après »') + '. Leur lumière augmente donc à cause de leur propre électrification (' + pts(m.C1 - m.C0) + ' au lieu de +0,9 point), et la double différence retranche une partie de l’effet qu’on cherche : elle tombe à ' + pts(dd) + ' au lieu de +38,0 points.</p>';
      g.lecture.innerHTML = txt;
      g.apres.textContent = '';
      g.apres.append(table(['', 'Avant (2003-2007)', 'Après (2010-2014)', 'Variation'], [
        ['Traitées (' + P.nT + ' localités)', fmt(100 * m.T0, 2) + ' %', fmt(100 * m.T1, 2) + ' %', pts(m.T1 - m.T0, 2)],
        ['Comparaison (' + P.nC + ' localités)', fmt(100 * m.C0, 2) + ' %', fmt(100 * m.C1, 2) + ' %', pts(m.C1 - m.C0, 2)],
        ['Écart traitées − comparaison', pts(m.T0 - m.C0, 2), pts(m.T1 - m.C1, 2), '**' + pts(dd, 2) + '**']]),
        h('div', { class: 'chiffres' }, A.chiffre('Coefficient de treated × post', fmt(reg.b[3], 4), fmt(reg.n) + ' observations'), A.chiffre('Erreur-type robuste HC1', fmt(reg.seHC1[3], 4), 't = ' + fmt(reg.b[3] / reg.seHC1[3], 1)), A.chiffre('Erreur-type groupée par localité', fmt(reg.seCL[3], 4), reg.G + ' localités, t = ' + fmt(reg.b[3] / reg.seCL[3], 1))));
    }
    A.adapter(g.zone, dessiner);
  };

  // --------------------------------------------- 3.6 tendances et placebo
  A.widgets.tendances = function (el) {
    const g = A.gabarit(el, 'Les deux groupes année par année', 'Avant 2008, les deux courbes évoluent-elles de la même façon ? La zone grisée (2008-2009) correspond aux années de raccordement du groupe traité, exclues de l’estimation.');
    const VARS = { nl_extensive: ['Localités éclairées (nl_extensive)', (v) => fmt(100 * v, 0) + ' %', (v) => fmt(100 * v, 1) + ' %'], nl_intensive_hat: ['Intensité lumineuse (nl_intensive_hat)', (v) => fmt(v, 1), (v) => fmt(v, 3)], nschool_elec: ['Écoles primaires électrifiées', (v) => fmt(v, 1), (v) => fmt(v, 2)], n_students_public: ['Élèves du primaire public', (v) => fmt(v, 0), (v) => fmt(v, 1)] };
    const LECT = {
      nl_intensive_hat: 'Variable définie seulement pour les localités éclairées au moins une fois (139 sur 297). Chez les traitées, l’intensité monte déjà un peu avant 2008 (de −0,01 à 0,21), alors que le groupe de comparaison reste plat : pour cette variable, les tendances parallèles sont moins nettes.',
      nschool_elec: 'Variable disponible jusqu’en 2012 seulement. Regarde la chute entre 2005 et 2006, dans les <b>deux</b> groupes : elle ressemble à un changement dans le relevé de la variable. La période « avant » mélange deux régimes, ce qui fragilise l’estimation de la question 3.5 (a).',
      n_students_public: 'Variable disponible jusqu’en 2012 seulement. Le nombre d’élèves baisse dans les deux groupes après 2007 ; rien n’indique que les localités raccordées en gagnent.'
    };
    const etat = { v: 'nl_extensive', tiers: false, k: 2005 };
    const serie = (t, v) => AN.map((a) => { const l = E.series.find((r) => r.treated === t && r.year === a); return l && l[v] != null ? l[v] : null; });
    const milieu = AN.map((a, j) => { let sm = 0, n = 0; E.loc.forEach(([an, , nl]) => { if (an >= 2010 && an <= 2014 && nl[j] !== '-') { sm += +nl[j]; n++; } }); return sm / n; });
    const select = h('select', { id: A.uid('sel'), 'aria-label': 'Variable' });
    Object.keys(VARS).forEach((k) => select.append(h('option', { value: k, text: VARS[k][0] })));
    select.addEventListener('change', () => { etat.v = select.value; dessiner(); });
    g.commandes.append(h('label', { class: 'commande' }, h('span', { text: 'Variable' }), select), A.case('Ajouter les localités électrifiées en 2010-2014', false, (v) => { etat.tiers = v; dessiner(); }));
    const placebo = h('div', { class: 'lecture' }), legende = h('div');
    g.legende.append(legende);
    const cur = A.curseur('Placebo : faux traitement à partir de', 2004, 2007, 1, etat.k, (v) => String(v), (v) => { etat.k = v; majPlacebo(); });
    g.apres.append(h('div', { class: 'commandes', style: 'margin-top:14px' }, cur), placebo);
    function majPlacebo() {
      const P = plan(TEMOINS.c1517.f, (a) => a <= 2007 && a < etat.k, (a) => a <= 2007 && a >= etat.k), r = S.mco(P.X, P.y), t = r.b[3] / r.seHC1[3];
      placebo.innerHTML = '<p><b>Double différence placebo</b> de la part de localités éclairées, sur 2003-2007 seulement, avec une période « après » fictive à partir de ' + etat.k + ' : interaction = <b>' + pts(r.b[3]) + '</b> (erreur-type HC1 ' + fmt(100 * r.seHC1[3], 1) + ' point' + (100 * r.seHC1[3] >= 2 ? 's' : '') + ', t = ' + fmt(t, 2) + ', p = ' + fmt(S.pBilaterale(t), 2) + '). ' + (Math.abs(t) < 1.96 ? 'On ne détecte aucun « effet » à une date où il ne s’est rien passé : les deux groupes évoluaient de façon comparable.' : 'Un « effet » apparaît avant tout traitement : signal d’alerte sur les tendances parallèles.') + (etat.k === 2005 ? ' C’est le placebo demandé à la question 3.6 (c).' : '') + '</p>';
    }
    function dessiner() {
      const v = etat.v, T = serie(1, v), Cm = serie(0, v), tiers = etat.tiers && v === 'nl_extensive';
      const tout = T.concat(Cm, tiers ? milieu : []).filter((x) => x != null), lo = Math.min(0, Math.min.apply(null, tout)), hi = Math.max.apply(null, tout) * 1.12;
      legende.textContent = '';
      legende.append(A.legende([{ c: 's1', nom: 'Traitées (2008-2009)', type: 'ligne' }, { c: 's2', nom: 'Comparaison (2015-2017)', type: 'ligne' }].concat(tiers ? [{ c: 's3', nom: 'Électrifiées en 2010-2014', type: 'ligne' }] : [])));
      const etroit = (g.zone.clientWidth || 680) < 520;

  // ---------------------------------------------- 3.8 erreurs-types groupées

    function simuler() {

      const G = A.graphe(g.zone, { nom: 'Dispersion réelle des estimations comparée aux erreurs-types HC1 et groupées', ratio: 0.38, hmin: 210, hmax: 280, x: { dom: [0.4, 3.6], grad: [1, 2, 3], fmt: (v) => (etroit ? COURT : NOMS)[v - 1] }, y: { dom: [0, max], fmt: (v) => fmt(v, 3) } }).axes();

    }

  };

    const termes = Object.keys(M.glossaire).map((k) => M.glossaire[k]).sort((a, b) => a.terme.localeCompare(b.terme, 'fr'));

    const champ = h('input', { type: 'search', id: 'filtre-glossaire', placeholder: 'Filtrer : biais, instrument, log…', 'aria-label': 'Filtrer le glossaire', style: 'width:100%;max-width:420px;padding:8px 10px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);margin-bottom:16px' });
    const zone = h('div');
    const dessiner = () => { const f = A.norm(champ.value); zone.textContent = ''; termes.filter((t) => !f || A.norm(t.terme + ' ' + t.def).includes(f)).forEach((t) => zone.append(h('div', { class: 'resume-q', id: 'g-' + A.norm(t.terme).replace(/ /g, '-') }, h('h4', { text: t.terme }), h('div', { html: md(t.def) }), t.voir ? h('p', { class: 'note-pied' }, h('a', { href: '#' + t.voir, text: 'Où ça sert dans le travail →' })) : null))); };
    champ.addEventListener('input', dessiner); dessiner();
    v.append(champ, zone);
    return v;
  }
  const vuePage = (nom, titre) => () => { fil([['Accueil', '#accueil'], [titre]]); return h('div', { html: md(A.C[nom]) }); };
  function vueIntrouvable() { fil([['Accueil', '#accueil'], ['Page introuvable']]); return h('div', null, h('h1', { text: 'Cette page n’existe pas' }), h('p', null, h('a', { href: '#accueil', text: 'Revenir à l’accueil' }))); }

  // -------------------------------------------------------------------- routeur
  const PAGES = { accueil: vueAccueil, bases: vueBases, comparatif: vuePage('comparatif', 'ChatGPT vs Claude'), choix: vueChoix, atelier: vuePage('atelier', 'Atelier R'), oral: vueOral, glossaire: vueGlossaire };
  function router() {
    const route = decodeURIComponent(location.hash.replace(/^#/, '')) || 'accueil';
    const memeQuestion = /^q-/.test(route) && route.replace(/^(q-\d+-\d+).*$/, '$1') === routeActive.replace(/^(q-\d+-\d+).*$/, '$1') && $('vue').firstChild;
    routeActive = route;
    fermerNav(); fermerGlose(); A.bulle.cacher();
    if (!memeQuestion) {
      const vue = PAGES[route] ? PAGES[route]() : /^q-/.test(route) ? vueQuestion(route) : /^b-/.test(route) ? vueLecon(route) : /^p\d$/.test(route) ? vuePartie(route) : vueIntrouvable();
      const hote = $('vue'); hote.textContent = ''; hote.append(vue);
      monter(hote);
    }
    marquerActif();
    const ancre = /^q-\d+-\d+-(\w+)$/.exec(route), cible = ancre && document.getElementById('s-' + ancre[1]);
    if (cible) cible.scrollIntoView(); else window.scrollTo(0, 0);
  }

  // ------------------------------------------------------- glossaire en bulle
  function fermerGlose() { const g = $('glose'); if (g) g.hidden = true; }
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest && ev.target.closest('.terme'), g = $('glose');
    if (!t) { if (!ev.target.closest || !ev.target.closest('#glose')) fermerGlose(); return; }
    const d = A.definition(t.dataset.terme);
    g.textContent = '';
    g.append(h('b', { text: d ? d.terme : t.dataset.terme }), h('div', { html: d ? md(d.def) : '<p>Définition à venir.</p>' }));
    if (d && d.voir) g.append(h('a', { href: '#' + d.voir, text: 'Où ça sert dans le travail →' }));
    g.hidden = false;
    const r = t.getBoundingClientRect(), gr = g.getBoundingClientRect();
    let x = r.left, y = r.bottom + 8;
    if (x + gr.width > window.innerWidth - 16) x = window.innerWidth - 16 - gr.width;
    if (y + gr.height > window.innerHeight - 8) y = Math.max(8, r.top - gr.height - 8);
    g.style.left = Math.max(16, x) + 'px'; g.style.top = y + 'px';
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { fermerGlose(); fermerNav(); $('recherche-resultats').hidden = true; } });
  window.addEventListener('scroll', A.debounce(fermerGlose, 50), { passive: true });

  // ------------------------------------------------------------------ recherche
  let index = null;
  function construireIndex() {
    index = [];
    M.ordre.forEach((id) => { const q = M.questions[id];
      index.push({ t: 'Question ' + id + ' — ' + q.titre, s: 'Partie ' + q.partie, r: routeQ(id), x: A.norm(id + ' ' + q.titre + ' ' + A.brut(q.enonce) + ' ' + q.sous.map((s) => s.titre + ' ' + A.brut(s.enonce) + ' ' + A.brut(s.court)).join(' ')) }); });
    M.lecons.forEach((l) => index.push({ t: l.titre, s: 'Les bases', r: '#' + l.route, x: A.norm(l.titre + ' ' + A.brut(l.texte).slice(0, 1500)) }));
    Object.keys(M.glossaire).forEach((k) => { const g = M.glossaire[k]; index.push({ t: g.terme, s: 'Glossaire', r: '#glossaire', x: A.norm(g.terme + ' ' + A.brut(g.def)) }); });
  }
  function chercher() {
    const champ = $('champ-recherche'), boite = $('recherche-resultats'), f = A.norm(champ.value);
    if (f.length < 2) { boite.hidden = true; return; }
    if (!index) construireIndex();
    const mots = f.split(' '), res = index.filter((e) => mots.every((m) => e.x.includes(m))).sort((a, b) => (A.norm(b.t).includes(f) ? 1 : 0) - (A.norm(a.t).includes(f) ? 1 : 0)).slice(0, 12);
    boite.textContent = '';
    if (!res.length) boite.append(h('div', { class: 'vide', text: 'Rien trouvé pour « ' + champ.value + ' ».' }));
    res.forEach((e) => boite.append(h('a', { href: e.r, onclick: () => { boite.hidden = true; champ.value = ''; } }, e.t, h('small', { text: e.s }))));
    boite.hidden = false;
  }

  // ------------------------------------------------------------- menu mobile
  function fermerNav() { $('nav').classList.remove('ouvert'); $('voile').hidden = true; $('bouton-menu').setAttribute('aria-expanded', 'false'); }
  function ouvrirNav() { $('nav').classList.add('ouvert'); $('voile').hidden = false; $('bouton-menu').setAttribute('aria-expanded', 'true'); }

  function demarrer() {
    A.store.demarrer();
    dessinerNav(); majProgression();
    A.store.abonner((quoi) => {
      majProgression();
      if (quoi === 'q' || quoi === 'charge') { document.querySelectorAll('#nav-liste .nav-q').forEach((a) => { const m = /^q-(\d+)-(\d+)$/.exec(a.dataset.route || ''); if (m) { const e = A.store.etat.q[m[1] + '.' + m[2]]; a.classList.toggle('fait', !!(e && e.fait)); } });
        M.parties.forEach((p) => { const c = document.querySelector('.nav-partie[data-partie="' + p.id + '"] .compte'), b = A.store.bilanPartie(p.num); if (c) c.textContent = b.fait + '/' + b.total; }); }
      if (quoi === 'charge') { const actif = document.activeElement; if (!actif || !/^(TEXTAREA|INPUT)$/.test(actif.tagName)) { routeActive = ''; router(); } }
    });
    $('bouton-menu').addEventListener('click', () => ($('nav').classList.contains('ouvert') ? fermerNav() : ouvrirNav()));
    $('voile').addEventListener('click', fermerNav);
    $('champ-recherche').addEventListener('input', A.debounce(chercher, 120));
    $('champ-recherche').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { const a = $('recherche-resultats').querySelector('a'); if (a) { location.hash = a.getAttribute('href'); $('recherche-resultats').hidden = true; ev.target.value = ''; } } });
    document.addEventListener('click', (ev) => { if (!ev.target.closest || !ev.target.closest('.recherche')) $('recherche-resultats').hidden = true; });
    window.addEventListener('hashchange', router);
    router();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer); else demarrer();
})();

</script>
</body>
</html>
