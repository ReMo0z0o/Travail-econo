s effets fixes de localité, une localité jamais observée avant ne dit rien sur un changement avant-après : elle pèse autrement.\n\n**Ce qui change vraiment : l'erreur-type.** Elle passe de 0,033 à 0,027, parce que 288 constantes expliquent beaucoup de variation et que le résidu rétrécit. Garde ce gain de précision en tête : la question 3.8 montre qu'il est trompeur.\n:code\n```r\ncomplet <- did %>%\n  group_by(electrific) %>%\n  filter(sum(!is.na(nl_extensive)) == 10) %>%      # localités observées les 10 années\n  ungroup()\n\ncoef(lm(nl_extensive ~ treated * post, data = complet))[\"treated:post\"]                  # 0,380006\ncoef(lm(nl_extensive ~ D + factor(electrific) + factor(year), data = complet))[\"D\"]      # 0,380006\n```\n:accord Même réponse et même vérification dans les deux versions : presque égaux, strictement égaux (0,380006) sur les 286 localités observées aux dix dates.\n##d | Pourquoi treated ne peut pas figurer dans la régression\n:enonce\nPourquoi `treated` ne peut-il pas figurer dans cette régression ?\n:court\nParce que `treated` ne change jamais pour une localité donnée : c'est exactement la somme des indicatrices des localités traitées. Il est **parfaitement colinéaire** avec les effets fixes de localité. R ne peut pas séparer les deux et renvoie `NA`.\n:zero\nC'est le piège des variables indicatrices de la question 1.11, en plus grand. Là-bas, on ne pouvait pas mettre les trois régions **et** une constante, parce que Bruxelles + Flandre + Wallonie = 1 pour toutes les communes.\n\nIci : additionne les indicatrices des localités traitées. Tu obtiens une variable qui vaut 1 pour les traitées et 0 pour les autres, c'est-à-dire `treated`. La variable n'apporte **aucune information nouvelle** : chaque constante $α_i$ contient déjà le fait que la localité $i$ est traitée ou non.\n\nDe la même façon, `post` est la somme des indicatrices des années 2010 à 2014 : il est absorbé par les effets fixes d'année.\n\nPlus généralement, **aucune caractéristique fixe dans le temps ne peut être estimée avec des effets fixes de localité**. C'est le prix à payer : on neutralise tout ce qui est fixe, donc on ne peut plus rien en dire.\n\n:::piege L'ordre des variables dans la formule\nSi tu écris `treated` **après** les effets fixes, R affiche `NA` : c'est le comportement attendu. Si tu l'écris **avant**, R supprime à la place l'indicatrice d'une localité et affiche pour `treated` un nombre (0,110) qui n'a aucun sens. Un coefficient affiché n'est pas forcément un coefficient interprétable.\n:::\n:code\n```r\nm <- lm(nl_extensive ~ D + factor(electrific) + factor(year) + treated, data = did)\ncoef(m)[\"treated\"]        # NA : colinéarité parfaite\n```\n:accord Même explication : `treated` est une combinaison exacte des indicatrices de localité, comme `post` l'est des indicatrices d'année. Claude signale en plus le piège de l'ordre des variables (le 0,11 sans signification).\n##e | Des effets fixes de région à la place\n:enonce\nRemplacez les effets fixes de localité par des effets fixes de région (`factor(region_num)`), en ajoutant `treated`, et réestimez. Le coefficient de `D` change-t-il ? Pourquoi ?\n:court\n**Pratiquement pas** : 0,3804 contre 0,3800. Pour que la double différence soit correcte, il suffit de tenir compte du **groupe** (`treated`) et du **temps** (effets fixes d'année). La région est une caractéristique fixe de plus, et la double différence retire déjà tout ce qui est fixe. Ce qui change, c'est l'erreur-type : 0,031 au lieu de 0,027.\n:zero\n**Pourquoi il faut remettre `treated`.** Sans effets fixes de localité, plus rien ne tient compte de l'écart de niveau entre les deux groupes. `treated` reprend ce rôle (son coefficient : 0,029, proche du 0,025 de la question 3.4). Si tu l'oublies, `D` monte à 0,405 : il absorbe l'écart de départ entre les groupes, et tu retombes sur la comparaison naïve de la question 3.3 (a).\n\n**Pourquoi `D` ne bouge pas.** La région ne change pas dans le temps. Or `D` mesure un **changement** propre aux traitées. Une caractéristique fixe peut expliquer des niveaux, pas un changement : l'ajouter ou la retirer ne déplace pas `D`. Sur le panel équilibré, les trois modèles donnent d'ailleurs exactement 0,380006.\n\n**Ce que cela t'apprend.** On peut tenir compte des différences fixes à plusieurs niveaux de finesse :\n\n| Niveau | Nombre de constantes | Coefficient de D | Erreur-type HC1 |\n|---|--:|--:|--:|\n| Groupe (`treated`) | 2 | 0,3802 | 0,0328 |\n| Région, plus `treated` | 13 | 0,3804 | 0,0313 |\n| Localité | 288 | 0,3800 | 0,0265 |\n\nLe coefficient est le même. Plus le niveau est fin, plus le modèle explique de variation, et plus l'erreur-type HC1 diminue.\n\nLes 9 localités sans code de région sont aussi celles qui n'ont aucune mesure de lumière : l'échantillon reste de 2 866 observations.\n:code\n```r\nreg_3_7e <- lm(nl_extensive ~ D + treated + factor(region_num) + factor(year), data = did)\nrob(reg_3_7e)[c(\"D\", \"treated\"), ]\n```\n:accord Même estimation (0,380404) et même explication. Claude insiste sur l'erreur-type (0,031 contre 0,027) ; ChatGPT sur le fait que l'écart minime disparaît sur le panel complet.\n##f | Pourquoi ne pas contrôler nschool_elec\n:enonce\nPourquoi ne faut-il pas ajouter `nschool_elec` comme variable de contrôle dans la régression de la luminosité ?\n:court\nParce que `nschool_elec` est lui-même un **résultat** de l'électrification (question 3.5). C'est un [[mauvais contrôle]] : le contrôler retirerait de l'effet la part qui passe par les écoles, et ferait comparer des localités qui ne sont plus comparables.\n:zero\nLe réseau produit de la lumière par plusieurs chemins : éclairage public, ménages branchés, bâtiments publics, **écoles électrifiées**. Tu cherches l'effet **total** de l'arrivée du réseau.\n\n**1. Tu bloquerais un chemin.** Contrôler `nschool_elec`, c'est demander : « à nombre d'écoles électrifiées égal, quel est l'effet du réseau sur la lumière ? ». La lumière qui passe par les écoles est exclue de la réponse. Ce n'est plus la question posée.\n\n**2. Tu comparerais des localités différentes.** Une localité traitée et une localité de comparaison qui ont le même nombre d'écoles électrifiées ne se ressemblent pas : la seconde a obtenu ses écoles électrifiées **sans** réseau. C'est un biais de sélection.\n\n**3. Tu perdrais deux années.** La variable n'existe pas pour 2013 et 2014 : l'échantillon tomberait de 2 866 à 2 290 observations.\n\n:::verif Ce qui se passe si on essaie\nAvec le contrôle, le coefficient de l'interaction tombe à 0,262. Mais ce n'est pas le contrôle qui le fait baisser : sur les mêmes 2 290 observations, **sans** le contrôle, il vaut déjà 0,264. La baisse vient de la perte de 2013 et 2014, deux des trois années où la lumière est la plus forte. Les raisons 1 et 2 sont des raisons de principe ; dans ces données, c'est la raison 3 qui pèse.\n:::\n\n**La règle générale**, déjà vue à la question 1.16 : on ne contrôle jamais une variable **postérieure au traitement et influencée par lui**.\n:accord Même réponse : c'est une conséquence possible du traitement, la contrôler bloquerait un chemin causal et changerait la question posée. Claude ajoute la raison pratique (variable absente en 2013-2014).\n:quiz\n? Que neutralisent les effets fixes de localité ?\n- Les chocs communs à toutes les localités une année donnée\n+ Toutes les caractéristiques d'une localité qui ne changent pas dans le temps\n- Les différences de tendance entre groupes\n> Chaque localité reçoit sa propre constante, qui absorbe tout ce qui est fixe chez elle, observé ou non.\n? Pourquoi R renvoie-t-il NA pour treated dans le modèle à effets fixes de localité ?\n- Parce que treated a trop de valeurs manquantes\n+ Parce que treated est la somme des indicatrices des localités traitées\n- Parce que treated est corrélé avec le terme d'erreur\n> C'est une colinéarité parfaite : treated n'apporte aucune information que les effets fixes ne contiennent déjà.\n? Avec des effets fixes de région au lieu de localité, le coefficient de D :\n+ ne change pratiquement pas, mais son erreur-type HC1 augmente\n- double\n- devient non significatif\n> La région est fixe dans le temps, comme la localité. Seule la variance résiduelle change.\n:oral\n? Qu'est-ce qu'un modèle TWFE ?\n> Une régression avec deux séries d'effets fixes : une constante par localité, qui neutralise tout ce qui est fixe dans le temps, et une constante par année, qui neutralise tout ce qui est commun à toutes les localités une année donnée. L'effet est estimé par l'évolution de chaque localité au-delà des chocs communs.\n? Ton coefficient TWFE est-il égal à celui de la question 3.4 ?\n> Presque : 0,3800 contre 0,3802. Ils seraient identiques dans un panel équilibré ; je l'ai vérifié sur les 286 localités observées dix ans, où les deux valent 0,380006. L'écart vient de deux localités observées seulement de 2012 à 2014.\n? Pourquoi ne pas contrôler le nombre d'écoles électrifiées ?\n> Parce que c'est une conséquence de l'électrification. Le contrôler bloquerait un des chemins par lesquels le réseau produit de la lumière : on n'estimerait plus l'effet total. On ne contrôle pas une variable influencée par le traitement.\n\n#Q 3.8 | Les erreurs-types groupées\n:intro\nJusqu'ici, les erreurs-types HC1 ont traité les 2 866 observations comme autant d'informations indépendantes. Or ce sont 288 localités observées dix fois. Cette question corrige l'incertitude, pas le coefficient.\n:concepts incertitude, did\n##a | HC1 contre erreurs-types groupées\n:enonce\nEstimez à nouveau les modèles des questions 3.4 (b) et 3.7 (a) avec des erreurs-types groupées par localité, et comparez-les aux erreurs-types robustes (HC1).\n:court\n| Modèle | Coefficient | HC1 | Groupée | Rapport | IC à 95 % (groupée) |\n|---|--:|--:|--:|--:|--:|\n| 3.4 (b) : `treated × post` | 0,380 | 0,033 | 0,044 | 1,35 | [0,29 ; 0,47] |\n| 3.7 (a) : effets fixes | 0,380 | 0,027 | 0,047 | 1,76 | [0,29 ; 0,47] |\n\nLes coefficients ne changent pas. Les erreurs-types augmentent de 35 % et de 76 %.\n:zero\n**Ce que « grouper » veut dire.** Les [[erreurs-types groupées]] (en anglais *clustered*) autorisent les erreurs d'une **même localité** à être corrélées entre elles d'une année à l'autre, de n'importe quelle façon. Elles supposent seulement que deux localités **différentes** sont indépendantes.\n\n- HC1 : 2 866 informations indépendantes.\n- Groupées : 288 blocs indépendants.\n\nSeule l'incertitude change. Le coefficient, lui, est calculé de la même façon.\n\n**Un détail qui compte.** Avec HC1, le modèle à effets fixes paraissait plus précis que le modèle simple (0,027 contre 0,033). Avec les erreurs-types groupées, les deux se rejoignent (0,047 et 0,044). Le gain de précision apparent des effets fixes était une illusion.\n\n{{w:cluster}}\n:code\n```r\nvc_groupee <- vcovCL(reg_3_4, cluster = ~ electrific, type = \"HC1\")\ncoeftest(reg_3_4, vcov = vc_groupee)\n\ncoeftest(reg_3_7a, vcov = vcovCL(reg_3_7a, cluster = ~ electrific, type = \"HC1\"))[\"D\", ]\n```\n\n- `vcovCL()` (package `sandwich`) calcule la matrice de variance groupée ; `cluster = ~ electrific` désigne la variable qui définit les groupes.\n- `coeftest()` refait le tableau de coefficients avec cette matrice. C'est la même mécanique que ta fonction `rob()`, avec `vcovCL` à la place de `vcovHC`.\n:accord Mêmes erreurs-types (0,0442 et 0,0467). Pour l'intervalle de confiance, ChatGPT utilise le quantile de Student à 287 degrés de liberté (nombre de localités moins un) et obtient [0,293 ; 0,467] et [0,288 ; 0,472] ; Claude utilise 1,96 et arrondit à [0,29 ; 0,47]. À deux décimales, c'est identique.\n##b | Pourquoi les erreurs d'une localité sont corrélées\n:enonce\nExpliquez avec vos mots pourquoi les termes d'erreur d'une même localité risquent d'être corrélés d'une année à l'autre dans cette application, et ce que cela implique pour les erreurs-types non groupées.\n:court\nParce que ce que le modèle n'explique pas dans une localité **persiste** d'une année à l'autre : sa taille, son activité, un marché ou une route à proximité. Une localité plus lumineuse que prévu une année l'est en général aussi l'année suivante. Ses dix observations n'apportent donc pas dix informations indépendantes. Les erreurs-types non groupées font comme si, et sont **trop petites** : les tests rejettent trop souvent et les intervalles sont trop étroits.\n:zero\n**Une image.** Pèse dix fois la même personne : tu n'as pas dix personnes. Tu connais très bien **son** poids, mais tu ne connais pas mieux le poids moyen de la population. Dix années d'une même localité, c'est un peu pareil.\n\n**Ce que contient le terme d'erreur d'une localité.** Tout ce qui influence sa lumière et n'est pas dans la régression : un marché hebdomadaire, un axe routier, la position exacte de la localité par rapport aux pixels du satellite. Ces facteurs ne changent pas d'une année à l'autre, ou très lentement.\n\n**Dans tes données.** La corrélation entre le résidu d'une localité et son résidu de l'année précédente vaut **0,66**. Si les erreurs étaient indépendantes, elle serait proche de 0.\n\n**Pourquoi c'est pire en double différence.** Le régresseur `D` est lui aussi « persistant » : il vaut 1 cinq années de suite dans chaque localité traitée. Quand le régresseur et l'erreur sont tous deux corrélés dans le temps, l'erreur-type naïve peut être très loin de la vérité. C'est un résultat classique (Bertrand, Duflo et Mullainathan, 2004), qui a fait des erreurs-types groupées la norme en double différence.\n\n**Et avec les effets fixes ?** Ils retirent la partie **permanente** de l'erreur d'une localité, mais pas sa persistance d'une année à l'autre. Le rapport est même plus grand (1,76).\n\nDans l'outil du point (a), mets la corrélation à 0, puis à 0,66. Sans aucun effet réel, un test à 5 % fondé sur HC1 en « trouve » un dans environ 15 % des simulations : trois fois trop souvent.\n:accord Même explication (des chocs persistants propres à la localité ; les lignes ne sont pas des informations indépendantes ; erreurs-types non groupées sous-estimées). Claude ajoute la corrélation des résidus mesurée dans les données (0,66) et la référence à Bertrand, Duflo et Mullainathan (2004).\n##c | Pourquoi grouper par localité\n:enonce\nPourquoi faut-il grouper au niveau de la localité, et non de l'année ou de la région ?\n:court\nTrois raisons : c'est le niveau où le **traitement est attribué** (on raccorde une localité) ; c'est le niveau où les **erreurs sont corrélées** (dans le temps, au sein d'une localité) ; et il y a **assez de groupes** (288). Par année, il n'y aurait que 10 groupes, et on ignorerait la corrélation dans le temps, qui est le vrai problème. Par région, 13 groupes : trop peu pour une erreur-type fiable.\n:zero\n| Grouper par… | Nombre de groupes | Corrélation autorisée | Problème |\n|---|--:|---|---|\n| **localité** | 288 | entre les années d'une même localité | aucun : c'est le bon niveau |\n| année | 10 | entre les localités, une même année | ignore la persistance dans le temps ; trop peu de groupes |\n| région | 13 | entre toutes les observations d'une région | trop peu de groupes |\n\n**La règle pratique.** On groupe au niveau où le traitement est décidé. Ici, le réseau arrive dans une localité : toutes ses années « après » sont traitées ensemble.\n\n**Pourquoi le nombre de groupes compte.** Une erreur-type groupée est calculée à partir de la dispersion **entre groupes**. Avec 288 localités, cette dispersion est bien mesurée. Avec 10 ou 13 groupes, elle est elle-même très imprécise, et les tests ne sont plus fiables. On cite souvent un minimum de 40 à 50 groupes.\n\n**Et la région ?** En théorie, grouper par région serait plus prudent encore : cela autoriserait aussi des corrélations entre localités voisines. Mais avec 13 régions, le remède est pire que le mal.\n\n:::verif Par curiosité\nJ'ai essayé : en groupant par année, l'erreur-type de l'interaction vaut 0,107 ; par région, 0,054. L'effet reste significatif dans tous les cas, mais ces deux valeurs reposent sur 10 et 13 groupes : ne les utilise pas pour conclure.\n:::\n:accord Même réponse : le traitement est attribué à la localité et ses mesures sont répétées ; grouper par année ne permettrait pas la corrélation dans le temps ; grouper par région laisserait trop peu de groupes (13).\n##d | Le sens de l'écart et la conclusion\n:enonce\nLe sens de l'écart observé en (a) est-il celui que vous attendiez ? Que concluez-vous sur l'effet de l'expansion du réseau électrique ?\n:court\n**Oui.** Avec des erreurs positivement corrélées dans le temps au sein d'une localité, on attend des erreurs-types groupées plus grandes : elles le sont, de 35 % et de 76 %. L'effet reste très significatif : t = 0,380 / 0,044 = **8,6**. L'arrivée du réseau a augmenté de **38 points** la probabilité qu'une localité soit visible de nuit, avec un intervalle de confiance à 95 % de **29 à 47 points**.\n:zero\n**Le raisonnement en trois temps.**\n\n1. **Ce qu'on attendait.** Corrélation positive (0,66), donc moins d'information qu'il n'y paraît, donc des erreurs-types groupées plus grandes.\n2. **Ce qu'on observe.** 0,044 contre 0,033, et 0,047 contre 0,027. Conforme.\n3. **Ce que ça change.** L'intervalle s'élargit, de [0,32 ; 0,44] à [0,29 ; 0,47]. La statistique t passe de 11,6 à 8,6. La conclusion ne change pas : l'effet est massif et très loin de zéro.\n\n{{w:loi test=did}}\n\n**La conclusion à écrire** doit rappeler sous quelle hypothèse elle vaut : *sous l'hypothèse de tendances parallèles*, l'arrivée du réseau a augmenté de 38 points (IC à 95 % : 29 à 47) la part de localités visibles de nuit.\n\n:::verif Et pour les autres résultats ? Vérifié sur les données, absent des deux corrigés\nL'énoncé ne demande les erreurs-types groupées que pour la luminosité. Voici ce qu'elles donnent pour les quatre variables de la question 3.5 :\n\n| Variable | Double différence | HC1 | Groupée | p-valeur (groupée) |\n|---|--:|--:|--:|--:|\n| `nl_extensive` | 0,380 | 0,033 | 0,044 | < 0,001 |\n| `nl_intensive_hat` | 0,429 | 0,140 | 0,097 | < 0,001 |\n| `nschool_elec` | 0,158 | 0,079 | 0,117 | 0,18 |\n| `n_students_public` | −6,73 | 5,28 | 5,00 | 0,18 |\n\nDeux enseignements.\n\n- **L'effet sur les écoles électrifiées n'est plus significatif** (p = 0,18 au lieu de 0,045). ChatGPT l'avait pressenti en parlant d'une inférence « sensible à la corrélation entre années ».\n- **Grouper n'augmente pas toujours l'erreur-type** : pour l'intensité lumineuse, elle diminue. Quand une localité est durablement au-dessus ou en dessous des autres, cet écart permanent s'annule dans la comparaison après − avant. L'erreur-type groupée en tient compte ; HC1, non. Dans l'outil du point (a), pousse la corrélation à 0,95 pour voir l'ordre s'inverser.\n:::\n:accord Même réponse : le sens est celui attendu, l'effet reste très significatif (t = 8,6, et 8,1 avec effets fixes), intervalle de 29 à 47 points. ChatGPT rappelle les deux conditions de la lecture causale (tendances parallèles, pas de contamination entre groupes) : c'est la bonne façon de finir.\n:quiz\n? Quand on passe des erreurs-types HC1 aux erreurs-types groupées par localité, qu'est-ce qui change ?\n- Le coefficient et son erreur-type\n+ Seulement l'erreur-type\n- Seulement le coefficient\n> Grouper ne modifie que le calcul de l'incertitude. Le coefficient reste 0,380.\n? Pourquoi ne pas grouper par région ?\n- Parce que le traitement varie d'une région à l'autre\n+ Parce qu'il n'y a que 13 régions, trop peu pour une erreur-type groupée fiable\n- Parce que les régions n'ont pas d'effet sur la lumière\n> Une erreur-type groupée repose sur la dispersion entre groupes : il en faut beaucoup.\n? La corrélation des résidus d'une localité d'une année à l'autre vaut 0,66. Les erreurs-types HC1 de la double différence sont donc :\n+ trop petites\n- trop grandes\n- correctes\n> HC1 compte dix informations indépendantes par localité, alors qu'elles se répètent en partie.\n:oral\n? Pourquoi grouper les erreurs-types par localité ?\n> Parce que les dix observations d'une localité ne sont pas indépendantes : ce que le modèle n'explique pas chez elle persiste d'une année à l'autre. Dans mes données, la corrélation des résidus d'une année à l'autre est de 0,66. Sans grouper, on surestime l'information disponible et les erreurs-types sont trop petites.\n? Qu'est-ce que le groupement change à ta conclusion ?\n> L'erreur-type passe de 0,033 à 0,044 et l'intervalle de confiance s'élargit, de 32-44 points à 29-47 points. L'effet reste très significatif, avec un t de 8,6. La conclusion ne change pas, mais sa précision est plus honnête.\n:retenir\n- Effets fixes de localité : tout ce qui est fixe dans le temps. Effets fixes d'année : tout ce qui est commun à tous une année donnée.\n- Dans un panel équilibré, TWFE et double différence 2×2 donnent le même coefficient (0,380).\n- On ne peut pas estimer l'effet d'une variable fixe dans le temps avec des effets fixes de localité, et on ne contrôle pas un résultat du traitement.\n- En panel, on groupe les erreurs-types au niveau où le traitement est attribué : 0,044 au lieu de 0,033.\n\n#SEC E | Conclusion\n\n#Q 3.9 | Plus de lumière, plus d'activité économique ?\n:enonce\nL'arrivée du réseau augmente mécaniquement la lumière nocturne, par exemple par l'éclairage public, indépendamment de toute activité économique.\n:intro\nLa lumière nocturne sert souvent de mesure indirecte de l'activité économique. Mais ici, le traitement **est** de l'électricité. Cette dernière question te demande de séparer ce que tes estimations montrent de ce qu'elles ne montrent pas.\n:concepts causalite, did\n##a | Ton résultat montre-t-il une hausse de l'activité économique ?\n:enonce\nVotre résultat de la question 3.4 montre-t-il une hausse de l'activité économique ?\n:court\n**Non.** Il montre que les localités raccordées deviennent visibles de nuit, pas qu'elles produisent davantage. Le réseau apporte de la lumière par lui-même : éclairage public, bâtiments publics, quelques ménages branchés. Et `nl_extensive` passe de 0 à 1 dès que quelques lampes dépassent le seuil de détection du satellite.\n:zero\n**Pourquoi la lumière mesure d'habitude l'activité.** Dans un pays où les statistiques locales sont rares, une zone qui s'éclaire est en général une zone où l'on construit, où l'on commerce, où les revenus montent. La lumière est un **indicateur indirect** : on ne s'intéresse pas à elle, mais à ce qu'elle révèle.\n\n**Pourquoi ça ne marche plus ici.** Un indicateur indirect n'est fiable que si son lien avec ce qu'il mesure reste **stable**. Or l'électrification change ce lien : elle rend la lumière possible et bon marché, à activité inchangée. Un lampadaire devant la mairie allume le pixel sans qu'aucune entreprise ait produit davantage.\n\nUne comparaison : le nombre de parapluies ouverts mesure bien la pluie, sauf le jour où la mairie en distribue gratuitement.\n\n**Ce que le résultat montre vraiment.** Que le réseau **est utilisé** : il y a de la lumière là où il n'y en avait pas. C'est une condition nécessaire à des effets économiques, pas une preuve de ces effets.\n:accord Même réponse : non. Une ampoule dans une rue peut rendre le village visible sans qu'aucune entreprise produise davantage (ChatGPT) ; la lumière n'est un bon indicateur que tant que sa relation avec l'activité est stable, et l'électrification casse précisément cette relation (Claude).\n##b | Les autres résultats de l'article\n:enonce\nQuels autres résultats de l'article permettent d'en juger ?\n:court\nCeux qui portent sur autre chose que la lumière. D'après l'énoncé et les deux corrigés : des effets positifs sur l'**approvisionnement en eau** (systèmes alimentés par le réseau) et sur l'**électrification des écoles**, **pas d'effet sur le nombre d'élèves**, et, du côté des ménages, davantage d'équipements et d'accès aux services financiers, y compris chez les ménages non raccordés. Ce sont des usages concrets et des services collectifs, pas une mesure directe de la production ou des revenus.\n:zero\n:::verif Cette réponse demande d'avoir lu l'article\nL'énoncé rend obligatoire la lecture des sections 1 à 4 et du tableau 4. Je n'ai pas pu lire l'article (accès payant). Voici ce que je peux garantir.\n\n- **Dit par l'énoncé** : effets positifs importants sur la luminosité, sur l'approvisionnement en eau et sur l'électrification des écoles ; pas d'effet sur le nombre d'élèves ; l'idée que les bénéfices passent par la communauté (éclairage public, écoles, pompes à eau, effets sur les ménages non raccordés).\n- **Dit par les deux corrigés, à vérifier dans ta lecture** : équipement des ménages en appareils électriques, accès aux services financiers, absence de croissance démographique significative.\n\nChatGPT ajoute que, dans la colonne « DiD : TWFE » du tableau 4, les résultats sur l'eau et les écoles sont « plus imprécis » que dans les spécifications principales. C'est cohérent avec ce que tu trouves pour les écoles (question 3.8), mais je n'ai pas pu le contrôler.\n:::\n\n**Comment classer ces résultats.** Demande-toi, pour chacun, s'il parle d'activité économique.\n\n| Résultat | Ce qu'il montre | Est-ce de l'activité économique ? |\n|---|---|---|\n| Lumière nocturne | le réseau est utilisé | pas directement |\n| Systèmes d'eau alimentés par le réseau | un service collectif nouveau | non : un équipement |\n| Écoles électrifiées, sans hausse du nombre d'élèves | un équipement amélioré | non |\n| Appareils électriques et services financiers chez les ménages | un changement des conditions de vie | indirectement |\n| Revenus, emploi, entreprises, production | ce qu'il faudrait observer | **oui, et c'est ce qui manque** |\n\n**Tes propres résultats vont dans le même sens.** Question 3.5 : un effet estimé positif sur les écoles électrifiées, aucun sur le nombre d'élèves. Le réseau modifie les équipements ; il ne modifie pas, dans ces données, les comportements mesurés.\n:gpt\nCite les infrastructures d'eau alimentées par le réseau et l'électrification des écoles « dans ses spécifications principales », en précisant que dans la seule colonne TWFE du tableau 4 ces deux résultats sont plus imprécis ; les équipements des ménages et l'accès aux services financiers ; pas de hausse robuste des inscriptions scolaires. Conclut que ces éléments montrent des usages concrets du réseau et ne mesurent pas directement la production.\n:claude\nCite, au niveau des localités, les systèmes d'adduction d'eau alimentés par le réseau et les écoles électrifiées, sans hausse du nombre d'élèves ni croissance démographique significative ; au niveau des ménages, plus d'appareils électriques et une meilleure inclusion financière, y compris chez les ménages non raccordés ; et la marge intensive de la lumière. Ajoute ce qu'il faudrait pour conclure : revenus, consommation, emploi, création d'entreprises.\n:verdict\nLes deux listes se recoupent et concordent avec le résumé que donne l'énoncé. ChatGPT est plus prudent sur la précision des résultats ; Claude dit clairement ce qui manque pour parler d'activité économique. Aucune des deux ne remplace ta lecture : à l'oral, on peut te demander où tu as lu tel résultat. Complète la liste avec tes propres notes.\n:opt mix | À ajuster après ta lecture de l'article\nL'article rapporte aussi des effets sur l'approvisionnement en eau par des systèmes alimentés par le réseau et sur l'électrification des écoles, sans hausse du nombre d'élèves, ainsi que, pour les ménages, davantage d'appareils électriques et d'accès aux services financiers, y compris chez ceux qui ne sont pas raccordés. Ces résultats décrivent des équipements collectifs et des conditions de vie. Pour conclure à une hausse de l'activité économique, il faudrait des mesures directes : revenus, emploi, création d'entreprises.\n##c | La conclusion en trois phrases\n:enonce\nFormulez en trois phrases au plus la conclusion que vos estimations permettent de tirer.\n:court\nTrois phrases, trois fonctions : **le résultat chiffré**, **l'hypothèse dont il dépend**, **ce qu'il ne montre pas**. Choisis ou adapte une des versions proposées plus bas.\n:zero\nUne bonne conclusion ne répète pas tous les chiffres. Elle dit ce qu'on a trouvé, à quelle condition c'est crédible, et où s'arrête ce qu'on peut affirmer.\n\n| Phrase | Sa fonction | Ce qu'elle doit contenir |\n|---|---|---|\n| 1 | Le résultat | +38 points, intervalle de 29 à 47, par rapport à quel groupe |\n| 2 | La condition | tendances parallèles ; ce qui les rend plausibles ; ce qui fragilise l'ampleur (satellite) |\n| 3 | La limite | lumière et équipements ne sont pas l'activité économique |\n\n**Trois erreurs à éviter.**\n\n- Écrire « l'électrification augmente l'activité économique » : tes estimations ne le montrent pas.\n- Donner l'erreur-type HC1 (0,033) comme mesure de précision : c'est l'erreur-type groupée (0,044) qui vaut.\n- Écrire que le nombre d'écoles électrifiées « augmente significativement » : l'effet n'est plus significatif avec des erreurs-types groupées, et il vient surtout d'une baisse dans le groupe de comparaison (question 3.5).\n\nL'énoncé dit « trois phrases au plus » : compte-les avant de rendre.\n:gpt\n« La double différence estime une hausse additionnelle d'environ 38 points de détection nocturne dans les localités raccordées tôt. On observe une amélioration de l'équipement scolaire, sans hausse discernable des effectifs du primaire public dans l'échantillon. L'interprétation causale dépend des tendances parallèles et la hausse de lumière ne quantifie pas, à elle seule, une hausse de l'activité économique. »\n:claude\nTrois phrases plus longues : +38 points (IC à 95 % avec erreurs groupées : 29 à 47 points) par rapport aux localités raccordées en 2015-2017, et hausse du nombre d'écoles électrifiées sans effet sur le nombre d'élèves ; le résultat repose sur les tendances parallèles, compatibles avec l'évolution avant 2008, et son ampleur dépend en partie du passage à VIIRS en 2012 ; le réseau apporte de la lumière et des équipements collectifs, ce qui ne suffit pas à établir une hausse de l'activité économique.\n:verdict\nMême fond. ChatGPT est plus court et plus lisible. Claude donne l'intervalle de confiance et mentionne le satellite, deux éléments qui montrent que tu as fait les questions 3.6 et 3.8. Les deux affirment sans réserve une amélioration de l'équipement scolaire : au vu des erreurs-types groupées (p = 0,18), j'ai nuancé ce point dans les trois versions ci-dessous. Le mieux reste d'écrire la tienne : c'est la conclusion qu'on te fera commenter à l'oral.\n:opt gpt | Version courte\nLa double différence estime que l'arrivée du réseau a augmenté d'environ 38 points la part de localités visibles de nuit, par rapport aux localités raccordées plus tard. L'équipement scolaire semble s'améliorer, sans hausse discernable du nombre d'élèves. Cette lecture causale dépend de l'hypothèse de tendances parallèles, et la hausse de lumière ne mesure pas à elle seule une hausse de l'activité économique.\n:opt claude | Version détaillée, avec intervalle et satellite\nLe raccordement au réseau en 2008-2009 a augmenté de 38 points la part de localités visibles de nuit (intervalle de confiance à 95 % avec erreurs-types groupées : 29 à 47 points) par rapport aux localités raccordées en 2015-2017 ; l'effet estimé sur les écoles électrifiées est positif mais fragile, et rien n'apparaît sur le nombre d'élèves. Ce résultat repose sur l'hypothèse de tendances parallèles, compatible avec l'évolution des deux groupes avant 2008, et son ampleur dépend en partie du passage au satellite VIIRS en 2012. Il montre que le réseau apporte de la lumière et des équipements collectifs, mais ne suffit pas à établir une hausse de l'activité économique.\n:opt mix | Version intermédiaire, qui commence par l'hypothèse\nSous l'hypothèse de tendances parallèles, que l'évolution des deux groupes avant 2008 rend plausible, l'arrivée du réseau a augmenté de 38 points (intervalle à 95 % : 29 à 47) la part de localités visibles de nuit. L'effet estimé sur les écoles électrifiées est positif mais imprécis, et aucun effet n'apparaît sur le nombre d'élèves. Ces résultats montrent que le réseau est utilisé et modifie les équipements collectifs ; ils ne permettent pas de conclure à une hausse de l'activité économique.\n:quiz\n? Pourquoi la hausse de la lumière nocturne ne prouve-t-elle pas ici une hausse de l'activité économique ?\n- Parce que l'effet n'est pas significatif\n+ Parce que le réseau produit de la lumière par lui-même, sans activité supplémentaire\n- Parce que le satellite ne mesure pas la lumière des villages\n> L'éclairage public suffit à rendre une localité visible. Le lien habituel entre lumière et activité est rompu par le traitement lui-même.\n? Laquelle de ces phrases peut figurer dans ta conclusion ?\n- L'électrification augmente l'activité économique des localités\n- L'électrification n'a aucun effet sur les localités\n+ L'électrification rend les localités visibles de nuit, sans effet détectable sur le nombre d'élèves\n> C'est ce que montrent tes estimations, ni plus ni moins.\n:oral\n? En une phrase, que montre ta partie 3 ?\n> Sous l'hypothèse de tendances parallèles, l'arrivée du réseau a augmenté de 38 points la part de localités visibles de nuit, avec un intervalle de 29 à 47 points ; cela montre que le réseau est utilisé, pas que l'activité économique a augmenté.\n? Que faudrait-il pour conclure sur l'activité économique ?\n> Des mesures directes : revenus ou consommation des ménages, emploi, nombre d'entreprises, production agricole. La lumière ne peut pas servir d'indicateur indirect ici, puisque le traitement est justement de l'électricité.\n:retenir\n- +38 points de localités visibles de nuit (IC à 95 % : 29 à 47), sous l'hypothèse de tendances parallèles.\n- L'ampleur dépend du capteur : +10 points avec DMSP, +56 avec VIIRS.\n- Effet positif mais fragile sur les écoles électrifiées, aucun sur le nombre d'élèves.\n- La lumière prouve que le réseau est utilisé, pas que l'activité économique augmente.\n","comparatif":"# ChatGPT et Claude : deux corrigés, les mêmes chiffres\n\n>> Les deux arrivent aux mêmes résultats. Ce qui les sépare, c'est la façon d'expliquer, la prudence, la profondeur, et quelques choix de méthode. Cette page fait le bilan, puis liste tous les points où tu as un choix à faire.\n\n## Le verdict en une minute\n\n:::cle Quatre constats\n- **Sur les chiffres : égalité.** J'ai exécuté les deux scripts sur tes fichiers. Tous les résultats principaux coïncident : 551 communes, élasticités de 1,444 et 1,608, effet 2SLS de −5,46 semaines, double différence de 0,380.\n- **Sur les réponses : 84 sous-questions sur 121 reçoivent la même réponse.** Les 37 autres diffèrent par la méthode, la profondeur ou la conclusion, presque jamais par le fond.\n- **Aucun des deux n'est « le bon ».** ChatGPT est plus concis et plus prudent. Claude explique davantage et vérifie plus de choses dans les données. Les deux contiennent des erreurs ou des affirmations que je n'ai pas pu vérifier.\n- **Le bon usage** : ne recopier ni l'un ni l'autre. Pour chaque divergence, choisis le raisonnement que tu sais défendre, puis réécris-le avec tes mots.\n:::\n\nUne précision honnête : cet atelier a lui-même été rédigé par Claude. J'ai jugé chaque point sur pièces, en refaisant les calculs, et chaque conseil est argumenté pour que tu puisses ne pas être d'accord.\n\n## Deux façons de travailler\n\n| | ChatGPT | Claude |\n|---|---|---|\n| Documents | un corrigé de 30 pages et un guide R de 13 pages | un guide de 52 pages (réponses, guide R, oral) et un dossier de résultats de référence |\n| Script R | 526 lignes, 41 lignes de commentaires | 1 068 lignes, 194 lignes de commentaires |\n| Plan d'une réponse | le résultat, puis sa lecture en deux ou trois phrases | la réponse courte, le raisonnement, les chiffres, le code |\n| Ton | dense, technique, prudent | pas à pas, plus affirmatif |\n| Ce qu'il ajoute volontiers | intervalles de confiance, références aux articles, mises en garde | vérifications sur les données, analyses supplémentaires, pièges de R |\n| Risque principal | des outils qui dépassent le cours, difficiles à expliquer à l'oral | plus de matière que la question n'en demande |\n\n## Ce que chacun fait de mieux\n\n### ChatGPT\n\n- **La prudence des formulations.** Il écrit qu'un groupe de comparaison est plus comparable « sans garantir les tendances parallèles » (3.2 d), que les effets fixes d'année « ne corrigent pas un changement de satellite qui affecterait différemment les groupes » (3.7 b), que 0,158 école n'est pas « +15,8 % » (3.5 a).\n- **Les intervalles de confiance.** Il en donne presque partout. Celui du placebo (de −4,1 à +6,7 points) est le meilleur argument de la question 3.6 (d).\n- **La concision.** Ses conclusions tiennent dans les trois phrases demandées (1.18 c, 2.14 d, 3.9 c).\n- **Les règles documentées.** Pour les 14 communes sans prix médian, il cite la règle de Statbel (pas de médiane sous 16 ventes) au lieu de la deviner (1.1 f).\n- **Les contrôles de son script.** 14 lignes `stopifnot()` vérifient que les résultats intermédiaires sont bien ceux attendus.\n\n### Claude\n\n- **L'explication.** Chaque réponse commence par l'essentiel, puis déroule le raisonnement. C'est le format le plus utile quand on part de zéro.\n- **Les preuves par les données.** Deux comptages qui démontrent d'où vient l'écart entre 565 et 581 communes (1.1 c) ; la formule qui reconstitue exactement le biais de variable omise (1.12) ; 75 % contre 40 % de localités dans l'échantillon d'intensité (3.5 b) ; la corrélation de 0,66 entre résidus successifs (3.8 b).\n- **Le respect de la question posée.** Quand l'énoncé demande « quelle hypothèse », il nomme l'homoscédasticité (1.3 c). Quand il demande un avis, il prend position puis nuance (1.5 b, 1.16, 2.14 d).\n- **Les conventions de l'énoncé.** Dossier `resultats`, noms `tab_`, `fig_`, `reg_`, graphiques avec ggplot2, fonction `rob()` : son script ressemble à ce que les assistantes attendent.\n- **La transparence.** Il dit clairement qu'il n'a pas pu lire le tableau 4 de l'article (3.4 c).\n\n## Ce qui est faux, approximatif ou invérifiable\n\n| Point | Qui | Ce qu'il en est |\n|---|---|---|\n| Date de la fusion Bastogne-Bertogne (1.1 c) | les deux | Ils écrivent le 1er décembre 2024. La date d'effet est le **2 décembre 2024**. |\n| Valeur de la colonne « DiD : TWFE » du tableau 4 (3.4 c) | ChatGPT : 0,396 (0,046). Claude : non lu. | **Invérifiable ici.** Le fichier fourni ne permet pas de retrouver 0,396. À lire dans l'article. |\n| −11,3 points, tableau 7 d'Angrist et Evans (2.13 a) | ChatGPT | Hors énoncé et non vérifié. Ne le cite que si tu le retrouves. |\n| Raison du maintien du code INS d'Anvers (1.1 d) | ChatGPT | Plausible (une fusion qui change la population de 2 %), mais je n'ai pas pu confirmer la source citée. |\n| « Le nombre d'écoles électrifiées augmente » (3.5 a) | les deux | Il est stable chez les traitées (0,49 puis 0,50) et baisse dans le groupe de comparaison (0,30 puis 0,15). |\n| « Écart stable de 2 à 3 points » avant 2008 (3.6 b) | Claude | L'écart va de 0,8 à 4,3 points. |\n| Autres résultats de l'article (3.9 b) | les deux | Concordants entre eux et avec l'énoncé, mais je n'ai pas pu lire l'article. |\n\n## Ce que ni l'un ni l'autre n'a vu\n\nCes points viennent de mes propres vérifications sur tes fichiers. Tu n'es pas obligé de les utiliser, mais ils peuvent faire la différence à l'oral.\n\n- **La série des écoles électrifiées change de régime entre 2005 et 2006** : dans tout l'échantillon, la part des localités ayant au moins une école électrifiée passe de 54 % à 6 %. La période « avant » mélange donc deux mesures ([question 3.5](#q-3-5)).\n- **Le coefficient de 0,158 sur les écoles vient surtout d'une baisse du groupe de comparaison**, pas d'une hausse chez les traitées. Avec des erreurs-types groupées, il n'est plus significatif (p = 0,18) ([question 3.8](#q-3-8)).\n- **Grouper les erreurs-types ne les augmente pas toujours** : pour l'intensité lumineuse, elles diminuent (0,097 contre 0,140).\n- **L'échelle d'intensité lumineuse change de zéro en 2012** : une année sans lumière vaut −0,214 jusqu'en 2011, puis 0.\n- **Contrôler `nschool_elec` fait baisser l'effet à 0,26, mais à cause des deux années perdues**, pas du contrôle lui-même ([question 3.7](#q-3-7)).\n- **Les deux scripts s'arrêtent dès la lecture des fichiers si la session R n'est pas en UTF-8.** Voir l'[atelier R](#atelier).\n\n## Six décisions à prendre une fois pour tout le rapport\n\nBeaucoup de divergences se ramènent à la même poignée de choix. Tranche-les une fois, et applique ta règle partout.\n\n### 1. Des fonctions que tu sais expliquer, ou des outils plus généraux ?\n\nChatGPT écrit ses propres fonctions (`contraste()`, `wald_F()`), calcule une covariance là où une hypothèse d'indépendance suffit (2.10 b), utilise un intervalle de Wilson (2.5 a) et un test J de Hansen par GMM (2.11). Ces choix sont rigoureux, et ils donnent **les mêmes nombres** que les versions simples. Mais à l'oral, on te demandera d'expliquer ton code ligne par ligne.\n\n**Conseil** : la méthode la plus simple qui donne le bon résultat. Tu peux ajouter une phrase du type « un calcul plus complet donne le même chiffre ».\n\n### 2. Jusqu'où aller au-delà de l'énoncé ?\n\nClaude ajoute une régression qui sépare les périodes DMSP et VIIRS (3.6 e). ChatGPT ajoute un test de sensibilité sur le codage des valeurs manquantes (1.15 a) et un chiffre supplémentaire de l'article (2.13 a).\n\n**Conseil** : garde un ajout s'il remplit trois conditions. Il **sert la réponse** à la question posée, tu **sais l'expliquer**, et il est **vérifié**. Sinon, garde-le pour l'oral.\n\n### 3. Trancher, ou présenter les deux lectures ?\n\nPlusieurs questions demandent un avis : « vous paraît-elle », « quel estimateur retenez-vous », « que concluez-vous ». ChatGPT a tendance à juxtaposer ; Claude à choisir puis nuancer.\n\n**Conseil** : une position, sa raison, puis sa limite. Et de la cohérence : ta réponse à la question 2.12 doit annoncer celle de 2.14 (d).\n\n### 4. Intervalles de confiance : 1,96 ou la loi de Student ?\n\nChatGPT utilise le quantile de la loi de Student (1,964 ou 1,968 selon l'échantillon) ; Claude utilise 1,96. À deux décimales, les intervalles sont identiques (1.13 a, 3.8 a).\n\n**Conseil** : choisis l'un, dis-le une fois, et garde-le dans tout le rapport.\n\n### 5. Citer les articles\n\nTrois endroits demandent une comparaison avec un article : 2.6 et 2.13 (Angrist et Evans), 3.4 (c) et 3.9 (b) (Schmidt et Moradi).\n\n**Conseil** : ne cite que des chiffres que tu as lus toi-même, avec le numéro du tableau. C'est le seul point où aucun des deux corrigés ne peut te remplacer.\n\n### 6. Le style du script\n\n`%>%` ou `|>`, ggplot2 ou graphiques de base, fichiers `.txt` ou `.csv` : les deux scripts font des choix opposés. L'[atelier R](#atelier) les compare et t'aide à écrire le tien.\n\n## Tous les points de divergence\n\nChaque ligne renvoie à la sous-question, avec le conseil correspondant. Tes choix, une fois cochés, apparaissent ici et dans [Mon rapport](#choix).\n\n{{w:divergences}}\n","atelier":"# Atelier R : écrire ton propre script\n\n>> Tu n'as pas besoin de savoir programmer. Une douzaine de fonctions suffisent pour tout le travail, et chacune fait une chose simple. Cette page te donne le squelette, les gestes, les pièges, et de quoi vérifier que ton code est juste.\n\n## Ce que l'énoncé exige du script\n\n| Exigence | Ce que ça veut dire en pratique |\n|---|---|\n| **Un seul script** | Un fichier `.R` qui reproduit tout ce qui figure dans le rapport : tableaux, graphiques, régressions, chiffres cités. |\n| **Une première ligne imposée** | `dossier <- \"C:/Users/.../donnees/\"`. C'est la seule ligne que les assistantes modifieront. |\n| **Exécution sans erreur** | Du début à la fin, sur un autre ordinateur que le tien. |\n| **Fichiers intacts** | Les quatre fichiers gardent leur nom et ne sont jamais modifiés à la main : tout se fait dans le script. |\n| **Packages** | Chargés au début avec `library()`. Aucun `install.packages()` actif. |\n| **Erreurs-types** | Robustes HC1 partout, sauf indication contraire. |\n| **Résultats enregistrés** | Proposé par l'énoncé : un dossier `resultats`, des noms `tab_1_4`, `fig_1_5`, `reg_1_6`. |\n\nEt la consigne qui compte le plus pour l'oral : chaque membre du groupe doit pouvoir **expliquer le code**.\n\n## Installer et préparer, une seule fois\n\n1. **Installe R (version 4.2 ou plus récente) et RStudio.** La version compte : voir le premier piège plus bas.\n2. **Crée un dossier `donnees`** avec les quatre fichiers, sans les renommer et sans les ouvrir dans Excel (Excel peut modifier l'encodage et les codes des communes).\n3. **Crée un projet RStudio** : *File > New Project > New Directory*. Le dossier du projet devient le répertoire de travail : c'est là que `resultats` sera créé.\n4. **Installe les packages dans la console**, pas dans le script :\n\n```r\ninstall.packages(c(\"dplyr\", \"ggplot2\", \"lmtest\", \"sandwich\", \"car\", \"AER\", \"haven\"))\n```\n\n5. **Exécute ligne par ligne** avec Ctrl + Entrée pour voir chaque résultat. Pour tout lancer d'un coup : Ctrl + Maj + Entrée.\n\n## Le squelette du script\n\nCes lignes forment le début de ton script. Je les ai exécutées telles quelles sur tes fichiers.\n\n```r\ndossier <- \"C:/Users/.../donnees/\"     # seule ligne que les assistantes modifieront\n\n# ---- Packages : chargés ici, jamais installés dans le script\nlibrary(dplyr)      # filter, mutate, group_by, summarise, jointures\nlibrary(ggplot2)    # graphiques\nlibrary(lmtest)     # coeftest(), bptest()\nlibrary(sandwich)   # vcovHC() : erreurs-types HC1 ; vcovCL() : erreurs-types groupées\nlibrary(car)        # linearHypothesis() : tests de restrictions\nlibrary(AER)        # ivreg() : variables instrumentales\nlibrary(haven)      # read_dta() : fichier Stata de la partie 3\n\n# ---- Réglages communs\ndir.create(\"resultats\", showWarnings = FALSE)\nrob <- function(m) coeftest(m, vcov = vcovHC(m, type = \"HC1\"))   # erreurs-types HC1\n\n# ---- Lecture des quatre fichiers\nimmo_raw <- read.delim(file.path(dossier, \"vastgoed_2010_9999.txt\"),\n                       sep = \"|\", fileEncoding = \"latin1\",\n                       colClasses = c(CD_REFNIS = \"character\"))\nfisc_raw <- read.delim(file.path(dossier, \"TF_PSNL_INC_TAX_MUNTY.txt\"),\n                       sep = \"|\", fileEncoding = \"UTF-8-BOM\",\n                       colClasses = c(CD_MUNTY_REFNIS = \"character\"))\nload(file.path(dossier, \"Fertility.RData\"))                 # crée l'objet Fertility\nelec_raw <- read_dta(file.path(dossier, \"elec_data.dta\"))\n\n# ---- Premier contrôle\ndim(immo_raw); dim(fisc_raw); dim(Fertility); dim(elec_raw)\n```\n\n:::verif Ce que tu dois voir après la dernière ligne\nAvec tes fichiers : `286120 13`, puis `11039 49`, puis `254654 8`, puis `20090 8` (lignes, colonnes). Si les deux premières tables n'ont qu'**une** ligne, va directement au premier piège.\n:::\n\n**La fonction `rob()`.** L'énoncé demande des erreurs-types HC1 partout, avec `coeftest(m, vcov = vcovHC(m, type = \"HC1\"))`. Plutôt que de recopier cette ligne soixante fois, on lui donne un nom. `rob(m)` prend un modèle estimé et renvoie son tableau de coefficients avec erreurs-types robustes. C'est la seule fonction « maison » dont tu as vraiment besoin.\n\n## Les fonctions qui font tout le travail\n\n| Fonction | Package | Ce qu'elle fait | Première utilisation |\n|---|---|---|---|\n| `read.delim()` | base | lit un fichier texte dont les colonnes sont séparées par un caractère | [1.1](#q-1-1) |\n| `filter()` | dplyr | garde les lignes qui vérifient une condition | [1.1](#q-1-1) |\n| `mutate()` | dplyr | crée ou modifie une colonne | [1.1](#q-1-1) |\n| `group_by()` puis `summarise()` | dplyr | calcule quelque chose par groupe | [1.4](#q-1-4) |\n| `inner_join()`, `anti_join()` | dplyr | fusionne deux tables ; liste les lignes sans correspondance | [1.1](#q-1-1) |\n| `lm()` | stats | régression par MCO | [1.6](#q-1-6) |\n| `coeftest()` avec `vcovHC()` | lmtest, sandwich | tableau de coefficients avec erreurs-types HC1 | [1.6](#q-1-6) |\n| `relevel()` | stats | change la catégorie de référence | [1.11](#q-1-11) |\n| `linearHypothesis()` | car | teste une ou plusieurs restrictions sur les coefficients | [1.13](#q-1-13) |\n| `bptest()` | lmtest | test de Breusch-Pagan | [1.14](#q-1-14) |\n| `ivreg()` | AER | variables instrumentales et 2SLS | [2.6](#q-2-6) |\n| `vcovCL()` | sandwich | erreurs-types groupées | [3.8](#q-3-8) |\n| `ggplot()` puis `ggsave()` | ggplot2 | dessine un graphique ; l'enregistre | [1.4](#q-1-4) |\n\n**L'enchaînement `%>%`.** Il se lit « puis ». `communes %>% filter(region == \"Wallonie\") %>% summarise(mean(prix))` : prends `communes`, **puis** garde la Wallonie, **puis** calcule la moyenne du prix. R propose aussi `|>`, qui fait la même chose. Choisis l'un des deux et garde-le.\n\n## Écrire une formule\n\nToutes les régressions s'écrivent avec la même grammaire : la variable expliquée, un tilde, les variables explicatives.\n\n| Tu écris | R comprend |\n|---|---|\n| `y ~ x1 + x2` | `y` expliqué par `x1` et `x2`, avec une constante |\n| `log(y) ~ log(x)` | un modèle log-log, sans créer de colonnes |\n| `y ~ x * region` | `x + region + x:region` : effets principaux et interaction |\n| `y ~ x:region` | l'interaction seule |\n| `y ~ factor(id)` | une indicatrice par valeur de `id` : des effets fixes |\n| `y ~ x + w \\| z + w` | dans `ivreg()` : `x` est endogène, `z` est l'instrument, `w` un contrôle écrit des deux côtés |\n\nUne variable de type texte ou `factor` crée automatiquement une indicatrice par catégorie, sauf la première, qui sert de référence. Pour choisir la référence : `relevel(factor(region), ref = \"Wallonie\")`.\n\n## Enregistrer chaque résultat\n\nL'énoncé propose trois lignes types. Le nom reprend toujours le numéro de la question.\n\n```r\n# un tableau\nwrite.csv(tab_1_4, \"resultats/tab_1_4.csv\", row.names = FALSE)\n\n# un graphique ggplot2\nggsave(\"resultats/fig_1_5.png\", fig_1_5, width = 7, height = 4.5)\n\n# une régression, avec erreurs-types robustes\ncapture.output(rob(reg_1_6), file = \"resultats/reg_1_6.txt\")\n```\n\nDans le rapport, chaque tableau et chaque graphique porte le numéro de la question, un titre, les unités et la source des données.\n\n## Lire une sortie\n\nLa leçon [Lire une sortie de R](#b-lire-r) détaille chaque colonne. L'essentiel tient en une ligne :\n\n```\n             Estimate Std. Error t value  Pr(>|t|)\nlrev         1.607820   0.074037 21.7165 < 2.2e-16 ***\n```\n\n`Estimate` est le coefficient, `Std. Error` son erreur-type, `t value` leur rapport, `Pr(>|t|)` la p-valeur. L'intervalle de confiance à 95 % : coefficient ± 1,96 × erreur-type.\n\n:::piege Les erreurs-types affichées par défaut ne sont pas les bonnes\n`summary(lm(...))` affiche les erreurs-types **classiques**, qui supposent l'homoscédasticité. Pour le modèle log-log de la question 1.6, elle annonce 0,081 là où l'erreur-type HC1 vaut 0,149 : presque moitié moins. N'utilise `summary()` que pour le R² : `summary(m)$r.squared`.\n:::\n\n## Les deux scripts côte à côte\n\nLes deux scripts donnent les mêmes résultats. Ils ne sont pas écrits de la même façon, et la différence compte pour toi : c'est **ton** script que tu devras expliquer.\n\n| | Script de ChatGPT | Script de Claude |\n|---|---|---|\n| Longueur | 526 lignes | 1 068 lignes |\n| Commentaires | 41 lignes | 194 lignes |\n| Lignes de plus de 100 caractères | 61 | 3 |\n| Enchaînement | `\\|>` | `%>%` |\n| Packages | dplyr, haven, lmtest, sandwich, AER | les mêmes, plus ggplot2 et car |\n| Graphiques | graphiques de base (`png()`, `plot()`) | ggplot2 et `ggsave()`, comme dans l'énoncé |\n| Erreurs-types HC1 | une fonction maison `reg_table()` | `rob()`, la ligne de l'énoncé |\n| Tests de restrictions | fonctions maison `contraste()` et `wald_F()` | `linearHypothesis()` |\n| Nom des objets | courts : `m9`, `b`, `cf` | ceux de l'énoncé : `reg_1_9`, `tab_1_10` |\n| Résultats | 83 fichiers dans le dossier des **données**, régressions en `.csv` | 85 fichiers dans `resultats`, régressions en `.txt` |\n| Vérifications internes | 14 `stopifnot()` | aucune |\n\n**La même question, deux écritures.** Voici la régression de la question 1.9.\n\n```r\n# ChatGPT\nm9 <- lm(lprix ~ lrev+region, b)\nsauver(reg_table(m9),\"reg_1_9\")\n```\n\n```r\n# Claude\nreg_1_9 <- lm(lprix ~ lrev + region, data = base)\nrob(reg_1_9)\ncapture.output(rob(reg_1_9), summary(reg_1_9)$r.squared,\n               file = \"resultats/reg_1_9.txt\")\n```\n\nLa première est plus courte, mais il faut aller lire `sauver()` et `reg_table()` pour savoir ce qui se passe. La seconde se lit sans rien chercher.\n\n### Ce qu'il faut prendre chez chacun\n\n- **De Claude** : la structure. Une section par question, les noms d'objets de l'énoncé, `rob()`, des commentaires qui disent **pourquoi**. C'est le script le plus proche de ce que l'énoncé décrit, et le plus facile à expliquer.\n- **De ChatGPT** : le réflexe de vérifier. Ses `stopifnot()` contrôlent par exemple que les coefficients recalculés à la main (1.10) sont identiques à ceux de `relevel()` (1.11). Fais ces vérifications toi aussi, dans la console.\n\n### Deux points de vigilance sur le script de ChatGPT\n\n- **Il s'arrête si une vérification échoue.** `stopifnot(nrow(b) == 551L)` interrompt tout le script si la base ne compte pas exactement 551 communes. Avec tes fichiers, toutes les vérifications passent. Mais si les assistantes utilisent un téléchargement plus récent des fichiers Statbel, un tel test peut arrêter l'exécution, alors que l'énoncé exige un script qui tourne jusqu'au bout.\n- **Il écrit ses résultats dans le dossier des données** (`file.path(dossier, \"resultats\")`), pas dans un dossier `resultats` du répertoire de travail comme le propose l'énoncé.\n\n## Dix pièges, dont plusieurs silencieux\n\nLes pires erreurs sont celles qui ne produisent aucun message. Les quatre premières sont de ce type.\n\n1. **La session R n'est pas en UTF-8.** Je l'ai reproduit : R ne lit alors qu'**une seule ligne** de chaque fichier Statbel, affiche un simple avertissement (`invalid input found on input connection`) et continue. Les deux scripts échouent ensuite, plus loin, avec un message sans rapport. Le remède sous Windows : R 4.2 ou plus récent, qui travaille en UTF-8. Sur un autre système, `Sys.getlocale()` doit mentionner UTF-8. Le contrôle dans tous les cas : `dim(immo_raw)` doit afficher 286 120 lignes.\n2. **Le code INS lu comme un nombre.** Sans `colClasses = c(CD_REFNIS = \"character\")`, le code `01000` devient `1000` et les fusions de tables perdent des lignes.\n3. **Les valeurs manquantes.** `lm()` retire sans prévenir les lignes incomplètes. Vérifie toujours `nobs(m)` : 551, 254 654, 2 866. Et `mean()` renvoie `NA` s'il y a une seule valeur manquante : ajoute `na.rm = TRUE`.\n4. **Anvers.** La fusion des deux tables « réussit » alors que le code 11002 ne désigne pas le même territoire des deux côtés ([question 1.1](#q-1-1)).\n5. **`summary()` au lieu de `rob()`.** Les coefficients sont justes, les erreurs-types ne sont pas celles demandées.\n6. **La catégorie de référence.** C'est l'ordre des catégories qui la fixe. Si tes coefficients de région ont le mauvais signe, regarde `levels(base$region)`.\n7. **Filtrer sur un texte accentué.** `\"façades\"` est exactement le genre de mot qu'un problème d'encodage abîme. Préfère le libellé néerlandais, sans accent, ou `startsWith()`.\n8. **Une variable fixe avec des effets fixes.** Placée après eux, `treated` vaut `NA`. Placée avant, R affiche un nombre qui n'a aucun sens ([question 3.7](#q-3-7)).\n9. **Les couleurs dans ggplot.** Mets `aes(colour = region)` dans `geom_point()`. Dans `ggplot()`, `geom_smooth()` tracerait une droite par région.\n10. **`setwd()` et `install.packages()` dans le script.** Les deux le font planter sur un autre ordinateur. Aucun des deux ne doit rester actif dans la version remise.\n\nLa partie 2 porte sur 254 654 mères : elle peut prendre une minute. C'est normal.\n\n## Valeurs de contrôle\n\nSi tu retrouves ces nombres avec ton propre code, il est juste. Coche-les au fur et à mesure.\n\n{{w:controles}}\n\nUn écart à la quatrième décimale n'a pas d'importance. Un écart à la première signale une erreur d'échantillon : commence par vérifier `nobs(m)`.\n\n## S'approprier le script\n\nUn script que tu as seulement relu, tu ne sauras pas le défendre. Voici ce qui fait vraiment la différence, du plus simple au plus exigeant.\n\n1. **Retape-le au lieu de le copier.** Partie par partie, en exécutant chaque ligne. C'est lent, et c'est le but : tu vois chaque résultat intermédiaire.\n2. **Écris tes propres commentaires.** Avant chaque bloc, une phrase : ce qu'il calcule et pourquoi. Si tu n'arrives pas à l'écrire, tu ne sais pas encore l'expliquer.\n3. **Fais tes propres choix là où l'énoncé en laisse.** Les quatre statistiques de la question 2.1, les trois de la question 3.1, le libellé des axes, le titre des tableaux, la catégorie de référence : rien n'oblige à reprendre ceux des corrigés.\n4. **Supprime ce que tu ne sais pas justifier.** Une vérification supplémentaire, une fonction maison, une régression hors énoncé : si tu ne peux pas dire à quoi elle sert, elle te desservira à l'oral.\n5. **Casse-le exprès.** Retire `colClasses`, remplace `rob()` par `summary()`, oublie `na.rm = TRUE`, et regarde ce qui change. C'est la meilleure façon de comprendre à quoi sert chaque ligne.\n6. **Fais-le tourner ailleurs.** Sur l'ordinateur d'un autre membre du groupe, dans une session neuve, en ne changeant que la première ligne. C'est exactement ce que feront les assistantes.\n7. **Explique-le à voix haute.** Prends un bloc au hasard et décris-le à quelqu'un du groupe sans lire les commentaires. Les [cartes d'oral](#oral) te donnent les questions probables.\n\n:::cle Le test final\nPour chaque chiffre de ton rapport, tu dois pouvoir montrer la ligne du script qui le produit, et dire en une phrase ce qu'elle fait.\n:::\n","glossaire":"#T Observation | observations\nUne ligne du tableau de données : une commune, une mère, une localité observée une année donnée.\n@voir b-donnees\n\n#T Unité statistique | unite statistique\nCe que représente une ligne du tableau. Partie 1 : une commune en 2023. Partie 2 : une mère. Partie 3 : une localité une année donnée.\n@voir b-donnees\n\n#T Panel | donnees de panel\nDonnées où les mêmes unités sont observées à plusieurs dates. Dans la partie 3, 574 localités suivies chaque année.\n@voir q-3-1\n\n#T Médiane | mediane, prix median\nValeur qui partage les observations en deux moitiés égales. Peu sensible aux valeurs extrêmes, contrairement à la moyenne.\n@voir b-donnees\n\n#T Écart interquartile | ecart interquartile, EIQ, quartile, quartiles\nDifférence entre le troisième quartile (p75) et le premier (p25). Mesure la dispersion de la moitié centrale des observations.\n@voir q-1-3\n\n#T Coefficient d'asymétrie | asymetrie, skewness\nMesure du déséquilibre entre les deux queues d'une distribution : nul si elle est symétrique, positif si la queue de droite est plus longue, négatif si c'est celle de gauche.\n@voir q-1-4\n\n#T Variable dépendante | variable dependante, variable expliquee\nLa variable qu'on cherche à expliquer, notée y, à gauche du `~` dans une formule R.\n@voir b-mco\n\n#T Régresseur | regresseur, variable explicative, regresseurs\nUne variable placée à droite du `~`, qui sert à expliquer la variable dépendante.\n@voir b-mco\n\n#T MCO | moindres carres ordinaires, moindres carres, OLS\nMoindres carrés ordinaires : méthode qui choisit la droite (ou le plan) rendant la somme des carrés des résidus la plus petite possible. Fonction `lm()` dans R.\n@voir b-mco\n\n#T Coefficient | coefficients, pente, coefficient de pente\nNombre estimé qui mesure de combien la variable dépendante change quand un régresseur augmente d'une unité, les autres régresseurs restant fixes.\n@voir b-mco\n\n#T Constante | intercept, ordonnee a l'origine\nValeur prédite de y quand tous les régresseurs valent zéro. Notée `(Intercept)` dans R. Souvent sans interprétation concrète.\n@voir b-mco\n\n#T Résidu | residu, residus\nÉcart entre la valeur observée et la valeur prédite par le modèle estimé. C'est l'estimation du terme d'erreur, observation par observation.\n@voir b-mco\n\n#T Terme d'erreur | terme d erreur, erreur, u\nTout ce qui fait varier y en dehors des régresseurs du modèle. On ne l'observe pas. Les hypothèses importantes portent sur lui.\n@voir b-hypotheses\n\n#T Valeur ajustée | valeurs ajustees, valeur predite, prediction\nValeur de y prédite par le modèle estimé pour une observation. Valeur observée = valeur ajustée + résidu.\n\n#T R² | r2, r carre, coefficient de determination\nPart de la variance de la variable dépendante expliquée par le modèle, entre 0 et 1. Ne se compare qu'entre modèles ayant la même variable dépendante.\n@voir q-1-8\n\n#T Erreur-type | erreur type, erreurs-types, standard error, ET\nMesure de l'imprécision d'une estimation : de combien elle varierait d'un échantillon à l'autre. Plus elle est petite, plus l'estimation est précise.\n@voir b-incertitude\n\n#T Statistique t | t, t value, statistique de test\nCoefficient divisé par son erreur-type. Indique à combien d'erreurs-types de zéro se trouve l'estimation. Au-delà de 1,96 en valeur absolue : significatif à 5 %.\n@voir b-incertitude\n\n#T p-valeur | p valeur, p-value, valeur p\nProbabilité d'obtenir une statistique au moins aussi extrême que celle observée si l'hypothèse nulle était vraie. Petite p-valeur : les données contredisent H₀.\n@voir b-incertitude\n\n#T Intervalle de confiance | IC, intervalle de confiance a 95\nPlage de valeurs plausibles pour le vrai coefficient : estimation ± 1,96 × erreur-type pour un niveau de 95 %.\n@voir b-incertitude\n\n#T Hypothèse nulle | H0, hypothese nulle\nL'affirmation qu'un test met à l'épreuve, par exemple « le coefficient vaut zéro ». On la rejette si les données la rendent trop peu plausible ; ne pas la rejeter ne la prouve pas.\n@voir b-incertitude\n\n#T Significatif | significativite, significatif a 5\nSe dit d'un coefficient dont on rejette qu'il soit nul, à un seuil donné (5 % en général). Ne dit rien de l'importance pratique de l'effet.\n@voir b-incertitude\n\n#T Puissance d'un test | puissance\nCapacité d'un test à rejeter H₀ quand elle est fausse. Un test peu puissant laisse passer des écarts réels : son non-rejet n'est pas une preuve.\n\n#T Loi du khi-deux | khi-deux, khi2, chi-deux, chi2\nLoi suivie sous H₀ par les statistiques de plusieurs tests du travail (Breusch-Pagan, Sargan). Dépend d'un nombre de degrés de liberté.\n@voir q-1-14\n\n#T Degrés de liberté | degres de liberte, ddl\nParamètre d'une loi de test. Pour un khi-deux : le nombre de restrictions testées. Pour Sargan : nombre d'instruments moins nombre de variables endogènes.\n\n#T Logarithme | log, ln, logarithme naturel\nFonction qui transforme les multiplications en additions. Une différence de logarithmes est approximativement une variation en pourcentage. `log()` dans R.\n@voir b-log\n\n#T Élasticité | elasticite, elasticites\nVariation en pourcentage de y associée à une variation de 1 % de x. C'est la pente d'un modèle log-log.\n@voir q-1-6\n\n#T Semi-élasticité | semi-elasticite\nVariation en pourcentage de y associée à une hausse d'une unité de x. C'est 100 fois la pente d'un modèle log-niveau.\n@voir q-1-6\n\n#T Forme fonctionnelle | formes fonctionnelles\nChoix de mettre ou non la variable dépendante et les régresseurs en logarithme (niveau-niveau, log-log, log-niveau, niveau-log). Chaque forme impose une relation différente.\n@voir q-1-6\n\n#T Indicatrice | indicatrices, variable indicatrice, dummy, variable muette, variable binaire\nVariable qui vaut 1 si l'observation appartient à une catégorie, 0 sinon.\n@voir b-indicatrices\n\n#T Catégorie de référence | categorie de reference, reference\nLa catégorie pour laquelle on ne met pas d'indicatrice. Tous les coefficients d'indicatrices mesurent un écart par rapport à elle.\n@voir q-1-9\n\n#T Colinéarité parfaite | colinearite parfaite, colinearite, piege des variables indicatrices\nSituation où un régresseur est une combinaison exacte des autres. Les MCO n'ont alors pas de solution unique, et R renvoie `NA` pour un coefficient.\n@voir q-1-9\n\n#T Interaction | interactions, terme d'interaction\nProduit de deux régresseurs. Son coefficient mesure de combien l'effet de l'un change selon la valeur de l'autre (une pente différente par région, par exemple).\n@voir q-1-13\n\n#T Centrage | centrer, variable centree\nSoustraire une constante à un régresseur pour déplacer son point zéro. Ne change pas les pentes, mais rend interprétables la constante et les indicatrices.\n@voir q-1-13\n\n#T Exogène | exogene, exogeneite, exogenes\nSe dit d'un régresseur sans lien avec le terme d'erreur : $E(u \\mid x) = 0$. Condition pour que son coefficient ne soit pas biaisé.\n@voir b-hypotheses\n\n#T Endogène | endogene, endogeneite\nSe dit d'un régresseur corrélé au terme d'erreur. Son coefficient MCO est biaisé. Causes : variable omise, causalité inverse, erreur de mesure.\n@voir q-2-2\n\n#T Biais de variable omise | variable omise, biais de variable omise\nBiais d'un coefficient quand on oublie une variable qui influence y et qui est corrélée au régresseur. Signe = (effet de la variable omise sur y) × (son lien avec le régresseur).\n@voir q-1-12\n\n#T Facteur de confusion | confusion, facteur cache\nVariable qui agit à la fois sur la cause supposée et sur le résultat, et crée une association sans lien causal.\n@voir b-causalite\n\n#T Causalité inverse | causalite inverse\nSituation où c'est y qui influence x, et non (seulement) l'inverse.\n@voir q-1-18\n\n#T Biais de sélection | selection, biais de selection\nBiais qui apparaît quand les groupes comparés se sont formés selon des caractéristiques liées au résultat.\n@voir q-2-2\n\n#T Erreur de mesure | erreur de mesure\nÉcart entre la valeur observée d'une variable et sa vraie valeur. Sur y : ajoute du bruit. Sur x : tire le coefficient vers zéro.\n@voir q-1-2\n\n#T Biais d'atténuation | attenuation\nBiais vers zéro d'un coefficient quand le régresseur est mesuré avec une erreur aléatoire.\n@voir q-1-18\n\n#T Homoscédasticité | homoscedasticite\nHypothèse selon laquelle la variance du terme d'erreur est la même pour toutes les observations.\n@voir q-1-14\n\n#T Hétéroscédasticité | heteroscedasticite\nSituation où la variance du terme d'erreur dépend des observations. Les coefficients MCO restent sans biais, mais les erreurs-types classiques sont fausses.\n@voir q-1-14\n\n#T Erreurs-types robustes HC1 | HC1, erreurs-types robustes, robuste, robustes\nErreurs-types valables même en cas d'hétéroscédasticité. HC1 est la version de White multipliée par n/(n − k). Dans R : `vcovHC(m, type = \"HC1\")`.\n@voir b-hypotheses\n\n#T Test de Breusch-Pagan | breusch-pagan, BP\nTest d'homoscédasticité : on régresse les résidus au carré sur des variables, et n × R² suit un khi-deux si la variance est constante.\n@voir q-1-14\n\n#T Moindres carrés pondérés | moindres carres ponderes, WLS\nVariante des MCO qui donne plus de poids aux observations les plus précises. Plus efficace que les MCO en présence d'hétéroscédasticité de forme connue.\n\n#T Variable de contrôle | controle, controles, variable de controle\nVariable ajoutée au modèle pour tenir constant un facteur qui influence y et qui est lié au régresseur d'intérêt.\n@voir q-2-7\n\n#T Mauvais contrôle | mauvais controle, bad control\nVariable qui est elle-même une conséquence du régresseur d'intérêt (ou de y). La contrôler fausse l'interprétation.\n@voir q-1-16\n\n#T Instrument | instruments, variable instrumentale, variables instrumentales, VI\nVariable qui fait varier le régresseur endogène sans être liée au terme d'erreur. Permet d'isoler une variation « propre » du régresseur.\n@voir q-2-3\n\n#T Pertinence | condition de pertinence\nPremière condition d'un instrument : il doit réellement faire varier le régresseur endogène. Se vérifie avec la première étape.\n@voir q-2-4\n\n#T Restriction d'exclusion | exclusion, restriction d exclusion\nCondition selon laquelle l'instrument n'agit sur le résultat que par l'intermédiaire du régresseur endogène. Ne se teste pas directement.\n@voir q-2-3\n\n#T Indépendance | independance de l'instrument\nCondition selon laquelle l'instrument est « comme tiré au sort », sans lien avec les caractéristiques des individus.\n@voir q-2-3\n\n#T Monotonie | condition de monotonie\nHypothèse selon laquelle l'instrument pousse tout le monde dans le même sens (personne ne fait l'inverse). Nécessaire pour interpréter la VI comme un effet local.\n@voir q-2-14\n\n#T Première étape | premiere etape, first stage\nRégression du régresseur endogène sur l'instrument (et les contrôles). Mesure la force de l'instrument.\n@voir q-2-4\n\n#T Forme réduite | forme reduite, reduced form\nRégression directe du résultat sur l'instrument. Mesure l'effet total de l'instrument sur le résultat.\n@voir q-2-6\n\n#T Estimateur de Wald | wald\nAvec un instrument binaire : forme réduite divisée par première étape.\n@voir q-2-6\n\n#T 2SLS | doubles moindres carres, 2sls, tsls\nDoubles moindres carrés : on prédit le régresseur endogène à l'aide des instruments et des contrôles, puis on utilise cette prédiction dans l'équation d'intérêt. Fonction `ivreg()`.\n@voir q-2-8\n\n#T Instrument faible | instruments faibles\nInstrument qui fait très peu varier le régresseur endogène. L'estimation devient imprécise et peu fiable. Repère usuel : F de première étape inférieur à 10.\n@voir q-2-4\n\n#T F de première étape | f de premiere etape, statistique F\nStatistique qui teste que les coefficients des instruments sont nuls dans la première étape. Avec un seul instrument, F = t².\n@voir q-2-4\n\n#T Suridentification | suridentifie, test de sargan, sargan, test J, hansen\nSituation où il y a plus d'instruments que de variables endogènes. On peut alors tester si les instruments donnent des réponses compatibles (test de Sargan ou test J).\n@voir q-2-11\n\n#T Test de Hausman | hausman, wu-hausman, test d'endogeneite\nTest qui compare les MCO et la VI pour savoir si le régresseur est réellement endogène. Suppose que les instruments sont valides.\n@voir q-2-12\n\n#T LATE | effet local, effet local moyen du traitement\nEffet moyen du traitement chez les « compliers » : c'est ce que mesure la VI quand l'effet diffère d'un individu à l'autre.\n@voir q-2-14\n\n#T Compliers | complier\nIndividus dont le traitement dépend de l'instrument : ici, les mères qui ont un troisième enfant parce que les deux premiers sont de même sexe, et pas sinon.\n@voir q-2-14\n\n#T Modèle de probabilité linéaire | probabilite lineaire\nRégression linéaire dont la variable dépendante vaut 0 ou 1. Les coefficients se lisent en points de probabilité.\n@voir q-2-4\n\n#T Marge extensive | marge intensive, marges\nMarge extensive : participer ou non (travailler ou pas, être éclairé ou pas). Marge intensive : combien, parmi ceux qui participent.\n@voir q-2-13\n\n#T Double différence | double difference, differences-en-differences, DiD, DD\nDifférence, entre le groupe traité et le groupe de comparaison, de leurs évolutions avant-après.\n@voir q-3-4\n\n#T Tendances parallèles | tendances paralleles\nHypothèse centrale de la double différence : sans traitement, les deux groupes auraient évolué de la même façon.\n@voir q-3-6\n\n#T Contrefactuel | contrefactuelle\nCe qui serait arrivé au groupe traité s'il n'avait pas été traité. On ne l'observe jamais ; toute la méthode consiste à l'approcher.\n@voir q-3-6\n\n#T Placebo | test placebo\nEstimation refaite là où il ne devrait y avoir aucun effet (une fausse date de traitement, par exemple). Un « effet » placebo signale un problème.\n@voir q-3-6\n\n#T Effets fixes | effet fixe, effets fixes de localite, effets fixes d'annee\nUne constante propre à chaque unité (localité) ou à chaque période (année). Absorbent tout ce qui ne varie pas dans le temps, ou tout ce qui est commun à une année.\n@voir q-3-7\n\n#T TWFE | two-way fixed effects, effets fixes doubles\nRégression avec à la fois des effets fixes d'unité et des effets fixes de période.\n@voir q-3-7\n\n#T Erreurs-types groupées | erreurs-types groupees, cluster, clustered, groupees\nErreurs-types qui autorisent les erreurs d'un même groupe (une même localité) à être corrélées entre elles. Dans R : `vcovCL()`.\n@voir q-3-8\n\n#T Code INS | REFNIS, code refnis, code NIS\nCode à cinq chiffres qui identifie chaque commune belge. C'est la clé qui permet de fusionner les deux fichiers de la partie 1.\n@voir q-1-1\n\n#T anti_join | anti-join, antijoin\nFonction de `dplyr` qui renvoie les lignes d'une table sans correspondant dans une autre. Sert à repérer les communes présentes dans un seul fichier.\n@voir q-1-1\n"};
