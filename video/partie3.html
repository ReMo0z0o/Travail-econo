<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Partie 3 expliquée : la double différence</title>
<!-- Vidéo explicative de la partie 3, rendue image par image par video/rendre.cjs.
     Chaque scène a des sous-titres ; les éléments marqués data-in="k" apparaissent au début du
     sous-titre k de la scène (data-in="k+1.5" : 1,5 s après). La durée de chaque sous-titre dépend
     de sa longueur, pour laisser le temps de lire. -->
<style>
@font-face { font-family: "Titre"; font-weight: 500 700; src: url(../outils/polices/space-grotesk-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Titre"; font-weight: 700; src: url(../outils/polices/space-grotesk-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Texte"; font-weight: 400; src: url(../outils/polices/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Texte"; font-weight: 400; src: url(../outils/polices/ibm-plex-sans-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+2000-206F; }
@font-face { font-family: "Texte"; font-weight: 600; src: url(../outils/polices/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Texte"; font-weight: 700; src: url(../outils/polices/ibm-plex-sans-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Code"; font-weight: 400; src: url(../outils/polices/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Code"; font-weight: 500; src: url(../outils/polices/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
:root {
  --bg: #f4f5f7; --surface: #fff; --ink: #0f1b2d; --ink-2: #3f4b5e; --muted: #6b7687; --line: #dfe3ea;
  --accent: #2747c9; --soft: #e9edfc; --t: #2a78d6; --c: #eb6834; --g: #1baf7a; --bad: #c43d3d; --nuit: #0b1220;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 34px/1.4 "Texte", sans-serif; }
.scene { position: absolute; inset: 0 0 230px 0; padding: 70px 110px 0; opacity: 0; }
.etiquette { position: absolute; top: 34px; left: 110px; font: 600 22px/1 "Texte"; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.etiquette b { color: var(--accent); }
h1 { font: 700 76px/1.08 "Titre", sans-serif; margin: 0 0 24px; letter-spacing: -.01em; }
h2 { font: 700 60px/1.1 "Titre", sans-serif; margin: 40px 0 30px; letter-spacing: -.01em; }
.sous { font-size: 40px; color: var(--ink-2); }
.carte { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 26px 32px; }
.grand { font: 700 120px/1 "Titre"; }
.code { font: 500 36px/1.4 "Code", monospace; background: #eef1f6; border-radius: 12px; padding: 18px 26px; display: inline-block; }
.t { color: var(--t); } .c { color: var(--c); } .g { color: var(--g); } .a { color: var(--accent); } .m { color: var(--muted); }
.rangee { display: flex; gap: 36px; align-items: flex-start; }
.pastille { display: inline-block; padding: 6px 18px; border-radius: 999px; font: 600 28px/1.2 "Texte"; }
svg text { font-family: "Texte", sans-serif; }
#sous-titre { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; background: var(--ink); color: #fff; display: flex; align-items: center; padding: 0 140px; }
#sous-titre p { margin: 0; font: 500 40px/1.38 "Texte"; max-width: 1640px; }
#sous-titre p b { color: #9fb4ff; }
#avance { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--accent); }
#chapitre { position: absolute; right: 110px; top: 30px; font: 600 24px/1 "Texte"; color: var(--muted); }
</style>
</head>
<body>
<div id="scenes"></div>

<div id="sous-titre"><p></p></div>
<div id="avance"></div>
<script>
'use strict';
// ------------------------------------------------------------------ scènes
// Chaque scène : un titre de chapitre, des sous-titres (narration) et un fragment HTML/SVG.
const S = [];
const scene = (chap, caps, html) => S.push({ chap, caps, html });

// Petits utilitaires de dessin SVG.
const barre = (x, base, haut, larg, couleur, inn, val, etiquette) =>
  `<g data-in="${inn}"><rect data-grow="${inn}" x="${x}" y="${base - haut}" width="${larg}" height="${haut}" rx="6" fill="${couleur}" style="transform-origin:${x}px ${base}px"/>` +
  `<text x="${x + larg / 2}" y="${base - haut - 16}" text-anchor="middle" font-size="40" font-weight="700" fill="${couleur}">${val}</text>` +
  `<text x="${x + larg / 2}" y="${base + 44}" text-anchor="middle" font-size="30" fill="#3f4b5e">${etiquette}</text></g>`;
const accolade = (x, y1, y2, texte, inn, couleur = '#0f1b2d') =>
  `<g data-in="${inn}"><path d="M${x} ${y1} h18 V${y2} h-18" fill="none" stroke="${couleur}" stroke-width="4"/>` +
  `<text x="${x + 34}" y="${(y1 + y2) / 2 + 14}" font-size="40" font-weight="700" fill="${couleur}">${texte}</text></g>`;

// 1. Titre
scene('Introduction', [
  'Partie 3 du travail : <b>l’électrification au Burkina Faso</b>.',
  'Dans cette vidéo, on part de zéro : aucune connaissance en économétrie n’est nécessaire.',
  'À la fin, tu sauras expliquer d’où vient le chiffre central de la partie : <b>+38 points</b>.'
], `<div style="margin-top:150px">
  <div class="pastille" style="background:var(--soft);color:var(--accent)" data-in="0">ECGEB352 · Partie 3</div>
  <h1 style="font-size:96px;margin-top:30px" data-in="0+0.3">Électrification au Burkina Faso</h1>
  <div class="sous" data-in="0+0.8">La double différence, expliquée depuis zéro</div>
  <div class="grand a" style="margin-top:70px" data-in="2">+38 points</div>
</div>`);

// 2. La question
let maisons = '';
for (let i = 0; i < 100; i++) { const x = 60 + (i % 20) * 44, y = 60 + Math.floor(i / 20) * 52, allume = [7, 33, 58, 71, 94].includes(i);
  maisons += `<path d="M${x} ${y + 14} l16 -14 l16 14 v18 h-32z" fill="${allume ? '#f5b71f' : '#c6cdd8'}"/>`; }
scene('La question', [
  'Au Burkina Faso, en 2014, <b>moins de 5 ménages ruraux sur 100</b> avaient l’électricité.',
  'Raccorder un village au réseau coûte cher. Est-ce que ça vaut la peine, si si peu de ménages se branchent ?',
  'Peut-être, si le réseau profite à <b>tout le village</b> : éclairage public, écoles électrifiées, pompes à eau.',
  'La question de la partie 3 : <b>l’arrivée du réseau change-t-elle quelque chose pour la localité entière ?</b>'
], `<h2>Un réseau électrique… pour qui ?</h2>
<div class="rangee">
  <div class="carte" data-in="0"><svg width="960" height="330">${maisons}</svg>
    <div style="font-size:32px"><b style="color:#d49a00">5 ménages sur 100</b> raccordés (2014)</div></div>
  <div style="display:flex;flex-direction:column;gap:22px;margin-top:10px">
    <div class="carte" data-in="2">💡 Éclairage public</div>
    <div class="carte" data-in="2+0.6">🏫 Écoles électrifiées</div>
    <div class="carte" data-in="2+1.2">🚰 Pompes à eau</div>
  </div>
</div>`);

// 3. Mesurer depuis l'espace
let points = '';
const poss = [[120,90],[300,160],[480,80],[640,210],[200,300],[420,340],[700,90],[820,280],[560,420],[90,420],[350,470],[760,450]];
poss.forEach(([x, y], i) => { const lum = [2, 5, 9].includes(i);
  points += `<circle cx="${x}" cy="${y}" r="10" fill="#3a4560"/>` + (lum ? `<circle data-in="1+${0.3 * i / 3}" cx="${x}" cy="${y}" r="26" fill="#ffd35c" opacity=".9"/><circle data-in="1" cx="${x}" cy="${y}" r="50" fill="#ffd35c" opacity=".25"/>` : ''); });
scene('Mesurer depuis l’espace', [
  'Comment savoir si un village a changé ? Les chercheurs utilisent des <b>images de la Terre prises la nuit</b> par satellite.',
  'Pour chaque village et chaque année, une variable dit si on voit de la lumière. Elle s’appelle <b>nl_extensive</b>.',
  'Elle vaut <b>1</b> si une lumière est détectée, et <b>0</b> sinon.',
  'La moyenne de cette variable sur un groupe, c’est donc la <b>part des villages éclairés</b>. Ici : 3 villages sur 12, soit 25 %.'
], `<h2>On regarde les villages… de nuit</h2>
<div class="rangee">
  <div style="background:var(--nuit);border-radius:18px;padding:10px" data-in="0"><svg width="900" height="540">${points}</svg></div>
  <div style="display:flex;flex-direction:column;gap:26px;width:620px">
    <div class="carte" data-in="1"><div class="code" style="font-size:34px">nl_extensive</div></div>
    <div class="carte" data-in="2"><b style="color:#d49a00">1</b> = lumière détectée<br><b class="m">0</b> = village dans le noir</div>
    <div class="carte" data-in="3">Moyenne = <b class="a">3 / 12 = 25 %</b><br><span class="m" style="font-size:28px">part des villages éclairés</span></div>
  </div>
</div>`);

// 4. Les données : un panel
let grille = '';
const lignes = ['Localité 1', 'Localité 2', 'Localité 3', 'Localité 4', '…', 'Localité 574'];
for (let a = 0; a < 12; a++) grille += `<text x="${250 + a * 112 + 50}" y="40" text-anchor="middle" font-size="26" fill="#6b7687">${2003 + a}</text>`;
lignes.forEach((l, r) => { grille += `<text x="0" y="${96 + r * 74}" font-size="28" fill="#3f4b5e">${l}</text>`;
  if (l === '…') return;
  for (let a = 0; a < 12; a++) { const lum = (r === 1 && a >= 7) || (r === 3 && a >= 9);
    grille += `<rect data-in="${r < 1 ? 0 : 1}+${0.04 * (a + 12 * r)}" x="${250 + a * 112}" y="${62 + r * 74}" width="100" height="52" rx="8" fill="${lum ? '#ffd35c' : '#1f2a3d'}"/>`; } });
scene('Les données', [
  'Les données suivent <b>574 localités</b> pendant <b>12 années</b>, de 2003 à 2014.',
  'Chaque ligne du fichier, c’est <b>une localité observée une année donnée</b> : 574 × 12 = 6 888 lignes.',
  'On appelle ça un <b>panel</b> : les mêmes unités, observées plusieurs fois.',
  'Avant 2008, presque tout est noir : à peine <b>2 %</b> des localités-années sont éclairées.'
], `<h2>Un panel : les mêmes localités, chaque année</h2>
<div class="rangee">
  <svg width="1600" height="500">${grille}</svg>
</div>
<div style="position:absolute;right:110px;top:70px" class="carte" data-in="1+1"><b class="a">574 × 12 = 6 888</b> lignes</div>`);

// 5. Le contrefactuel
scene('Le vrai problème', [
  'Pour mesurer l’effet du réseau sur un village, il faudrait le comparer <b>à lui-même, sans le réseau</b>.',
  'Mais ce village-là n’existe pas : une fois raccordé, on ne verra jamais ce qu’il serait devenu sans électricité.',
  'Cette situation imaginaire s’appelle le <b>contrefactuel</b>. Toute la méthode consiste à l’estimer à l’aide d’autres villages.'
], `<h2>Comparer un village… à lui-même</h2>
<div class="rangee" style="gap:80px;margin-top:40px;align-items:center">
  <div class="carte" style="width:560px;text-align:center" data-in="0">
    <div style="font-size:120px">🏘️💡</div><b>Avec le réseau</b><br><span class="g">observé ✔</span></div>
  <div style="font:700 80px Titre" data-in="0+0.6">vs</div>
  <div class="carte" style="width:560px;text-align:center;border-style:dashed;opacity:.9" data-in="0+1">
    <div style="font-size:120px;filter:grayscale(1);opacity:.5">🏘️</div><b>Sans le réseau</b><br><span style="color:var(--bad)" data-in="1">jamais observé ✘</span></div>
</div>
<div class="carte" style="margin-top:40px;display:inline-block" data-in="2">Le <b class="a">contrefactuel</b> : ce qui se serait passé sans le traitement.</div>`);

// 6. Les deux groupes
const xAn = (a) => 80 + (a - 2003) * 108;
let frise = '';
for (let a = 2003; a <= 2017; a++) frise += `<line x1="${xAn(a)}" y1="250" x2="${xAn(a)}" y2="262" stroke="#6b7687" stroke-width="3"/><text x="${xAn(a)}" y="300" text-anchor="middle" font-size="26" fill="#3f4b5e">${a}</text>`;
scene('Deux groupes', [
  'On choisit deux groupes. Le <b>groupe traité</b> : 59 localités raccordées au réseau en 2008 ou 2009.',
  'Le <b>groupe de comparaison</b> : 238 localités raccordées plus tard, entre 2015 et 2017. Jusqu’en 2014, elles n’ont pas l’électricité.',
  'Pourquoi elles ? Elles ont été choisies par le même programme, donc elles ressemblent aux traitées. Seul le calendrier change.',
  'On écarte les localités raccordées en 2010-2014 : elles s’allument <b>pendant</b> la période étudiée. Elles fausseraient la comparaison.',
  'On écarte aussi les localités jamais raccordées : sans doute plus petites et plus isolées, elles ne sont pas comparables.',
  'Enfin, on retire 2008 et 2009, les années de raccordement. <b>Avant</b> = 2003 à 2007. <b>Après</b> = 2010 à 2014.'
], `<h2>Qui compare-t-on ?</h2>
<svg width="1700" height="560">
  <line x1="60" y1="256" x2="1640" y2="256" stroke="#6b7687" stroke-width="4"/>${frise}
  <g data-in="0"><rect x="${xAn(2008) - 40}" y="150" width="${xAn(2009) - xAn(2008) + 80}" height="70" rx="12" fill="#2a78d6"/>
    <text x="${(xAn(2008) + xAn(2009)) / 2}" y="196" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Traitées : 59</text></g>
  <g data-in="1"><rect x="${xAn(2015) - 40}" y="150" width="${xAn(2017) - xAn(2015) + 80}" height="70" rx="12" fill="#eb6834"/>
    <text x="${xAn(2016)}" y="196" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Comparaison : 238</text></g>
  <g data-in="3"><rect x="${xAn(2010) - 40}" y="70" width="${xAn(2014) - xAn(2010) + 80}" height="60" rx="12" fill="#c6cdd8"/>
    <text x="${xAn(2012)}" y="111" text-anchor="middle" font-size="28" fill="#3f4b5e">Raccordées 2010-2014 ✘</text></g>
  <g data-in="5"><rect x="${xAn(2003) - 30}" y="340" width="${xAn(2007) - xAn(2003) + 60}" height="64" rx="12" fill="#e9edfc"/>
    <text x="${xAn(2005)}" y="383" text-anchor="middle" font-size="32" font-weight="700" fill="#2747c9">AVANT</text>
    <rect x="${xAn(2008) - 30}" y="340" width="${xAn(2009) - xAn(2008) + 60}" height="64" rx="12" fill="#f3d6d6"/>
    <text x="${(xAn(2008) + xAn(2009)) / 2}" y="383" text-anchor="middle" font-size="28" fill="#c43d3d">retiré</text>
    <rect x="${xAn(2010) - 30}" y="340" width="${xAn(2014) - xAn(2010) + 60}" height="64" rx="12" fill="#e9edfc"/>
    <text x="${xAn(2012)}" y="383" text-anchor="middle" font-size="32" font-weight="700" fill="#2747c9">APRÈS</text></g>
</svg>
<div class="carte" style="position:absolute;left:110px;top:640px;font-size:32px" data-in="4">✘ Jamais raccordées : pas comparables</div>`);

// 7. Les quatre nombres
const cellule = (v, cl, inn) => `<td data-in="${inn}" style="padding:26px 50px;text-align:center"><span class="grand ${cl}" style="font-size:96px">${v}</span></td>`;
scene('Quatre nombres', [
  'On calcule la part de localités éclairées dans chaque groupe, avant et après. <b>Quatre nombres</b> suffisent.',
  'Les traitées : <b>5,2 %</b> avant, <b>44,1 %</b> après.',
  'Le groupe de comparaison : <b>2,7 %</b> avant, <b>3,7 %</b> après.',
  'Avec ces quatre nombres, essayons d’abord deux comparaisons naïves… et voyons pourquoi elles ne suffisent pas.'
], `<h2>Part des localités éclairées</h2>
<table class="carte" style="border-collapse:separate;font-size:34px" data-in="0">
  <tr><th></th><th style="padding:10px 50px" class="m">Avant<br><span style="font-size:26px">2003-2007</span></th><th style="padding:10px 50px" class="m">Après<br><span style="font-size:26px">2010-2014</span></th></tr>
  <tr><th style="text-align:left;padding-right:30px" class="t">Traitées</th>${cellule('5,2 %', 't', '1')}${cellule('44,1 %', 't', '1+1')}</tr>
  <tr><th style="text-align:left;padding-right:30px" class="c">Comparaison</th>${cellule('2,7 %', 'c', '2')}${cellule('3,7 %', 'c', '2+1')}</tr>
</table>`);

// 8. Comparaison naïve 1
const B = 520, k = 9.5;
scene('Comparaison naïve n°1', [
  'Première idée : comparer les deux groupes <b>après 2010</b>. 44,1 % contre 3,7 % : un écart de <b>40,5 points</b>.',
  'Problème : les deux groupes étaient <b>déjà un peu différents</b> avant le réseau : 5,2 % contre 2,7 %.',
  'Une partie de l’écart existait donc déjà. C’est un <b>biais de sélection</b> : les groupes n’étaient pas identiques au départ.'
], `<h2>« Après seulement » : 40,5 points ?</h2>
<svg width="1700" height="620">
  <text x="330" y="${B + 100}" text-anchor="middle" font-size="32" font-weight="700" fill="#0f1b2d">APRÈS</text>
  ${barre(160, B, 44.1 * k, 140, '#2a78d6', '0', '44,1 %', 'Traitées')}${barre(360, B, 3.7 * k + 4, 140, '#eb6834', '0+0.4', '3,7 %', 'Comparaison')}
  ${accolade(540, B - 44.1 * k, B - 3.7 * k, '40,5 pts', '0+1')}
  <g data-in="1"><text x="1130" y="${B + 100}" text-anchor="middle" font-size="32" font-weight="700" fill="#0f1b2d">AVANT</text></g>
  ${barre(960, B, 5.2 * k, 140, '#2a78d6', '1', '5,2 %', 'Traitées')}${barre(1160, B, 2.7 * k + 4, 140, '#eb6834', '1+0.3', '2,7 %', 'Comparaison')}
  <g data-in="1+1"><text x="1130" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#c43d3d">déjà 2,5 pts d’écart</text></g>
  <g data-in="2"><rect x="900" y="100" width="560" height="80" rx="14" fill="#f3d6d6"/><text x="1180" y="153" text-anchor="middle" font-size="36" font-weight="700" fill="#c43d3d">Biais de sélection</text></g>
</svg>`);

// 9. Comparaison naïve 2
scene('Comparaison naïve n°2', [
  'Deuxième idée : regarder les traitées <b>avant et après</b>. Elles passent de 5,2 % à 44,1 % : <b>+39,0 points</b>.',
  'Problème : entre les deux périodes, d’autres choses ont changé <b>pour tout le monde</b> : croissance, lampes solaires, satellite plus sensible…',
  'La preuve : même <b>sans réseau</b>, le groupe de comparaison a gagné 0,9 point. C’est un <b>biais de tendance</b>.'
], `<h2>« Avant / après » : 39 points ?</h2>
<svg width="1700" height="620">
  <text x="330" y="${B + 100}" text-anchor="middle" font-size="32" font-weight="700" fill="#2a78d6">TRAITÉES</text>
  ${barre(160, B, 5.2 * k, 140, '#2a78d6', '0', '5,2 %', 'Avant')}${barre(360, B, 44.1 * k, 140, '#2a78d6', '0+0.4', '44,1 %', 'Après')}
  ${accolade(540, B - 44.1 * k, B - 5.2 * k, '+39,0 pts', '0+1')}
  <g data-in="2"><text x="1130" y="${B + 100}" text-anchor="middle" font-size="32" font-weight="700" fill="#eb6834">COMPARAISON (sans réseau)</text></g>
  ${barre(960, B, 2.7 * k + 4, 140, '#eb6834', '2', '2,7 %', 'Avant')}${barre(1160, B, 3.7 * k + 4, 140, '#eb6834', '2+0.3', '3,7 %', 'Après')}
  <g data-in="2+1"><text x="1130" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#c43d3d">+0,9 pt sans réseau</text></g>
  <g data-in="1"><rect x="900" y="100" width="560" height="80" rx="14" fill="#f3d6d6"/><text x="1180" y="153" text-anchor="middle" font-size="36" font-weight="700" fill="#c43d3d">Biais de tendance</text></g>
</svg>`);

// 10. La double différence
const gx = (p) => 260 + p * 700, gy = (v) => 560 - v * 10;
scene('La double différence', [
  'La <b>double différence</b> corrige les deux biais d’un coup.',
  'Hypothèse : sans le réseau, les traitées auraient suivi la <b>même évolution</b> que le groupe de comparaison, soit +0,9 point.',
  'Elles seraient donc passées de 5,2 % à environ <b>6,1 %</b>. C’est la ligne en pointillés : le contrefactuel.',
  'Or on observe 44,1 %. L’écart, c’est l’effet du réseau : <b>39,0 − 0,9 = 38,0 points</b>.',
  'À retenir : on soustrait l’évolution du groupe de comparaison à celle du groupe traité. Une différence de différences.'
], `<h2>Différence des différences</h2>
<svg width="1700" height="620">
  <line x1="200" y1="560" x2="1100" y2="560" stroke="#6b7687" stroke-width="3"/>
  <text x="${gx(0)}" y="610" text-anchor="middle" font-size="30" fill="#3f4b5e">Avant</text><text x="${gx(1)}" y="610" text-anchor="middle" font-size="30" fill="#3f4b5e">Après</text>
  <g data-in="0"><path data-draw="0" d="M${gx(0)} ${gy(2.7)} L${gx(1)} ${gy(3.7)}" stroke="#eb6834" stroke-width="7" fill="none"/>

window.DEBUTS = S.map((s) => s.cap.map((c) => s.debut + c[0]));

  d.innerHTML = `<div class="etiquette"><b>${i + 1}/${S.length}</b> · ${s.chap}</div>` + s.html;

  d.querySelectorAll('path[data-draw]').forEach((p) => { const L = p.getTotalLength ? p.getTotalLength() : 1000; p.dataset.long = L; p.style.strokeDasharray = p.getAttribute('stroke-dasharray') ? p.getAttribute('stroke-dasharray') : L; });
});
const temps = (s, code) => { const [k, off] = String(code).split('+'); const c = s.cap[+k] || s.cap[0]; return c[0] + (off ? +off : 0); };
const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };

window.DUREE = TOTAL;
window.render = function (T) {
  S.forEach((s) => {
    const loc = T - s.debut, actif = T >= s.debut - 0.01 && T < s.fin;

    s.el.style.opacity = opa; s.el.style.visibility = opa > 0 ? 'visible' : 'hidden';
    if (!opa) return;
    s.el.querySelectorAll('[data-in]').forEach((e) => { const p = ease((loc - temps(s, e.dataset.in)) / 0.7); e.style.opacity = p; if (e.tagName !== 'g' && e.tagName !== 'path' && e.tagName !== 'circle' && e.tagName !== 'rect' && e.tagName !== 'text' && e.tagName !== 'tr') e.style.transform = `translateY(${(1 - p) * 24}px)`; });
    s.el.querySelectorAll('[data-grow]').forEach((e) => { const p = ease((loc - temps(s, e.dataset.grow)) / 1.0); e.style.transform = `scaleY(${p})`; });
    s.el.querySelectorAll('path[data-draw]').forEach((e) => { const p = ease((loc - temps(s, e.dataset.draw)) / 1.4), L = +e.dataset.long;
      if (e.getAttribute('stroke-dasharray')) { e.style.opacity = p; } else { e.style.strokeDashoffset = L * (1 - p); } });
    const c = s.cap.findIndex(([a, b]) => loc >= a && loc < b), st = document.querySelector('#sous-titre p');
    const ci = c >= 0 ? c : (loc < s.cap[0][0] ? -1 : s.cap.length - 1);
    if (st.dataset.k !== s.debut + ':' + ci) { st.dataset.k = s.debut + ':' + ci; st.innerHTML = ci >= 0 ? s.caps[ci] : ''; }
    if (ci >= 0) { const [a, b] = s.cap[ci]; st.style.opacity = Math.min(ease((loc - a) / 0.35), ci === s.caps.length - 1 ? 1 : ease((b - loc) / 0.25)); } else st.style.opacity = 0;

  });
  document.getElementById('avance').style.width = (100 * T / TOTAL) + '%';
};
